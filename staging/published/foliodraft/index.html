<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FolioDraft — Distraction-Free Writing Studio, Word Count Goals & Deadlines</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf7; --ink:#2e2a23; --mut:#7a6f5e; --acc:#8a5a2b; --acc-ink:#ffffff;
  --acc2:#2f6f5e; --ok:#3d7a4e; --warn:#b3402a; --line:#e4d9c4; --pill:#efe7d6;
  --paper:#fffdf7; --shadow:0 1px 3px rgba(60,45,25,.08);
}
[data-theme="dark"]{
  --bg:#171410; --card:#211d16; --ink:#ece4d3; --mut:#a89a80; --acc:#d9a45b; --acc-ink:#1d1710;
  --acc2:#6fc2a4; --ok:#6fc287; --warn:#e0654a; --line:#38301f; --pill:#2b251a;
  --paper:#211d16; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{padding:0;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.hdr-in{max-width:1100px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo-badge{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.logo-badge svg{width:24px;height:24px}
.brand{font-weight:800;font-size:20px;letter-spacing:.2px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.3px}
.hdr-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--acc-ink);border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;min-height:44px}
.btn:active{transform:scale(.96);filter:brightness(1.12)}
.btn.sec{background:var(--pill);color:var(--ink);border:1px solid var(--line)}
.btn.sec:active{transform:scale(.96);filter:brightness(1.05)}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{padding:6px 10px;min-height:36px;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.pill{background:var(--pill);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.pill:active{transform:scale(.95)}
.hdr-btns button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--pill);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.hdr-btns button:active{transform:scale(.92);filter:brightness(1.12)}
.hdr-btns button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.hdr-btns button svg{width:22px;height:22px}
main{max-width:1100px;margin:0 auto;padding:16px}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#tabs button{background:var(--pill);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px}
#tabs button:active{transform:scale(.95)}
#tabs button.active{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:700}
.big{font-size:28px;font-weight:800;line-height:1.2}
.detail{font-size:20px;font-weight:600;color:var(--mut);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:15px;font-weight:700}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{display:block;font-size:15px;font-weight:700;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;font-size:15px}
.toast.show{opacity:1}
.dlg-ov{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dlg-msg{font-size:16px;line-height:1.5;margin-bottom:14px}
.dlg-in{width:100%;box-sizing:border-box;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;margin-bottom:14px;background:var(--bg);color:var(--ink)}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end}
.dlg .btn:active{transform:scale(.97)}
.cta-strip{margin:26px 0 10px;text-align:center}
/* write tab layout */
.write-grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.write-grid{grid-template-columns:1fr}}
.lib{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);max-height:70vh;overflow:auto}
.proj{margin-bottom:10px}
.proj-head{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;cursor:pointer;font-weight:800;font-size:16px}
.proj-head:active{transform:scale(.98)}
.proj-head .car{color:var(--mut);font-size:15px}
.proj-head .pw{margin-left:auto;font-size:15px;color:var(--mut);font-weight:700}
.doc-item{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 22px;border-radius:8px;cursor:pointer;font-size:15px}
.doc-item:active{transform:scale(.98)}
.doc-item.active{background:var(--pill);font-weight:700}
.doc-item .dw{margin-left:auto;font-size:15px;color:var(--mut);white-space:nowrap}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--mut);width:34px;height:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;padding:0}
.iconbtn:active{transform:scale(.9);filter:brightness(1.15)}
.editor-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:60vh}
.editor-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.editor-bar input.doctitle{border:none;background:transparent;font-size:20px;font-weight:800;color:var(--ink);padding:6px 4px;min-height:40px;flex:1;min-width:160px}
.editor-bar input.doctitle:focus{outline:2px solid var(--acc);border-radius:6px}
.wc-chip{font-size:15px;font-weight:700;color:var(--mut);white-space:nowrap}
.saved-ind{font-size:15px;color:var(--mut);white-space:nowrap}
#editor{flex:1;min-height:52vh;border:none;background:transparent;color:var(--ink);padding:22px 26px;font-family:Georgia,"Iowan Old Style",Palatino,"Palatino Linotype",serif;font-size:19px;line-height:1.75;resize:none;border-radius:0 0 12px 12px}
#editor:focus{outline:none}
#preview{flex:1;min-height:52vh;padding:22px 30px;font-family:Georgia,"Iowan Old Style",Palatino,serif;font-size:18px;line-height:1.7;overflow:auto}
#preview h1,#preview h2,#preview h3,#preview h4{font-family:system-ui,sans-serif;line-height:1.3}
#preview blockquote{border-left:4px solid var(--acc);margin:12px 0;padding:6px 14px;color:var(--mut);font-style:italic}
#preview pre{background:var(--pill);padding:12px;border-radius:8px;overflow:auto;font-size:15px}
#preview code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
#preview hr{border:none;border-top:2px solid var(--line);margin:18px 0}
/* goals */
.goal-ring{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring-lbl{font-size:16px;font-weight:700}
.ring-sub{font-size:15px;color:var(--mut)}
/* charts */
.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:760px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.chart-card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.vbars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:8px}
.vbar{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;cursor:pointer;position:relative;opacity:.85}
.vbar:active{transform:scaleY(1.02)}
.vbar.sel{background:var(--acc2);outline:3px solid var(--acc);outline-offset:2px;opacity:1}
.vbar.zero{background:var(--pill)}
.spot{background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:15px;font-weight:700}
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut-legend{font-size:15px}
.donut-legend .li{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;border-radius:6px}
.donut-legend .li:active{transform:scale(.98)}
.donut-legend .sw{width:14px;height:14px;border-radius:4px;flex:0 0 14px}
.donut-legend .li.sel{font-weight:800}
/* sessions */
.sess-live{background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sess-timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.printonly{display:none}
@media(max-width:640px){
  .hdr-in{flex-wrap:wrap;row-gap:8px}
  .hdr-btns{margin-left:0;flex-basis:100%;justify-content:flex-start}
}
/* print */
@media print{
  header,#tabs,.cta-strip,.noprint,.lib,.editor-bar,#editor,#preview{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:100%;padding:0}
  .write-grid{display:block}
  .editor-card{border:none;box-shadow:none}
  .printonly{display:block!important;font-family:Georgia,serif;font-size:18px;line-height:1.7}
  .printonly h1{font-size:26px}.printonly h2{font-size:22px}
}
</style>
</head>
<body>
<header>
<div class="hdr-in">
<div class="logo-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-6 0-12 4-14 10l-2 6 6-2c6-2 10-8 10-14z"/><path d="M6 18c2-4 5-7 9-9"/></svg></div>
<div class="brand">FolioDraft<small>write every day</small></div>
<div class="hdr-btns">
<a class="pill" href="https://glenerds.gumroad.com">More Apps</a>
<button id="btnSample" title="Try sample data" aria-label="Try sample data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/></svg></button>
<button id="btnTheme" title="Dark mode" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button>
<button id="btnSound" title="Sound" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg></button>
</div>
</div>
</header>
<main>
<div id="tabs" role="tablist"></div>
<div id="app"></div>
<div class="cta-strip"><a class="pill" href="https://glenerds.gumroad.com">More Apps from Glenerds</a></div>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* FolioDraft core */
var LS="foliodraft_v1",LSS="foliodraft_sample_snap",LSO="foliodraft_sample_on",LSND="foliodraft_snd",LTH="foliodraft_theme";
function $(s){return document.querySelector(s);}
function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){v=parseFloat(v);return isNaN(v)?0:v;}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function dayStr(d){d=d||new Date();var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function addDays(ds,n){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return dayStr(d);}
function diffDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);}
function wc(t){t=String(t==null?"":t);var s=t.replace(/```[\s\S]*?```/g," ").replace(/`[^`]*`/g," ").replace(/!\[[^\]]*\]\([^)]*\)/g," ").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/^\s{0,3}#{1,6}\s/gm," ").replace(/^\s{0,3}>\s?/gm," ").replace(/^\s{0,3}([-*+]\s+|\d+\.\s+)/gm," ").replace(/(\*\*|__|~~)/g," ");var cjk=s.match(/[\u3040-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g);s=s.replace(/[\u3040-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g," ").trim();var w=s?s.split(/\s+/).filter(Boolean).length:0;return w+(cjk?cjk.length:0);}
function fmtN(n){return Number(n||0).toLocaleString("en-US");}
function fmtDate(ds){if(!ds)return "—";var d=new Date(ds+"T12:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function dlgOpen(html){closeDlg();var ov=document.createElement("div");ov.id="dlgOv";ov.className="dlg-ov";ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(ov);ov.addEventListener("click",function(e){if(e.target===ov)closeDlg();});var f=ov.querySelector("input,button");if(f)f.focus();}
function closeDlg(){var ov=$("#dlgOv");if(ov)ov.remove();}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDlg();});
function confirmDlg(msg,okLabel,cb){if(typeof okLabel==="function"){cb=okLabel;okLabel="Delete";}dlgOpen('<div class="dlg-msg">'+esc(msg)+'</div><div class="dlg-btns"><button class="btn sec" id="dlgCancel">Cancel</button><button class="btn danger" id="dlgOk">'+esc(okLabel)+'</button></div>');$("#dlgCancel").onclick=function(){clickS();closeDlg();};$("#dlgOk").onclick=function(){closeDlg();cb();};}
function promptDlg(msg,def,okLabel,cb){if(typeof okLabel==="function"){cb=okLabel;okLabel="Save";}dlgOpen('<div class="dlg-msg">'+esc(msg)+'</div><input id="dlgIn" class="dlg-in" value="'+esc(def||"")+'" aria-label="'+esc(msg)+'"><div class="dlg-btns"><button class="btn sec" id="dlgCancel">Cancel</button><button class="btn" id="dlgOk">'+esc(okLabel||"Save")+'</button></div>');var inp=$("#dlgIn");inp.focus();inp.select();$("#dlgCancel").onclick=function(){clickS();closeDlg();};function go(){var v=inp.value;closeDlg();cb(v);} $("#dlgOk").onclick=function(){clickS();go();};inp.onkeydown=function(e){if(e.key==="Enter")go();};}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2200);}
/* sound */
var sndOn=true;try{sndOn=localStorage.getItem(LSND)!=="0";}catch(e){}
var AC=null;
function tone(f,d){if(!sndOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f||660;g.gain.value=0.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.12));o.stop(AC.currentTime+(d||0.13));}catch(e){}}
function clickS(){tone(660);} function goodS(){tone(520);setTimeout(function(){tone(780);},90);}
/* theme */
function paintTheme(){var st=null;try{st=localStorage.getItem(LTH);}catch(e){}var dark=st==="dark"||(st==null&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",dark?"dark":"light");$("#btnTheme").classList.toggle("on",dark);}
function paintSnd(){$("#btnSound").classList.toggle("on",sndOn);}
function paintSample(on){$("#btnSample").classList.toggle("on",!!on);}
/* state */
function blankDB(){return {projects:[],docs:[],sessions:[],dailyGoal:500,dayLog:{}};}
var DB=blankDB();
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){toast("Couldn't save \u2014 browser storage is full. Export a JSON backup now.");}}
function load(){var s=null;try{s=localStorage.getItem(LS);if(!s)return;var d=JSON.parse(s);
  if(Array.isArray(d.projects))DB.projects=d.projects;
  if(Array.isArray(d.docs))DB.docs=d.docs;
  if(Array.isArray(d.sessions))DB.sessions=d.sessions;
  if(typeof d.dailyGoal==="number")DB.dailyGoal=d.dailyGoal;
  if(d.dayLog&&typeof d.dayLog==="object")DB.dayLog=d.dayLog;
}catch(e){try{if(s)localStorage.setItem(LS+".corrupt-bak",s);}catch(_){}setTimeout(function(){toast("Saved data was corrupted \u2014 starting fresh. A rescue copy was kept.");},600);}}
var ui={tab:"write",openProj:null,openDoc:null,preview:false,q:"",selBar:null,selSlice:null,_snap:0,_saveT:null,_sessT:null,liveSess:null};
function projDocs(pid){return DB.docs.filter(function(d){return d.projectId===pid;}).sort(function(a,b){return (b.updated||"")<(a.updated||"")?-1:1;});}
function projById(id){return DB.projects.filter(function(p){return p.id===id;})[0]||null;}
function docById(id){return DB.docs.filter(function(d){return d.id===id;})[0]||null;}
function docWords(d){return wc(d.body);}
function projWords(pid){return projDocs(pid).reduce(function(a,d){return a+docWords(d);},0);}
function totalWords(){return DB.docs.reduce(function(a,d){return a+docWords(d);},0);}
function todayWords(){return num(DB.dayLog[dayStr()]);}
function streak(){var n=0,d=dayStr();if(!num(DB.dayLog[d]))d=addDays(d,-1);while(num(DB.dayLog[d])>0){n++;d=addDays(d,-1);}return n;}
function last30(){var out=[],t=dayStr();for(var i=29;i>=0;i--){var ds=addDays(t,-i);out.push({d:ds,w:num(DB.dayLog[ds])});}return out;}
/* markdown */
function mdInline(s){return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|\W)\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){if(!/^(https?:|mailto:|#)/i.test(u))return t;return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';});}
function mdRender(src){var lines=esc(src).split("\n"),html="",inList=null,inCode=false,cb=[];
  function closeList(){if(inList){html+=inList==="ul"?"</ul>":"</ol>";inList=null;}}
  for(var i=0;i<lines.length;i++){var ln=lines[i];
    if(/^\s*```/.test(ln)){if(inCode){html+="<pre><code>"+cb.join("\n")+"</code></pre>";cb=[];inCode=false;}else{closeList();inCode=true;}continue;}
    if(inCode){cb.push(ln);continue;}
    var h=ln.match(/^(#{1,4})\s+(.*)/);
    if(h){closeList();html+="<h"+h[1].length+">"+mdInline(h[2])+"</h"+h[1].length+">";continue;}
    if(/^\s*---+\s*$/.test(ln)){closeList();html+="<hr>";continue;}
    var bq=ln.match(/^&gt;\s?(.*)/);
    if(bq){closeList();html+="<blockquote>"+mdInline(bq[1])+"</blockquote>";continue;}
    var ul=ln.match(/^\s*[-*]\s+(.*)/),ol=ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){var t=ul?"ul":"ol",c=ul?ul[1]:ol[1];if(inList!==t){closeList();html+="<"+t+">";inList=t;}html+="<li>"+mdInline(c)+"</li>";continue;}
    if(/^\s*$/.test(ln)){closeList();continue;}
    closeList();html+="<p>"+mdInline(ln)+"</p>";}
  closeList();if(inCode)html+="<pre><code>"+cb.join("\n")+"</code></pre>";return html||"<p></p>";}
/* sample data */
function sampleDB(){var t=dayStr(),P=[],D=[],S=[];
  var p1=uid(),p2=uid(),p3=uid();
  P.push({id:p1,name:"The Salt Road",targetWords:80000,deadline:addDays(t,210),created:t});

  if(!mks.length)h+='<div class="ring-sub">No data yet.</div>';
  mks.forEach(function(m){var pct=Math.round(months[m]/mmx*100);
    h+='<div class="vbar" style="height:'+Math.max(3,pct)+'%;cursor:default" title="'+m+": "+fmtN(months[m])+' words"></div>';});
  h+='</div><div class="ring-sub">'+mks.map(function(m){return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][num(m.slice(5))-1];}).join(" · ")+'</div></div>';
  /* streak card */
  var st=streak();
  h+='<div class="chart-card" data-card><h3>Writing streak</h3><div class="big">'+st+' day'+(st===1?"":"s")+'</div><div class="detail">consecutive days with words written</div><div class="ring-sub" style="margin-top:8px">Total words all time: '+fmtN(totalWords())+'<br>Documents: '+DB.docs.length+' · Projects: '+DB.projects.length+' · Sessions: '+DB.sessions.length+'</div></div>';
  return h+'</div>';
}
/* ---------- SESSIONS TAB ---------- */
function fmtDur(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60);}
function sessionsHTML(){
  var h='';
  if(ui.liveSess){
    var ls=ui.liveSess;
    h+='<div class="sess-live"><div class="row" style="justify-content:space-between"><strong>Writing now: '+esc((docById(ls.docId)||{title:"?"}).title||"Untitled")+'</strong><span class="sess-timer" id="sessTimer">00:00:00</span></div><div class="ring-sub" id="sessWords">0 words this session</div><div class="row" style="margin-top:8px"><button class="btn danger" data-act="sessstop">Stop & log session</button></div></div>';
  }else{
    h+='<div class="form"><div class="row"><select id="sessDoc" aria-label="Document for session" style="max-width:280px">'+DB.docs.map(function(d){return '<option value="'+d.id+'"'+(ui.openDoc===d.id?" selected":"")+'>'+esc(d.title||"Untitled")+'</option>';}).join("")+'</select><button class="btn" data-act="sessstart">Start writing session</button></div><div class="ring-sub" style="margin-top:6px">The timer runs while you write; words are counted when you stop.</div></div>';
  }
  h+='<div class="form"><h3 style="margin-top:0">Log a past session</h3><div class="fgrid"><div><label>Date</label><input type="date" id="msDate" value="'+dayStr()+'"></div><div><label>Minutes</label><input type="number" id="msMin" min="1" value="30"></div><div><label>Words written</label><input type="number" id="msWords" min="0" value="0"></div><div><label>Document</label><select id="msDoc">'+DB.docs.map(function(d){return '<option value="'+d.id+'">'+esc(d.title||"Untitled")+'</option>';}).join("")+'</select></div></div><div class="row" style="margin-top:10px"><button class="btn sec" data-act="sessmanual">Add session</button></div></div>';
  h+='<div class="card"><h3>Session history</h3>';
  if(!DB.sessions.length)h+='<div class="ring-sub">No sessions logged yet.</div>';
  else{var ss=DB.sessions.slice().sort(function(a,b){return (b.start||"")<(a.start||"")?-1:1;});
    h+='<table><tr><th>Date</th><th>Document</th><th>Time</th><th>Words</th><th></th></tr>';
    ss.forEach(function(s){var d=docById(s.docId);
      h+='<tr><td>'+esc(String(s.start||"").slice(0,10))+'</td><td>'+esc(d?(d.title||"Untitled"):"—")+'</td><td style="font-size:15px;color:var(--mut)">'+esc(s.start||"")+' → '+esc(s.end||"")+'</td><td><strong>'+fmtN(s.words)+'</strong></td><td><button class="iconbtn" data-act="sessel" data-id="'+s.id+'" aria-label="Delete session">🗑</button></td></tr>';});
    h+='</table>';}
  return h+'</div>';
}
function sessTick(){
  var el=$("#sessTimer");if(!el||!ui.liveSess)return;
  el.textContent=fmtDur(Date.now()-ui.liveSess.t0);
  var d=docById(ui.liveSess.docId),w2=$("#sessWords");
  if(d&&w2)w2.textContent=fmtN(Math.max(0,wc(d.body)-ui.liveSess.w0))+" words this session";
}
/* ---------- BACKUP TAB ---------- */
function backupHTML(){
  return '<div class="form"><h3 style="margin-top:0">Backup & restore</h3>'
  +'<div class="row"><button class="btn" data-act="bkjson">Download JSON backup</button>'
  +'<label class="btn sec" style="margin:0">Restore from file<input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></label></div>'
  +'<div class="ring-sub" style="margin-top:8px">Your library lives in this browser only. Download a backup before clearing browser data or switching devices.</div></div>'
  +'<div class="form"><h3 style="margin-top:0">Export all documents</h3><div class="row"><button class="btn sec" data-act="expallmd">All as .md (zip-less)</button></div><div class="ring-sub" style="margin-top:8px">Downloads each document as its own Markdown file.</div></div>'
  +'<div class="form"><h3 style="margin-top:0;color:var(--warn)">Danger zone</h3><div class="row"><button class="btn danger" data-act="wipe">Erase everything</button></div></div>';
}
/* ---------- RENDER ---------- */
var TABS=[["write","Write"],["goals","Goals"],["charts","Charts"],["sessions","Sessions"],["backup","Backup"]];
function render(){
  var th=$("#tabs");th.innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" class="'+(ui.tab===t[0]?"active":"")+'">'+t[1]+'</button>';}).join("");
  var h="";
  if(ui.tab==="write")h=writeHTML();
  else if(ui.tab==="goals")h=goalsHTML();
  else if(ui.tab==="charts")h=chartsHTML();
  else if(ui.tab==="sessions")h=sessionsHTML();
  else h=backupHTML();
  $("#app").innerHTML=h;
  if(ui.tab==="write")bindWrite();
  bindTab();
}
function bindTab(){
  var rf=$("#restoreFile");if(rf){rf.addEventListener("change",function(){var f=rf.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!validBackup(d))throw 0;DB=sanitizeBackup(d);ui.openDoc=null;clearInterval(ui._sessT);ui.liveSess=null;save();render();goodS();toast("Backup restored");}catch(e){toast("That file is not a FolioDraft backup");}};r.readAsText(f);});}
}
document.addEventListener("click",function(e){
  var tb=e.target.closest("[data-tab]");
  if(tb){flushSave();ui.tab=tb.getAttribute("data-tab");clickS();render();return;}
  var b=e.target.closest("[data-bar]");
  if(b){ui.selBar=ui.selBar===num(b.getAttribute("data-bar"))?null:num(b.getAttribute("data-bar"));clickS();render();return;}
  var sl=e.target.closest("[data-slice]");
  if(sl){var i=num(sl.getAttribute("data-slice"));ui.selSlice=ui.selSlice===i?null:i;clickS();render();return;}
  var a=e.target.closest("[data-act]");
  if(!a)return;var act=a.getAttribute("data-act"),id=a.getAttribute("data-id");
  if(act==="setgoal"){var v=num($("#goalIn").value);if(v>0){DB.dailyGoal=Math.round(v);save();render();goodS();toast("Daily goal set");}return;}
  if(act==="setpt"){var p=projById(id);if(!p)return;var ti=document.querySelector('.tgtIn[data-pid="'+id+'"]'),di=document.querySelector('.dlIn[data-pid="'+id+'"]');if(ti)p.targetWords=Math.max(0,Math.round(num(ti.value)));if(di)p.deadline=di.value;save();render();goodS();return;}
  function stamp(){var n=new Date(),p=function(x){return (x<10?"0":"")+x;};return dayStr()+" "+p(n.getHours())+":"+p(n.getMinutes());}
  if(act==="sessstart"){var sd=$("#sessDoc");if(!sd||!sd.value){toast("Create a document first");return;}var d=docById(sd.value);ui.liveSess={docId:sd.value,projectId:d.projectId,t0:Date.now(),w0:wc(d.body),start:stamp()};ui.openDoc=sd.value;clearInterval(ui._sessT);ui._sessT=setInterval(sessTick,1000);render();goodS();return;}
  if(act==="sessstop"){var ls=ui.liveSess;if(!ls)return;flushSave();var d=docById(ls.docId);var w=d?Math.max(0,wc(d.body)-ls.w0):0;DB.sessions.push({id:uid(),docId:ls.docId,projectId:ls.projectId,start:ls.start,end:stamp(),words:w});var t=dayStr();DB.dayLog[t]=num(DB.dayLog[t]);clearInterval(ui._sessT);ui.liveSess=null;save();render();goodS();toast("Session logged: "+fmtN(w)+" words");return;}
  if(act==="sessmanual"){var dd=$("#msDate").value||dayStr(),mm=Math.max(1,Math.round(num($("#msMin").value))),ww=Math.max(0,Math.round(num($("#msWords").value))),mdoc=$("#msDoc").value;var d2=docById(mdoc);DB.sessions.push({id:uid(),docId:mdoc,projectId:d2?d2.projectId:null,start:dd+" manual",end:mm+" min",words:ww});DB.dayLog[dd]=num(DB.dayLog[dd])+ww;save();render();goodS();return;}
  if(act==="sessel"){var sx=null;for(var i6=0;i6<DB.sessions.length;i6++){if(DB.sessions[i6].id===id)sx=DB.sessions[i6];}var self=this;confirmDlg("Delete this session?",function(){if(sx&&sx.start&&sx.start.indexOf(" manual")>-1){var dd=sx.start.split(" ")[0];DB.dayLog[dd]=Math.max(0,num(DB.dayLog[dd])-num(sx.words));}DB.sessions=DB.sessions.filter(function(s){return s.id!==id;});save();render();});return;}
  if(act==="bkjson"){download("foliodraft-backup-"+dayStr()+".json",JSON.stringify(DB),"application/json");goodS();return;}
  if(act==="expallmd"){if(!DB.docs.length){toast("No documents to export");return;}DB.docs.forEach(function(d){exportDoc(d,"md",true);});goodS();toast("Exported "+DB.docs.length+" documents");return;}
  if(act==="wipe"){var self=this;confirmDlg("Erase ALL projects, documents, sessions and stats? This cannot be undone.",function(){DB=blankDB();ui.openDoc=null;clearInterval(ui._sessT);ui.liveSess=null;save();render();});return;}
  doAct(act,id,a);
});
/* header buttons */
$("#btnTheme").addEventListener("click",function(){clickS();var cur=null;try{cur=localStorage.getItem(LTH);}catch(e){}var dark=document.documentElement.getAttribute("data-theme")==="dark";var next=dark?"light":"dark";try{localStorage.setItem(LTH,next);}catch(e){}paintTheme();});
$("#btnSound").addEventListener("click",function(){sndOn=!sndOn;try{localStorage.setItem(LSND,sndOn?"1":"0");}catch(e){}paintSnd();if(sndOn)tone(660);});
$("#btnSample").addEventListener("click",function(){clickS();setSample(!isSampleOn());toast(isSampleOn()?"Sample data on":"Sample data off");});
window.addEventListener("beforeunload",flushSave);
/* init */
load();paintTheme();paintSnd();paintSample(isSampleOn());
if(!DB.docs.length&&!isSampleOn()){/* fresh: create a starter project+doc */}
render();
</script>
</body>
</html>
