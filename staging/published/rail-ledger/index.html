<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Railroad Collection Inventory — Locomotives, Rolling Stock &amp; Consists</title>
<meta name="description" content="RailLedger: a private model railroad collection inventory. Log locomotives and rolling stock by scale, road, DCC and value, track maintenance, build consists, and print an insurance packet. Your data stays in your browser.">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2b2620;--muted:#7a7264;--line:#e3ddd0;--accent:#8a5a2b;--accent2:#b07a3f;--good:#3f7a4e;--warn:#b07a3f;--bad:#b0442e;--h0:#e9e2d2;--h1:#cfe0c8;--h2:#a9cba0;--bar:#c98f4e;--barline:#8a5a2b;--sel:#8a5a2b}
[data-theme="dark"]{--bg:#1d1a15;--card:#26211a;--ink:#ece5d5;--muted:#a89e88;--line:#3a342a;--accent:#d99a55;--accent2:#e8b06a;--good:#7fbf8a;--warn:#d99a55;--bad:#e07a5e;--h0:#3a342a;--h1:#3c4a38;--h2:#4c5f46;--bar:#8a5a2b;--barline:#d99a55;--sel:#d99a55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:30px;margin:0}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:18px;margin:14px 0 6px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logobadge{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tagline{font-size:15px;color:var(--muted);margin:0}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn.on{outline:2px solid var(--accent)}
.iconbtn svg{width:22px;height:22px}
.pillbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:16px;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:16px;cursor:pointer;font-family:inherit}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.cards2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.chartsgrid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);align-items:start}
.chartsgrid .wide{grid-column:1/-1}
@media(max-width:700px){.chartsgrid{grid-template-columns:1fr}}
.stat{font-size:15px;color:var(--muted);margin:0}
.stat b{display:block;font-size:30px;color:var(--ink);margin-top:2px}
.snaprow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.snaprow:last-child{border-bottom:none}
.snaprow b{text-align:right}
.muted{color:var(--muted)}
.small{font-size:15px}
.detail{text-align:center;font-size:17px;font-weight:700;margin-top:10px;min-height:26px}
.bars{display:flex;align-items:flex-end;gap:8px;height:260px;padding:8px 4px 0;border-bottom:2px solid var(--line)}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;cursor:pointer;height:100%}
.barcol .b{width:70%;max-width:44px;background:var(--bar);border:1px solid var(--barline);border-radius:6px 6px 0 0;min-height:3px}
.barcol.sel .b{background:var(--sel);border-color:var(--sel);transform:translateY(-6px)}
.barcol .bl{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap}
.barcol .bv{font-size:13px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hbarrow{display:flex;align-items:center;gap:10px;cursor:pointer}
.hbarlab{flex:0 0 170px;text-align:right;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbartrack{flex:1;background:var(--h0);border-radius:6px;height:22px}
.hbarfill{background:var(--bar);border:1px solid var(--barline);border-radius:6px;height:100%;min-width:4px}
.hbarrow.sel .hbarfill{background:var(--sel);border-color:var(--sel)}
.hbarval{flex:0 0 60px;font-size:15px;color:var(--muted)}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donutwrap .legend{flex:1;min-width:180px}
.legend .lrow{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:16px;cursor:pointer;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.legend .lrow.sel{border-color:var(--sel);background:var(--h0)}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
path.slice{cursor:pointer;transition:transform .15s}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
th{font-size:15px;color:var(--muted)}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:15px;color:var(--muted);margin:10px 0 4px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.formrow{grid-template-columns:1fr}}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:17px;cursor:pointer;font-family:inherit;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.danger{background:var(--bad)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--h0);color:var(--ink)}
.badge.good{background:var(--h1)}
.badge.warn{background:#f0dfc2;color:#6b4a1f}
[data-theme="dark"] .badge.warn{background:#4a3a22;color:#e8c98a}
.badge.bad{background:#f2c9bd;color:#7a2a18}
[data-theme="dark"] .badge.bad{background:#4a2820;color:#f0a88e}
.samplebar{background:var(--h1);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;font-size:16px;z-index:50;max-width:90vw;text-align:center}
.cta{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;margin-top:26px}
footer{margin-top:34px;font-size:14px;color:var(--muted);text-align:center}
@media print{.topbar,.tabs,.btnrow,.cta,footer,.no-print{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;break-inside:avoid}}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ================= RailLedger — model railroad collection inventory ================= */
var LS='railledger_v1',LSS='railledger_v1_snapshot';
var DB={items:[],maint:[],consists:[]};
var ui={tab:'dash',editItem:null,editConsist:null,filterScale:'all',filterType:'all',q:''};
var sel={acqMonth:null,scaleVal:null,scaleCount:null,road:null};
try{var raw=localStorage.getItem(LS);if(raw){var d=JSON.parse(raw);if(d&&typeof d==='object')DB=d;}}catch(e){}
if(!Array.isArray(DB.items))DB.items=[];if(!Array.isArray(DB.maint))DB.maint=[];if(!Array.isArray(DB.consists))DB.consists=[];
function todayLocal(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){toast('Could not save — browser storage is full or blocked. Export a backup now.');}}
function uid(){return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function money(n){n=Number(n)||0;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){if(!d)return '—';var p=d.split('-');return p.length===3?(+p[1])+'/'+(+p[2])+'/'+p[0]:d;}
function monthKey(d){return d?d.slice(0,7):'';}
/* ---------- sound ---------- */
var AC=null,muted=false;
try{muted=localStorage.getItem('railledger_mute')==='1';}catch(e){}
function tone(f,dur){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}catch(e){}}
function click(){tone(660,0.08);}
function good(){tone(880,0.12);}
/* ---------- theme ---------- */
var theme='light';
try{theme=localStorage.getItem('railledger_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);try{localStorage.setItem('railledger_theme',theme);}catch(e){}}
applyTheme();
/* ---------- sample data ---------- */
var sampleOn=false;
try{sampleOn=!!localStorage.getItem(LSS);}catch(e){}
function toggleSample(){
  if(!sampleOn){try{localStorage.setItem(LSS,JSON.stringify(DB));}catch(e){}DB=sampleData();save();sampleOn=true;try{localStorage.setItem(LSS+'_on','1');}catch(e){}toast('Sample data on — your real records are saved and will come back exactly, even after a reload.');}
  else{var snap=null;try{snap=JSON.parse(localStorage.getItem(LSS)||'null');}catch(e){}if(!snap||!Array.isArray(snap.items)){toast('Sample snapshot missing — not touching your data.');return;}DB=snap;save();try{localStorage.removeItem(LSS);localStorage.removeItem(LSS+'_on');}catch(e){}sampleOn=false;toast('Sample data off — your records are back.');}
  ui.editItem=null;render();
}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3200);}
function sampleData(){
  var items=[
    {id:'s1',kind:'loco',road:'Union Pacific',number:'1989',scale:'HO',mfr:'Athearn',model:'SD70ACe',dcc:'1989',type:'Diesel',pdate:'2026-03-14',price:289.99,value:310,cond:'Excellent',loc:'Cabinet A · shelf 2',notes:'DCC + sound, runs smooth.'},
    {id:'s2',kind:'loco',road:'BNSF',number:'4721',scale:'HO',mfr:'Kato',model:'ES44AC',dcc:'4721',type:'Diesel',pdate:'2026-01-18',price:245,value:260,cond:'Excellent',loc:'Cabinet A · shelf 2',notes:''},
    {id:'s3',kind:'loco',road:'Denver & Rio Grande Western',number:'5771',scale:'N',mfr:'Kato',model:'F7A/B set',dcc:'5771',type:'Diesel',pdate:'2021-06-20',price:189.95,value:175,cond:'Good',loc:'Drawer 3',notes:'B unit needs coupler check.'},
    {id:'s4',kind:'loco',road:'Pennsylvania',number:'1361',scale:'O',mfr:'Lionel',model:'K4s Pacific',dcc:'',type:'Steam',pdate:'2020-12-25',price:549,value:600,cond:'Mint',loc:'Display case',notes:'Legacy command. Christmas gift.'},
    {id:'s5',kind:'roll',road:'Union Pacific',number:'34210',scale:'HO',mfr:'Walthers',model:'50ft boxcar',dcc:'',type:'Boxcar',pdate:'2026-03-14',price:34.99,value:32,cond:'Good',loc:'Cabinet B · bin 1',notes:''},
    {id:'s6',kind:'roll',road:'CSX',number:'88120',scale:'HO',mfr:'Athearn',model:'Covered hopper',dcc:'',type:'Hopper',pdate:'2026-07-22',price:29.99,value:28,cond:'Good',loc:'Cabinet B · bin 1',notes:''},
    {id:'s7',kind:'roll',road:'BNSF',number:'723456',scale:'N',mfr:'Micro-Trains',model:'40ft boxcar',dcc:'',type:'Boxcar',pdate:'2022-03-05',price:27.95,value:25,cond:'Excellent',loc:'Drawer 3',notes:''},
    {id:'s8',kind:'roll',road:'Santa Fe',number:'99901',scale:'HO',mfr:'Bachmann',model:'Caboose',dcc:'',type:'Caboose',pdate:'2025-12-08',price:42,value:38,cond:'Fair',loc:'Cabinet B · bin 2',notes:'Needs new trucks.'},
    {id:'s9',kind:'loco',road:'Norfolk Southern',number:'8105',scale:'HO',mfr:'Broadway Limited',model:'ES44AC',dcc:'8105',type:'Diesel',pdate:'2026-09-05',price:329,value:340,cond:'Excellent',loc:'Cabinet A · shelf 1',notes:'Paragon4 sound.'},
    {id:'s10',kind:'roll',road:'Union Pacific',number:'25011',scale:'HO',mfr:'Walthers',model:'Autorack',dcc:'',type:'Autorack',pdate:'2026-09-05',price:39.99,value:40,cond:'Excellent',loc:'Cabinet B · bin 1',notes:''}
  ];
  var maint=[
    {id:'m1',itemId:'s3',date:'2026-08-20',type:'Repair',cost:12.5,notes:'Replaced B-unit coupler spring.'},
    {id:'m2',itemId:'s8',date:'2026-09-15',type:'Planned',cost:0,notes:'Order replacement trucks.'},
    {id:'m3',itemId:'s1',date:'2026-06-10',type:'Cleaning',cost:0,notes:'Wheel cleaning, all axles.'}
  ];
  var consists=[
    {id:'c1',name:'Intermodal hotshot',itemIds:['s9','s10','s5'],notes:'Mainline run.'},
    {id:'c2',name:'Heritage steam special',itemIds:['s4'],notes:'Display only.'}
  ];
  return {items:items,maint:maint,consists:consists};
}
/* ---------- helpers ---------- */
function itemById(id){for(var i=0;i<DB.items.length;i++)if(DB.items[i].id===id)return DB.items[i];return null;}
function itemName(it){if(!it)return '?';return (it.road?it.road+' ':'')+(it.number||'')+(it.model?' · '+it.model:'');}
function totalValue(){return DB.items.reduce(function(t,it){return t+(Number(it.value)||0);},0);}
function totalPaid(){return DB.items.reduce(function(t,it){return t+(Number(it.price)||0);},0);}
function maintFor(id){return DB.maint.filter(function(m){return m.itemId===id;}).sort(function(a,b){return b.date<a.date?-1:1;});}
function lastMaintDate(id){var l=maintFor(id);return l.length?l[0].date:null;}
/* ================= views ================= */
/* ---------- header ---------- */
function iconSVG(kind){
  if(kind==='flask')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5.3L4.7 17a2 2 0 0 0 1.8 2.9h11a2 2 0 0 0 1.8-2.9L14 8.3V3"/><path d="M7.5 13.5h9"/></svg>';
  if(kind==='moon')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  if(kind==='sound')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><g class="wv"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></g></svg>';
  return '';
}
function header(){
  return '<div class="topbar"><div class="brand"><span class="logobadge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="13" height="8" rx="2"/><path d="M16 10h3l2 2v3h-5"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="13.5" cy="17.5" r="1.6"/><circle cx="19" cy="17.5" r="1.4"/></svg></span>'
    +'<span><h1>RailLedger</h1><p class="tagline">Model railroad collection inventory</p></span></div>'
    +'<button class="pillbtn" data-act="moreapps">More Apps</button>'
    +'<button class="iconbtn'+(sampleOn?' on':'')+'" id="btnSample" title="Try sample data" aria-label="Try sample data">'+iconSVG('flask')+'</button>'
    +'<button class="iconbtn" id="btnTheme" title="Light / dark mode" aria-label="Toggle dark mode">'+iconSVG('moon')+'</button>'
    +'<button class="iconbtn'+(muted?'':' on')+'" id="btnSound" title="Sound on/off" aria-label="Toggle sound">'+iconSVG('sound')+'</button></div>';
}
function tabsBar(){
  var tabs=[['dash','Dashboard'],['coll','Collection'],['cons','Consists'],['maint','Maintenance'],['charts','Charts'],['rep','Reports & Data']];
  return '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" class="'+(ui.tab===t[0]?'active':'')+'">'+t[1]+'</button>';}).join('')+'</div>';
}
/* ---------- dashboard ---------- */
function viewDash(){
  var n=DB.items.length,locos=DB.items.filter(function(i){return i.kind==='loco';}).length;
  var planned=DB.maint.filter(function(m){return m.type==='Planned';}).length;
  var recent=DB.items.slice().sort(function(a,b){return (b.pdate||'')<(a.pdate||'')?-1:1;}).slice(0,5);
  var h='<div class="grid cards2">'
    +'<div class="card"><p class="stat">Collection<b>'+n+' pieces</b></p><p class="small muted">'+locos+' locomotives · '+(n-locos)+' rolling stock</p></div>'
    +'<div class="card"><p class="stat">Collection value<b>'+money(totalValue())+'</b></p><p class="small muted">Paid '+money(totalPaid())+'</p></div>'
    +'<div class="card"><p class="stat">Maintenance<b>'+DB.maint.length+' records</b></p><p class="small muted">'+planned+' planned jobs</p></div>'
    +'<div class="card"><p class="stat">Consists<b>'+DB.consists.length+' built</b></p><p class="small muted">'+DB.consists.reduce(function(t,c){return t+c.itemIds.length;},0)+' cars assigned</p></div></div>';
  h+='<div class="card"><h2>Recently added</h2>';
  if(!recent.length)h+='<p class="muted">Nothing logged yet. Add your first piece on the Collection tab, or try the sample data flask up top.</p>';
  else h+='<table><tr><th>Piece</th><th>Scale</th><th>Acquired</th><th style="text-align:right">Value</th></tr>'
    +recent.map(function(it){return '<tr><td><b>'+esc(itemName(it))+'</b> <span class="badge">'+(it.kind==='loco'?'Locomotive':'Rolling stock')+'</span></td><td>'+esc(it.scale||'—')+'</td><td>'+fmtDate(it.pdate)+'</td><td style="text-align:right">'+money(it.value)+'</td></tr>';}).join('')+'</table>';
  h+='</div>';
  var upcoming=DB.maint.filter(function(m){return m.type==='Planned';}).sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,5);
  if(upcoming.length){h+='<div class="card"><h2>Planned maintenance</h2>'+upcoming.map(function(m){var it=itemById(m.itemId);
    return '<div class="snaprow"><span>'+esc(itemName(it))+' — '+esc(m.notes||m.type)+'</span><b>'+fmtDate(m.date)+'</b></div>';}).join('')+'</div>';}
  return h;
}
/* ---------- collection ---------- */
var SCALES=['Z','N','HO','O','G'];
var LOCO_TYPES=['Diesel','Steam','Electric'];
var ROLL_TYPES=['Boxcar','Hopper','Tank car','Flatcar','Gondola','Caboose','Passenger','Autorack','Refrigerator','Other'];
var CONDS=['Mint','Excellent','Good','Fair','Poor'];
function itemForm(it){
  it=it||{kind:'loco',road:'',number:'',scale:'HO',mfr:'',model:'',dcc:'',type:'Diesel',pdate:'',price:'',value:'',cond:'Excellent',loc:'',notes:''};
  var isLoco=it.kind==='loco';
  var h='<div class="card"><h2>'+(it.id?'Edit piece':'Add a piece')+'</h2>'
    +'<div class="formrow"><div><label>Type</label><select id="fKind"><option value="loco"'+(isLoco?' selected':'')+'>Locomotive</option><option value="roll"'+(!isLoco?' selected':'')+'>Rolling stock</option></select></div>'
    +'<div><label>Scale</label><select id="fScale">'+SCALES.map(function(s){return '<option'+(it.scale===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div></div>'
    +'<div class="formrow"><div><label>Railroad / road name</label><input id="fRoad" value="'+esc(it.road)+'" placeholder="e.g. Union Pacific"></div>'
    +'<div><label>Road number</label><input id="fNumber" value="'+esc(it.number)+'" placeholder="e.g. 1989"></div></div>'
    +'<div class="formrow"><div><label>Manufacturer</label><input id="fMfr" value="'+esc(it.mfr)+'" placeholder="e.g. Athearn"></div>'
    +'<div><label>Model</label><input id="fModel" value="'+esc(it.model)+'" placeholder="e.g. SD70ACe"></div></div>'
    +'<div class="formrow"><div id="typeWrap"><label>'+(isLoco?'Locomotive type':'Car type')+'</label><select id="fType">'+(isLoco?LOCO_TYPES:ROLL_TYPES).map(function(s){return '<option'+(it.type===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div>'
    +'<div id="dccWrap" style="'+(isLoco?'':'display:none')+'"><label>DCC address</label><input id="fDcc" value="'+esc(it.dcc)+'" placeholder="e.g. 1989"></div></div>'
    +'<div class="formrow"><div><label>Date acquired</label><input type="date" id="fPdate" value="'+esc(it.pdate||'')+'"></div>'
    +'<div><label>Condition</label><select id="fCond">'+CONDS.map(function(s){return '<option'+(it.cond===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div></div>'
    +'<div class="formrow"><div><label>Price paid ($)</label><input type="number" id="fPrice" min="0" step="0.01" value="'+esc(it.price)+'" placeholder="0.00"></div>'

/* ---------- charts ---------- */
var PALETTE=['#8a5a2b','#3f7a4e','#4a6fa5','#b0442e','#7a5a8a','#b07a3f','#5a8a8a','#8a4a6a'];
function chartValueDonut(){
  var byS={};DB.items.forEach(function(it){var k=it.scale||'?';byS[k]=(byS[k]||0)+(Number(it.value)||0);});
  var keys=Object.keys(byS).sort(function(a,b){return byS[b]-byS[a];});
  if(!keys.length)return '<p class="muted">Add pieces to see the value split.</p>';
  var total=keys.reduce(function(t,k){return t+byS[k];},0);
  var C=2*Math.PI*60,off=0,paths='',legend='';
  keys.forEach(function(k,i){
    var frac=byS[k]/total,startFrac=off/C,selc=sel.scaleVal===k;
    var midA=(startFrac+frac/2)*2*Math.PI;
    var pull=selc?' transform="translate('+(7*Math.cos(midA)).toFixed(1)+' '+(7*Math.sin(midA)).toFixed(1)+')"':'';
    var len=Math.max(0,frac*C-1.5),col=PALETTE[i%PALETTE.length];
    if(keys.length===1||frac>=0.999){paths+='<circle cx="100" cy="100" r="60" fill="none" stroke="'+col+'" stroke-width="28" data-vscale="'+esc(k)+'" style="cursor:pointer"'+pull+'/>';}
    else{paths+='<circle cx="100" cy="100" r="60" fill="none" stroke="'+col+'" stroke-width="28" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" data-vscale="'+esc(k)+'" style="cursor:pointer"'+pull+'/>';}
    legend+='<div class="lrow'+(selc?' sel':'')+'" data-vscale="'+esc(k)+'"><span class="sw" style="background:'+col+'"></span>'+esc(k)+' ('+money(byS[k])+')</div>';
    off+=frac*C;
  });
  var c1=money(total),c2='total';
  if(sel.scaleVal&&byS[sel.scaleVal]!=null){c1=money(byS[sel.scaleVal]);c2=sel.scaleVal+' scale';}
  var fs1=c1.length>10?14:c1.length>8?17:20;
  return '<div class="donutwrap"><svg width="260" height="260" viewBox="0 0 200 200" role="img" aria-label="Value by scale" style="flex:0 0 auto">'
    +'<circle cx="100" cy="100" r="60" fill="none" stroke="var(--h0)" stroke-width="28"/>'+paths
    +'<text x="100" y="96" text-anchor="middle" font-size="'+fs1+'" font-weight="700" fill="var(--ink)">'+esc(c1)+'</text>'
    +'<text x="100" y="118" text-anchor="middle" font-size="14" fill="var(--muted)">'+esc(c2)+'</text></svg>'
    +'<div class="legend">'+legend+'</div></div>';
}
function chartScaleBars(){
  var byS={};DB.items.forEach(function(it){var k=it.scale||'?';byS[k]=(byS[k]||0)+1;});
  var keys=Object.keys(byS).sort();
  if(!keys.length)return '<p class="muted">Add pieces to see the count.</p>';
  var max=Math.max.apply(null,keys.map(function(k){return byS[k];}));
  return '<div class="bars" role="img" aria-label="Pieces by scale">'+keys.map(function(k){
    var h=Math.max(Math.round(byS[k]/max*240),4);
    return '<div class="barcol'+(sel.scaleCount===k?' sel':'')+'" data-cscale="'+esc(k)+'" style="height:100%"><div class="b" style="height:'+h+'px"></div><div class="bv">'+byS[k]+'</div><div class="bl">'+esc(k)+'</div></div>';
  }).join('')+'</div>';
}
function chartAcq(){
  var counts={},i;for(i=11;i>=0;i--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);counts[d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)]=0;}
  DB.items.forEach(function(it){var k=monthKey(it.pdate);if(k in counts)counts[k]++;});
  var keys=Object.keys(counts),max=Math.max.apply(null,keys.map(function(k){return counts[k];}).concat([1]));
  var names=['J','F','M','A','M','J','J','A','S','O','N','D'];
  return '<div class="bars" role="img" aria-label="Acquisitions by month">'+keys.map(function(k){
    var h=Math.max(Math.round(counts[k]/max*240),3),dt=new Date(k+'-02');
    return '<div class="barcol'+(sel.acqMonth===k?' sel':'')+'" data-acq="'+k+'" title="'+k+': '+counts[k]+'" style="height:100%"><div class="b" style="height:'+h+'px"></div><div class="bv">'+counts[k]+'</div><div class="bl">'+names[dt.getMonth()]+'</div></div>';
  }).join('')+'</div>';
}
function chartRoad(){
  var byR={};DB.items.forEach(function(it){var k=it.road||'Unknown';byR[k]=(byR[k]||0)+(Number(it.value)||0);});
  var keys=Object.keys(byR).sort(function(a,b){return byR[b]-byR[a];}).slice(0,8);
  if(!keys.length)return '<p class="muted">Add pieces to see the split.</p>';
  var max=Math.max(byR[keys[0]]||0,1);
  return '<div class="hbars" role="img" aria-label="Value by railroad">'+keys.map(function(k){
    var w=Math.max(Math.round(byR[k]/max*100),4);
    return '<div class="hbarrow'+(sel.road===k?' sel':'')+'" data-road="'+esc(k)+'" title="'+esc(k)+': '+money(byR[k])+'">'
      +'<div class="hbarlab">'+esc(k)+'</div><div class="hbartrack"><div class="hbarfill" style="width:'+w+'%"></div></div>'
      +'<div class="hbarval">'+money(byR[k])+'</div></div>';
  }).join('')+'</div>';
}
function scaleValDetail(){return sel.scaleVal?esc(sel.scaleVal)+' scale: '+money(DB.items.filter(function(i){return (i.scale||'?')===sel.scaleVal;}).reduce(function(t,i){return t+(Number(i.value)||0);},0))+'. Tap again to release.':'Tap a slice to see the scale.';}
function scaleCountDetail(){if(!sel.scaleCount)return 'Tap a bar to see the scale.';var n=DB.items.filter(function(i){return (i.scale||'?')===sel.scaleCount;}).length;return esc(sel.scaleCount)+': '+n+' pieces. Tap again to release.';}
function acqDetail(){if(!sel.acqMonth)return 'Tap a bar to see the month.';var n=DB.items.filter(function(i){return monthKey(i.pdate)===sel.acqMonth;}).length;return sel.acqMonth+': '+n+' added. Tap again to release.';}

  var qs=$('#qScale');if(qs)qs.addEventListener('change',function(){ui.filterScale=qs.value;render();});
  var qt=$('#qType');if(qt)qt.addEventListener('change',function(){ui.filterType=qt.value;render();});
  var qb=$('#qBox');if(qb)qb.addEventListener('input',function(){ui.q=qb.value;var pos=qb.selectionStart;render();var nq=$('#qBox');if(nq){nq.focus();nq.setSelectionRange(pos,pos);}});
  /* consists */
  var nc=qa('[data-act="newConsist"]')[0];if(nc)nc.addEventListener('click',function(){ui.editConsist='new';ui._tmpConsist=null;click();render();window.scrollTo(0,0);});
  qa('[data-act="editConsist"]').forEach(function(b){b.addEventListener('click',function(){ui.editConsist=b.getAttribute('data-id');ui._tmpConsist=null;click();render();window.scrollTo(0,0);});});
  qa('[data-act="cancelConsist"]').forEach(function(b){b.addEventListener('click',function(){ui.editConsist=null;ui._tmpConsist=null;render();});});
  qa('[data-act="toggleConsistItem"]').forEach(function(b){b.addEventListener('click',function(){
    var id=b.getAttribute('data-id');
    ui._tmpConsist=ui._tmpConsist||{itemIds:(ui.editConsist==='new'?[]:DB.consists.filter(function(x){return x.id===ui.editConsist;})[0].itemIds.slice())};
    var cn=$('#cName'),nt=$('#cNotes');
    if(cn)ui._tmpConsist.name=cn.value;if(nt)ui._tmpConsist.notes=nt.value;
    var c=ui._tmpConsist;
    var ix=c.itemIds.indexOf(id);if(ix>=0)c.itemIds.splice(ix,1);else c.itemIds.push(id);click();render();
  });});
  var sc=qa('[data-act="saveConsist"]')[0];
  if(sc)sc.addEventListener('click',function(){
    var name=$('#cName').value.trim();if(!name){toast('Give the consist a name.');return;}
    var ids=(ui._tmpConsist&&ui._tmpConsist.itemIds)||(ui.editConsist==='new'?[]:DB.consists.filter(function(x){return x.id===ui.editConsist;})[0].itemIds);
    var notes=$('#cNotes').value.trim();
    if(ui.editConsist==='new')DB.consists.push({id:uid(),name:name,itemIds:ids,notes:notes});
    else{var c=DB.consists.filter(function(x){return x.id===ui.editConsist;})[0];c.name=name;c.itemIds=ids;c.notes=notes;}
    ui._tmpConsist=null;save();good();ui.editConsist=null;render();
  });
  var dc=qa('[data-act="delConsist"]')[0];
  if(dc)dc.addEventListener('click',function(){if(!confirm('Delete this consist?'))return;DB.consists=DB.consists.filter(function(x){return x.id!==ui.editConsist;});ui._tmpConsist=null;save();ui.editConsist=null;render();});
  /* maintenance */
  var am=qa('[data-act="addMaint"]')[0];
  if(am)am.addEventListener('click',function(){
    var itemId=$('#mItem').value;if(!itemId){toast('Add a piece first.');return;}
    DB.maint.push({id:uid(),itemId:itemId,date:$('#mDate').value||todayLocal(),type:$('#mType').value,cost:parseFloat($('#mCost').value)||0,notes:$('#mNotes').value.trim()});
    save();good();render();
  });
  qa('[data-act="delMaint"]').forEach(function(b){b.addEventListener('click',function(){if(!confirm('Delete this record?'))return;DB.maint=DB.maint.filter(function(m){return m.id!==b.getAttribute('data-id');});save();render();});});
  /* charts */
  qa('[data-vscale]').forEach(function(el){el.addEventListener('click',function(){var k=el.getAttribute('data-vscale');sel.scaleVal=sel.scaleVal===k?null:k;click();render();});});
  qa('[data-cscale]').forEach(function(el){el.addEventListener('click',function(){var k=el.getAttribute('data-cscale');sel.scaleCount=sel.scaleCount===k?null:k;click();render();});});
  qa('[data-acq]').forEach(function(el){el.addEventListener('click',function(){var k=el.getAttribute('data-acq');sel.acqMonth=sel.acqMonth===k?null:k;click();render();});});
  qa('[data-road]').forEach(function(el){el.addEventListener('click',function(){var k=el.getAttribute('data-road');sel.road=sel.road===k?null:k;click();render();});});
  /* reports */
  var pp=qa('[data-act="printPacket"]')[0];if(pp)pp.addEventListener('click',function(){click();printPacket();});
  var ce=qa('[data-act="csv"]')[0];
  if(ce)ce.addEventListener('click',function(){click();
    var rows=[['Road','Number','Kind','Scale','Manufacturer','Model','Type','DCC','Date acquired','Price paid','Current value','Condition','Location','Notes']];
    DB.items.forEach(function(it){rows.push([it.road,it.number,it.kind,it.scale,it.mfr,it.model,it.type,it.dcc,it.pdate,it.price,it.value,it.cond,it.loc,it.notes].map(csvEsc));});
    download('railledger-collection.csv',rows.map(function(r){return r.join(',');}).join('\n'),'text/csv');
  });
  var bk=qa('[data-act="backup"]')[0];
  if(bk)bk.addEventListener('click',function(){click();download('railledger-backup.json',JSON.stringify(DB),'application/json');});
  var rf=$('#restoreFile');
  if(rf)rf.addEventListener('change',function(){
    var f=rf.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.items))throw 0;
      var badId=(d.items||[]).some(function(it){return !it||!it.id;})||(d.maint||[]).some(function(m){return !m||!m.id;})||(d.consists||[]).some(function(c){return !c||!c.id;});
      if(badId)throw 0;
      var dropped=0;
      d.items=(d.items||[]).filter(function(it){var ok=it&&typeof it==='object';if(!ok)dropped++;return ok;});
      d.maint=(d.maint||[]).filter(function(m){var ok=m&&typeof m==='object';if(!ok)dropped++;return ok;});
      d.consists=(d.consists||[]).filter(function(c){var ok=c&&typeof c==='object';if(!ok)dropped++;return ok;});
      DB=d;save();good();toast('Backup restored.'+(dropped?' '+dropped+' bad records dropped.':''));render();
    }catch(e){toast('That file is not a valid RailLedger backup.');}};
    r.readAsText(f);rf.value='';
  });
}
render();
</script>
</body>
</html>
