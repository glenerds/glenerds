<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Fishing Catch Log & Tackle Tracker — Trips, Personal Bests, Bait Stats</title>
<meta name="description" content="FishinLedger: a private, offline fishing catch log. Record trips and catches, track personal bests, see which baits actually work, and print your season report. Your spots stay private — no account, no cloud.">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#24211b; --muted:#6f6656; --line:#e2dac9;
  --accent:#1f6f5c; --accent2:#2f9e7e; --good:#2e7d4f; --warn:#b3541e; --bad:#b03a2e;
  --chip:#ece5d3; --sel:#1f6f5c; --shadow:0 1px 3px rgba(36,33,27,.10);
  --h0:#ece5d3; --h1:#cfe3d4; --h2:#9cc7ab; --h3:#5da47e; --h4:#2c7a58;
  --bar:#2f9e7e; --barline:#1f6f5c;
}
body.dark{
  --bg:#14181a; --card:#1f2629; --ink:#eef2ee; --muted:#a9b8b0; --line:#333f42;
  --accent:#5fd3a8; --accent2:#3aa87f; --good:#5cb87f; --warn:#e08a4e; --bad:#e06a5e;
  --chip:#2a3437; --sel:#5fd3a8; --shadow:0 1px 3px rgba(0,0,0,.45);
  --h0:#2a3437; --h1:#8fdcb8; --h2:#5da47e; --h3:#4a7d60; --h4:#2f5c44;
  --bar:#3aa87f; --barline:#5fd3a8;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{max-width:1080px;margin:0 auto;padding:14px 16px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:38px;height:38px;flex:0 0 auto}
.brand .name{font-size:26px;font-weight:700;letter-spacing:.5px}
.hbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:21px;box-shadow:var(--shadow)}
.hbtn:hover{border-color:var(--accent)}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.dark .hbtn.on{color:#10201a}
.pillbtn{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;font-weight:700;box-shadow:var(--shadow);text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.pillbtn:hover{border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.tab{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;font-weight:700}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
body.dark .tab.active{color:#10201a}
.grid{display:grid;gap:14px}
.cards4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cards2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:20px}
.card h3{margin:14px 0 8px;font-size:18px}
.statnum{font-size:32px;font-weight:700;color:var(--accent)}
.statlab{font-size:15px;color:var(--muted)}
.statsub{font-size:15px;color:var(--muted);margin-top:6px}
.detail{font-size:20px;font-weight:600;min-height:28px;margin-top:8px;text-align:center}
.muted{color:var(--muted);font-size:15px}
form .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
form label{font-size:15px;font-weight:700;display:block;margin-bottom:4px}
.field{display:flex;flex-direction:column;min-width:140px;flex:1}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.btn{padding:11px 20px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
body.dark .btn{color:#10201a}
body.dark .btn.ghost{color:var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.small{padding:7px 12px;font-size:15px}
.listitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.listitem .ttl{font-size:18px;font-weight:700}
.tag{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 10px;font-size:15px;margin:2px 4px 2px 0}
.bars{display:flex;align-items:flex-end;gap:8px;height:260px;padding:8px 4px 0;border-bottom:2px solid var(--line)}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.barfill{width:100%;max-width:54px;background:var(--bar);border-radius:6px 6px 0 0;border:1px solid var(--barline);border-bottom:none;transition:transform .12s}
.barcol.sel .barfill{background:var(--sel);outline:3px solid var(--sel);outline-offset:2px}
.barlab{font-size:14px;color:var(--muted);margin-top:4px;white-space:nowrap}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donutwrap svg{flex:0 0 auto}
.legend{font-size:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.legend .li{cursor:pointer;padding:4px 10px;border-radius:8px;display:inline-flex;gap:8px;align-items:center}
.legend .li.sel{background:var(--chip);outline:2px solid var(--sel)}
.sw{width:16px;height:16px;border-radius:4px;flex:0 0 auto}
path.slice{cursor:pointer;transition:transform .15s}
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin-top:6px}
.heat i{aspect-ratio:1.4;border-radius:4px;background:var(--h0);display:block;cursor:pointer}
.heat i.h1{background:var(--h1)}.heat i.h2{background:var(--h2)}.heat i.h3{background:var(--h3)}.heat i.h4{background:var(--h4)}
.heat i.sel{outline:3px solid var(--ink);outline-offset:1px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
th{font-size:15px;color:var(--muted)}
.alert{background:var(--chip);border-left:5px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:16px}
.snap{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.snaprow{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;font-size:16px}
.snaprow span{color:var(--muted)}
footer.cta{max-width:1080px;margin:0 auto 40px;padding:0 16px;text-align:center}
.hidden{display:none!important}
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;color:#000}
  #printArea h1{font-size:24px}
  #printArea table{font-size:13px}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:6px}
}
@media(max-width:560px){.heat{grid-template-columns:repeat(9,1fr)}}
@media(max-width:560px){.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.tabs button{flex:0 0 auto}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:16px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#1f6f5c" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="8" r="3.2"/><path d="M20 11.5 V26"/><path d="M20 26 c0 6-4.5 9-9 9 c-4 0-7-2.6-7-6.4"/><path d="M4 28.6 l5.5 1.2 l-1.6 5.2" stroke-width="2.4"/></g><circle cx="20" cy="8" r="3.2" fill="#2f9e7e" stroke="none"/></svg>
    <span class="name">FishinLedger</span>
  </div>
  <a class="pillbtn" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps</a>
  <button class="hbtn" id="btnSample" title="Try sample data" aria-label="Try sample data"><svg viewBox="0 0 24 24"><path d="M10 3h4M10 3v5.2L4.8 17a2.4 2.4 0 0 0 2.1 3.6h10.2a2.4 2.4 0 0 0 2.1-3.6L14 8.2V3"/><path d="M7.5 14h9"/></svg></button>
  <button class="hbtn" id="btnTheme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M20 13.2A8.5 8.5 0 1 1 10.8 4 6.8 6.8 0 0 0 20 13.2z"/></svg></button>
  <button class="hbtn" id="btnSound" title="Toggle sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="sw1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="sw2" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
</header>
<main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div id="view"></div>
</main>
<footer class="cta"><a class="pillbtn" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps</a></footer>
<div id="printArea"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* FishinLedger — private offline fishing catch log. All data stays in this browser. */
var LS='fishinledger_v1', SNAP='fishinledger_v1_snapshot', SMFLAG='fishinledger_samplemode';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function blankDB(){return {trips:[],catches:[],spots:[],tackle:[],settings:{theme:'auto',sound:true}};}
function load(){
  try{var raw=localStorage.getItem(LS);if(!raw)return null;var d=JSON.parse(raw);
    if(!d||typeof d!=='object')return null;
    d.trips=d.trips||[];d.catches=d.catches||[];d.spots=d.spots||[];d.tackle=d.tackle||[];
    d.settings=d.settings||{theme:'auto',sound:true};return d;}catch(e){return null;}
}
var DB=load()||blankDB();
var sampleMode=false;
var memBackup=null;
try{sampleMode=localStorage.getItem(SMFLAG)==='1';}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ozTotal(c){return (Number(c.lb)||0)*16+(Number(c.oz)||0);}
function fmtW(c){var t=ozTotal(c);if(!t)return '—';var lb=Math.floor(t/16),oz=Math.round(t%16);
  if(lb&&oz)return lb+' lb '+oz+' oz';if(lb)return lb+' lb';return oz+' oz';}
function fmtL(c){var l=Number(c.len);return l>0?l+'"':'—';}
function tripById(id){for(var i=0;i<DB.trips.length;i++)if(DB.trips[i].id===id)return DB.trips[i];return null;}
function spotById(id){for(var i=0;i<DB.spots.length;i++)if(DB.spots[i].id===id)return DB.spots[i];return null;}
function baitById(id){for(var i=0;i<DB.tackle.length;i++)if(DB.tackle[i].id===id)return DB.tackle[i];return null;}
function catchesOf(tripId){return DB.catches.filter(function(c){return c.tripId===tripId;});}
function monthKey(d){return d.slice(0,7);}
function monthLabel(k){var p=k.split('-');var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return M[Number(p[1])-1]+' '+p[0];}

/* ---------- sound ---------- */
var actx=null;
function beep(f){
  if(!DB.settings.sound)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f||520;g.gain.value=0.08;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.18);o.stop(actx.currentTime+0.2);
  }catch(e){}
}
function click(){beep(520);}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2600);}

/* ---------- theme ---------- */
function applyTheme(){
  var t=DB.settings.theme||'auto';
  var dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark',dark);
  var b=document.getElementById('btnTheme');
  b.classList.toggle('on',t!=='auto');
}
document.getElementById('btnTheme').addEventListener('click',function(){
  DB.settings.theme=document.body.classList.contains('dark')?'light':'dark';
  save();applyTheme();click();
});
document.getElementById('btnSound').addEventListener('click',function(){
  DB.settings.sound=!DB.settings.sound;save();
  applySoundBtn();
  click();
});
function applySoundBtn(){
  var b=document.getElementById('btnSound');
  b.classList.toggle('on',!DB.settings.sound);
  var w=b.querySelectorAll('.sw1,.sw2');
  for(var i=0;i<w.length;i++)w[i].style.display=DB.settings.sound?'':'none';
  b.title=DB.settings.sound?'Sound: on':'Sound: off';
}

/* ---------- sample data ---------- */
function seededRand(seed){var s=seed;return function(){s=(s*1103515245+12345)%2147483648;return s/2147483648;};}
function genSample(){
  var R=seededRand(20261010);
  var d=blankDB();d.settings=DB.settings;
  var s1={id:uid(),name:'Lake Monroe',type:'lake',notes:'Cutoff areas near Paynetown; best at dawn.'};
  var s2={id:uid(),name:'Griffy Lake',type:'lake',notes:'Quiet no-wake lake, good for kayaks.'};
  var s3={id:uid(),name:'Beanblossom Creek',type:'river',notes:'Wade the riffles below the old bridge.'};
  d.spots=[s1,s2,s3];
  var t1={id:uid(),name:'Zoom Trick Worm',type:'soft plastic',color:'Green Pumpkin'};
  var t2={id:uid(),name:'Strike King KVD 1.5',type:'crankbait',color:'Sexy Shad'};
  var t3={id:uid(),name:'Berkley Power Grub',type:'soft plastic',color:'Chartreuse'};
  var t4={id:uid(),name:'Mepps Aglia',type:'spinner',color:'Gold'};
  var t5={id:uid(),name:'Yamamoto Senko',type:'soft plastic',color:'Watermelon Red'};
  d.tackle=[t1,t2,t3,t4,t5];
  var species=['Largemouth Bass','Largemouth Bass','Largemouth Bass','Smallmouth Bass','Crappie','Crappie','Bluegill','Channel Catfish'];
  var weathers=['Sunny, calm','Overcast, light breeze','Partly cloudy','Morning fog, then sun','Windy, choppy'];
  var base=new Date();base.setHours(7,0,0,0);
  var dayMs=86400000, offsets=[292,271,255,240,224,208,190,172,150,131,112,96,78,60,45,30,21,12,5];
  offsets.forEach(function(off,ti){
    var dt=new Date(base.getTime()-off*dayMs);
    var iso=dt.toISOString().slice(0,10);
    var spot=[s1,s2,s3][Math.floor(R()*3)];
    var skunk=R()<0.12;
    var trip={id:uid(),date:iso,spotId:spot.id,spotName:spot.name,
      cond:{weather:weathers[Math.floor(R()*weathers.length)],air:(58+Math.floor(R()*30))+'°F',
            water:(52+Math.floor(R()*28))+'°F',wind:['Calm','Light','Breezy','Windy'][Math.floor(R()*4)],notes:''}};
    d.trips.push(trip);
    if(skunk)return;
    var n=1+Math.floor(R()*4);
    for(var i=0;i<n;i++){
      var sp=species[Math.floor(R()*species.length)];
      var lb=0,oz=0,len=0;
      if(sp==='Largemouth Bass'){lb=1+Math.floor(R()*4);oz=Math.floor(R()*16);len=12+Math.floor(R()*10);}
      else if(sp==='Smallmouth Bass'){lb=1+Math.floor(R()*3);oz=Math.floor(R()*16);len=11+Math.floor(R()*8);}
      else if(sp==='Crappie'){oz=6+Math.floor(R()*10);len=8+Math.floor(R()*6);}
      else if(sp==='Bluegill'){oz=3+Math.floor(R()*6);len=6+Math.floor(R()*4);}
      else{lb=2+Math.floor(R()*8);oz=Math.floor(R()*16);len=16+Math.floor(R()*12);}
      var bait=[t1,t2,t3,t4,t5][Math.floor(R()*5)];
      d.catches.push({id:uid(),tripId:trip.id,species:sp,len:len,lb:lb,oz:oz,
        baitId:bait.id,baitName:bait.name,technique:['Texas rig','Wacky rig','Slow roll','Jigging','Drift'][Math.floor(R()*5)],
        released:R()<0.7?'yes':'no',notes:''});
    }
  });
  d.trips.sort(function(a,b){return b.date<a.date?-1:1;});
  return d;
}
function setSample(on){
  click();
  if(on){
    var snap=null;
    try{snap=JSON.stringify(DB);localStorage.setItem(SNAP,snap);}catch(e){snap=null;}
    if(snap===null){toast('Could not snapshot your data — sample mode not enabled.');return;}
    memBackup=DB;
    DB=genSample();save();
    try{localStorage.setItem(SMFLAG,'1');}catch(e){}
    sampleMode=true;
  }else{
    var restored=null;
    try{var raw=localStorage.getItem(SNAP);restored=raw?JSON.parse(raw):null;}catch(e){restored=null;}
    if(!restored&&memBackup)restored=memBackup;
    DB=restored||blankDB();
    memBackup=null;
    try{localStorage.removeItem(SNAP);localStorage.removeItem(SMFLAG);}catch(e){}
    save();sampleMode=false;
  }
  sel.month=null;sel.species=null;sel.bait=null;sel.week=null;editTrip=null;editCatch=null;
  render();
}
document.getElementById('btnSample').addEventListener('click',function(){setSample(!sampleMode);});
function refreshSampleBtn(){var b=document.getElementById('btnSample');b.classList.toggle('on',sampleMode);b.title=sampleMode?'Sample data ON — tap to restore your data':'Try sample data';}

/* ---------- tabs ---------- */
var TABS=[['dash','Dashboard'],['log','Catch Log'],['spots','Spots'],['tackle','Tackle'],['bests','Personal Bests'],['charts','Charts'],['reports','Reports & Data']];
var activeTab='dash';
var sel={month:null,species:null,bait:null,week:null};
var editTrip=null,editCatch=null,editSpot=null,editBait=null;
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab'+(t[0]===activeTab?' active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
  }).join('');
  var btns=document.querySelectorAll('#tabs .tab');
  for(var i=0;i<btns.length;i++)btns[i].addEventListener('click',function(){activeTab=this.getAttribute('data-tab');click();render();});
}
function render(){renderTabs();refreshSampleBtn();applyTheme();
  var v=document.getElementById('view');
  if(activeTab==='dash')v.innerHTML=viewDash();
  else if(activeTab==='log')v.innerHTML=viewLog();
  else if(activeTab==='spots')v.innerHTML=viewSpots();
  else if(activeTab==='tackle')v.innerHTML=viewTackle();
  else if(activeTab==='bests')v.innerHTML=viewBests();
  else if(activeTab==='charts')v.innerHTML=viewCharts();
  else v.innerHTML=viewReports();
  wireView();
}

/* ---------- dashboard ---------- */
function palette(){return ['#2f9e7e','#e0a33e','#5b8dd9','#c65b8f','#8a6fd1','#4fb3a9','#d96a4b','#7fb069'];}
function viewDash(){
  var nc=DB.catches.length, nt=DB.trips.length;
  var big=null;DB.catches.forEach(function(c){if(!big||ozTotal(c)>ozTotal(big))big=c;});
  var recent=DB.catches.slice().sort(function(a,b){var ta=tripById(a.tripId),tb=tripById(b.tripId);
    var da=ta?ta.date:'',db=tb?tb.date:'';return db<da?-1:1;}).slice(0,6);
  var needy=DB.trips.filter(function(t){var c=t.cond||{};return !(c.weather||c.air||c.water||c.wind||c.notes);});
  var mkNow=monthKey(new Date().toISOString().slice(0,10));
  var thisMonth=DB.catches.filter(function(c){var t=tripById(c.tripId);return t&&monthKey(t.date)===mkNow;}).length;
  var skunks=DB.trips.filter(function(t){return !DB.catches.some(function(c){return c.tripId===t.id;});}).length;
  var bigTrip=big?tripById(big.tripId):null;
  var snap='';
  if(!needy.length&&nc){
    var bs=baitStats()[0];
    var bySpot={};DB.catches.forEach(function(c){var t=tripById(c.tripId);var k=t?t.spotName:'?';bySpot[k]=(bySpot[k]||0)+1;});
    var topSpot=Object.keys(bySpot).sort(function(a,b){return bySpot[b]-bySpot[a];})[0];
    var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
    var last30=DB.catches.filter(function(c){var t=tripById(c.tripId);return t&&new Date(t.date+'T12:00:00')>=cutoff;}).length;
    snap='<div class="snap"><div class="snaprow"><span>Top bait</span><b>'+esc(bs?bs.name:'—')+(bs?' ('+bs.n+' fish)':'')+'</b></div>'
      +'<div class="snaprow"><span>Hottest spot</span><b>'+esc(topSpot||'—')+(topSpot?' ('+bySpot[topSpot]+' fish)':'')+'</b></div>'
      +'<div class="snaprow"><span>Last 30 days</span><b>'+last30+' fish</b></div></div>';
  }
  var h='<div class="grid cards4">'
    +'<div class="card"><div class="statnum">'+nc+'</div><div class="statlab">Total catches logged</div>'+(nc?'<div class="statsub">'+thisMonth+' this month</div>':'')+'</div>'

function monthDetail(){
  if(!sel.month)return 'Tap a bar to see the month.';
  var list=DB.catches.filter(function(c){var t=tripById(c.tripId);return t&&monthKey(t.date)===sel.month;});
  var trips={};list.forEach(function(c){trips[c.tripId]=1;});
  var sp={};list.forEach(function(c){sp[c.species]=(sp[c.species]||0)+1;});
  var top=Object.keys(sp).sort(function(a,b){return sp[b]-sp[a];})[0];
  return monthLabel(sel.month)+': '+list.length+' catches, '+Object.keys(trips).length+' trips'+(top?' — top: '+esc(top):'')+'. Tap again to release.';
}
function chartMonths(){
  var now=new Date(),keys=[];
  for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    keys.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2));}
  var counts={};keys.forEach(function(k){counts[k]=0;});
  DB.catches.forEach(function(c){var t=tripById(c.tripId);if(!t)return;var k=monthKey(t.date);if(k in counts)counts[k]++;});
  var max=Math.max.apply(null,keys.map(function(k){return counts[k];}).concat([1]));
  var lab=['J','F','M','A','M','J','J','A','S','O','N','D'];
  return '<div class="bars" role="img" aria-label="Catches by month">'+keys.map(function(k){
    var h=Math.round(counts[k]/max*240);
    var ml=monthLabel(k).split(' ');
    return '<div class="barcol'+(sel.month===k?' sel':'')+'" data-month="'+k+'" title="'+monthLabel(k)+': '+counts[k]+' catches">'
      +'<div class="barfill" style="height:'+Math.max(h,counts[k]>0?6:2)+'px"></div>'
      +'<div class="barlab">'+lab[Number(k.slice(5,7))-1]+'</div></div>';
  }).join('')+'</div>';
}
function speciesDetail(){
  if(!sel.species)return 'Tap a slice to see the species.';
  var list=DB.catches.filter(function(c){return c.species===sel.species;});
  var pct=Math.round(list.length/Math.max(DB.catches.length,1)*100);
  return list.length+' catches — '+pct+'% of total. Tap again to release.';
}
function chartDonut(){
  var counts={};DB.catches.forEach(function(c){counts[c.species]=(counts[c.species]||0)+1;});
  var names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  var total=DB.catches.length;
  var pal=palette();
  if(!total)return '<p class="muted">No catches yet.</p>';
  var R=72,C=2*Math.PI*R,off=25,paths='';
  names.forEach(function(n,i){
    var frac=counts[n]/total, len=frac*C;
    var pull=sel.species===n?9:0;
    var mid=(off+len/2)/C*360-90, rad=mid*Math.PI/180;
    var dx=Math.cos(rad)*pull, dy=Math.sin(rad)*pull;
    paths+='<g transform="translate('+dx.toFixed(1)+' '+dy.toFixed(1)+')"><circle class="slice" data-species="'+esc(n)+'" cx="100" cy="100" r="'+R+'" fill="none" stroke="'+pal[i%pal.length]+'" stroke-width="30"'
      +' stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 100 100)"><title>'+esc(n)+': '+counts[n]+'</title></circle></g>';
    off+=len;
  });
  var center1,center2;
  if(sel.species){var sc=counts[sel.species],sp2=Math.round(sc/total*100);center1=sc+' fish';center2=sp2+'% of total';}
  else{center1=total+' fish';center2='total';}
  var fs1=center1.length>10?15:center1.length>7?19:24;
  var legend=names.map(function(n,i){
    return '<div class="li'+(sel.species===n?' sel':'')+'" data-species="'+esc(n)+'"><span class="sw" style="background:'+pal[i%pal.length]+'"></span>'+esc(n)+' ('+counts[n]+')</div>';
  }).join('');
  return '<div class="donutwrap"><div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto">'
    +'<svg width="320" height="320" viewBox="0 0 200 200" role="img" aria-label="Catches by species">'
    +'<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--h0)" stroke-width="30"/>'+paths
    +'<text x="100" y="96" text-anchor="middle" font-size="'+fs1+'" font-weight="700" fill="var(--ink)" pointer-events="none">'+esc(center1)+'</text>'
    +'<text x="100" y="122" text-anchor="middle" font-size="15" fill="var(--muted)" pointer-events="none">'+esc(center2)+'</text>'
    +'</svg></div><div class="legend">'+legend+'</div></div>';
}
function baitStats(){
  var st={};
  DB.catches.forEach(function(c){var k=c.baitId||('n:'+c.baitName);
    st[k]=st[k]||{name:c.baitName||'Unknown',n:0,big:null};
    st[k].n++;if(!st[k].big||ozTotal(c)>ozTotal(st[k].big))st[k].big=c;});
  return Object.keys(st).map(function(k){return {key:k,name:st[k].name,n:st[k].n,big:st[k].big};})
    .sort(function(a,b){return b.n-a.n;}).slice(0,8);
}
function baitDetail(){
  if(!sel.bait)return 'Tap a bar to see the bait.';
  var s=baitStats().filter(function(x){return x.key===sel.bait;})[0];
  if(!s)return 'Tap a bar to see the bait.';
  return esc(s.name)+': '+s.n+' catches'+(s.big?', biggest '+fmtW(s.big)+' ('+esc(s.big.species)+')':'')+'. Tap again to release.';
}
function chartBaits(){
  var s=baitStats();
  if(!s.length)return '<p class="muted">No bait data yet.</p>';
  var max=Math.max.apply(null,s.map(function(x){return x.n;}).concat([1]));
  return '<div class="bars" role="img" aria-label="Catches by bait">'+s.map(function(x){
    var h=Math.round(x.n/max*240);
    return '<div class="barcol'+(sel.bait===x.key?' sel':'')+'" data-bait="'+esc(x.key)+'" title="'+esc(x.name)+': '+x.n+' catches">'
      +'<div class="barfill" style="height:'+Math.max(h,6)+'px"></div>'
      +'<div class="barlab">'+x.n+'</div></div>';
  }).join('')+'</div><p class="muted">'+s.map(function(x){return esc(x.name);}).join(' · ')+'</p>';
}
function chartHeat(){
  var cells=[],now=new Date();now.setHours(0,0,0,0);
  var start=new Date(now.getTime()-(26*7-1)*86400000);
  var buckets={};
  DB.catches.forEach(function(c){var t=tripById(c.tripId);if(!t)return;
    var d=new Date(t.date+'T12:00:00');var w=Math.floor((d-start)/ (7*86400000));
    if(w>=0&&w<26)buckets[w]=(buckets[w]||0)+1;});
  for(var w=0;w<26;w++){
    var n=buckets[w]||0, lvl=n===0?0:n<3?1:n<6?2:n<10?3:4;
    var wd=new Date(start.getTime()+w*7*86400000);
    cells.push('<i class="'+(lvl?'h'+lvl:'')+(sel.week===w?' sel':'')+'" data-week="'+w+'" title="Week of '+wd.toISOString().slice(0,10)+': '+n+' catches"></i>');
  }
  return '<div class="heat">'+cells.join('')+'</div>';
}
function weekDetail(){
  if(sel.week==null)return 'Tap a square to see the week.';
  var now=new Date();now.setHours(0,0,0,0);
  var start=new Date(now.getTime()-(26*7-1)*86400000);
  var w0=new Date(start.getTime()+sel.week*7*86400000), w1=new Date(w0.getTime()+6*86400000);
  var n=0,trips={};
  DB.catches.forEach(function(c){var t=tripById(c.tripId);if(!t)return;
    var d=new Date(t.date+'T12:00:00');
    if(d>=w0&&d<=w1){n++;trips[c.tripId]=1;}});
  function f(d){return d.toISOString().slice(0,10);}
  return 'Week of '+f(w0)+': '+n+' catches, '+Object.keys(trips).length+' trips. Tap again to release.';
}

    +'<div class="field" style="max-width:200px"><label>Season</label><select id="rYear">'
    +(ys.length?ys.map(function(y){return '<option value="'+y+'"'+(y===cur?' selected':'')+'>'+y+'</option>';}).join(''):'<option value="'+cur+'">'+cur+'</option>')+'</select></div>'
    +'</div><div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">'
    +'<button class="btn" id="btnPrint">Print report</button>'
    +'<button class="btn ghost" id="btnCSV">Export catches (CSV)</button>'
    +'<button class="btn ghost" id="btnJSON">Download backup (JSON)</button>'
    +'<label class="btn ghost" style="cursor:pointer">Restore backup<input type="file" id="fileJSON" accept=".json,application/json" class="hidden"></label>'
    +'</div><p class="muted">Printing shows only the report. CSV covers every catch. JSON backup restores everything — files are sanitized on import.</p></div>';
  return h;
}
function buildReport(year){
  var trips=DB.trips.filter(function(t){return t.date.slice(0,4)===year;});
  var catches=DB.catches.filter(function(c){var t=tripById(c.tripId);return t&&t.date.slice(0,4)===year;});
  var best={};
  catches.forEach(function(c){var b=best[c.species];
    if(!b||ozTotal(c)>ozTotal(b)||(ozTotal(c)===ozTotal(b)&&(Number(c.len)||0)>(Number(b.len)||0)))best[c.species]=c;});
  var bstats={};
  catches.forEach(function(c){var k=c.baitName||'Unknown';bstats[k]=bstats[k]||{n:0,big:null};bstats[k].n++;
    if(!bstats[k].big||ozTotal(c)>ozTotal(bstats[k].big))bstats[k].big=c;});
  var h='<h1>FishinLedger — '+esc(year)+' Season Report</h1>'
    +'<p>'+trips.length+' trips · '+catches.length+' catches · '+Object.keys(best).length+' species</p>'
    +'<h2>Personal bests</h2><table><tr><th>Species</th><th>Weight</th><th>Length</th><th>Date</th><th>Water</th></tr>'
    +Object.keys(best).sort(function(a,b){return ozTotal(best[b])-ozTotal(best[a]);}).map(function(n){
      var c=best[n],t=tripById(c.tripId);
      return '<tr><td>'+esc(n)+'</td><td>'+fmtW(c)+'</td><td>'+fmtL(c)+'</td><td>'+esc(t?t.date:'')+'</td><td>'+esc(t?t.spotName:'')+'</td></tr>';}).join('')+'</table>'
    +'<h2>Bait performance</h2><table><tr><th>Bait</th><th>Catches</th><th>Biggest fish</th></tr>'
    +Object.keys(bstats).sort(function(a,b){return bstats[b].n-bstats[a].n;}).map(function(k){
      return '<tr><td>'+esc(k)+'</td><td>'+bstats[k].n+'</td><td>'+fmtW(bstats[k].big)+' ('+esc(bstats[k].big.species)+')</td></tr>';}).join('')+'</table>'
    +'<h2>Trips</h2><table><tr><th>Date</th><th>Water</th><th>Catches</th><th>Conditions</th></tr>'
    +trips.sort(function(a,b){return b.date<a.date?-1:1;}).map(function(t){
      var cs=catchesOf(t.id).length,c=t.cond||{};
      return '<tr><td>'+esc(t.date)+'</td><td>'+esc(t.spotName)+'</td><td>'+cs+'</td><td>'+esc([c.weather,c.water&&('water '+c.water)].filter(Boolean).join(' · '))+'</td></tr>';}).join('')+'</table>';
  return h;
}
function download(name,content,type){
  var b=new Blob([content],{type:type}),u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},500);
}
function csvEsc(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  var rows=[['date','water','species','length_in','weight','bait','technique','released','notes']];
  DB.catches.slice().sort(function(a,b){var ta=tripById(a.tripId),tb=tripById(b.tripId);
    var da=ta?ta.date:'',db=tb?tb.date:'';return da<db?-1:1;}).forEach(function(c){
    var t=tripById(c.tripId);
    rows.push([t?t.date:'',t?t.spotName:'',c.species,c.len||'',fmtW(c),c.baitName||'',c.technique||'',c.released||'',c.notes||'']);});
  download('fishinledger-catches.csv',rows.map(function(r){return r.map(csvEsc).join(',');}).join('\n'),'text/csv');
}
function sanitizeDB(raw){
  function str(v,n){v=String(v==null?'':v);return v.slice(0,n||200);}
  function num(v){v=Number(v);return isFinite(v)&&v>=0?v:0;}
  function arr(a){return Array.isArray(a)?a:[];}
  var d=blankDB();
  d.trips=arr(raw.trips).map(function(t){return {id:str(t.id,40)||uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(t.date)?t.date:'2000-01-01',
    spotId:str(t.spotId,40),spotName:str(t.spotName,120),
    cond:{weather:str(t.cond&&t.cond.weather,120),air:str(t.cond&&t.cond.air,40),water:str(t.cond&&t.cond.water,40),wind:str(t.cond&&t.cond.wind,60),notes:str(t.cond&&t.cond.notes,2000)}};});
  d.catches=arr(raw.catches).map(function(c){return {id:str(c.id,40)||uid(),tripId:str(c.tripId,40),
    species:str(c.species,80),len:num(c.len),lb:num(c.lb),oz:num(c.oz),
    baitId:str(c.baitId,40),baitName:str(c.baitName,120),technique:str(c.technique,80),
    released:c.released==='no'?'no':'yes',notes:str(c.notes,2000)};});
  d.spots=arr(raw.spots).map(function(s){return {id:str(s.id,40)||uid(),name:str(s.name,120),
    type:['lake','river','pond','stream','saltwater'].indexOf(s.type)>=0?s.type:'lake',notes:str(s.notes,2000)};});
  d.tackle=arr(raw.tackle).map(function(b){return {id:str(b.id,40)||uid(),name:str(b.name,120),
    type:str(b.type,80),color:str(b.color,80)};});
  return d;
}

/* ---------- wiring ---------- */
function q(s,r){return (r||document).querySelector(s);}
function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function wireView(){
  /* chart selection */
  qa('[data-month]').forEach(function(el){el.addEventListener('click',function(){
    var k=el.getAttribute('data-month');sel.month=sel.month===k?null:k;click();render();});});
  qa('[data-species]').forEach(function(el){el.addEventListener('click',function(){
    var k=el.getAttribute('data-species');sel.species=sel.species===k?null:k;click();render();});});
  qa('[data-bait]').forEach(function(el){el.addEventListener('click',function(){
    var k=el.getAttribute('data-bait');sel.bait=sel.bait===k?null:k;click();render();});});
  qa('[data-week]').forEach(function(el){el.addEventListener('click',function(){
    var k=Number(el.getAttribute('data-week'));sel.week=sel.week===k?null:k;click();render();});});
  qa('[data-fixcond]').forEach(function(el){el.addEventListener('click',function(){
    var t=tripById(el.getAttribute('data-fixcond'));if(t){editTrip=t;activeTab='log';click();render();
      setTimeout(function(){var f=q('#tWeather');if(f)f.focus();},50);}});});
  /* trip form */
  var ft=q('#fTrip');
  if(ft)ft.addEventListener('submit',function(e){e.preventDefault();
    var spotId=q('#tSpot').value,spotNew=q('#tSpotNew').value.trim();
    var spot=spotId?spotById(spotId):null;
    var name=spot?spot.name:(spotNew||'');
    if(editTrip){
      editTrip.date=q('#tDate').value||editTrip.date;editTrip.spotId=spot?spot.id:'';editTrip.spotName=name||editTrip.spotName;
      editTrip.cond={weather:q('#tWeather').value.trim(),air:q('#tAir').value.trim(),water:q('#tWater').value.trim(),wind:q('#tWind').value.trim(),notes:q('#tNotes').value.trim()};
      editTrip=null;
    }else{
      DB.trips.push({id:uid(),date:q('#tDate').value||new Date().toISOString().slice(0,10),
        spotId:spot?spot.id:'',spotName:name,
        cond:{weather:q('#tWeather').value.trim(),air:q('#tAir').value.trim(),water:q('#tWater').value.trim(),wind:q('#tWind').value.trim(),notes:q('#tNotes').value.trim()}});
    }
    save();click();render();});
  var ct=q('#cancelTrip');if(ct)ct.addEventListener('click',function(){editTrip=null;click();render();});
  qa('[data-edittrip]').forEach(function(el){el.addEventListener('click',function(){editTrip=tripById(el.getAttribute('data-edittrip'));editCatch=null;click();render();window.scrollTo(0,0);});});
  qa('[data-deltrip]').forEach(function(el){el.addEventListener('click',function(){
    if(!confirm('Delete this trip and its catches?'))return;
    var id=el.getAttribute('data-deltrip');
    DB.trips=DB.trips.filter(function(t){return t.id!==id;});
    DB.catches=DB.catches.filter(function(c){return c.tripId!==id;});
    save();click();render();});});
  /* catch forms */
  qa('.catchform').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();
    var tripId=f.getAttribute('data-trip');
    var sp=q('.cSpecies',f).value.trim();if(!sp)return;
    var baitId=q('.cBait',f).value,baitNew=q('.cBaitNew',f).value.trim();
    var bait=baitId?baitById(baitId):null;
    var data={tripId:tripId,species:sp,len:Math.max(0,Number(q('.cLen',f).value)||0),
      lb:Math.max(0,Number(q('.cLb',f).value)||0),oz:Math.max(0,Number(q('.cOz',f).value)||0),
      baitId:bait?bait.id:'',baitName:bait?bait.name:baitNew,
      technique:q('.cTech',f).value.trim(),released:q('.cRel',f).value,notes:q('.cNotes',f).value.trim()};
    if(editCatch&&editCatch.tripId===tripId){for(var k in data)editCatch[k]=data[k];editCatch=null;}
    else{data.id=uid();DB.catches.push(data);}
    save();click();render();});});
  qa('[data-editcatch]').forEach(function(el){el.addEventListener('click',function(){
    var c=null;DB.catches.forEach(function(x){if(x.id===el.getAttribute('data-editcatch'))c=x;});
    editCatch=c;click();render();});});
  qa('[data-cancelcatch]').forEach(function(el){el.addEventListener('click',function(){editCatch=null;click();render();});});
  qa('[data-delcatch]').forEach(function(el){el.addEventListener('click',function(){
    if(!confirm('Delete this catch?'))return;
    var id=el.getAttribute('data-delcatch');
    DB.catches=DB.catches.filter(function(c){return c.id!==id;});
    save();click();render();});});
  /* spots */
  var fs=q('#fSpot');
  if(fs)fs.addEventListener('submit',function(e){e.preventDefault();
    var n=q('#sName').value.trim();if(!n)return;
    if(editSpot){editSpot.name=n;editSpot.type=q('#sType').value;editSpot.notes=q('#sNotes').value.trim();editSpot=null;}
    else DB.spots.push({id:uid(),name:n,type:q('#sType').value,notes:q('#sNotes').value.trim()});
    save();click();render();});
  var cs2=q('#cancelSpot');if(cs2)cs2.addEventListener('click',function(){editSpot=null;click();render();});
  qa('[data-editspot]').forEach(function(el){el.addEventListener('click',function(){editSpot=spotById(el.getAttribute('data-editspot'));click();render();window.scrollTo(0,0);});});
  qa('[data-delspot]').forEach(function(el){el.addEventListener('click',function(){
    if(!confirm('Delete this spot? Trips keep their recorded water name.'))return;
    var id=el.getAttribute('data-delspot');
    DB.spots=DB.spots.filter(function(s){return s.id!==id;});
    save();click();render();});});
  /* tackle */
  var fb=q('#fBait');
  if(fb)fb.addEventListener('submit',function(e){e.preventDefault();
    var n=q('#bName').value.trim();if(!n)return;
    if(editBait){editBait.name=n;editBait.type=q('#bType').value.trim();editBait.color=q('#bColor').value.trim();editBait=null;}
    else DB.tackle.push({id:uid(),name:n,type:q('#bType').value.trim(),color:q('#bColor').value.trim()});
    save();click();render();});
  var cb=q('#cancelBait');if(cb)cb.addEventListener('click',function(){editBait=null;click();render();});
  qa('[data-editbait]').forEach(function(el){el.addEventListener('click',function(){editBait=baitById(el.getAttribute('data-editbait'));click();render();window.scrollTo(0,0);});});
  qa('[data-delbait]').forEach(function(el){el.addEventListener('click',function(){
    if(!confirm('Delete this bait? Catches keep their recorded bait name.'))return;
    var id=el.getAttribute('data-delbait');
    DB.tackle=DB.tackle.filter(function(b){return b.id!==id;});
    save();click();render();});});
  /* reports */
  var bp=q('#btnPrint');if(bp)bp.addEventListener('click',function(){click();
    q('#printArea').innerHTML=buildReport(q('#rYear').value);window.print();});
  var bc=q('#btnCSV');if(bc)bc.addEventListener('click',function(){click();exportCSV();});
  var bj=q('#btnJSON');if(bj)bj.addEventListener('click',function(){click();
    download('fishinledger-backup.json',JSON.stringify(DB,null,1),'application/json');});
  var fj=q('#fileJSON');
  if(fj)fj.addEventListener('change',function(){
    var f=fj.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){try{DB=sanitizeDB(JSON.parse(r.result));save();click();
      alert('Backup restored: '+DB.trips.length+' trips, '+DB.catches.length+' catches.');render();
    }catch(e){alert('Could not read that file — not a valid FishinLedger backup.');}};
    r.readAsText(f);});
}

/* ---------- init ---------- */
(function(){
  applySoundBtn();
  render();
})();
</script>
