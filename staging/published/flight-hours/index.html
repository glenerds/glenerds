<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlightHours — Pilot Logbook for GA Pilots | Flight Time, Currency &amp; Rating Progress Tracker</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#e9eef5; --ink:#1b2432; --muted:#5d6b7d;
  --line:#d4dce8; --acc:#25639e; --acc2:#3a7ab5; --good:#1e7a46; --warn:#a86e05; --bad:#b03a2e;
  --chip:#e3eaf3; --shadow:0 1px 4px rgba(20,40,70,.10);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#10151d; --panel:#1a212e; --panel2:#232e40; --ink:#e9eff7; --muted:#a9b8cc;
  --line:#33415a; --acc:#5ea0d8; --acc2:#4a86bd; --good:#63cc8f; --warn:#e3b95c; --bad:#ef8a7a;
  --chip:#263449; --shadow:0 1px 4px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem .9rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:22px;letter-spacing:.2px}
.logo-badge{width:40px;height:40px;border-radius:10px;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo-badge svg{width:26px;height:26px;fill:#fff}
.hspace{flex:1}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;cursor:pointer;min-height:44px}
button:hover{border-color:var(--acc2)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.primary:hover{background:var(--acc2)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{min-height:38px;padding:.3rem .6rem;font-size:15px}
button.seg[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.iconbtn{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.iconbtn svg{width:23px;height:23px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{background:var(--chip)}
a.moreapps{display:inline-flex;align-items:center;gap:.4rem;height:44px;padding:0 .9rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:600}
a.moreapps:hover{border-color:var(--acc2)}
#sampleBanner{display:none;background:var(--warn);color:#1d1607;font-weight:700;text-align:center;padding:.45rem .8rem;font-size:15px}
#sampleBanner.on{display:block}
nav.tabs{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;padding:.6rem .9rem 0}
nav.tabs button{border-radius:999px;padding:.45rem .95rem}
nav.tabs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:.9rem}
.view{display:none}
.view.on{display:block}
.grid{display:grid;gap:.9rem;align-items:start}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.grid.charts2{grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));align-items:stretch}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:var(--shadow)}
.card h2{margin:.1rem 0 .6rem;font-size:19px}
.card h3{margin:.8rem 0 .4rem;font-size:16px}
.stat .num{font-size:30px;font-weight:800;line-height:1.1}
.stat .lab{color:var(--muted);font-size:15px}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:.08rem .6rem;font-size:15px;margin:.1rem .15rem .1rem 0}
.tag.good{background:rgba(30,122,70,.16);color:var(--good)}
.tag.warn{background:rgba(168,110,5,.18);color:var(--warn)}
.tag.bad{background:rgba(176,58,46,.15);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:.42rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:.6rem}
label{display:block;font-size:15px;color:var(--muted);margin-bottom:.15rem}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.5rem .6rem;min-height:44px}
textarea{min-height:64px;resize:vertical}
input[type="checkbox"]{width:22px;height:22px;min-height:0;vertical-align:middle}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.listitem{border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem;margin-bottom:.6rem;background:var(--panel)}
.listitem .head{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.listitem .head b{font-size:17px}
.notice{border:1px solid var(--warn);background:rgba(168,110,5,.10);border-radius:12px;padding:.7rem .9rem;margin-bottom:.9rem}
.hint{font-size:15px;color:var(--warn);margin:.3rem 0}
.bar{height:14px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:.35rem 0 .2rem}
.bar>div{height:100%;background:var(--acc);border-radius:999px}
.bar>div.full{background:var(--good)}
.chartwrap{width:100%}
#view-charts .card{display:flex;flex-direction:column}
#view-charts .chartwrap{flex:1;display:flex;align-items:center}
#view-charts .detail{margin-top:auto}
.chartwrap svg{width:100%;height:auto;display:block}
.detail{background:var(--panel2);border-radius:10px;padding:.6rem .8rem;margin-top:.6rem;font-size:15px}
footer{max-width:1180px;margin:0 auto;padding:1rem .9rem 2rem;color:var(--muted);font-size:15px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#printArea{display:none}
@media print{
  body>*{display:none !important}
  #printArea{display:block !important;color:#000;background:#fff;font-size:13px}
  #printArea h1{font-size:20px;margin:0 0 4px}
  #printArea h2{font-size:15px;margin:14px 0 4px;border-bottom:1px solid #999;padding-bottom:2px}
  #printArea table{font-size:12px}
  #printArea th,#printArea td{border-bottom:1px solid #bbb;padding:3px 5px;color:#000}
  .pbrk{page-break-before:always}
}
@media (max-width:560px){ .brand{font-size:19px} main{padding:.7rem} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21.5 15.5v-2l-8.5-5V3.2a1.2 1.2 0 0 0-2.4 0v5.3l-8.5 5v2l8.5-2.6v5l-2.3 1.7v1.5l3.5-1 3.5 1v-1.5L13 17.9v-5l8.5 2.6Z"/></svg></span>FlightHours</div>
  <div class="hspace"></div>
  <a class="moreapps" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps</a>
  <button class="iconbtn" id="flaskBtn" title="Try sample data" aria-pressed="false" aria-label="Try sample data"><svg viewBox="0 0 24 24"><path d="M10 3h4M10 3v5.2L4.8 18a2.4 2.4 0 0 0 2.1 3.5h10.2A2.4 2.4 0 0 0 19.2 18L14 8.2V3"/><path d="M7.5 14h9"/></svg></button>
  <button class="iconbtn" id="themeBtn" title="Dark mode" aria-pressed="false" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M20 13.2A8.2 8.2 0 0 1 10.8 4 8.5 8.5 0 1 0 20 13.2Z"/></svg></button>
  <button class="iconbtn" id="soundBtn" title="Sound" aria-pressed="true" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path class="sndw" d="M15.5 9.5a3.6 3.6 0 0 1 0 5M18 7a6.8 6.8 0 0 1 0 10"/></svg></button>
</header>
<div id="sampleBanner">Sample data is on — you are looking at demo records. Toggle the flask to get your own records back.</div>
<nav class="tabs" role="tablist">
  <button data-tab="dashboard" aria-selected="true">Dashboard</button>
  <button data-tab="flights" aria-selected="false">Flights</button>
  <button data-tab="aircraft" aria-selected="false">Aircraft</button>
  <button data-tab="airports" aria-selected="false">Airports</button>
  <button data-tab="currency" aria-selected="false">Currency</button>
  <button data-tab="records" aria-selected="false">Records &amp; Goals</button>
  <button data-tab="charts" aria-selected="false">Charts</button>
  <button data-tab="reports" aria-selected="false">Reports &amp; Data</button>

</nav>
<main>
  <section class="view on" id="view-dashboard"></section>
  <section class="view" id="view-flights"></section>
  <section class="view" id="view-aircraft"></section>
  <section class="view" id="view-airports"></section>
  <section class="view" id="view-currency"></section>
  <section class="view" id="view-records"></section>
  <section class="view" id="view-charts"></section>
  <section class="view" id="view-reports"></section>
  <section class="view" id="view-about"></section>
</main>
<footer>FlightHours keeps your logbook on this device only — no account, no sync, no subscription. Export a backup from Reports &amp; Data and keep it somewhere safe.</footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<script>
"use strict";
const APP_NAME="FlightHours", LS_KEY="flighthours_v1";
const $=s=>document.querySelector(s);
let uidC=0;
const uid=()=>"id"+Date.now().toString(36)+(uidC++).toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;const s=String(v==null?"":v).trim();if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return 0;const n=parseFloat(s);return isFinite(n)?n:0;};
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>dstr(new Date());
const parseD=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return null;const p=s.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);return(d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2])?d:null;};
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"—";};
const addDays=(s,n)=>{const d=parseD(s);if(!d)return "";d.setDate(d.getDate()+n);return dstr(d);};
const diffDays=(a,b)=>{const da=parseD(a),db=parseD(b);if(!da||!db)return null;return Math.round((db-da)/864e5);};
/* exact calendar-month math: clamp day to target month's last day */
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
function addCalMonths(s,n){const d=parseD(s);if(!d)return "";const t=new Date(d.getFullYear(),d.getMonth()+n,1);const day=Math.min(d.getDate(),daysInMonth(t.getFullYear(),t.getMonth()));return dstr(new Date(t.getFullYear(),t.getMonth(),day));}
const endOfMonth=s=>{const d=parseD(s);if(!d)return "";return dstr(new Date(d.getFullYear(),d.getMonth()+1,0));};
const monthStart=s=>{const p=(s||"").split("-");return p.length===3?p[0]+"-"+p[1]+"-01":"";};
/* hours: INTEGER TENTHS everywhere (13 = 1.3h). Never sum floats. */
const h2t=v=>Math.max(0,Math.round(num(v)*10));
const c2t=v=>Math.max(0,Math.min(9999,Math.round(num(v))));
const fmtH=t=>(Math.round(t)/10).toFixed(1);
const monthKey=s=>(s||"").slice(0,7);
const monthLabel=k=>{const d=parseD(k+"-01");return d?d.toLocaleDateString(undefined,{month:"short",year:"2-digit"}):k;};

/* ---------- state ---------- */
function blankData(){return {flights:[],aircraft:[],airports:[],records:[],goals:[]};}
let S=null;
function defaultState(){return {v:1,settings:{sound:true,theme:null},data:blankData(),sample:{on:false,snapshot:null}};}
let saveWarned=false;
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){if(!saveWarned){saveWarned=true;try{toast("Warning: this browser could not save your records (storage full or blocked). Export a backup from Reports & Data.");}catch(e2){}}}}
function load(){
  let raw=null;try{raw=localStorage.getItem(LS_KEY);}catch(e){}
  if(raw){
    let p=null;try{p=JSON.parse(raw);}catch(e){}
    if(p&&p.v===1&&p.data){
      const clean=sanitizeData(p.data);
      const snap=p.sample&&p.sample.snapshot?sanitizeData(p.sample.snapshot):null;
      S={v:1,
        settings:{sound:!(p.settings&&p.settings.sound===false),
          theme:p.settings&&(p.settings.theme==="dark"||p.settings.theme==="light")?p.settings.theme:null},
        data:clean?clean.data:blankData(),
        sample:{on:!!(p.sample&&p.sample.on),snapshot:snap?snap.data:null}};
    }else{
      try{localStorage.setItem(LS_KEY+"_corrupt",raw);}catch(e){}
    }
  }
  if(!S){S=defaultState();save();}
}
const D=()=>S.data;
const acById=id=>D().aircraft.find(a=>a.id===id);
const apById=id=>D().airports.find(a=>a.id===id);
const acLabel=a=>a?((a.tail||"Aircraft")+(a.make||a.model?" — "+[a.make,a.model].filter(Boolean).join(" "):"")):"(removed aircraft)";
const apLabel=a=>a?((a.code||"????")+(a.name?" — "+a.name:"")):"(removed airport)";
const routeOf=f=>{const a=apById(f.fromId),b=apById(f.toId);return (a?a.code:"????")+" → "+(b?b.code:"????");};

/* One row of empty flight form values (hours kept as tenths).
   Category sums that exceed total are HINTED, never blocked. */
const CAT_FIELDS=[["pic","PIC"],["sic","SIC"],["dualReceived","Dual received"],["dualGiven","Dual given (CFI)"],["night","Night"],["xc","Cross-country"],["instActual","Instrument (actual)"],["instSim","Instrument (sim/hood)"]];
const sumFlights=(list)=>{const t={total:0,pic:0,sic:0,dualReceived:0,dualGiven:0,night:0,xc:0,instActual:0,instSim:0,approaches:0,holding:0,dayTO:0,dayLdg:0,nightTO:0,nightLdg:0,flights:0};
  list.forEach(f=>{t.flights++;t.total+=f.total;t.pic+=f.pic;t.sic+=f.sic;t.dualReceived+=f.dualReceived;t.dualGiven+=f.dualGiven;t.night+=f.night;t.xc+=f.xc;t.instActual+=f.instActual;t.instSim+=f.instSim;t.approaches+=f.approaches;t.holding+=f.holding?1:0;t.dayTO+=f.dayTO;t.dayLdg+=f.dayLdg;t.nightTO+=f.nightTO;t.nightLdg+=f.nightLdg;});
  return t;};
const allTotals=()=>sumFlights(D().flights);

/* ---------- currency (computed from records, as of today) ---------- */
/* 90-day passenger currency: landings on/after today-90 count ("preceding 90 days"); current through the 90th day after the oldest qualifying landing. */
function paxCurrency(night){
  const t=todayStr(),from=addDays(t,-90);
  const dates=[];
  D().flights.forEach(f=>{if(f.date>=from&&f.date<=t){const n=night?f.nightLdg:(f.dayLdg+f.nightLdg);for(let i=0;i<n;i++)dates.push(f.date);}});
  dates.sort();
  const count=dates.length,need=3,current=count>=need;
  let through="",daysLeft=null;
  if(current){through=addDays(dates[count-need],90);daysLeft=diffDays(t,through);}
  return {count:count,need:need,current:current,through:through,daysLeft:daysLeft,from:from,to:t};
}
/* Instrument currency: FAA 6-calendar-month lookback: window opens on the 1st
   day of the month 6 calendar months before the current month. */
function instCurrency(){
  const t=todayStr(),from=monthStart(addCalMonths(monthStart(t),-6));
  let approaches=0,holding=0,lastAppr="";
  D().flights.forEach(f=>{if(f.date>=from&&f.date<=t){approaches+=f.approaches;if(f.holding)holding++;if(f.approaches>0&&f.date>lastAppr)lastAppr=f.date;}});
  return {approaches:approaches,needAppr:6,holding:holding,needHold:1,current:approaches>=6&&holding>=1,from:from,to:t,lastAppr:lastAppr};
}
/* Flight review: due at the END of the 24th calendar month after the review. */
function flightReview(){
  const revs=D().records.filter(r=>r.kind==="Flight review"&&r.date).map(r=>r.date).sort();
  const last=revs.length?revs[revs.length-1]:"";
  if(!last)return {last:"",due:"",daysLeft:null};
  const due=endOfMonth(addCalMonths(last,24));
  return {last:last,due:due,daysLeft:diffDays(todayStr(),due)};
}
function expiringRecords(){
  const t=todayStr();
  return D().records.filter(r=>r.expires).map(r=>({r:r,days:diffDays(t,r.expires)})).sort((a,b)=>a.days-b.days);
}

/* ---------- sanitize / restore ---------- */
function isDateStr(s){return typeof s==="string"&&!!parseD(s);}
function sanitizeData(raw){
  const dropped={flights:0,aircraft:0,airports:0,records:0,goals:0};
  let corrected=0;
  const fixDate=(v,fb)=>{if(isDateStr(v))return v;if(typeof v==="string"&&v)corrected++;return fb;};
  if(!raw||typeof raw!=="object")return null;
  const arr=v=>Array.isArray(v)?v:[];
  const okId=o=>o&&typeof o==="object"&&typeof o.id==="string"&&/^[A-Za-z0-9_-]{1,80}$/.test(o.id);
  const str=v=>typeof v==="string"?v.slice(0,500):"";
  const tenths=v=>Math.max(0,Math.min(100000,Math.round(num(v))));
  const aircraft=arr(raw.aircraft).filter(o=>{if(!okId(o)){dropped.aircraft++;return false;}return true;}).map(o=>({id:o.id,tail:str(o.tail)||"N?????",make:str(o.make),model:str(o.model),category:["ASEL","AMEL","ASES","AMES","Helicopter","Glider","Other"].indexOf(o.category)>=0?o.category:"ASEL",notes:str(o.notes)}));
  const airports=arr(raw.airports).filter(o=>{if(!okId(o)){dropped.airports++;return false;}return true;}).map(o=>({id:o.id,code:(str(o.code)||"????").toUpperCase().slice(0,8),name:str(o.name),city:str(o.city),notes:str(o.notes)}));
  const acIds={},apIds={};aircraft.forEach(a=>acIds[a.id]=1);airports.forEach(a=>apIds[a.id]=1);
  const flights=arr(raw.flights).filter(o=>{if(!okId(o)){dropped.flights++;return false;}return true;}).map(o=>({id:o.id,date:fixDate(o.date,todayStr()),
    aircraftId:acIds[o.aircraftId]?o.aircraftId:"",fromId:apIds[o.fromId]?o.fromId:"",toId:apIds[o.toId]?o.toId:"",
    total:tenths(o.total),pic:tenths(o.pic),sic:tenths(o.sic),dualReceived:tenths(o.dualReceived),dualGiven:tenths(o.dualGiven),night:tenths(o.night),xc:tenths(o.xc),instActual:tenths(o.instActual),instSim:tenths(o.instSim),
    approaches:c2t(o.approaches),approachTypes:str(o.approachTypes),holding:!!o.holding,
    dayTO:c2t(o.dayTO),dayLdg:c2t(o.dayLdg),nightTO:c2t(o.nightTO),nightLdg:c2t(o.nightLdg),
    person:str(o.person),remarks:str(o.remarks)}));
  const KINDS=["Certificate","Medical","Endorsement","Flight review","Other"];
  const records=arr(raw.records).filter(o=>{if(!okId(o)){dropped.records++;return false;}return true;}).map(o=>({id:o.id,kind:KINDS.indexOf(o.kind)>=0?o.kind:"Other",name:str(o.name)||"Record",date:isDateStr(o.date)?o.date:"",expires:isDateStr(o.expires)?o.expires:"",issuer:str(o.issuer),notes:str(o.notes)}));
  const GOAL_CATS=["total","pic","sic","dualReceived","dualGiven","night","xc","inst","dayLdg","nightLdg"];
  const goals=arr(raw.goals).filter(o=>{if(!okId(o)){dropped.goals++;return false;}return true;}).map(o=>{const tg={};const src=o.targets&&typeof o.targets==="object"?o.targets:{};GOAL_CATS.forEach(k=>{if(num(src[k])>0)tg[k]=Math.min(100000,Math.round(num(src[k])));});return {id:o.id,name:str(o.name)||"Goal",targets:tg,notes:str(o.notes)};});
  const droppedTotal=Object.keys(dropped).reduce((a,k)=>a+dropped[k],0);
  return {data:{flights:flights,aircraft:aircraft,airports:airports,records:records,goals:goals},dropped:droppedTotal,droppedDetail:dropped,corrected:corrected,goalCats:GOAL_CATS};
}

/* ---------- sound / toast ---------- */
let AC=null;
let toastTimer=null;
function toast(msg){const el=$("#toast");if(!el)return;el.textContent=msg;el.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("on"),2800);}
function beep(f){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||760;o.type="sine";g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.09);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.1);}catch(e){}}
/* ---------- sample data (dates relative to today so currency math demos cleanly) ---------- */
function sampleData(){
  const A=(tail,make,model,cat)=>{const a={id:uid(),tail:tail,make:make,model:model,category:cat,notes:""};return a;};

/* ---------- shared UI helpers ---------- */
let editFlightId=null, editAcId=null, editApId=null, editRecId=null, editGoalId=null;
function currencyChip(ok,label){return "<span class='tag "+(ok?"good":"bad")+"'>"+esc(label)+"</span>";}
function ruleNote(){return "<p class='muted'>Computed from your records as of today. Your official logbook and the current regulations govern — this is a records summary, not an FAA determination.</p>";}

/* ---------- dashboard ---------- */
function renderDashboard(){
  const el=$("#view-dashboard"),t=allTotals();
  const day=paxCurrency(false),ngt=paxCurrency(true),inst=instCurrency(),rev=flightReview();
  const exp=expiringRecords().filter(x=>x.days<=180).slice(0,4);
  const recent=D().flights.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  let h="<div class='grid c4'>"+
    stat(fmtH(t.total),"Total hours logged")+stat(String(t.flights),"Flights")+stat(fmtH(t.pic),"PIC hours")+stat(String(t.dayLdg+t.nightLdg),"Landings (all)")+
  "</div><div class='grid c2' style='margin-top:.9rem'>";
  h+="<div class='card'><h2>Currency snapshot</h2>"+
    row("Passenger currency (day)",day.current, day.current?("Current — "+day.count+" takeoffs &amp; landings in the last 90 days; good through "+fmtD(day.through)):("Not current — "+day.count+" of 3 takeoffs &amp; landings in the last 90 days"))+
    row("Passenger currency (night)",ngt.current, ngt.current?("Current — "+ngt.count+" night full-stop landings in the last 90 days; good through "+fmtD(ngt.through)):("Not current — "+ngt.count+" of 3 night full-stop landings in the last 90 days"))+
    row("Instrument currency",inst.current, inst.current?("Current — "+inst.approaches+" approaches and "+inst.holding+" holding event(s) in the last 6 calendar months"):("Not current — "+inst.approaches+" of 6 approaches, "+inst.holding+" of 1 holding event in the last 6 calendar months"))+
    row("Flight review",!!rev.last&&rev.daysLeft>=0, rev.last?("Last review "+fmtD(rev.last)+" — due "+fmtD(rev.due)+(rev.daysLeft>=0?" ("+rev.daysLeft+" days left)":" (past the due month)")):"No flight review recorded yet")+
    "<p class='muted'>Full detail and the rules used are on the Currency tab.</p></div>";
  h+="<div class='card'><h2>Recent flights</h2>";
  if(!recent.length)h+="<p class='muted'>No flights yet. Add your first flight on the Flights tab, or tap the flask (top right) to explore with sample data.</p>";
  else h+="<table><tr><th>Date</th><th>Route</th><th>Aircraft</th><th>Total</th></tr>"+recent.map(f=>"<tr><td>"+fmtD(f.date)+"</td><td>"+esc(routeOf(f))+"</td><td>"+esc(acById(f.aircraftId)?acById(f.aircraftId).tail:"—")+"</td><td>"+fmtH(f.total)+" hrs</td></tr>").join("")+"</table>";
  if(exp.length)h+="<h3>Coming due</h3>"+exp.map(x=>"<div>"+esc(x.r.kind)+": "+esc(x.r.name)+" — <b>"+(x.days<0?"expired "+fmtD(x.r.expires):"expires "+fmtD(x.r.expires)+" ("+x.days+" days)")+"</b></div>").join("");
  h+="</div></div>";
  h+="<div class='card' style='margin-top:.9rem'><h2>Where the hours are</h2><div class='grid c3'>"+
    [["PIC",t.pic],["Dual received",t.dualReceived],["Dual given (CFI)",t.dualGiven],["SIC",t.sic],["Night",t.night],["Cross-country",t.xc],["Instrument",t.instActual+t.instSim]].map(x=>stat(fmtH(x[1]),x[0]+" hours")).join("")+
  "</div><p class='muted'>Categories overlap — PIC, night, cross-country and instrument time can all describe the same flight. See the Charts tab for detail.</p></div>";
  el.innerHTML=h;
  function stat(n,l){return "<div class='card stat'><div class='num'>"+esc(n)+"</div><div class='lab'>"+esc(l)+"</div></div>";}
  function row(name,ok,text){return "<div style='margin-bottom:.55rem'><div>"+currencyChip(ok,ok?"Current":"Not current")+" <b>"+esc(name)+"</b></div><div class='muted'>"+text+"</div></div>";}
}

/* ---------- flights ---------- */
function acOptions(sel){return D().aircraft.map(a=>"<option value='"+a.id+"'"+(a.id===sel?" selected":"")+">"+esc(acLabel(a))+"</option>").join("");}
function apOptions(sel){return D().airports.map(a=>"<option value='"+a.id+"'"+(a.id===sel?" selected":"")+">"+esc(apLabel(a))+"</option>").join("");}
function hInput(name,val,label){return "<div><label>"+esc(label)+"</label><input type='number' step='0.1' min='0' max='10000' name='"+name+"' value='"+(val?fmtH(val):"")+"' placeholder='0.0'></div>";}
function cInput(name,val,label){return "<div><label>"+esc(label)+"</label><input type='number' step='1' min='0' max='9999' name='"+name+"' value='"+(val?val:"")+"' placeholder='0'></div>";}
function flightForm(f){
  const v=f||{date:todayStr(),aircraftId:"",fromId:"",toId:"",total:0,pic:0,sic:0,dualReceived:0,dualGiven:0,night:0,xc:0,instActual:0,instSim:0,approaches:0,approachTypes:"",holding:false,dayTO:0,dayLdg:0,nightTO:0,nightLdg:0,person:"",remarks:""};
  const over=f&&((v.pic+v.sic+v.dualReceived+v.dualGiven>v.total)||v.night>v.total||v.xc>v.total||(v.instActual+v.instSim)>v.total);
  const warn=over?"<p class='hint'>Heads up: on this entry the category hours add up to more than the total time. It is saved as entered — check the numbers when you can.</p>":"";
  return "<div class='card'><h2>"+(f?"Edit flight":"Log a flight")+"</h2>"+warn+
  "<form data-form='flight'>"+
  "<div class='row'><div><label>Date</label><input type='date' name='date' required value='"+esc(v.date)+"'></div>"+
  "<div><label>Aircraft</label><select name='aircraftId' required>"+acOptions(v.aircraftId)+"</select></div>"+
  "<div><label>From</label><select name='fromId' required>"+apOptions(v.fromId)+"</select></div>"+
  "<div><label>To</label><select name='toId' required>"+apOptions(v.toId)+"</select></div></div>"+
  "<div class='row'>"+hInput("total",v.total,"Total time (hrs)")+hInput("pic",v.pic,"PIC (hrs)")+hInput("sic",v.sic,"SIC (hrs)")+hInput("dualReceived",v.dualReceived,"Dual received (hrs)")+hInput("dualGiven",v.dualGiven,"Dual given / CFI (hrs)")+"</div>"+
  "<div class='row'>"+hInput("night",v.night,"Night (hrs)")+hInput("xc",v.xc,"Cross-country (hrs)")+hInput("instActual",v.instActual,"Instrument — actual (hrs)")+hInput("instSim",v.instSim,"Instrument — sim / hood (hrs)")+"</div>"+
  "<div class='row'>"+cInput("approaches",v.approaches,"Instrument approaches (count)")+"<div><label>Approach types (e.g. ILS, RNAV)</label><input name='approachTypes' value='"+esc(v.approachTypes)+"' maxlength='120'></div>"+
  "<div><label>Holding pattern flown</label><input type='checkbox' name='holding' value='1'"+(v.holding?" checked":"")+"> Held on this flight</div>"+
  "<div><label>Instructor / passenger</label><input name='person' value='"+esc(v.person)+"' maxlength='120'></div></div>"+
  "<div class='row'>"+cInput("dayTO",v.dayTO,"Day takeoffs")+cInput("dayLdg",v.dayLdg,"Day landings")+cInput("nightTO",v.nightTO,"Night takeoffs")+cInput("nightLdg",v.nightLdg,"Night landings (full stop)")+"</div>"+
  "<div><label>Remarks</label><textarea name='remarks' maxlength='1000'>"+esc(v.remarks)+"</textarea></div>"+
  "<div class='btnrow'><button class='primary' type='submit'>"+(f?"Save changes":"Add flight")+"</button>"+(f?"<button type='button' data-act='cancel-flight'>Cancel</button>":"")+"</div></form></div>";
}

function renderFlights(){
  const el=$("#view-flights"),list=D().flights.slice().sort((a,b)=>b.date.localeCompare(a.date));
  let h="";
  if(!D().aircraft.length||!D().airports.length)h+="<div class='notice'>You need at least one aircraft and one airport before logging a flight. Use Quick add below — it takes a few seconds.</div>";
  const editing=editFlightId?D().flights.find(f=>f.id===editFlightId):null;
  h+=flightForm(editing);

    list.map(f=>"<tr><td>"+fmtD(f.date)+"</td><td>"+esc(routeOf(f))+"</td><td>"+esc(acById(f.aircraftId)?acById(f.aircraftId).tail:"—")+"</td><td>"+fmtH(f.total)+"</td><td>"+fmtH(f.pic)+"</td><td>"+fmtH(f.night)+"</td><td>"+fmtH(f.xc)+"</td><td>"+fmtH(f.instActual+f.instSim)+"</td><td>"+f.approaches+(f.holding?" +H":"")+"</td><td>"+f.dayLdg+" / "+f.nightLdg+"</td>"+
    "<td><button class='small' data-act='edit-flight' data-id='"+f.id+"'>Edit</button> <button class='small danger' data-act='del-flight' data-id='"+f.id+"'>Delete</button></td></tr>"+

/* ---------- currency ---------- */
function renderCurrency(){
  const el=$("#view-currency");
  const day=paxCurrency(false),ngt=paxCurrency(true),inst=instCurrency(),rev=flightReview(),t=allTotals(),exp=expiringRecords();
  const block=(title,ok,status,rule,detail)=>"<div class='card'><h2>"+esc(title)+"</h2><div>"+currencyChip(ok,status)+"</div><p>"+detail+"</p><p class='muted'>Rule used: "+esc(rule)+"</p></div>";
  let h="<div class='notice'><b>Records summary only.</b> Everything on this page is computed from the flights and records you entered, as of today. It is not an FAA determination of currency or eligibility — your official logbook and the current regulations govern.</div><div class='grid c2'>";
  h+=block("Passenger currency — day",day.current,day.current?"Current":"Not current","3 takeoffs and 3 landings in the preceding 90 days (day + night landings counted).",
    "Your records show <b>"+day.count+"</b> takeoffs &amp; landings between "+fmtD(day.from)+" and "+fmtD(day.to)+"."+(day.current?" The oldest one that keeps you current falls out after <b>"+fmtD(day.through)+"</b> ("+day.daysLeft+" days from today).":" You need "+(day.need-day.count)+" more to reach 3."));
  h+=block("Passenger currency — night",ngt.current,ngt.current?"Current":"Not current","3 night takeoffs and 3 full-stop night landings in the preceding 90 days.",
    "Your records show <b>"+ngt.count+"</b> night full-stop landings between "+fmtD(ngt.from)+" and "+fmtD(ngt.to)+"."+(ngt.current?" The oldest qualifying landing falls out after <b>"+fmtD(ngt.through)+"</b> ("+ngt.daysLeft+" days from today).":" You need "+(ngt.need-ngt.count)+" more to reach 3."));
  h+=block("Instrument currency",inst.current,inst.current?"Current":"Not current","Within the preceding 6 calendar months: 6 instrument approaches, plus holding procedures and intercepting/tracking courses.",
    "Looking back from "+fmtD(inst.from)+" (the 1st of the month 6 calendar months ago) to "+fmtD(inst.to)+": <b>"+inst.approaches+"</b> of 6 approaches and <b>"+inst.holding+"</b> of 1 holding event(s) in your records."+(inst.lastAppr?" Most recent approach logged "+fmtD(inst.lastAppr)+".":""));
  h+=block("Flight review",!!rev.last&&rev.daysLeft>=0,rev.last?(rev.daysLeft>0?"Current":(rev.daysLeft===0?"Due today":"Due")):"Not recorded","A flight review completed within the preceding 24 calendar months (due at the end of the 24th month).",
    rev.last?("Last flight review in your records: <b>"+fmtD(rev.last)+"</b>. Due by <b>"+fmtD(rev.due)+"</b>"+(rev.daysLeft>0?" — "+rev.daysLeft+" days from today.":(rev.daysLeft===0?" — due today.":" — that month has passed."))):"No flight review recorded. Add it under Records &amp; Goals.");
  h+="</div>";
  h+="<div class='card' style='margin-top:.9rem'><h2>Certificates, medical &amp; endorsements — dates</h2>";
  if(!exp.length)h+="<p class='muted'>No records with expiry dates yet. Add them under Records &amp; Goals and they will show up here.</p>";
  else h+="<table><tr><th>Record</th><th>Type</th><th>Expires</th><th>Status</th></tr>"+exp.map(x=>"<tr><td>"+esc(x.r.name)+"</td><td>"+esc(x.r.kind)+"</td><td>"+fmtD(x.r.expires)+"</td><td>"+(x.days<0?"<span class='tag bad'>Expired</span>":(x.days<=90?"<span class='tag warn'>"+x.days+" days left</span>":"<span class='tag good'>"+x.days+" days left</span>"))+"</td></tr>").join("")+"</table>";
  h+="<p class='muted'>Lifetime totals from your records: "+fmtH(t.total)+" total, "+fmtH(t.pic)+" PIC, "+fmtH(t.night)+" night, "+fmtH(t.xc)+" cross-country, "+fmtH(t.instActual+t.instSim)+" instrument.</p>"+ruleNote()+"</div>";
  el.innerHTML=h;
}

/* ---------- records & goals ---------- */
const GOAL_LABELS={total:"Total hours",pic:"PIC hours",sic:"SIC hours",dualReceived:"Dual received",dualGiven:"Dual given (CFI)",night:"Night hours",xc:"Cross-country hours",inst:"Instrument hours (actual + sim)",dayLdg:"Day landings",nightLdg:"Night landings"};
function goalProgress(g){
  const t=allTotals();t.inst=t.instActual+t.instSim;
  return Object.keys(g.targets).map(k=>{const have=k==="dayLdg"||k==="nightLdg"?t[k]:t[k];const target=g.targets[k];
    const shown=k==="dayLdg"||k==="nightLdg"?String(have):fmtH(have);const shownT=k==="dayLdg"||k==="nightLdg"?String(target):fmtH(target);
    return {k:k,label:GOAL_LABELS[k],have:have,target:target,pct:Math.min(100,target>0?Math.round(have/target*100):0),text:"your records show "+shown+" of the "+shownT+" you entered ("+(target>0?Math.round(have/target*100):0)+"%)"};});
}
function renderRecords(){

/* ---------- charts ---------- */
let chartSel={cat:null,aircraft:null,months:null,landings:null};
const PALETTE=["#25639e","#1e7a46","#a86e05","#7a4fa3","#b03a2e","#2a7f7f","#c25e7e","#5d8a3c","#846552","#3f6fb5"];
function barsSVG(items,key,sel){
  const W=640,H=316,base=240,top=28;
  const max=Math.max.apply(null,items.map(i=>Math.abs(i.value)).concat([0]))||1;
  let s="<svg viewBox='0 0 "+W+" "+H+"' role='img'>";
  s+="<line x1='46' y1='"+base+"' x2='"+(W-8)+"' y2='"+base+"' stroke='currentColor' opacity='.35'/>";
  s+="<text x='4' y='"+(top+2)+"' font-size='13' fill='currentColor'>"+esc(items._maxLabel||"")+"</text>";
  const slot=(W-60)/Math.max(items.length,1),bw=Math.min(104,slot*0.62);
  items.forEach((it,i)=>{
    const v=it.value,x=52+i*slot+(slot-bw)/2,selx=i===sel;
    const h=Math.max(3,(Math.abs(v)/max)*(base-top)),y=base-h;
    s+="<g data-chart='"+key+"' data-idx='"+i+"' style='cursor:pointer'>"+
      (selx?"<rect x='"+(x-3)+"' y='"+(y-5)+"' width='"+(bw+6)+"' height='"+(h+5)+"' rx='6' fill='"+it.color+"' opacity='.28'/>":"")+
      "<rect x='"+x+"' y='"+y+"' width='"+bw+"' height='"+h+"' rx='4' fill='"+it.color+"'"+(v===0?" opacity='.45'":"")+(selx?" stroke='currentColor' stroke-width='2' transform='translate(0,-3)'":"")+"/></g>"+
      "<text x='"+(x+bw/2)+"' y='"+(base+20)+"' font-size='12.5' text-anchor='middle' fill='currentColor'>"+esc(it.short||it.label)+"</text>";
  });
  return s+"</svg>";
}
function donutSVG(segs,key,sel,centerTop,centerBot){
  const size=300,cx=150,cy=150,R=118,r=68,total=segs.reduce((a,s)=>a+s.value,0);
  let s="<svg viewBox='0 0 "+size+" "+size+"' role='img'>";
  if(!total)return s+"<circle cx='"+cx+"' cy='"+cy+"' r='"+R+"' fill='none' stroke='currentColor' opacity='.15' stroke-width='"+(R-r)+"'/><text x='"+cx+"' y='"+(cy+5)+"' text-anchor='middle' font-size='15' fill='currentColor'>No data</text></svg>";
  let ang=-Math.PI/2;
  segs.forEach((sg,i)=>{
    const frac=sg.value/total,a2=ang+frac*Math.PI*2,large=frac>0.5?1:0;
    const mid=ang+frac*Math.PI,pull=i===sel?7:0,px=Math.cos(mid)*pull,py=Math.sin(mid)*pull;
    if(frac>=0.999){
      s+="<circle data-chart='"+key+"' data-idx='"+i+"' style='cursor:pointer' cx='"+(cx+px)+"' cy='"+(cy+py)+"' r='"+((R+r)/2)+"' fill='none' stroke='"+sg.color+"' stroke-width='"+(R-r)+"'/>"+
        (i===sel?"<circle style='pointer-events:none' cx='"+(cx+px)+"' cy='"+(cy+py)+"' r='"+(R+4)+"' fill='none' stroke='currentColor' stroke-width='2.5'/><circle style='pointer-events:none' cx='"+(cx+px)+"' cy='"+(cy+py)+"' r='"+(r-4)+"' fill='none' stroke='currentColor' stroke-width='2.5'/>":"");
    }else{
      const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2),x4=cx+r*Math.cos(ang),y4=cy+r*Math.sin(ang);
      s+="<path data-chart='"+key+"' data-idx='"+i+"' style='cursor:pointer' transform='translate("+px+","+py+")' d='M"+x1+" "+y1+" A"+R+" "+R+" 0 "+large+" 1 "+x2+" "+y2+" L"+x3+" "+y3+" A"+r+" "+r+" 0 "+large+" 0 "+x4+" "+y4+" Z' fill='"+sg.color+"'"+(i===sel?" stroke='currentColor' stroke-width='2.5'":"")+"/>";
    }
    ang=a2;
  });
  s+="<text x='"+cx+"' y='"+(cy-2)+"' text-anchor='middle' font-size='21' font-weight='700' fill='currentColor'>"+esc(centerTop)+"</text><text x='"+cx+"' y='"+(cy+20)+"' text-anchor='middle' font-size='13' fill='currentColor' opacity='.75'>"+esc(centerBot)+"</text></svg>";
  return s;
}
function trailingMonths(n){
  const out=[];let cur=monthStart(todayStr());
  for(let i=0;i<n;i++){out.unshift({key:cur.slice(0,7),label:monthLabel(cur.slice(0,7)),short:monthLabel(cur.slice(0,7))});cur=monthStart(addCalMonths(cur,-1));}
  return out;
}
function renderCharts(){
  const el=$("#view-charts"),t=allTotals();
  /* 1 — hours by category (donut) */
  const cats=[["PIC",t.pic],["Dual received",t.dualReceived],["Dual given (CFI)",t.dualGiven],["SIC",t.sic],["Night",t.night],["Cross-country",t.xc],["Instrument",t.instActual+t.instSim]];
  const segs=cats.map((c,i)=>({label:c[0],value:c[1],color:PALETTE[i%PALETTE.length]})).filter(s=>s.value>0);
  const segSum=segs.reduce((a,s)=>a+s.value,0);
  /* 2 — hours by aircraft */
  const acItems=D().aircraft.map(a=>{const tt=sumFlights(D().flights.filter(f=>f.aircraftId===a.id));return {label:acLabel(a),short:a.tail,value:tt.total,color:PALETTE[0]};}).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,8);
  acItems.forEach((x,i)=>x.color=PALETTE[i%PALETTE.length]);
  acItems._key="aircraft";acItems._maxLabel="max "+fmtH(Math.max.apply(null,acItems.map(x=>x.value).concat([0])))+" hrs";
  /* 3 — hours by month, trailing 12 */

  mItems._key="months";mItems._maxLabel="max "+fmtH(Math.max.apply(null,mItems.map(x=>x.value).concat([0])))+" hrs";
  /* 4 — landings by month, trailing 12 */
  const lItems=months.map(m=>{const tt=sumFlights(D().flights.filter(f=>monthKey(f.date)===m.key));return {label:m.label,short:m.short,value:tt.dayLdg+tt.nightLdg,color:PALETTE[1]};});
  lItems._key="landings";lItems._maxLabel="max "+Math.max.apply(null,lItems.map(x=>x.value).concat([0]))+" landings";

  let h="<div class='grid charts2'>";
  h+="<div class='card'><h2>Hours by category</h2><div class='chartwrap'>"+donutSVG(segs,"cat",chartSel.cat,fmtH(t.total),"total hours")+"</div>"+
    (chartSel.cat!=null&&segs[chartSel.cat]?"<div class='detail'><b>"+esc(segs[chartSel.cat].label)+":</b> "+fmtH(segs[chartSel.cat].value)+" hrs ("+(segSum?Math.round(segs[chartSel.cat].value/segSum*100):0)+"% of the summed categories — categories overlap, so this is a share of logged category time, not of total time.)</div>":"<div class='detail'>Tap a slice for detail. Categories overlap — one flight can count toward several.</div>")+"</div>";
  h+="<div class='card'><h2>Hours by aircraft</h2><div class='chartwrap'>"+(acItems.length?barsSVG(acItems,"aircraft",chartSel.aircraft):"<p class='muted'>No flights yet.</p>")+"</div>"+
    (chartSel.aircraft!=null&&acItems[chartSel.aircraft]?"<div class='detail'><b>"+esc(acItems[chartSel.aircraft].label)+":</b> "+fmtH(acItems[chartSel.aircraft].value)+" hrs in your records.</div>":"<div class='detail'>Tap a bar for detail.</div>")+"</div>";
  h+="<div class='card'><h2>Hours by month (last 12)</h2><div class='chartwrap'>"+barsSVG(mItems,"months",chartSel.months)+"</div>"+
    (chartSel.months!=null?"<div class='detail'><b>"+esc(mItems[chartSel.months].label)+":</b> "+fmtH(mItems[chartSel.months].value)+" hrs logged.</div>":"<div class='detail'>Tap a bar for detail.</div>")+"</div>";
  h+="<div class='card'><h2>Landings by month (last 12)</h2><div class='chartwrap'>"+barsSVG(lItems,"landings",chartSel.landings)+"</div>"+
    (chartSel.landings!=null?"<div class='detail'><b>"+esc(lItems[chartSel.landings].label)+":</b> "+lItems[chartSel.landings].value+" landing(s) logged (day + night).</div>":"<div class='detail'>Tap a bar for detail.</div>")+"</div>";
  h+="</div>";
  el.innerHTML=h;
}

function download(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},300);}
function csvCell(v){let s=String(v==null?"":v);const t=s.replace(/^\s+/,"");if(/^[=+\-@]/.test(t))s="'"+t;return "\""+s.replace(/"/g,"\"\"")+"\"";}

function handleRestore(file){
  if(S.sample.on){toast("Turn sample data off to restore.");return;}
  const rd=new FileReader();
  rd.onload=()=>{
    let parsed=null;try{parsed=JSON.parse(rd.result);}catch(e){}
    if(!parsed||parsed.app!=="flighthours"||parsed.version!==1){toast("That file is not a FlightHours backup — nothing was changed.");return;}
    const clean=sanitizeData(parsed.data);
    if(!clean){toast("Backup could not be read — nothing was changed.");return;}
    if(!confirm("Replace ALL current records with this backup?"+(clean.dropped?" "+clean.dropped+" invalid record(s) will be dropped.":"")+(clean.corrected?" "+clean.corrected+" record(s) had invalid dates, which will be reset.":"")))return;
    S.data=clean.data;S.sample={on:false,snapshot:null};
    editFlightId=editAcId=editApId=editRecId=editGoalId=null;chartSel={cat:null,aircraft:null,months:null,landings:null};
    save();applySampleBanner();renderAll();
    toast("Backup restored."+(clean.dropped?" Dropped "+clean.dropped+" invalid record(s).":"")+(clean.corrected?" "+clean.corrected+" invalid date(s) were reset.":""));beep(880);
  };
  rd.readAsText(file);
}

  "<button data-act='print-summary'>Print currency &amp; progress summary</button></div>"+
  "<p class='muted'>The logbook prints in a classic tabular layout, "+15+" flights per page, with page totals and totals carried forward from page to page.</p></div>"+
  "<div class='card'><h2>Your data</h2><div class='btnrow'>"+
  "<button data-act='export-csv'>Export flights (CSV)</button>"+
  "<button data-act='backup'>Download backup (JSON)</button></div>"+
  "<label>Restore from a backup file</label><input type='file' id='restoreFile' accept='.json,application/json'>"+
  "<p class='muted'>Restoring replaces everything currently in FlightHours on this device. Exports and restore are paused while sample data is on, so a demo can never overwrite your real logbook.</p></div>"+
  "</div><div class='card' style='margin-top:.9rem'><h2>How your data is stored</h2><p class='muted'>FlightHours stores everything in this browser's local storage on this device only. There is no account, no server, and no sync. If you clear browser data or switch devices, your logbook does not follow — download a JSON backup regularly and keep it somewhere safe. The same file can be restored here any time.</p></div>";
  const rf=$("#restoreFile");
  if(rf)rf.addEventListener("change",()=>{if(rf.files&&rf.files[0])handleRestore(rf.files[0]);rf.value="";});
}
function renderAbout(){
  $("#view-about").innerHTML="<div class='card'><h2>About FlightHours</h2>"+
  "<p>FlightHours is a personal pilot logbook for general-aviation flying: unlimited flights, aircraft and airports, currency summaries computed from your own records, and rating-progress totals measured against targets you set yourself.</p>"+
  "<p><b>What it is not.</b> FlightHours never makes an FAA determination. Currency and progress pages are records summaries — they show the math from the flights and records you entered, next to the standard rule used, so you can check them against your official logbook and the current regulations. Always verify before you fly.</p>"+
  "<p><b>Honest limits.</b> This is a single file that lives in your browser: it cannot send you alerts or reminders, it does not sync between devices, and it does not import airline schedules or connect to ForeFlight or any other service. Open it and it shows you where your records stand — that is the whole job.</p>"+
  "<p><b>Your data.</b> Everything stays on this device in local storage. No account, no subscription, no tracking. Back up from Reports &amp; Data.</p></div>";
}

/* ---------- sample toggle ---------- */
function applySampleBanner(){
  $("#sampleBanner").classList.toggle("on",S.sample.on);
  $("#flaskBtn").setAttribute("aria-pressed",S.sample.on?"true":"false");
}
function resetEdits(){editFlightId=editAcId=editApId=editRecId=editGoalId=null;chartSel={cat:null,aircraft:null,months:null,landings:null};}
function toggleSample(){
  if(!S.sample.on){
    S.sample.snapshot=JSON.parse(JSON.stringify(D()));
    S.data=sampleData();S.sample.on=true;resetEdits();
    save();applySampleBanner();renderAll();toast("Sample data on — your own records are saved and will come back when you toggle the flask off.");beep(880);
  }else{
    const hadSnap=!!S.sample.snapshot;
    if(hadSnap)S.data=S.sample.snapshot;
    S.sample={on:false,snapshot:null};resetEdits();
    save();applySampleBanner();renderAll();toast(hadSnap?"Sample data off — your records are back.":"Sample data off — no saved copy was found, so the records on screen were kept.");beep(660);
  }
}

/* ---------- forms ---------- */
function fd(form){const o={};new FormData(form).forEach((v,k)=>{o[k]=typeof v==="string"?v.trim():v;});return o;}
function overTotal(o){const t=h2t(o.total);const role=h2t(o.pic)+h2t(o.sic)+h2t(o.dualReceived)+h2t(o.dualGiven);return role>t||h2t(o.night)>t||h2t(o.xc)>t||(h2t(o.instActual)+h2t(o.instSim))>t;}
function handleForm(form){
  const kind=form.getAttribute("data-form"),o=fd(form);
  if(kind==="flight"){
    const rec={id:editFlightId||uid(),date:isDateStr(o.date)?o.date:todayStr(),aircraftId:o.aircraftId||"",fromId:o.fromId||"",toId:o.toId||"",
      total:h2t(o.total),pic:h2t(o.pic),sic:h2t(o.sic),dualReceived:h2t(o.dualReceived),dualGiven:h2t(o.dualGiven),night:h2t(o.night),xc:h2t(o.xc),instActual:h2t(o.instActual),instSim:h2t(o.instSim),
      approaches:c2t(o.approaches),approachTypes:(o.approachTypes||"").slice(0,120),holding:!!o.holding,
      dayTO:c2t(o.dayTO),dayLdg:c2t(o.dayLdg),nightTO:c2t(o.nightTO),nightLdg:c2t(o.nightLdg),
      person:(o.person||"").slice(0,120),remarks:(o.remarks||"").slice(0,1000)};
    if(editFlightId){const i=D().flights.findIndex(f=>f.id===editFlightId);if(i>=0)D().flights[i]=rec;toast("Flight updated.");}
    else{D().flights.push(rec);toast("Flight logged.");}
    editFlightId=null;save();renderAll();beep(880);
    if(overTotal(o))setTimeout(()=>toast("Note: category hours on that flight add up to more than its total time — saved as entered."),300);
  }
  else if(kind==="quickac"||kind==="aircraft"){
    const rec={id:kind==="aircraft"&&editAcId?editAcId:uid(),tail:(o.tail||"").slice(0,20)||"N?????",make:(o.make||"").slice(0,60),model:(o.model||"").slice(0,60),category:o.category||"ASEL",notes:(o.notes||"").slice(0,500)};
    if(kind==="aircraft"&&editAcId){const i=D().aircraft.findIndex(a=>a.id===editAcId);if(i>=0)D().aircraft[i]=rec;toast("Aircraft updated.");}
    else{D().aircraft.push(rec);toast("Aircraft added.");}
    editAcId=null;save();renderAll();beep(880);
  }
  else if(kind==="quickap"||kind==="airport"){
    const rec={id:kind==="airport"&&editApId?editApId:uid(),code:((o.code||"").toUpperCase().slice(0,8))||"????",name:(o.name||"").slice(0,80),city:(o.city||"").slice(0,80),notes:(o.notes||"").slice(0,500)};
    if(kind==="airport"&&editApId){const i=D().airports.findIndex(a=>a.id===editApId);if(i>=0)D().airports[i]=rec;toast("Airport updated.");}
    else{D().airports.push(rec);toast("Airport added.");}
    editApId=null;save();renderAll();beep(880);
  }
  else if(kind==="record"){
    const rec={id:editRecId||uid(),kind:o.kind||"Other",name:(o.name||"").slice(0,120)||"Record",date:isDateStr(o.date)?o.date:"",expires:isDateStr(o.expires)?o.expires:"",issuer:(o.issuer||"").slice(0,120),notes:(o.notes||"").slice(0,500)};
    if(editRecId){const i=D().records.findIndex(r=>r.id===editRecId);if(i>=0)D().records[i]=rec;toast("Record updated.");}
    else{D().records.push(rec);toast("Record added.");}
    editRecId=null;save();renderAll();beep(880);
  }
  else if(kind==="goal"){
    const targets={};
    ["total","pic","sic","dualReceived","dualGiven","night","xc","inst"].forEach(k=>{const v=h2t(o["tg_"+k]);if(v>0)targets[k]=v;});
    ["dayLdg","nightLdg"].forEach(k=>{const v=c2t(o["tg_"+k]);if(v>0)targets[k]=v;});
    const rec={id:editGoalId||uid(),name:(o.name||"").slice(0,120)||"Goal",targets:targets,notes:(o.notes||"").slice(0,500)};
    if(!Object.keys(targets).length){toast("Add at least one target number for the goal.");return;}
    if(editGoalId){const i=D().goals.findIndex(g=>g.id===editGoalId);if(i>=0)D().goals[i]=rec;toast("Goal updated.");}
    else{D().goals.push(rec);toast("Goal added.");}
    editGoalId=null;save();renderAll();beep(880);
  }
}

/* ---------- actions ---------- */
function doAction(act,el){
  const id=el&&el.getAttribute?el.getAttribute("data-id"):"";
  if(act==="cancel-flight")editFlightId=null;
  else if(act==="edit-flight"){editFlightId=id;switchTab("flights");renderAll();window.scrollTo(0,0);return;}
  else if(act==="del-flight"){if(confirm("Delete this flight? This cannot be undone.")){D().flights=D().flights.filter(f=>f.id!==id);if(editFlightId===id)editFlightId=null;save();renderAll();toast("Flight deleted.");beep(520);}return;}
  else if(act==="cancel-ac")editAcId=null;
  else if(act==="edit-ac"){editAcId=id;switchTab("aircraft");renderAll();window.scrollTo(0,0);return;}
  else if(act==="del-ac"){const used=D().flights.some(f=>f.aircraftId===id);if(confirm("Delete this aircraft?"+(used?" Flights that used it will show as removed aircraft.":"")+" This cannot be undone.")){D().aircraft=D().aircraft.filter(a=>a.id!==id);if(editAcId===id)editAcId=null;save();renderAll();toast("Aircraft deleted.");beep(520);}return;}
  else if(act==="cancel-ap")editApId=null;
  else if(act==="edit-ap"){editApId=id;switchTab("airports");renderAll();window.scrollTo(0,0);return;}
  else if(act==="del-ap"){const used=D().flights.some(f=>f.fromId===id||f.toId===id);if(confirm("Delete this airport?"+(used?" Flights that used it will show as removed airport.":"")+" This cannot be undone.")){D().airports=D().airports.filter(a=>a.id!==id);if(editApId===id)editApId=null;save();renderAll();toast("Airport deleted.");beep(520);}return;}
  else if(act==="cancel-rec")editRecId=null;
  else if(act==="edit-rec"){editRecId=id;switchTab("records");renderAll();window.scrollTo(0,0);return;}
  else if(act==="del-rec"){if(confirm("Delete this record? This cannot be undone.")){D().records=D().records.filter(r=>r.id!==id);if(editRecId===id)editRecId=null;save();renderAll();toast("Record deleted.");beep(520);}return;}
  else if(act==="cancel-goal")editGoalId=null;
  else if(act==="edit-goal"){editGoalId=id;switchTab("records");renderAll();window.scrollTo(0,0);return;}
  else if(act==="del-goal"){if(confirm("Delete this goal? This cannot be undone.")){D().goals=D().goals.filter(g=>g.id!==id);if(editGoalId===id)editGoalId=null;save();renderAll();toast("Goal deleted.");beep(520);}return;}
  else if(act==="print-logbook"){printLogbook();return;}
  else if(act==="print-summary"){printSummary();return;}
  else if(act==="export-csv"){exportCSV();return;}
  else if(act==="backup"){doBackup();return;}
  save();renderAll();
}

/* ---------- shell ---------- */
function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.getAttribute("data-tab")===name?"true":"false"));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="view-"+name));
}
function renderAll(){renderDashboard();renderFlights();renderAircraft();renderAirports();renderCurrency();renderRecords();renderCharts();renderReports();renderAbout();}
function applyTheme(){
  const dark=S.settings.theme?S.settings.theme==="dark":(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  $("#themeBtn").setAttribute("aria-pressed",dark?"true":"false");
}
function init(){
  load();
  applyTheme();
  $("#soundBtn").setAttribute("aria-pressed",S.settings.sound?"true":"false");
  applySampleBanner();
  renderAll();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{switchTab(b.getAttribute("data-tab"));beep(700);}));
  $("#flaskBtn").addEventListener("click",toggleSample);
  $("#themeBtn").addEventListener("click",()=>{const cur=document.documentElement.getAttribute("data-theme")==="dark";S.settings.theme=cur?"light":"dark";save();applyTheme();beep(700);});
  $("#soundBtn").addEventListener("click",()=>{S.settings.sound=!S.settings.sound;$("#soundBtn").setAttribute("aria-pressed",S.settings.sound?"true":"false");save();toast(S.settings.sound?"Sound on.":"Sound off.");if(S.settings.sound)beep(880);});
  document.querySelector("main").addEventListener("submit",e=>{const f=e.target.closest("form[data-form]");if(f){e.preventDefault();handleForm(f);}});
  document.querySelector("main").addEventListener("click",e=>{
    const ch=e.target.closest("[data-chart]");
    if(ch){const k=ch.getAttribute("data-chart"),i=parseInt(ch.getAttribute("data-idx"),10);chartSel[k]=chartSel[k]===i?null:i;renderCharts();beep(700);return;}
    const b=e.target.closest("[data-act]");
    if(b){doAction(b.getAttribute("data-act"),b);}
  });
  document.addEventListener("pointerdown",()=>{if(S.settings.sound&&AC&&AC.state==="suspended")AC.resume();},{passive:true});
}
init();
</script>
