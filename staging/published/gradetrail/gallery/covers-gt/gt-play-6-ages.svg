<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.45" stop-color="#f5b073"/>
      <stop offset="0.72" stop-color="#9cc6dd"/>
      <stop offset="1" stop-color="#2f9fd8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#grow)"/>
  <text x="640" y="128" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="92" fill="#ffffff">GradeTrail</text>
  <rect x="592" y="150" width="96" height="8" rx="4" fill="#ffdf5e"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M150 230 l11 22 24 4 -17 16 4 24 -22 -12 -22 12 4 -24 -17 -16 24 -4 z"/>
    <path d="M420 210 l9 18 20 3 -15 14 4 20 -18 -10 -18 10 4 -20 -15 -14 20 -3 z"/>
    <path d="M700 220 l10 20 22 3 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -3 z"/>
    <path d="M950 210 l9 18 20 3 -15 14 4 20 -18 -10 -18 10 4 -20 -15 -14 20 -3 z"/>
    <path d="M1150 240 l10 20 22 3 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -3 z"/>
  </g>
  <!-- progression trail -->
  <path d="M 90 505 C 320 495, 520 515, 640 505 S 980 495, 1170 505" fill="none" stroke="#ffffff" stroke-width="9" stroke-dasharray="24 18" stroke-linecap="round" opacity="0.95"/>
  <polygon points="1170,488 1206,505 1170,522" fill="#ffffff"/>
  <!-- stage 1: ABC block (youngest) -->
  <g transform="translate(190,400)">
    <rect x="-62" y="-62" width="124" height="124" rx="18" fill="#ffffff"/>
    <rect x="-62" y="-62" width="124" height="124" rx="18" fill="none" stroke="#d94f4f" stroke-width="9"/>
    <text x="0" y="26" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="72" fill="#d94f4f">A</text>
  </g>
  <!-- stage 2: pencil -->
  <g transform="translate(490,400)">
    <rect x="-115" y="-20" width="160" height="40" rx="7" fill="#ffcf3f"/>
    <rect x="-115" y="-20" width="160" height="14" rx="7" fill="#ffd95e"/>
    <polygon points="45,-20 95,0 45,20" fill="#f5d7a1"/>
    <polygon points="78,-7 95,0 78,7" fill="#3a3a3a"/>
    <rect x="-135" y="-20" width="20" height="40" fill="#b9c4cc"/>
    <rect x="-160" y="-20" width="27" height="40" rx="8" fill="#ef7d9b"/>
  </g>
  <!-- stage 3: book stack -->
  <g transform="translate(790,405)">
    <rect x="-95" y="-8" width="190" height="42" rx="8" fill="#2f9fd8"/>
    <rect x="-85" y="-2" width="170" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="-85" y="-52" width="170" height="42" rx="8" fill="#3f9e4d"/>
    <rect x="-75" y="-46" width="150" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="-75" y="-96" width="150" height="42" rx="8" fill="#ff9f2e"/>
    <rect x="-65" y="-90" width="130" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- stage 4: graduation cap -->
  <g transform="translate(1090,395)">
    <polygon points="0,-34 86,0 0,34 -86,0" fill="#1c1c26"/>
    <polygon points="0,-34 86,0 0,34 -86,0" fill="none" stroke="#ffdf5e" stroke-width="5"/>
    <path d="M -44 11 L -44 38 Q 0 56 44 38 L 44 11 Q 0 29 -44 11" fill="#2b2b38"/>
    <line x1="86" y1="0" x2="86" y2="47" stroke="#ffdf5e" stroke-width="6"/>
    <circle cx="86" cy="54" r="9" fill="#ffdf5e"/>
  </g>
  <!-- age labels -->
  <g font-family="DejaVu Sans" font-weight="bold" font-size="32" fill="#ffffff" text-anchor="middle">
    <text x="190" y="580">ages 5–7</text>
    <text x="490" y="580">ages 8–11</text>
    <text x="790" y="580">ages 12–14</text>
    <text x="1090" y="580">ages 15–18</text>
  </g>
  <text x="640" y="662" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="44" fill="#ffffff">Lessons, attendance, grades &amp; reading logs</text>
</svg>
