<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="growS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.45" stop-color="#f5b073"/>
      <stop offset="0.72" stop-color="#9cc6dd"/>
      <stop offset="1" stop-color="#2f9fd8"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#growS)"/>
  <text x="540" y="132" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="96" fill="#ffffff">GradeTrail</text>
  <rect x="492" y="156" width="96" height="8" rx="4" fill="#ffdf5e"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M55 250 l10 20 22 3 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -3 z"/>
    <path d="M990 240 l9 18 20 3 -15 14 4 20 -18 -10 -18 10 4 -20 -15 -14 20 -3 z"/>
    <path d="M540 700 l9 18 20 3 -15 14 4 20 -18 -10 -18 10 4 -20 -15 -14 20 -3 z"/>
    <path d="M120 800 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3 z"/>
    <path d="M960 800 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3 z"/>
  </g>
  <!-- 2x2 stage cards -->
  <g>
    <rect x="92" y="230" width="428" height="300" rx="28" fill="#ffffff" opacity="0.22"/>
    <rect x="560" y="230" width="428" height="300" rx="28" fill="#ffffff" opacity="0.22"/>
    <rect x="92" y="570" width="428" height="300" rx="28" fill="#ffffff" opacity="0.22"/>
    <rect x="560" y="570" width="428" height="300" rx="28" fill="#ffffff" opacity="0.22"/>
  </g>
  <!-- card 1: ABC block ages 5-7 -->
  <g transform="translate(306,350)">
    <rect x="-58" y="-58" width="116" height="116" rx="16" fill="#ffffff"/>
    <rect x="-58" y="-58" width="116" height="116" rx="16" fill="none" stroke="#d94f4f" stroke-width="8"/>
    <text x="0" y="24" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="66" fill="#d94f4f">A</text>
  </g>
  <text x="306" y="482" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="36" fill="#ffffff">ages 5–7</text>
  <!-- card 2: pencil ages 8-11 -->
  <g transform="translate(774,350)">
    <rect x="-105" y="-18" width="146" height="36" rx="6" fill="#ffcf3f"/>
    <polygon points="41,-18 86,0 41,18" fill="#f5d7a1"/>
    <polygon points="71,-6 86,0 71,6" fill="#3a3a3a"/>
    <rect x="-123" y="-18" width="18" height="36" fill="#b9c4cc"/>
