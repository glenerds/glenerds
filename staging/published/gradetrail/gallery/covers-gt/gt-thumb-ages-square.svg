  <!-- bottom line -->
  <text x="540" y="952" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#ffffff">Lessons, attendance,</text>
  <text x="540" y="1012" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="48" fill="#ffffff">grades &amp; reading logs</text>
