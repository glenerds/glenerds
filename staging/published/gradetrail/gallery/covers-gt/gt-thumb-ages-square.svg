  </g>
  <text x="774" y="822" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="36" fill="#ffffff">ages 15–18</text>
  <!-- step badges -->
  <g font-family="DejaVu Sans" font-weight="bold" font-size="30" text-anchor="middle">
    <circle cx="132" cy="270" r="24" fill="#ffdf5e"/><text x="132" y="281" fill="#7a5b00">1</text>
    <circle cx="600" cy="270" r="24" fill="#ffdf5e"/><text x="600" y="281" fill="#7a5b00">2</text>
    <circle cx="132" cy="610" r="24" fill="#ffdf5e"/><text x="132" y="621" fill="#7a5b00">3</text>
    <circle cx="600" cy="610" r="24" fill="#ffdf5e"/><text x="600" y="621" fill="#7a5b00">4</text>
