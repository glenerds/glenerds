  </g>
  <text x="774" y="482" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="36" fill="#ffffff">ages 8–11</text>
  <!-- card 3: book stack ages 12-14 -->
  <g transform="translate(306,690)">
    <rect x="-85" y="-6" width="170" height="38" rx="8" fill="#2f9fd8"/>
    <rect x="-76" y="-50" width="152" height="38" rx="8" fill="#3f9e4d"/>
    <rect x="-68" y="-94" width="136" height="38" rx="8" fill="#ff9f2e"/>
  </g>
  <text x="306" y="822" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="36" fill="#ffffff">ages 12–14</text>
  <!-- card 4: grad cap ages 15-18 -->
  <g transform="translate(774,688)">
    <polygon points="0,-32 80,0 0,32 -80,0" fill="#1c1c26"/>
    <polygon points="0,-32 80,0 0,32 -80,0" fill="none" stroke="#ffdf5e" stroke-width="5"/>
    <path d="M -41 10 L -41 36 Q 0 53 41 36 L 41 10 Q 0 27 -41 10" fill="#2b2b38"/>
    <line x1="80" y1="0" x2="80" y2="44" stroke="#ffdf5e" stroke-width="6"/>
