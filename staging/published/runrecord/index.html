<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Agility Trial Log — RunRecord</title>
<style>
:root{--bg:#f4f2ec;--card:#ffffff;--ink:#23211c;--mut:#6b675c;--line:#ddd8cb;--acc:#1f7a4d;--acc-ink:#ffffff;--q:#1f7a4d;--nq:#c0392b;--warn:#b7791f;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#17181c;--card:#202228;--ink:#eceae4;--mut:#a8a49a;--line:#34373e;--acc:#3fae72;--acc-ink:#0e1512;--q:#3fae72;--nq:#e0655a;--warn:#d9a441;--shadow:0 1px 3px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0;font-size:16px;line-height:1.45}
.hdr-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;margin-right:auto}
.logo-badge{width:34px;height:34px;flex:none}
.hdr-btns{display:flex;gap:8px;align-items:center;flex:none}
.hdr-btns button,.pillbtn{min-width:44px;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .08s,background .15s}
.hdr-btns button:active{transform:scale(.93)}
.hdr-btns button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.hdr-btns button svg{width:22px;height:22px}
.pillbtn{width:auto;padding:0 14px;font-size:15px;font-weight:700;text-decoration:none}
.pillbtn:active{transform:scale(.93)}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer}
.tabs button:active{transform:scale(.95)}
.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:14px 0 8px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:24px;font-weight:800}
.kpi .l{font-size:15px;color:var(--mut);font-weight:600}
label{font-size:15px;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
textarea{min-height:70px;resize:vertical}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--acc);color:var(--acc-ink);border:none;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.small{padding:7px 12px;font-size:15px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--nq);color:#fff}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.srow{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.badge{font-size:15px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff;flex:none}
.badge.Q{background:var(--q)} .badge.NQ{background:var(--nq)}
.venuetag{font-size:15px;font-weight:700;color:var(--mut);flex:none}
.muted{color:var(--mut);font-size:15px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:15px}
.iconbtn:active{transform:scale(.93)}
.doggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dogcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.dogcard h3{margin:0 0 4px;font-size:18px}
.pbar{background:var(--bg);border:1px solid var(--line);border-radius:999px;height:16px;overflow:hidden;margin:6px 0 4px}
.pbar>div{background:var(--acc);height:100%;border-radius:999px;transition:width .3s}
.goalhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.goalhead h3{margin:0;font-size:17px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.chart-card h3{margin:0 0 6px;font-size:16px}
.chart-card svg{width:100%;height:auto;display:block}
.chart-val{font-size:15px;font-weight:700;margin-top:6px;min-height:22px}
#tab-charts g[data-k],#tab-charts .seg{outline:none;-webkit-tap-highlight-color:transparent}
#tab-charts g[data-k]:focus,#tab-charts .seg:focus{outline:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog{background:var(--card);border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.dialog h2{margin:0 0 12px;font-size:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#quotaWarn{display:none;background:var(--warn);color:#fff;padding:10px 16px;border-radius:10px;margin-bottom:12px;font-size:15px;font-weight:600}
#quotaWarn.show{display:block}
#printPacket{display:none}
@media print{
  body>*{display:none!important}
  #printPacket{display:block!important;color:#111;font-family:system-ui,sans-serif;padding:24px}
  #printPacket h1{font-size:22px}#printPacket h2{font-size:17px;margin-top:20px}
  #printPacket table{width:100%;border-collapse:collapse;font-size:13px}
  #printPacket th,#printPacket td{border-bottom:1px solid #ccc;padding:6px 8px;text-align:left}
}
@media(max-width:760px){
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .doggrid{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .hdr-in{padding:10px 10px;gap:8px}
  .brand{font-size:16px;gap:6px}
  .logo-badge{width:28px;height:28px}
  .pillbtn{padding:0 10px}
  .hdr-btns{gap:5px}
}
</style>
</head>
<body>
<header><div class="hdr-in">
  <div class="brand"><svg class="logo-badge" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1f7a4d"/><path d="M8 26c4-1 6-4 8-8l3-6c.6-1.2 2-1.4 2.8-.4l2.4 3 6-2c1.4-.5 2.6.8 2 2.1l-1.4 3.1c-.4.9-1.3 1.4-2.3 1.3l-4.5-.6-2 5.4c-.5 1.4-2 2-3.4 1.5L8 26z" fill="#fff"/><circle cx="27.5" cy="13.5" r="1.6" fill="#fff"/><path d="M30 10l1.2 2.4L33.6 13l-2.4 1.2L30 16.6l-1.2-2.4-2.4-.6 2.4-1.2z" fill="#ffd94d"/></svg><span>RunRecord</span></div>
  <div class="hdr-btns">
    <a class="pillbtn" href="https://glenerds.gumroad.com">More Apps</a>
    <button id="btnSample" title="Sample data" aria-label="Toggle sample data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6.3L4.8 18a2 2 0 001.8 3h10.8a2 2 0 001.8-3L14 9.3V3"/><path d="M7.5 14h9"/></svg></button>
    <button id="btnTheme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button>
    <button id="btnSound" title="Toggle sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></button>
  </div>
</div></header>
<main>
<div id="quotaWarn">Storage is full — your latest change was not saved. Free up space and try again.</div>
<div class="tabs" id="tabs">
  <button data-t="dogs" class="on">Dogs</button>
  <button data-t="runs">Runs</button>
  <button data-t="titles">Titles</button>
  <button data-t="charts">Charts</button>
  <button data-t="backup">Backup</button>
</div>
<section id="tab-dogs"></section>
<section id="tab-runs" hidden></section>
<section id="tab-titles" hidden></section>
<section id="tab-charts" hidden></section>
<section id="tab-backup" hidden></section>
</main>
<div id="modalHost"></div>
<div id="toast"></div>
<div id="printPacket"></div>
<script>
"use strict";
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r1=n=>Math.round((+n||0)*10)/10;
function noProto(k,v){ return k==="__proto__"?undefined:v; }
function strictDate(ds){ if(!/^\d{4}-\d{2}-\d{2}$/.test(ds))return false; const[y,m,d]=ds.split("-").map(Number); const dt=new Date(y,m-1,d); return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(ds,n){ const[y,m,d]=ds.split("-").map(Number); const dt=new Date(y,m-1,d+n); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function diffDays(a,b){ const pa=a.split("-").map(Number),pb=b.split("-").map(Number); return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/864e5); }
function fmtDate(ds){ const[y,m,d]=ds.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function monthKey(ds){ return ds.slice(0,7); }
function monthLabel(mk){ const[y,m]=mk.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"short"})+" ’"+String(y).slice(2); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function download(name,content,type){ const b=new Blob([content],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
/* ============ sound ============ */
let AC=null;
function beep(f){ if(state.settings.sound===false)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type="sine"; o.frequency.value=f||600; g.gain.setValueAtTime(.08,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.18); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+.2);}catch(e){} }
/* ============ constants ============ */
const VENUES=["AKC","ASCA","USDAA","CPE","NADAC","UKI","Other"];
const CLASSES=["Standard","Jumpers","FAST","Gamblers","Snooker","Pairs","Other"];
const LEVELS=["Novice","Open","Excellent","Master"];
/* ============ state ============ */
const LSKEY="runrecord-v1";
let snap=null;
function blankState(){ return { dogs:[], runs:[], goals:[], settings:{theme:null,sound:true,sample:false} }; }
let state=blankState(), quotaWarned=false;
function save(){ if(state.settings.sample)return; try{localStorage.setItem(LSKEY,JSON.stringify(state));quotaWarned=false;$("#quotaWarn").classList.remove("show");}catch(e){ if(!quotaWarned){quotaWarned=true;$("#quotaWarn").classList.add("show");} } }
function validDog(d){ return d&&typeof d==="object"&&typeof d.name==="string"&&d.name.trim().length>0&&(!d.birth||(strictDate(d.birth)&&d.birth<=todayISO())); }
function validRun(r){ return r&&typeof r==="object"&&typeof r.dogId==="string"&&strictDate(r.date)&&VENUES.includes(r.venue)&&CLASSES.includes(r.cls)&&LEVELS.includes(r.level)&&(r.q===true||r.q===false)&&isFinite(+r.faults)&&+r.faults>=0&&+r.faults<=200&&isFinite(+r.time)&&+r.time>=0&&+r.time<=600&&isFinite(+r.points)&&+r.points>=0&&+r.points<=1000; }
function validGoal(g){ return g&&typeof g==="object"&&typeof g.dogId==="string"&&typeof g.name==="string"&&g.name.trim().length>0&&isFinite(+g.dqNeed)&&+g.dqNeed>0&&+g.dqNeed<=500&&isFinite(+g.ptsNeed)&&+g.ptsNeed>0&&+g.ptsNeed<=100000; }
function load(){ try{ const raw=localStorage.getItem(LSKEY); if(!raw){state=blankState();return;} const d=JSON.parse(raw,noProto); if(!d||typeof d!=="object"||!d.settings){state=blankState();return;} state=Object.assign(blankState(),d);
  state.dogs=(Array.isArray(d.dogs)?d.dogs:[]).filter(validDog).map(x=>({id:String(x.id||uid()),name:String(x.name),breed:String(x.breed||""),callName:String(x.callName||""),regNums:String(x.regNums||""),birth:(strictDate(x.birth)&&x.birth<=todayISO())?x.birth:"",notes:String(x.notes||"")}));
  const seen=new Set();
  state.runs=(Array.isArray(d.runs)?d.runs:[]).filter(validRun).filter(r=>{const k=String(r.id||"");if(seen.has(k))return false;seen.add(k);return true;}).map(sanitizeRun);
  state.goals=(Array.isArray(d.goals)?d.goals:[]).filter(validGoal).map(sanitizeGoal);
  state.settings=Object.assign(blankState().settings,d.settings||{});
  if(typeof state.settings.sound!=="boolean")state.settings.sound=true;
 }catch(e){ state=blankState(); } }
function sanitizeRun(r){ return {id:String(r.id||uid()),dogId:String(r.dogId),date:r.date,venue:r.venue,cls:r.cls,level:r.level,q:!!r.q,faults:Math.min(200,Math.max(0,Math.floor(+r.faults||0))),time:Math.min(600,Math.max(0,+r.time||0)),points:r1(Math.min(1000,Math.max(0,+r.points||0))),placement:Math.max(0,Math.min(500,Math.floor(+r.placement||0))),judge:String(r.judge||""),location:String(r.location||""),notes:String(r.notes||"")}; }
function sanitizeGoal(g){ return {id:String(g.id||uid()),dogId:String(g.dogId),name:String(g.name),venue:VENUES.includes(g.venue)?g.venue:"Any",dqNeed:Math.min(500,Math.max(1,Math.floor(+g.dqNeed||20))),ptsNeed:Math.min(100000,Math.max(1,Math.floor(+g.ptsNeed||750)))}; }
/* ============ title math ============ */
function runsFor(dogId,venue){ return state.runs.filter(r=>r.dogId===dogId&&(venue==="Any"||!venue||r.venue===venue)); }
const TITLE_LEVELS=["Excellent","Master"];
function goalProgress(goal){ const rs=runsFor(goal.dogId,goal.venue);
  const tl=r=>r.q&&TITLE_LEVELS.includes(r.level);
  const byKey={}; rs.forEach(r=>{ if(!tl(r))return; const k=r.date+"|"+r.venue; byKey[k]=byKey[k]||{std:false,jww:false}; if(r.cls==="Standard")byKey[k].std=true; if(r.cls==="Jumpers")byKey[k].jww=true; });
  const dq=Object.values(byKey).filter(v=>v.std&&v.jww).length;
  const pts=rs.reduce((t,r)=>t+(tl(r)&&(r.cls==="Standard"||r.cls==="Jumpers")?+r.points:0),0);
  return {dq,pts:r1(pts),qCount:rs.filter(r=>r.q).length,runCount:rs.length}; }
/* ============ sample data ============ */
function makeSample(){ let seed=20261012; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const dogs=[
    {id:"d1",name:"Biscuit",breed:"Border Collie",callName:"Bis",regNums:"DN12345678",birth:"2021-04-12",notes:"Runs best first thing in the morning."},
    {id:"d2",name:"Maple",breed:"Shetland Sheepdog",callName:"Maple",regNums:"DN87654321",birth:"2022-09-03",notes:"Working on weave entries."},
    {id:"d3",name:"Pepper",breed:"Miniature Poodle",callName:"Pep",regNums:"",birth:"2023-02-18",notes:"Just starting Novice."}];
  const venues=["AKC","AKC","AKC","ASCA","CPE","UKI"];
  const judges=["D. Harper","M. Okafor","S. Lindqvist","R. Patel","J. Morales"];
  const places=["Paws & Play Arena","Riverbend Agility Club","Northfield Trial Grounds","Sunny Acres DTC"];
  const runs=[]; const start=addDays(todayISO(),-180);
  dogs.forEach((dg,di)=>{
    const nR=[26,22,14][di];
    for(let i=0;i<nR;i++){
      const d=addDays(start,Math.floor(rnd()*180));
      const venue=pick(venues);
      const cls=pick(["Standard","Standard","Jumpers","Jumpers","FAST","Gamblers","Snooker"]);
      const level=di===2?"Novice":pick(["Open","Open","Excellent","Master","Master"]);
      const q=rnd()<(di===2?0.45:0.68);
      const faults=q?0:Math.floor(rnd()*15)+5;
      const time=r1(32+rnd()*28);
      const points=q?r1(rnd()*38+2):0;
      runs.push({id:uid()+i+di*100,date:d,dogId:dg.id,venue,cls,level,q,faults,time,points,placement:q&&rnd()>0.6?Math.floor(rnd()*4)+1:0,judge:pick(judges),location:pick(places),notes:""});
    }});
  // guarantee a few same-day Standard+Jumpers Q pairs so double-Qs show up
  const dA=addDays(todayISO(),-40), dB=addDays(todayISO(),-12);
  [[dA,"d1"],[dB,"d1"],[dA,"d2"]].forEach(([d,dg],k)=>{
    runs.push({id:"dq"+k+"a",date:d,dogId:dg,venue:"AKC",cls:"Standard",level:"Master",q:true,faults:0,time:r1(38+rnd()*6),points:r1(20+rnd()*15),placement:1,judge:"D. Harper",location:"Riverbend Agility Club",notes:""});
    runs.push({id:"dq"+k+"b",date:d,dogId:dg,venue:"AKC",cls:"Jumpers",level:"Master",q:true,faults:0,time:r1(30+rnd()*5),points:r1(20+rnd()*15),placement:2,judge:"D. Harper",location:"Riverbend Agility Club",notes:""});});
  const goals=[
    {id:"g1",dogId:"d1",name:"MACH-style",venue:"AKC",dqNeed:20,ptsNeed:750},
    {id:"g2",dogId:"d2",name:"MACH-style",venue:"AKC",dqNeed:20,ptsNeed:750},
    {id:"g3",dogId:"d3",name:"Novice titles",venue:"Any",dqNeed:3,ptsNeed:50}];
  return {dogs,runs,goals,settings:{theme:null,sound:true,sample:true}}; }
/* ============ tabs ============ */
let curTab="dogs", runFilter="all", titleDog=null, chartSel=null, chartSelInfo=null;
function showTab(t){ curTab=t; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["dogs","runs","titles","charts","backup"].forEach(k=>$("#tab-"+k).hidden=k!==t);
  if(t==="charts")renderCharts(); save(); }
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{beep(500);showTab(b.dataset.t);});
function dogName(id){ const d=state.dogs.find(x=>x.id===id); return d?d.name:"—"; }
/* ============ dogs tab ============ */
function renderDogs(){ const el=$("#tab-dogs");
  const cards=state.dogs.map(d=>{ const rs=state.runs.filter(r=>r.dogId===d.id); const q=rs.filter(r=>r.q).length;
    const pts=r1(rs.reduce((t,r)=>t+(r.q?+r.points:0),0));
    return `<div class="dogcard"><h3>${esc(d.name)}</h3>
    <div class="muted">${esc(d.breed)}${d.callName?` · “${esc(d.callName)}”`:""}</div>
    ${d.birth?`<div class="muted">Born ${fmtDate(d.birth)}</div>`:""}
    ${d.regNums?`<div class="muted">Reg: ${esc(d.regNums)}</div>`:""}
    ${d.notes?`<div style="margin-top:6px">${esc(d.notes)}</div>`:""}
    <div class="muted" style="margin-top:8px">${rs.length} runs · ${q} Q${q===1?"":"s"} · ${pts} pts</div>
    <div class="rowbtns"><button class="iconbtn" data-de="${esc(d.id)}">Edit</button><button class="iconbtn" data-dx="${esc(d.id)}">Delete</button><button class="iconbtn" data-dt="${esc(d.id)}">Titles</button></div></div>`; }).join("");
  el.innerHTML=`<div class="card"><div class="goalhead"><h2 style="margin:0;flex:1">Dogs (${state.dogs.length})</h2><button class="btn small" id="dogAdd">+ Add dog</button></div>
  ${state.dogs.length?`<div class="doggrid" style="margin-top:12px">${cards}</div>`:'<p class="muted">No dogs yet. Add your first dog to start logging runs.</p>'}</div>`;
  $("#dogAdd").onclick=()=>{beep(600);dogForm(null);};
  el.querySelectorAll("[data-de]").forEach(b=>b.onclick=()=>{beep(600);dogForm(state.dogs.find(d=>d.id===b.dataset.de));});
  el.querySelectorAll("[data-dx]").forEach(b=>b.onclick=()=>{ const d=state.dogs.find(x=>x.id===b.dataset.dx); if(!d)return;

  if(chartSelInfo){ const el=document.getElementById(chartSelInfo.vid); if(el)el.textContent=chartSelInfo.text; }
}
function donutSVG(segs,centerTop,centerSub){ const tot=segs.reduce((t,s)=>t+s.v,0);
  if(!tot)return `<svg viewBox="0 0 200 170"><text x="100" y="88" text-anchor="middle" font-size="15" fill="var(--mut)">No data</text></svg>`;
  const cx=100,cy=85,R=62,r=40; let a=-Math.PI/2; let out="";
  segs.forEach(s=>{ const frac=s.v/tot, a2=a+frac*Math.PI*2;
    const big=frac>0.5?1:0;
    const mx=Math.cos((a+a2)/2),my=Math.sin((a+a2)/2);
    const sel=chartSel===s.k;
    if(frac>0.999){ out+=`<g class="seg${sel?" sel":""}" data-k="${s.k}" style="cursor:pointer" transform="translate(${sel?mx*8:0},${sel?my*8:0})">${sel?`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--ink)" stroke-width="${R-r+6}"/>`:""}<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${s.color}" stroke-width="${R-r}"/></g>`; a=a2; return; }
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);
    out+=`<g class="seg${sel?" sel":""}" data-k="${s.k}" style="cursor:pointer" transform="translate(${sel?mx*8:0},${sel?my*8:0})">
      <path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${xi1.toFixed(1)} ${yi1.toFixed(1)} A${r} ${r} 0 ${big} 0 ${xi2.toFixed(1)} ${yi2.toFixed(1)} Z" fill="${s.color}" stroke="${sel?"var(--ink)":"none"}" stroke-width="${sel?3:0}"/></g>`;
    a=a2; });
  // center text in bounded box: hole diameter 80, minus 12 padding each side -> max width 56
  out+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)" pointer-events="none">${esc(String(centerTop).slice(0,10))}</text>
  <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="14" fill="var(--mut)" pointer-events="none">${esc(String(centerSub).slice(0,14))}</text>`;
  const leg=segs.map(s=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="width:12px;height:12px;border-radius:3px;background:${s.color};display:inline-block"></span><span style="font-size:15px">${esc(s.label)}</span></span>`).join("");
  return `<svg viewBox="0 0 200 170">${out}</svg><div style="margin-top:4px">${leg}</div>`;
}
function barsSVG(data,color,unit,suffix){ const mx=Math.max(...data.map(d=>d.v),1); const W=300,H=150,bw=W/Math.max(data.length,1);
  return `<svg viewBox="0 0 ${W} ${H}">`+data.map((d,i)=>{ const h=Math.max(2,(d.v/mx)*(H-30)); const x=i*bw+4;
    const sel=chartSel===unit+i;
    return `<g class="${sel?"sel":""}" data-k="${unit+i}" style="cursor:pointer"><rect x="${x}" y="${H-22-h}" width="${bw-8}" height="${h}" rx="4" fill="${color}" stroke="${sel?"var(--ink)":"none"}" stroke-width="${sel?3:0}"/><text x="${x+(bw-8)/2}" y="${H-8}" text-anchor="middle" font-size="13" fill="var(--mut)">${esc(d.l)}</text></g>`; }).join("")+`</svg>`; }
function wireCharts(charts){ document.querySelectorAll("#tab-charts .seg, #tab-charts g[data-k]").forEach(g=>{

    const csvCell=c=>{ let v=String(c??""); if(/^[=+\-@]/.test(v))v="'"+v; return `"${v.replace(/"/g,'""')}"`; };

      if(!d||typeof d!=="object"||!Array.isArray(d.dogs)||!Array.isArray(d.runs))throw new Error("bad");
      const seenDog=new Set(); let dupeDogs=0;
      const dogs=d.dogs.filter(x=>x&&typeof x==="object"&&typeof x.name==="string"&&x.name.trim().length>0).map(x=>({id:String(x.id||uid()),name:String(x.name),breed:String(x.breed||""),callName:String(x.callName||""),regNums:String(x.regNums||""),birth:(strictDate(x.birth)&&x.birth<=todayISO())?x.birth:"",notes:String(x.notes||"")})).filter(x=>{ if(seenDog.has(x.id)){dupeDogs++;return false;} seenDog.add(x.id); return true; });
      const dogIds=new Set(dogs.map(x=>x.id));
      const seen=new Set(); let dupes=0;
      const runs=[]; d.runs.filter(validRun).forEach(x=>{ const k=String(x.id||""); if(seen.has(k)){dupes++;return;} seen.add(k); if(!dogIds.has(String(x.dogId)))return; runs.push(sanitizeRun(x)); });
      const seenGoal=new Set(); let dupeGoals=0;
      const goals=(Array.isArray(d.goals)?d.goals:[]).filter(validGoal).filter(g=>dogIds.has(String(g.dogId))).map(sanitizeGoal).filter(g=>{ if(seenGoal.has(g.id)){dupeGoals++;return false;} seenGoal.add(g.id); return true; });
      const dropped=(d.dogs.length-dogs.length)+(d.runs.length-runs.length)+dupeDogs+dupeGoals;
      state.dogs=dogs; state.runs=runs; state.goals=goals;
      if(d.settings&&typeof d.settings==="object"){ state.settings.sample=false; if(typeof d.settings.sound==="boolean")state.settings.sound=d.settings.sound; if(d.settings.theme==="dark"||d.settings.theme==="light")state.settings.theme=d.settings.theme; }
      snap=null; state.settings.sample=false; runFilter="all"; titleDog=null; chartSel=null; chartSelInfo=null;
      $("#btnSample").classList.remove("on"); applyTheme(); applySound();
      save(); beep(700); renderAll();
      toast(dropped?`Backup restored — ${dropped} invalid entr${dropped===1?"y":"ies"} skipped.`:"Backup restored.");
    }catch(_){ toast("That file isn't a valid RunRecord backup."); } }; r.readAsText(f); e.target.value=""; };
  $("#bkWipe").onclick=()=>{ if(state.settings.sample){toast("Turn off sample data first — wipe is disabled while previewing.");return;}
    if(confirm("Delete ALL dogs, runs, and goals? This cannot be undone.")){ snap=null; runFilter="all"; titleDog=null; chartSel=null; chartSelInfo=null;
      const s=state.settings; s.sample=false; state=blankState(); state.settings=s; save(); beep(400); renderAll(); $("#btnSample").classList.remove("on"); toast("All data deleted."); } };
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=$("#modalHost"); if(m&&m.innerHTML.trim())closeModal(); } });
/* ============ modal ============ */
function openModal(html){ $("#modalHost").innerHTML=`<div class="overlay" id="ovl"><div class="dialog">${html}</div></div>`;
  $("#ovl").addEventListener("mousedown",e=>{ if(e.target.id==="ovl")closeModal(); }); }
function closeModal(){ $("#modalHost").innerHTML=""; }
/* ============ print ============ */
function printPacket(dogId){ const d=state.dogs.find(x=>x.id===dogId); if(!d)return;
  const rs=state.runs.filter(r=>r.dogId===dogId).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const q=rs.filter(r=>r.q).length, pts=r1(rs.reduce((t,r)=>t+(r.q?+r.points:0),0));
  const goals=state.goals.filter(g=>g.dogId===dogId).map(g=>{ const p=goalProgress(g); return `<tr><td>${esc(g.name)}</td><td>${esc(g.venue)}</td><td>${p.dq} / ${g.dqNeed}</td><td>${p.pts} / ${g.ptsNeed}</td></tr>`; }).join("");
  $("#printPacket").innerHTML=`<h1>RunRecord — Trial Packet</h1>
  <p><b>${esc(d.name)}</b>${d.breed?` — ${esc(d.breed)}`:""}${d.callName?` (“${esc(d.callName)}”)`:""}${d.birth?` — born ${fmtDate(d.birth)}`:""}${d.regNums?` — reg ${esc(d.regNums)}`:""}</p>
  <p>${rs.length} runs · ${q} qualifying · ${pts} points</p>
  <h2>Title goals</h2><table><tr><th>Goal</th><th>Venue</th><th>Double-Qs</th><th>Points</th></tr>${goals||"<tr><td colspan=4>None</td></tr>"}</table>
  <h2>Run history</h2><table><tr><th>Date</th><th>Venue</th><th>Class</th><th>Level</th><th>Q/NQ</th><th>Faults</th><th>Time</th><th>Pts</th><th>Judge</th></tr>
  ${rs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.venue)}</td><td>${esc(r.cls)}</td><td>${esc(r.level)}</td><td>${r.q?"Q":"NQ"}</td><td>${r.faults}</td><td>${r.time}</td><td>${r.points}</td><td>${esc(r.judge)}</td></tr>`).join("")}</table>
  <p style="color:#555;font-size:12px">Personal records only — verify titles against official venue records. RunRecord is not affiliated with the AKC or any venue.</p>`;
  window.print();
}
/* ============ theme / sound / sample ============ */
function applyTheme(){ const st=state.settings.theme; const dark=st==="dark"||(st==null&&matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.dataset.theme=dark?"dark":""; $("#btnTheme").classList.toggle("on",dark); }
$("#btnTheme").onclick=()=>{ const dark=document.documentElement.dataset.theme==="dark"; state.settings.theme=dark?"light":"dark"; save(); applyTheme(); beep(600); };
function applySound(){ $("#btnSound").classList.toggle("on",state.settings.sound!==false); }
$("#btnSound").onclick=()=>{ state.settings.sound=state.settings.sound===false?true:false; save(); applySound(); beep(700); toast(state.settings.sound!==false?"Sound on.":"Sound off."); };
$("#btnSample").onclick=()=>{ if(state.settings.sample){ if(snap){ try{const d=JSON.parse(snap,noProto); state.dogs=d.dogs; state.runs=d.runs; state.goals=d.goals;}catch(e){} snap=null; } state.settings.sample=false; save(); }
  else{ snap=JSON.stringify({dogs:state.dogs,runs:state.runs,goals:state.goals}); quotaWarned=false; $("#quotaWarn").classList.remove("show"); const s=makeSample(); state.dogs=s.dogs; state.runs=s.runs; state.goals=s.goals; state.settings.sample=true; }
  runFilter="all"; titleDog=null; chartSel=null; chartSelInfo=null;
  $("#btnSample").classList.toggle("on",state.settings.sample);
  beep(700); renderAll(); toast(state.settings.sample?"Sample data on — edits made now will be discarded.":"Sample data off — your data restored."); };
/* ============ render all / init ============ */
function renderAll(){ renderDogs(); renderRuns(); renderTitles(); renderBackup(); if(curTab==="charts")renderCharts(); }
load(); applyTheme(); applySound();
$("#btnSample").classList.toggle("on",!!state.settings.sample);
if(state.settings.sample){ const s=makeSample(); state.dogs=s.dogs; state.runs=s.runs; state.goals=s.goals; }
renderAll(); showTab("dogs");
</script>
