  if (r.kind === 'bill') return (p.lines || []).length + ' line(s) → ' + suppName(p.supplierId);

async function runRecurringItem(r, date) {
  const p = r.payload || {};
  const ap = S.accounts.find(a => a.subkind === 'ap' && !a.archived);
  const ar = S.accounts.find(a => a.subkind === 'ar' && !a.archived);
  const taxA = S.accounts.find(a => a.subkind === 'tax' && !a.archived);
  if (r.kind === 'invoice') {
    const inv = {
      id: Core.newId('in'), number: await nextNumber('invoice'), customerId: p.customerId, date, dueDate: Core.addDays(date, 14),
      lines: p.lines, payments: [], status: 'sent', currency: S.company.currency, rateToBase: 1,
      notes: p.notes || '', journalId: null
    };
    const tx = Core.buildSaleInvoice({
      date, memo: 'Invoice ' + inv.number + ' — ' + custName(inv.customerId) + ' (recurring: ' + r.name + ')', ref: inv.number,
      arAccountId: ar.id, taxAccountId: taxA ? taxA.id : ar.id,
      lines: p.lines.map(l => ({ revenueAccountId: l.revenueAccountId, qty: l.qty, rateCents: l.rateCents, taxRateBps: l.taxRateBps }))
    });
    tx.source = { kind: 'invoice', id: inv.id };
    await postJournal(tx);
    inv.journalId = tx.id;
    await putCol('invoices', inv);
  } else if (r.kind === 'bill') {
    const bill = {
      id: Core.newId('bi'), number: await nextNumber('bill'), supplierId: p.supplierId, date, dueDate: Core.addDays(date, 14),
      lines: p.lines, payments: [], status: 'sent', currency: S.company.currency, rateToBase: 1, notes: '', journalId: null
    };
    const tx = Core.buildSupplierBill({
      date, memo: 'Bill ' + bill.number + ' — ' + suppName(bill.supplierId) + ' (recurring: ' + r.name + ')', ref: bill.number,
      apAccountId: ap.id, taxAccountId: taxA ? taxA.id : ap.id,
      lines: p.lines.map(l => ({ expenseAccountId: l.expenseAccountId, amountCents: l.amountCents, taxRateBps: l.taxRateBps }))
    });
    tx.source = { kind: 'bill', id: bill.id };
    await postJournal(tx);
    bill.journalId = tx.id;
    await putCol('bills', bill);
  } else {
    const tx = Core.buildExpense({
      date, memo: p.memo + ' (recurring: ' + r.name + ')', bankAccountId: p.bankAccountId,
      expenseAccountId: p.expenseAccountId, taxAccountId: taxA ? taxA.id : null,
      amountCents: p.amountCents, taxRateBps: p.taxRateBps || 0, source: { kind: 'expense', id: Core.newId('ex') }
    });
    await postJournal(tx);
    const taxLine = taxA && tx.lines.find(l => l.accountId === taxA.id);
    await putCol('expenses', {
      id: Core.newId('ex'), date, expenseAccountId: p.expenseAccountId, amountCents: p.amountCents,
      taxCents: taxLine ? taxLine.debit : 0, taxRateBps: p.taxRateBps || 0, taxInclusive: false,
      memo: p.memo, supplierId: null, bankAccountId: p.bankAccountId, journalId: tx.id, receiptId: null,
      currency: S.company.currency, rateToBase: 1
    });
  }
  r.lastRun = date;
  r.nextDate = stepRecDate(r.nextDate, r.freq);
  await putCol('recurring', r);
}

async function ensureDepAccts() {
  let { depExp, accum } = ensureDepAccounts();
  if (!depExp) {
    depExp = { id: Core.newId('a'), code: '6390', type: 'Expense', name: 'Depreciation Expense', plain: 'Wear and tear on big purchases', subkind: null, contra: false };

    await putCol('accounts', accum);
  }
  return { depExp, accum };

/* Inventory + COGS accounts are auto-created the first time any stock-tracked
   product is used, so sales always relieve cost properly no matter which
   business template the company started with. */
async function ensureInventoryAccts() {
  let invA = S.accounts.find(a => a.subkind === 'inventory' && !a.archived);
  let cogs = S.accounts.find(a => a.subkind === 'cogs' && !a.archived);
  if (!invA) {
    invA = { id: Core.newId('a'), code: '1300', type: 'Asset', name: 'Inventory', plain: 'Stock on hand (cost value)', subkind: 'inventory', contra: false };
    await putCol('accounts', invA);
  }
  if (!cogs) {
    cogs = { id: Core.newId('a'), code: '5000', type: 'Expense', name: 'Cost of Goods Sold', plain: 'What sold items cost me', subkind: 'cogs', contra: false };
    await putCol('accounts', cogs);
  }
  return { invA, cogs };
}
/* Opening Balance Equity: the offset account for stock you already owned when
   you start tracking it (same convention as QuickBooks). */
async function ensureOpeningEquityAcct() {
  let obe = S.accounts.find(a => a.subkind === 'obequity' && !a.archived);
  if (!obe) {
    obe = { id: Core.newId('a'), code: '3900', type: 'Equity', name: 'Opening Balance Equity', plain: 'Starting balances when you began these books', subkind: 'obequity', contra: false };
    await putCol('accounts', obe);
  }
  return obe;
}
function depMonthlyAmount(a, bookValue) {
  const depreciable = a.costCents - (a.salvageCents || 0);
  if (a.method === 'db') {
    const rate = 1 - Math.pow((a.salvageCents || 1) / a.costCents, 1 / a.lifeMonths);
    return Math.max(0, Math.round(bookValue * rate));
  }
  return Math.round(depreciable / a.lifeMonths);
}
function postDepreciationModal(aid) {
  const a = S.assets.find(x => x.id === aid);
  const posted = S.depreciation.filter(d => d.assetId === a.id).reduce((s, d) => s + d.amountCents, 0);
  const depreciable = a.costCents - (a.salvageCents || 0);
  const remaining = depreciable - posted;
  if (remaining <= 0) { toast('Fully depreciated already.'); return; }
  const startM = a.postedThrough ? Core.addMonths(a.postedThrough.slice(0, 7) + '-01', 1) : a.purchaseDate.slice(0, 7) + '-01';
  formModal('Post depreciation — ' + a.name,
    '<p class="small">Depreciable: ' + esc(money(depreciable)) + ' · posted so far: ' + esc(money(posted)) + ' · remaining: <b>' + esc(money(remaining)) + '</b></p>'
    + '<div class="frow">' + fld('From month', '<input type="month" name="fromM" value="' + startM.slice(0, 7) + '">')
    + fld('To month', '<input type="month" name="toM" value="' + today().slice(0, 7) + '">') + '</div>'
    + '<p class="small">Posts one journal entry per month in the range.</p>',
    'Post', async vals => {
      let m = vals.fromM + '-01';
      const endM = vals.toM + '-01';
      const { depExp, accum } = await ensureDepAccts();
      let book = a.costCents - posted, total = 0, last = null, n = 0;
      while (m <= endM && n < 120) {
        let amt = depMonthlyAmount(a, book);
        amt = Math.min(amt, depreciable - posted - total);
        if (amt <= 0) break;
        const tx = Core.makeTx({
          date: m, memo: 'Depreciation — ' + a.name + ' (' + m.slice(0, 7) + ')',
          source: { kind: 'depreciation', id: Core.newId('dp') },
          lines: [{ accountId: depExp.id, debit: amt, credit: 0 }, { accountId: accum.id, debit: 0, credit: amt }]
        });
        await postJournal(tx);
        await putCol('depreciation', { id: Core.newId('dp'), assetId: a.id, date: m, amountCents: amt, journalId: tx.id });
        total += amt; book -= amt; last = m;
        m = Core.addMonths(m, 1); n++;
      }
      if (last) { a.postedThrough = last; await putCol('assets', a); }
      if (!total) { toast('Nothing to post in that range.'); return false; }
      toast('Posted ' + money(total) + ' depreciation.');
    });
}

        };
        const tx = Core.buildSaleInvoice({
          date: inv.date, memo: 'Invoice ' + inv.number + ' — ' + custName(cid) + ' (time)', ref: inv.number,

          lines: lines.map(l => ({ revenueAccountId: l.revenueAccountId, qty: l.qty, rateCents: l.rateCents, taxRateBps: 0 }))

function currencyFormModal(existing) {
  const c = existing || {};
  formModal(existing ? 'Edit rate' : 'Add currency',
    fld('Currency code', existing ? '<p><b>' + esc(c.code) + '</b></p>' : '<input type="text" name="code" maxlength="3" placeholder="EUR" style="text-transform:uppercase">')
    + fld('Rate to base (' + esc(S.company.currency) + ')', '<input type="text" name="rate" inputmode="decimal" value="' + (c.rateToBase || '') + '" placeholder="e.g. 1.08">', 'How much 1 unit is worth in ' + esc(S.company.currency) + '.'),
    'Save', async vals => {
      const code = existing ? c.code : (vals.code || '').trim().toUpperCase();

      if (!existing && S.currencies.some(x => x.code === code)) { toast('That currency already exists.'); return false; }
      await putCol('currencies', { id: c.id || Core.newId('cu'), code, rateToBase: rate });
    });
}

/* ================= BACKUP & IMPORT ================= */
Screens['tools/backup'] = function () {
  return helpBox('Backup & import — your data, your control', 'Everything lives in this browser. <b>Download a backup regularly</b> — if you clear browser data or switch devices without one, your books are gone. ' + esc(BRAND) + ' never uploads anything anywhere.')
    + '<div class="card"><h3>Backup</h3><p class="small">Saves every record for <b>' + esc(S.company.name) + '</b> as one JSON file. To restore, use Import below.</p>'
    + '<div class="toolbar"><button class="btn btn-p" id="bk-exp">Download backup (JSON)</button><button class="btn" id="bk-csv">Export everything (CSVs)</button></div></div>'
    + '<div class="card" style="margin-top:14px"><h3>Restore</h3><p class="small">Replaces ALL data for this company with the backup file. Your current data will be overwritten.</p>'
    + '<div class="toolbar"><input type="file" id="bk-file" accept=".json" class="btn"></div></div>'
    + '<div class="card" style="margin-top:14px"><h3>Import lists (CSV)</h3><p class="small">Bring in customers, suppliers or products from a spreadsheet.</p>'
    + '<div class="toolbar"><select id="im-type"><option value="customers">Customers</option><option value="suppliers">Suppliers</option><option value="products">Products & services</option></select>'
    + '<input type="file" id="im-file" accept=".csv,.txt" class="btn"></div><div id="im-work"></div></div>'
    + '<div class="card" style="margin-top:14px;border-color:var(--bad)"><h3>Danger zone</h3><p class="small">Deletes this company and all its books permanently.</p>'
    + '<button class="btn btn-danger" id="bk-del">Delete this company</button></div>';
};
Screens['tools/backup'].mount = function (view) {
  view.querySelector('#bk-exp').onclick = exportBackupJSON;
  view.querySelector('#bk-csv').onclick = exportAllCSV;
  view.querySelector('#bk-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !data.company) { toast('That file is not a ' + BRAND + ' backup.'); return; }
      if (!await confirmDlg('Replace ALL data for "' + S.company.name + '" with this backup? This cannot be undone.', 'Replace everything')) return;
      await wipeCompanyData(S.company.id);
      await DB.put('companies', data.company);
      for (const st of STORES) {
        if (st === 'companies' || !data[st]) continue;
        for (const rec of data[st]) await DB.put(st, rec);
      }
      await loadCompany(data.company.id);
      S.companies = await DB.all('companies');
      blip(); toast('Backup restored.'); go('dash');
    } catch (err) { toast('Could not read that file.'); }
  };
  view.querySelector('#bk-del').onclick = async () => {
    if (S.companies.length <= 1) { toast('You cannot delete your only company.'); return; }
    if (!await confirmDlg('Delete "' + S.company.name + '" and ALL its books? This cannot be undone.', 'Delete everything')) return;
    if (!await confirmDlg('Really sure? There is no recycle bin.', 'Yes, delete')) return;
    await wipeCompanyData(S.company.id);
    await DB.del('companies', S.company.id);
    S.companies = await DB.all('companies');
    const next = S.companies.find(c => !c.isDemo) || S.companies[0];
    await loadCompany(next.id);
    localStorage.setItem('tamebooks_last_company', S.company.id);
    go('dash');
  };
  view.querySelector('#im-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const parsed = parseCSVGeneric(await f.text());
    if (!parsed.rows.length) { toast('No rows found in that file.'); return; }
    IMP.data = parsed;
    IMP.type = view.querySelector('#im-type').value;
    renderImportMapper(view);
  };
};
async function wipeCompanyData(companyId) {
  for (const st of STORES) {
    if (st === 'companies') continue;
    const all = await DB.all(st);
    for (const o of all) {
      if (o.companyId === companyId || (st === 'meta' && String(o.id).endsWith(':' + companyId))) {
        await DB.del(st, o.id).catch(() => {});
      }
    }
  }
}
async function exportBackupJSON() {
  const data = { app: 'tamebooks-backup', version: 1, exportedAt: new Date().toISOString(), company: S.company };
  for (const st of STORES) {
    if (st === 'companies') continue;
    data[st] = (await DB.all(st)).filter(o => o.companyId === S.company.id || (st === 'meta' && String(o.id).endsWith(':' + S.company.id)));
  }
  download('tamebooks-backup-' + S.company.id + '.json', JSON.stringify(data), 'application/json');
  toast('Backup downloaded — keep it somewhere safe.');
}
function exportAllCSV() {
  const cid = S.company.id;
  download('tamebooks-journal.csv', journalToCSV(Core.txsIn(S.journal, cid, null, null)), 'text/csv');
  download('tamebooks-invoices.csv', toCSV(['Number', 'Customer', 'Date', 'Due', 'Total', 'Balance', 'Status'], S.invoices.map(d => {
    const t = Core.docBaseTotals(d); return [d.number, custName(d.customerId), d.date, d.dueDate, (t.total / 100).toFixed(2), ((t.total - t.paid) / 100).toFixed(2), Core.docStatus(d, today())];
  })), 'text/csv');
  download('tamebooks-bills.csv', toCSV(['Number', 'Supplier', 'Date', 'Due', 'Total', 'Balance', 'Status'], S.bills.map(d => {
    const t = Core.docBaseTotals(d); return [d.number, suppName(d.supplierId), d.date, d.dueDate, (t.total / 100).toFixed(2), ((t.total - t.paid) / 100).toFixed(2), Core.docStatus(d, today())];
  })), 'text/csv');
  download('tamebooks-expenses.csv', toCSV(['Date', 'Category', 'Memo', 'Amount'], S.expenses.map(e => [e.date, acctName(e.expenseAccountId), e.memo, ((e.amountCents + (e.taxCents || 0)) / 100).toFixed(2)])), 'text/csv');
  download('tamebooks-customers.csv', toCSV(['Name', 'Email', 'Phone'], S.customers.map(c => [c.name, c.email, c.phone])), 'text/csv');
  download('tamebooks-products.csv', toCSV(['Name', 'Type', 'Price', 'Stock'], S.products.map(p => [p.name, p.type, (p.priceCents / 100).toFixed(2), p.qtyOnHand || 0])), 'text/csv');
  toast('CSVs downloaded.');
}
/* ----- generic CSV list importer ----- */
const IMP = { data: null, type: 'customers' };
function parseCSVGeneric(text) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim() !== '');
  const cells = l => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (q) { if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(s => s.trim());
  };
  if (!lines.length) return { headers: [], rows: [] };
  return { headers: cells(lines[0]), rows: lines.slice(1).map(cells) };
}
const IMP_FIELDS = {
  customers: [['name', 'Name *'], ['email', 'Email'], ['phone', 'Phone'], ['address', 'Address'], ['notes', 'Notes']],
  suppliers: [['name', 'Name *'], ['email', 'Email'], ['phone', 'Phone'], ['address', 'Address'], ['notes', 'Notes']],
  products: [['name', 'Name *'], ['price', 'Price'], ['type', 'Type (item/service)'], ['taxBps', 'Tax %'], ['qtyOnHand', 'Stock qty']]
};
function renderImportMapper(view) {
  const el = view.querySelector('#im-work');
  const { headers, rows } = IMP.data;
  const fields = IMP_FIELDS[IMP.type];
  const guess = fname => {
    const i = headers.findIndex(h => h.toLowerCase().replace(/[^a-z]/g, '') === fname.replace(/[^a-z]/g, ''));
    return i >= 0 ? i : '';
  };
  el.innerHTML = '<div class="card" style="margin-top:10px"><h3>Map columns</h3>'
    + '<div class="frow" style="flex-wrap:wrap">' + fields.map(([f, label]) =>
      '<div style="min-width:180px;flex:1">' + fld(label, '<select data-map="' + f + '"><option value="">— skip —</option>'
        + headers.map((h, i) => '<option value="' + i + '"' + (String(guess(f)) === String(i) ? ' selected' : '') + '>' + esc(h || ('Column ' + (i + 1))) + '</option>').join('') + '</select>') + '</div>').join('') + '</div>'
    + '<h3>Preview (first 5 rows)</h3><div class="tblwrap"><table class="tbl"><thead><tr>' + headers.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>'
    + rows.slice(0, 5).map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'
    + '<div class="mfoot" style="justify-content:flex-start"><button class="btn btn-p" id="im-go">Import ' + rows.length + ' row(s)</button></div></div>';
  el.querySelector('#im-go').onclick = async () => {
    const map = {};
    el.querySelectorAll('[data-map]').forEach(s => { if (s.value !== '') map[s.dataset.map] = +s.value; });
    if (map.name === undefined) { toast('Map the Name column — it is required.'); return; }
    let n = 0;
    for (const r of rows) {
      const g = f => map[f] !== undefined ? (r[map[f]] || '').trim() : '';
      if (!g('name')) continue;
      if (IMP.type === 'products') {
        await putCol('products', {
          id: Core.newId('pr'), name: g('name'), type: /serv/i.test(g('type')) ? 'service' : 'item',
          priceCents: Core.toCents(g('price')), taxBps: Math.round(parseFloat(g('taxBps')) * 100) || 0,
          trackStock: false, qtyOnHand: parseFloat(g('qtyOnHand')) || 0, avgCostCents: 0, inventoryAccountId: null
        });
      } else {
        await putCol(IMP.type, { id: Core.newId(IMP.type === 'customers' ? 'cu' : 'su'), name: g('name'), email: g('email'), phone: g('phone'), address: g('address'), notes: g('notes') });
      }
      n++;
    }
    blip(); toast('Imported ' + n + ' ' + IMP.type + '.');
    IMP.data = null; el.innerHTML = ''; view.querySelector('#im-file').value = '';
  };
}

    ['Do debits have to equal credits?', 'Always. Every screen in ' + BRAND + ' builds balanced entries for you. Only the manual journal entry lets you touch debits and credits directly, and it refuses to post unless they balance.'],
    ['What is the difference between a bill and an expense?', 'A bill means “I will pay later” — it records the expense now and the debt in Accounts Payable. An expense means “I paid right now” — money leaves the bank immediately.'],
    ['How do I fix a mistake?', 'Never edit a posted entry. Void the invoice or bill (posts a reversing entry), or delete the payment/expense — the books stay balanced either way.'],
    ['What does “reconcile” mean?', 'Proving your books match the bank. Import the statement (or type the ending balance), tick off each transaction, and chase the difference to zero. Do it every month.'],
    ['Can I invoice in another currency?', 'Yes. Pick the currency on the invoice; ' + BRAND + ' converts it to your base currency at the rate you set. Edit rates under Tools → Currencies.'],
    ['The numbers look wrong — what do I check?', 'Open Reports → Trial Balance: debits must equal credits. Then check the Journal for duplicate or misdated entries. Every figure on every report is clickable to show its source entries.']

/* ================= BOOT ================= */
async function boot() {
  loadUI();
  document.getElementById('logo-badge').innerHTML = SVG_LOGO;
  document.getElementById('btn-demo').onclick = () => toggleSampleData();
  document.getElementById('btn-theme').onclick = () => toggleTheme();
  document.getElementById('btn-sound').onclick = () => toggleSound();
  try {
    await dbOpen();
  } catch (e) {
    document.getElementById('view').innerHTML = '<div class="card"><h3>Storage unavailable</h3><p>' + esc(BRAND) + ' needs IndexedDB to keep your books, but this browser refused it. Try a different browser.</p></div>';
    return;
  }
  S = { companies: await DB.all('companies') };
  if (!S.companies.length) { renderWizard(); return; }
  const lastId = localStorage.getItem('tamebooks_last_company');
  const c = S.companies.find(x => x.id === lastId) || S.companies[0];
  await loadCompany(c.id);
  go('dash');
}
boot();
