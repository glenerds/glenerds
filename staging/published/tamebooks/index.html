<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TameBooks — Small Business Accounting</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#ffffff; --panel2:#faf8f3; --ink:#211d15; --muted:#6f6555;
  --line:#e4dccb; --accent:#0e7c5b; --accent-soft:#e3f2ec; --accent-ink:#ffffff;
  --good:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --radius:12px; --shadow:0 2px 10px rgba(30,25,15,.08);
  --chart1:#0e7c5b; --chart2:#d97706; --chart3:#2563eb; --chart4:#9333ea;
  --chart5:#db2777; --chart6:#0891b2; --chart7:#65a30d; --chart8:#e11d48;
}
html[data-theme="dark"]{
  --bg:#161310; --panel:#201b15; --panel2:#262019; --ink:#efe7d6; --muted:#a79a82;
  --line:#3b3325; --accent:#2fbf8f; --accent-soft:#123b2e; --accent-ink:#0c1512;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#161310; --panel:#201b15; --panel2:#262019; --ink:#efe7d6; --muted:#a79a82;
    --line:#3b3325; --accent:#2fbf8f; --accent-soft:#123b2e; --accent-ink:#0c1512;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,h4{margin:.4em 0;line-height:1.25}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.15rem}
p{margin:.5em 0}
a{color:var(--accent)}
.small{font-size:15px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn-t{color:var(--warn)}
/* ---------- header (no colored bar) ---------- */
header.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .wordmark{font-size:1.45rem;font-weight:800;letter-spacing:.2px}
.brand .tag{font-size:15px;color:var(--muted)}
.topbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.pill:hover{border-color:var(--accent)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.on{background:var(--accent-soft);border-color:var(--accent)}
.iconbtn svg{width:22px;height:22px}
/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;padding:8px 20px 0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;position:sticky;top:69px;z-index:40}
nav.tabs button{border:0;background:none;color:var(--muted);font-size:16px;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs{display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;cursor:pointer}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding:18px 20px 80px;max-width:1240px;margin:0 auto}
/* ---------- cards / kpis ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin-top:0;font-size:1.05rem}
.kpi .k-label{font-size:15px;color:var(--muted);font-weight:600}
.kpi .k-value{font-size:1.7rem;font-weight:800;margin:2px 0}
.kpi .k-sub{font-size:15px;color:var(--muted)}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{border-color:var(--accent)}
.two{grid-template-columns:1fr 1fr}
@media(max-width:860px){.two{grid-template-columns:1fr}}
/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--panel2);font-size:15px;color:var(--muted);font-weight:700;text-transform:none;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--panel2)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.rowlink{cursor:pointer;color:var(--accent);font-weight:600}
/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.08)}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:15px;border-radius:8px}
.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.toolbar .spacer{flex:1}
label.fld{display:block;margin:10px 0}
label.fld>span{display:block;font-size:15px;font-weight:700;margin-bottom:4px}
label.fld .help{font-weight:400;color:var(--muted);font-size:15px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=month],select,textarea{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
/* ---------- modal ---------- */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);color:var(--ink);border-radius:16px;max-width:760px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.3);border:1px solid var(--line);position:relative}
.modal.wide{max-width:1020px}
.modal h2{margin-top:0;padding-right:48px}
.mx{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;padding:0}
.mx:hover{border-color:var(--accent);color:var(--accent)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:16px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- misc ---------- */
.helpbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 16px;margin:12px 0;font-size:16px}
.helpbox h4{margin:.2em 0}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:700}
.b-paid{background:#dcfce7;color:#166534}.b-overdue{background:#fee2e2;color:#991b1b}
.b-sent{background:#dbeafe;color:#1e40af}.b-partial{background:#fef3c7;color:#92400e}
.b-draft{background:#e5e7eb;color:#374151}.b-void{background:#f3f4f6;color:#6b7280}
html[data-theme="dark"] .b-paid{background:#14532d;color:#bbf7d0}
html[data-theme="dark"] .b-overdue{background:#7f1d1d;color:#fecaca}
html[data-theme="dark"] .b-sent{background:#1e3a8a;color:#bfdbfe}
html[data-theme="dark"] .b-partial{background:#78350f;color:#fde68a}
html[data-theme="dark"] .b-draft{background:#374151;color:#e5e7eb}
.checkline{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.checkline input{flex:none}
svg.chart{width:100%;height:auto;display:block}
svg.chart .bar{cursor:pointer;transition:transform .18s ease,filter .18s ease}
svg.chart .bar.sel{stroke:var(--ink);stroke-width:3;filter:brightness(1.12)}
.donutwrap{display:flex;flex-direction:column;align-items:center}
.donutwrap>svg.chart{width:100%;max-width:340px}
.donutwrap .legend{justify-content:center}
svg.chart text{fill:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
/* ---------- invoice print ---------- */
#print-area{display:none}
@media print{
  #app,#toast{display:none !important}
  #print-area{display:block !important;color:#000}
  #print-area .inv{max-width:720px;margin:0 auto;font-size:14px}
  #print-area table{width:100%;border-collapse:collapse}
  #print-area th,#print-area td{border:1px solid #999;padding:8px;text-align:left}
  body.print-rpt #print-area{display:none !important}
  body.print-rpt #app{display:block !important}  body.print-rpt header.top,body.print-rpt nav.tabs,body.print-rpt .subtabs,body.print-rpt .toolbar,body.print-rpt .helpbox,body.print-rpt #demo-banner,body.print-rpt footer.appfoot,body.print-rpt #toast{display:none !important}
  body.print-rpt #view{max-width:none;padding:0}
  body.print-rpt .card{box-shadow:none;border:none}
}
.inv-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.inv-title{font-size:2rem;font-weight:800}
.inv-meta{text-align:right}
.inv table.lines{width:100%;border-collapse:collapse;margin:14px 0}
.inv table.lines th,.inv table.lines td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.inv table.lines th{background:var(--panel2)}
.inv .totals{margin-left:auto;width:280px}
.inv .totals td{padding:6px 8px}
.inv-logo{max-height:70px;max-width:220px}
/* ---------- wizard ---------- */
#wizard-ov{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto}
.wiz{max-width:640px;margin:30px auto}
.wiz .step{display:none}
.wiz .step.on{display:block}
.tplcard{border:2px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;margin:10px 0;background:var(--panel)}
.tplcard:hover{border-color:var(--accent)}
.tplcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.tplcard h3{margin:0 0 4px}
footer.appfoot{text-align:center;color:var(--muted);font-size:15px;padding:26px 12px;border-top:1px solid var(--line);margin-top:30px}
.kbd-hint{font-size:15px;color:var(--muted)}
.drill{cursor:pointer;text-decoration:underline dotted}
.drill:hover{color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.stmt-row.match-pending{background:var(--accent-soft)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span id="logo-badge" aria-hidden="true"></span>
      <span><span class="wordmark" id="brand-word">TameBooks</span><br><span class="tag">Small-business accounting</span></span>
    </div>
    <div class="topbtns">
      <a class="pill" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps</a>
      <button class="iconbtn" id="btn-demo" title="Try sample data (a demo company)" aria-label="Try sample data (a demo company)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L4.7 18a2 2 0 0 0 1.8 3h11a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7.2 14.5h9.6"/></svg></button>
      <button class="iconbtn" id="btn-theme" title="Toggle dark / light mode" aria-label="Toggle dark / light mode"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="iconbtn on" id="btn-sound" title="Toggle sound" aria-label="Toggle sound"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main sections"></nav>
  <div class="subtabs" id="subtabs" aria-label="Sub sections"></div>
  <main id="view"></main>
  <footer class="appfoot" id="appfoot"></footer>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="print-area"></div>
<script>
/* ============================================================================
 * TameBooks — accounting core (pure logic, zero DOM).
 * Works in browsers (sets window.TameBooksCore) and in Node (module.exports).
 * Money is ALWAYS integer cents. Every journal transaction must balance
 * exactly: sum(debits) === sum(credits), tolerance 0.
 * ========================================================================== */
(function (global) {
'use strict';

/* ---------------- money ---------------- */

function toCents(x) {
  if (x === null || x === undefined || x === '') return 0;
  if (typeof x === 'number') return Math.round(x * 100);
  var s = String(x).trim().replace(/[$,\s]/g, '');
  var neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s[0] === '-') { neg = true; s = s.slice(1); }
  var parts = s.split('.');
  var c = parseInt(parts[0] || '0', 10) * 100;
  if (parts[1]) {
    var frac = (parts[1] + '00').slice(0, 3); // keep 3 digits to round properly
    c += Math.round(parseInt(frac, 10) / 10);
  }
  return neg ? -c : c;
}

function fromCents(c) { return c / 100; }

function fmtMoney(cents, code) {
  try {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: code || 'USD' }).format(cents / 100);
  } catch (e) {
    var sign = cents < 0 ? '-' : '';
    var a = Math.abs(cents);
    return sign + (code || 'USD') + ' ' + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
  }
}

function fmtNum(n, digits) {
  return Number(n).toLocaleString('en-US', { maximumFractionDigits: digits === undefined ? 2 : digits });
}

/* tax: bps = basis points of a percent, e.g. 750 = 7.50% */
function taxCents(netCents, bps) {
  if (!bps) return 0;
  return Math.round(netCents * bps / 10000);
}

/* split a tax-inclusive gross into {net, tax} */
function splitInclusive(grossCents, bps) {
  if (!bps) return { net: grossCents, tax: 0 };
  var net = Math.round(grossCents * 10000 / (10000 + bps));
  return { net: net, tax: grossCents - net };
}

/* ---------------- dates (local, YYYY-MM-DD) ---------------- */

function pad(n) { return String(n).padStart(2, '0'); }

function isoOf(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function todayISO() { return isoOf(new Date()); }

function parseISO(s) {
  var p = String(s).slice(0, 10).split('-');
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
}

function addDays(s, n) {
  var d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d);
}

function addMonths(s, n) {
  var d = parseISO(s);
  var day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return isoOf(d);
}

function addYears(s, n) { return addMonths(s, n * 12); }

function diffDays(a, b) {
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}

function monthKey(s) { return String(s).slice(0, 7); }

function monthStart(s) { return monthKey(s) + '-01'; }

function fmtDate(s) {
  if (!s) return '';
  var d = parseISO(s);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* ---------------- ids ---------------- */

var __seq = 0;
function newId(prefix) {
  __seq += 1;
  return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + __seq.toString(36) +
    Math.random().toString(36).slice(2, 7);
}

/* ---------------- chart of accounts ---------------- */

var TYPES = ['Asset', 'Liability', 'Equity', 'Revenue', 'Expense'];
var DEBIT_NORMAL = { Asset: true, Expense: true }; // Liability/Equity/Revenue are credit-normal

/*
 * subkind drives report behavior:
 * bank, cash, ar, ap, tax, inventory, fixedasset, accumdep, equity, drawings,
 * revenue, cogs, expense, other
 */
function defaultChart(template) {
  var A = [];
  function a(code, name, plain, type, subkind, extra) {
    var o = { code: code, name: name, plain: plain, type: type, subkind: subkind || 'other' };
    if (extra) for (var k in extra) o[k] = extra[k];
    A.push(o);
  }
  // --- cash & banks ---
  a('1000', 'Checking Account', 'Main bank account', 'Asset', 'bank');
  a('1010', 'Savings Account', 'Savings', 'Asset', 'bank');
  a('1020', 'Petty Cash', 'Cash on hand', 'Asset', 'cash');
  // --- receivables / inventory ---
  a('1100', 'Accounts Receivable', 'Money customers owe me', 'Asset', 'ar');
  if (template === 'retail') {
    a('1300', 'Inventory', 'Stock on hand (cost value)', 'Asset', 'inventory');
  }
  a('1500', 'Equipment & Fixed Assets', 'Big purchases that last years', 'Asset', 'fixedasset');
  a('1510', 'Accumulated Depreciation', 'Wear-and-tear used up so far', 'Asset', 'accumdep', { contra: true });
  // --- payables ---
  a('2000', 'Accounts Payable', 'Money I owe suppliers', 'Liability', 'ap');
  a('2100', 'Tax Payable', 'Sales tax / VAT I owe', 'Liability', 'tax');
  // --- equity ---
  a('3000', 'Owner Equity', "My investment in the business", 'Equity', 'equity');
  a('3100', 'Owner Drawings', 'Money I took out for myself', 'Equity', 'drawings', { contra: true });
  // --- revenue ---
  if (template === 'freelancer') {
    a('4000', 'Service Revenue', 'Money in from client work', 'Revenue', 'revenue');
  } else if (template === 'retail') {
    a('4000', 'Product Sales', 'Money in from selling products', 'Revenue', 'revenue');
    a('4010', 'Service Revenue', 'Money in from services', 'Revenue', 'revenue');
  } else {
    a('4000', 'Service Revenue', 'Money in from services', 'Revenue', 'revenue');
    a('4010', 'Other Income', 'Other money in', 'Revenue', 'revenue');
  }
  // --- expenses ---
  if (template === 'retail') a('5000', 'Cost of Goods Sold', 'What sold items cost me', 'Expense', 'cogs');
  a('5010', 'Rent', 'Office / shop rent', 'Expense', 'expense');
  a('5020', 'Utilities', 'Electricity, water, internet, phone', 'Expense', 'expense');
  a('5030', 'Office Supplies', 'Supplies and small equipment', 'Expense', 'expense');
  a('5040', 'Software & Subscriptions', 'Apps and online tools', 'Expense', 'expense');
  a('5050', 'Marketing & Advertising', 'Getting customers', 'Expense', 'expense');
  a('5060', 'Travel', 'Business travel', 'Expense', 'expense');
  a('5070', 'Meals & Entertainment', 'Business meals', 'Expense', 'expense');
  a('5080', 'Professional Services', 'Accountant, lawyer, consultants', 'Expense', 'expense');
  a('5090', 'Insurance', 'Business insurance', 'Expense', 'expense');
  a('5100', 'Bank Fees', 'Bank charges', 'Expense', 'expense');
  a('5110', 'Mileage', 'Driving for business', 'Expense', 'expense');
  a('5120', 'Depreciation Expense', 'Wear-and-tear cost per period', 'Expense', 'expense');
  if (template !== 'freelancer') a('5130', 'Contract Labor', 'Contractors and freelancers I pay', 'Expense', 'expense');
  a('5140', 'Repairs & Maintenance', 'Fixing things', 'Expense', 'expense');
  a('5150', 'Other Expenses', 'Anything else', 'Expense', 'expense');
  return A;
}

function defaultTaxRates() {
  return [
    { name: 'No tax', bps: 0 },
    { name: 'Sales tax 6%', bps: 600 },
    { name: 'Sales tax 7%', bps: 700 },
    { name: 'Sales tax 8.5%', bps: 850 },
    { name: 'VAT 20%', bps: 2000 }
  ];
}

/* ---------------- transaction validation ---------------- */

function isInt(n) { return typeof n === 'number' && isFinite(n) && Math.floor(n) === n; }

function validateTransaction(tx, accountsById) {
  var errors = [];
  if (!tx || !Array.isArray(tx.lines) || tx.lines.length < 2) {
    errors.push('A transaction needs at least two lines.');
    return { ok: false, errors: errors };
  }
  var sumD = 0, sumC = 0;
  tx.lines.forEach(function (ln, i) {
    var tag = 'Line ' + (i + 1);
    if (!ln.accountId || (accountsById && !accountsById[ln.accountId])) {
      errors.push(tag + ': unknown account.');
    }
    if (!isInt(ln.debit) || !isInt(ln.credit)) {
      errors.push(tag + ': amounts must be whole cents.');
    }
    if (ln.debit < 0 || ln.credit < 0) {
      errors.push(tag + ': amounts cannot be negative.');
    }
    if (ln.debit > 0 && ln.credit > 0) {
      errors.push(tag + ': a line cannot be both debit and credit.');
    }
    if (ln.debit === 0 && ln.credit === 0) {
      errors.push(tag + ': a line cannot be zero on both sides.');
    }
    sumD += ln.debit; sumC += ln.credit;
  });
  if (sumD !== sumC) {
    errors.push('Out of balance: debits ' + fmtMoney(sumD) + ' vs credits ' + fmtMoney(sumC) + '.');
  }
  return { ok: errors.length === 0, errors: errors, totalDebit: sumD, totalCredit: sumC };
}

function makeTx(o) {
  return {
    id: o.id || newId('tx'),
    companyId: o.companyId || null,
    date: o.date,
    memo: o.memo || '',
    ref: o.ref || '',
    lines: o.lines,
    source: o.source || null,   // {kind:'invoice'|'bill'|..., id}
    createdAt: o.createdAt || new Date().toISOString()
  };
}

/* ---------------- posting builders (all return balanced tx objects) ---------------- */

/* Sale invoice. lines: [{revenueAccountId, qty, rateCents, taxRateBps}] */
function buildSaleInvoice(o) {
  var total = 0, taxTotal = 0;
  var revByAcct = {};
  (o.lines || []).forEach(function (ln) {
    var net = Math.round(ln.qty * ln.rateCents);
    var tax = taxCents(net, ln.taxRateBps || 0);
    total += net + tax; taxTotal += tax;
    revByAcct[ln.revenueAccountId] = (revByAcct[ln.revenueAccountId] || 0) + net;
  });
  var lines = [{ accountId: o.arAccountId, debit: total, credit: 0 }];
  Object.keys(revByAcct).forEach(function (acct) {
    lines.push({ accountId: acct, debit: 0, credit: revByAcct[acct] });
  });
  if (taxTotal > 0) lines.push({ accountId: o.taxAccountId, debit: 0, credit: taxTotal });
  return makeTx({ companyId: o.companyId, date: o.date, memo: o.memo, ref: o.ref, lines: lines, source: o.source });
}

function buildInvoicePayment(o) {
  // Dr Bank / Cr AR
  return makeTx({
    companyId: o.companyId, date: o.date, memo: o.memo, ref: o.ref,
    lines: [
      { accountId: o.bankAccountId, debit: o.amountCents, credit: 0 },
      { accountId: o.arAccountId, debit: 0, credit: o.amountCents }
    ],
    source: o.source
  });
}

/* Supplier bill. lines: [{expenseAccountId, amountCents, taxRateBps}] (amounts are net) */
function buildSupplierBill(o) {
  var total = 0, taxTotal = 0;
  var expByAcct = {};
  (o.lines || []).forEach(function (ln) {
    var tax = taxCents(ln.amountCents, ln.taxRateBps || 0);
    total += ln.amountCents + tax; taxTotal += tax;
    expByAcct[ln.expenseAccountId] = (expByAcct[ln.expenseAccountId] || 0) + ln.amountCents;
  });
  var lines = [];
  Object.keys(expByAcct).forEach(function (acct) {
    lines.push({ accountId: acct, debit: expByAcct[acct], credit: 0 });
  });
  if (taxTotal > 0) lines.push({ accountId: o.taxAccountId, debit: taxTotal, credit: 0 }); // reclaimable
  lines.push({ accountId: o.apAccountId, debit: 0, credit: total });
  return makeTx({ companyId: o.companyId, date: o.date, memo: o.memo, ref: o.ref, lines: lines, source: o.source });
}

function buildBillPayment(o) {
  return makeTx({
    companyId: o.companyId, date: o.date, memo: o.memo, ref: o.ref,
    lines: [
      { accountId: o.apAccountId, debit: o.amountCents, credit: 0 },
      { accountId: o.bankAccountId, debit: 0, credit: o.amountCents }
    ],
    source: o.source
  });
}

/* Direct expense paid from bank. taxInclusive controls gross/net handling. */
function buildExpense(o) {
  var gross = o.amountCents, net, tax;
  if (o.taxInclusive) { var s = splitInclusive(gross, o.taxRateBps || 0); net = s.net; tax = s.tax; }
  else { net = gross; tax = taxCents(gross, o.taxRateBps || 0); }
  var lines = [{ accountId: o.expenseAccountId, debit: net, credit: 0 }];
  if (tax > 0) lines.push({ accountId: o.taxAccountId, debit: tax, credit: 0 });
  lines.push({ accountId: o.bankAccountId, debit: 0, credit: net + tax });
  return makeTx({ companyId: o.companyId, date: o.date, memo: o.memo, ref: o.ref, lines: lines, source: o.source });
}

/* ---------------- invoice / bill math (pure, plain objects) ---------------- */

function docLineTotals(lines) {
  var sub = 0, tax = 0;
  (lines || []).forEach(function (ln) {
    // invoice lines use qty x rateCents; bill lines carry amountCents directly
    var net = (ln.amountCents !== undefined && ln.amountCents !== null)
      ? ln.amountCents
      : Math.round((ln.qty || 0) * (ln.rateCents || 0));
    var t = taxCents(net, ln.taxRateBps || 0);
    sub += net; tax += t;
  });
  return { subtotal: sub, tax: tax, total: sub + tax };
}

/* amounts may be in a foreign currency; convert at the doc's rateToBase for the books */
function docBaseTotals(doc) {
  var t = docLineTotals(doc.lines);
  var r = doc.rateToBase || 1;
  return {
    subtotal: Math.round(t.subtotal * r),
    tax: Math.round(t.tax * r),
    total: Math.round(t.total * r)
  };
}

function docPaidCents(doc) {
  return (doc.payments || []).reduce(function (s, p) { return s + (p.amountCents || 0); }, 0);
}

function docBalanceDue(doc) {
  return docBaseTotals(doc).total - docPaidCents(doc);
}

function docStatus(doc, asOf) {
  if (doc.status === 'void') return 'void';
  if (doc.status === 'draft') return 'draft';
  var due = docBalanceDue(doc);
  if (due <= 0) return 'paid';
  if (asOf && doc.dueDate && doc.dueDate < asOf) return 'overdue';
  return docPaidCents(doc) > 0 ? 'partial' : 'sent';
}

/* ---------------- balances & reports (from journal lines ONLY) ---------------- */

function txsIn(journal, companyId, from, to) {
  return journal.filter(function (tx) {
    if (companyId && tx.companyId !== companyId) return false;
    if (from && tx.date < from) return false;
    if (to && tx.date > to) return false;
    return true;
  });
}

function accountTotals(accounts, txs) {
  var m = {};
  accounts.forEach(function (a) { m[a.id] = { debit: 0, credit: 0 }; });
  txs.forEach(function (tx) {
    (tx.lines || []).forEach(function (ln) {
      var t = m[ln.accountId];
      if (!t) return; // unknown account: caught by integrity check
      t.debit += ln.debit; t.credit += ln.credit;
    });
  });
  return m;
}

/* signed balance honoring normal balance + contra flag */
function signedBalance(acct, totals) {
  var t = totals[acct.id] || { debit: 0, credit: 0 };
  var debitNormal = !!DEBIT_NORMAL[acct.type];
  if (acct.contra) debitNormal = !debitNormal;
  return debitNormal ? (t.debit - t.credit) : (t.credit - t.debit);
}

function trialBalance(accounts, journal, o) {
  o = o || {};
  var txs = txsIn(journal, o.companyId, null, o.asOf || null);
  var totals = accountTotals(accounts, txs);
  var rows = [], td = 0, tc = 0;
  accounts.forEach(function (a) {
    var t = totals[a.id];
    if (!t || (t.debit === 0 && t.credit === 0 && !o.includeZero)) return;
    var d = 0, c = 0;
    var debitNormal = !!DEBIT_NORMAL[a.type];
    if (a.contra) debitNormal = !debitNormal;
    var net = debitNormal ? t.debit - t.credit : t.credit - t.debit;
    if (net >= 0) { if (debitNormal) d = net; else c = net; }
    else { if (debitNormal) c = -net; else d = -net; }
    td += d; tc += c;
    rows.push({ account: a, debit: d, credit: c });
  });
  return { rows: rows, totalDebit: td, totalCredit: tc, balanced: td === tc };
}

function profitLoss(accounts, journal, o) {
  o = o || {};
  var txs = txsIn(journal, o.companyId, o.from || null, o.to || null);
  var totals = accountTotals(accounts, txs);
  var revenue = [], expenses = [], tr = 0, te = 0;
  accounts.forEach(function (a) {
    var b = signedBalance(a, totals);
    if (b === 0 && !o.includeZero) return;
    if (a.type === 'Revenue') { revenue.push({ account: a, amount: b }); tr += b; }
    else if (a.type === 'Expense') { expenses.push({ account: a, amount: b }); te += b; }
  });
  return { revenue: revenue, expenses: expenses, totalRevenue: tr, totalExpense: te, net: tr - te };
}

function balanceSheet(accounts, journal, o) {
  o = o || {};
  var asOf = o.asOf || todayISO();
  var txs = txsIn(journal, o.companyId, null, asOf);
  var totals = accountTotals(accounts, txs);
  var assets = [], liabilities = [], equity = [];
  var tA = 0, tL = 0, tE = 0;
  accounts.forEach(function (a) {
    var b = signedBalance(a, totals);
    if (b === 0 && !o.includeZero) return;
    var row = { account: a, amount: b };
    // Contra accounts (accumulated depreciation, owner drawings) carry a signed
    // balance in their own normal direction; they must SUBTRACT from their
    // section total, otherwise the balance-sheet equation breaks.
    var sectionVal = a.contra ? -b : b;
    if (a.type === 'Asset') { assets.push(row); tA += sectionVal; }
    else if (a.type === 'Liability') { liabilities.push(row); tL += sectionVal; }
    else if (a.type === 'Equity') { equity.push(row); tE += sectionVal; }
  });
  var pl = profitLoss(accounts, journal, { companyId: o.companyId, to: asOf });
  var retained = pl.net;
  tE += retained;
  return {
    assets: assets, liabilities: liabilities, equity: equity,
    retainedEarnings: retained,
    totalAssets: tA, totalLiabilities: tL, totalEquity: tE,
    balanced: tA === tL + tE
  };
}

/* Cash flow, indirect method, from journal lines only. */
function cashFlow(accounts, journal, o) {
  o = o || {};
  var from = o.from, to = o.to || todayISO();
  var byId = {};
  accounts.forEach(function (a) { byId[a.id] = a; });
  function bal(subkind, upto) {
    var s = 0;
    accounts.forEach(function (a) {
      if (a.subkind !== subkind) return;
      var txs = txsIn(journal, o.companyId, null, upto);
      s += signedBalance(a, accountTotals(accounts, txs));
    });
    return s;
  }
  var pl = profitLoss(accounts, journal, { companyId: o.companyId, from: from, to: to });
  var net = pl.net;
  // depreciation add-back: depreciation expense in period
  var dep = 0;
  accounts.forEach(function (a) {
    if (a.subkind === 'expense' && /depreciation/i.test(a.name)) {
      var txs = txsIn(journal, o.companyId, from, to);
      dep += signedBalance(a, accountTotals(accounts, txs));
    }
  });
  var before = from ? addDays(from, -1) : null; // null = beginning of time: opening balance is 0
  var dAR = bal('ar', to) - (before ? bal('ar', before) : 0);
  var dInv = bal('inventory', to) - (before ? bal('inventory', before) : 0);
  // change in ALL liabilities (AP, tax payable, etc.) — added back in operating
  function liabBal(upto) {
    var s = 0;
    accounts.forEach(function (a) {
      if (a.type === 'Liability') {
        s += signedBalance(a, accountTotals(accounts, txsIn(journal, o.companyId, null, upto)));
      }
    });
    return s;
  }
  var dLiab = liabBal(to) - (before ? liabBal(before) : 0);
  var operating = net + dep - dAR - dInv + dLiab;
  // investing: change in fixed assets (net of depreciation contra)
  var dFA = 0;
  accounts.forEach(function (a) {
    if (a.subkind === 'fixedasset') {
      var txs = txsIn(journal, o.companyId, from, to);
      dFA += signedBalance(a, accountTotals(accounts, txs));
    }
  });
  var investing = -dFA;
  // financing: equity movements excluding retained (contributions/drawings)
  var dEq = 0;
  accounts.forEach(function (a) {
    if ((a.subkind === 'equity' || a.subkind === 'drawings') && a.type === 'Equity') {
      var txs = txsIn(journal, o.companyId, from, to);
      var b = signedBalance(a, accountTotals(accounts, txs));
      dEq += a.contra ? -b : b; // drawings are a cash outflow: subtract
    }
  });
  var financing = dEq;
  // actual cash change for cross-check
  function cashBal(upto) {
    var s = 0;
    accounts.forEach(function (a) {
      if (a.subkind === 'bank' || a.subkind === 'cash') {
        s += signedBalance(a, accountTotals(accounts, txsIn(journal, o.companyId, null, upto)));
      }
    });
    return s;
  }
  var startCash = before ? cashBal(before) : 0;
  var endCash = cashBal(to);
  var netChange = operating + investing + financing;
  return {
    netIncome: net, depreciationAddBack: dep,
    changeAR: dAR, changeLiabilities: dLiab, changeInventory: dInv,
    operating: operating, investing: investing, financing: financing,
    netChange: netChange, startCash: startCash, endCash: endCash,
    reconciles: (startCash + netChange) === endCash
  };
}

function agedBuckets(docs, asOf, kind) {
  // kind: 'ar' uses dueDate; docs carry balanceDueCents precomputed by caller
  var buckets = [
    { key: 'current', label: 'Not yet due', total: 0, docs: [] },
    { key: 'd1', label: '1–30 days overdue', total: 0, docs: [] },
    { key: 'd2', label: '31–60 days overdue', total: 0, docs: [] },
    { key: 'd3', label: '61–90 days overdue', total: 0, docs: [] },
    { key: 'd4', label: 'Over 90 days overdue', total: 0, docs: [] }
  ];
  docs.forEach(function (d) {
    if (d.balanceDueCents <= 0) return;
    var overdue = d.dueDate ? diffDays(d.dueDate, asOf) : 0;
    var b = overdue <= 0 ? buckets[0] : overdue <= 30 ? buckets[1] : overdue <= 60 ? buckets[2] : overdue <= 90 ? buckets[3] : buckets[4];
    b.total += d.balanceDueCents;
    b.docs.push(d);
  });
  return buckets;
}

function taxSummary(accounts, journal, o) {
  o = o || {};
  var txs = txsIn(journal, o.companyId, o.from || null, o.to || null);
  var collected = 0, reclaimable = 0;
  var byId = {};
  accounts.forEach(function (a) { byId[a.id] = a; });
  txs.forEach(function (tx) {
    tx.lines.forEach(function (ln) {
      var a = byId[ln.accountId];
      if (!a || a.subkind !== 'tax') return;
      collected += ln.credit;
      reclaimable += ln.debit;
    });
  });
  return { collected: collected, reclaimable: reclaimable, netOwed: collected - reclaimable };
}

function glDetail(accounts, journal, accountId, o) {
  o = o || {};
  var txs = txsIn(journal, o.companyId, null, o.to || null)
    .filter(function (tx) { return tx.lines.some(function (ln) { return ln.accountId === accountId; }); })
    .sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : 0; });
  var acct = null;
  accounts.forEach(function (a) { if (a.id === accountId) acct = a; });
  // opening balance before `from`
  var opening = { debit: 0, credit: 0 };
  if (o.from) {
    txsIn(journal, o.companyId, null, addDays(o.from, -1)).forEach(function (tx) {
      tx.lines.forEach(function (ln) {
        if (ln.accountId === accountId) { opening.debit += ln.debit; opening.credit += ln.credit; }
      });
    });
  }
  var debitNormal = acct ? !!DEBIT_NORMAL[acct.type] : true;
  if (acct && acct.contra) debitNormal = !debitNormal;
  var runD = opening.debit, runC = opening.credit;
  function bal() { return debitNormal ? runD - runC : runC - runD; }
  var rows = [{ date: null, memo: 'Opening balance', ref: '', debit: 0, credit: 0, balance: bal(), opening: true }];
  txs.forEach(function (tx) {
    if (o.from && tx.date < o.from) return;
    tx.lines.forEach(function (ln) {
      if (ln.accountId !== accountId) return;
      runD += ln.debit; runC += ln.credit;
      rows.push({ date: tx.date, memo: tx.memo, ref: tx.ref, debit: ln.debit, credit: ln.credit, balance: bal(), txId: tx.id });
    });
  });
  return { account: acct, rows: rows, opening: bal() && rows[0].balance, ending: bal() };
}

/* Full integrity self-check. Returns {ok, errors[]}. */
function integrityCheck(accounts, journal, companyId) {
  var errors = [];
  var byId = {};
  accounts.forEach(function (a) { byId[a.id] = a; });
  var txs = companyId ? journal.filter(function (t) { return t.companyId === companyId; }) : journal;
  txs.forEach(function (tx) {
    var v = validateTransaction(tx, byId);
    if (!v.ok) errors.push('Transaction ' + (tx.ref || tx.id) + ' (' + tx.date + '): ' + v.errors.join(' '));
  });
  var tb = trialBalance(accounts, journal, { companyId: companyId });
  if (!tb.balanced) errors.push('Trial balance out of balance: debits ' + fmtMoney(tb.totalDebit) + ' vs credits ' + fmtMoney(tb.totalCredit) + '.');
  var bs = balanceSheet(accounts, journal, { companyId: companyId });
  if (!bs.balanced) errors.push('Balance sheet equation violated: assets ' + fmtMoney(bs.totalAssets) + ' vs liabilities+equity ' + fmtMoney(bs.totalLiabilities + bs.totalEquity) + '.');
  return { ok: errors.length === 0, errors: errors };
}

/* ---------------- bank statement import ---------------- */

function parseBankCSV(text) {
  var errors = [];
  var rawLines = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
  if (rawLines.length < 2) { errors.push('No data rows found.'); return { rows: [], errors: errors }; }
  function splitLine(l, d) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < l.length; i++) {
      var ch = l[i];
      if (q) {
        if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === d) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(function (s) { return s.trim(); });
  }
  var delim = rawLines[0].indexOf(';') > rawLines[0].indexOf(',') ? ';' : ',';
  var header = splitLine(rawLines[0], delim).map(function (h) { return h.toLowerCase(); });
  function colIdx(names) {
    for (var i = 0; i < header.length; i++) {
      for (var j = 0; j < names.length; j++) {
        if (header[i].indexOf(names[j]) !== -1) return i;
      }
    }
    return -1;
  }
  var dI = colIdx(['date']);
  var descI = colIdx(['description', 'desc', 'narration', 'details', 'memo', 'payee']);
  var amtI = colIdx(['amount']);
  var debI = colIdx(['debit', 'withdrawal', 'paid out', 'money out']);
  var credI = colIdx(['credit', 'deposit', 'paid in', 'money in']);
  if (dI === -1 || (amtI === -1 && (debI === -1 || credI === -1))) {
    // try headerless: assume date, description, amount
    dI = 0; descI = 1; amtI = 2;
    if (header.length < 3) { errors.push('Could not understand the columns. Need date, description, and amount.'); return { rows: [], errors: errors }; }
  }
  function parseDate(s) {
    s = String(s).trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);

const DBNAME = 'tamebooks_db_v1';

    rq.onerror = () => reject(rq.error);

}

  return new Promise((resolve, reject) => {
    let t;

    catch (e) { reject(e); return; }
    const st = t.objectStore(store);
    let out;
    try { out = fn(st); } catch (e) { reject(e); return; }
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('transaction aborted'));

  put: (store, obj) => dbTx(store, 'readwrite', st => { st.put(obj); }),

/* ================= SVG charts (hand-rolled, clickable) ================= */
const PALETTE = ['#0e7c5b', '#d97706', '#2563eb', '#9333ea', '#db2777', '#0891b2', '#65a30d', '#e11d48'];
function svgBars(series, opts) {
  // series: [{label, v1, v2, key}] ; opts: {l1, l2, c1, c2, fmt, on}
  opts = opts || {};
  const W = 640, H = opts.H || 360, padL = 64, padB = 34, padT = 14;
  const max = Math.max(1, ...series.flatMap(s => [Math.abs(s.v1 || 0), Math.abs(s.v2 || 0)]));
  const bw = Math.min(46, (W - padL - 20) / Math.max(1, series.length) / 2.4);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  const y = v => H - padB - (Math.abs(v) / max) * (H - padB - padT);
  // gridlines
  for (let g = 0; g <= 4; g++) {
    const gv = max * g / 4, gy = y(gv);
    s += '<line x1="' + padL + '" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" stroke="var(--line)"/>';
    s += '<text x="' + (padL - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + esc(shortMoney(gv)) + '</text>';
  }
  series.forEach((d, i) => {
    const x = padL + 10 + i * ((W - padL - 20) / series.length);
    const cx = x + (W - padL - 20) / series.length / 2;
    if (d.v1) s += '<rect class="bar" data-k="' + esc(d.key || i) + '" data-s="1" x="' + (cx - bw - 2) + '" y="' + y(d.v1) + '" width="' + bw + '" height="' + (H - padB - y(d.v1)) + '" rx="3" fill="' + (opts.c1 || PALETTE[0]) + '"><title>' + esc((opts.l1 || '') + ' ' + d.label + ': ' + money(d.v1)) + '</title></rect>';
    if (d.v2) s += '<rect class="bar" data-k="' + esc(d.key || i) + '" data-s="2" x="' + (cx + 2) + '" y="' + y(d.v2) + '" width="' + bw + '" height="' + (H - padB - y(d.v2)) + '" rx="3" fill="' + (opts.c2 || PALETTE[1]) + '"><title>' + esc((opts.l2 || '') + ' ' + d.label + ': ' + money(d.v2)) + '</title></rect>';
    s += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(d.label) + '</text>';
  });
  s += '</svg>';
  return s;
}

function shortMoney(c) {
  const d = (c || 0) / 100; // values are cents — convert to dollars first
  const a = Math.abs(d);
  if (a >= 1e9) return (d / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (d / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (d / 1e3).toFixed(1) + 'k';
  return String(Math.round(d * 100) / 100);
}
// Bar chart auto-fit: size the dashboard bar chart so it fills its card to the
// bottom, matching the donut card's height (the grid stretches both cards to
// the tallest). Runs before first paint via requestAnimationFrame and on resize.
function fitBarChart() {
  var wrap = document.getElementById('barWrap');
  var bCard = document.getElementById('barCard');
  var dCard = document.getElementById('donutCard');
  if (!wrap || !bCard || !dCard || !window._barTrend) return;
  var cs = getComputedStyle(bCard);
  var padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  var padH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  var h3 = bCard.querySelector('h3');
  var chrome = padV + (h3 ? h3.getBoundingClientRect().height : 0) + 6;
  var target = dCard.getBoundingClientRect().height - chrome;
  var svgW = Math.max(200, bCard.clientWidth - padH);
  var H = Math.round(target * 640 / svgW);
  H = Math.max(300, Math.min(1000, H));
  if (Math.abs(H - (fitBarChart._h || 0)) > 8) {
    fitBarChart._h = H;
    wrap.innerHTML = svgBars(window._barTrend, { l1: 'Income', l2: 'Expenses', H: H });
    var svg = wrap.querySelector('svg');
    if (svg && typeof bindChartSvg === 'function') bindChartSvg(svg);
  }
  if (!fitBarChart._rz) {
    fitBarChart._rz = true;
    window.addEventListener('resize', function () {
      clearTimeout(fitBarChart._t);
      fitBarChart._t = setTimeout(function () { fitBarChart._h = 0; fitBarChart(); }, 200);
    });
  }
}
function svgDonut(segs, opts) {
  // segs: [{label, value, key}]
  opts = opts || {};
  const size = 300, r = 112, cx = 150, cy = 150;
  const total = segs.reduce((s, x) => s + x.value, 0) || 1;
  let a0 = -Math.PI / 2, s = '<svg class="chart" viewBox="0 0 ' + size + ' ' + size + '">';
  segs.forEach((g, i) => {
    const a1 = a0 + (g.value / total) * Math.PI * 2;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const mid = (a0 + a1) / 2;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const col = g.color || PALETTE[i % PALETTE.length];
    if (g.value > 0) {
      s += '<path class="bar" data-k="' + esc(g.key || g.label) + '" data-mid="' + mid.toFixed(3) + '" data-v="' + g.value + '" data-label="' + esc(g.label) + '" d="M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1)
        + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + col + '" stroke="var(--panel)" stroke-width="2">'
        + '<title>' + esc(g.label + ': ' + money(g.value)) + '</title></path>';
    }
    a0 = a1;
  });
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="72" fill="var(--panel)"/>';
  s += '<text class="dcv" x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" style="font-size:17px;font-weight:800;fill:var(--ink)">' + esc(shortMoney(total)) + '</text>';
  s += '<text class="dcl" x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle">total</text>';
  s += '</svg>';
  s += '<div class="legend">' + segs.map((g, i) =>
    '<span><i style="background:' + (g.color || PALETTE[i % PALETTE.length]) + '"></i>' + esc(g.label) + ' — ' + esc(money(g.value)) + '</span>').join('') + '</div>';
  return '<div class="donutwrap">' + s + '</div>';
}
function svgLine(points, opts) {
  // points: [{label, value, key}]
  opts = opts || {};
  const W = 640, H = 340, padL = 64, padB = 34, padT = 14;
  const vals = points.map(p => p.value);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if (max === min) max = min + 1;
  const y = v => padT + (max - v) / (max - min) * (H - padB - padT);
  const x = i => padL + 10 + i * ((W - padL - 20) / Math.max(1, points.length - 1));
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  for (let g = 0; g <= 4; g++) {
    const gv = min + (max - min) * g / 4, gy = y(gv);
    s += '<line x1="' + padL + '" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" stroke="var(--line)"/>';
    s += '<text x="' + (padL - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + esc(shortMoney(gv)) + '</text>';
  }
  if (min < 0 && max > 0) s += '<line x1="' + padL + '" y1="' + y(0) + '" x2="' + W + '" y2="' + y(0) + '" stroke="var(--muted)" stroke-dasharray="4"/>';
  const pts = points.map((p, i) => x(i).toFixed(1) + ',' + y(p.value).toFixed(1)).join(' ');
  s += '<polyline points="' + pts + '" fill="none" stroke="' + (opts.color || PALETTE[0]) + '" stroke-width="3"/>';
  points.forEach((p, i) => {
    s += '<circle class="bar" data-k="' + esc(p.key || i) + '" cx="' + x(i) + '" cy="' + y(p.value) + '" r="7" fill="' + (opts.color || PALETTE[0]) + '"><title>' + esc(p.label + ': ' + money(p.value)) + '</title></circle>';
    if (points.length <= 12) s += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(p.label) + '</text>';
  });
  s += '</svg>';
  return s;
}

function lineRowHTML(l, o) {
  l = l || {};
  const taxSel = '<select data-f="tax" style="width:100%">' + S.taxrates.map(t =>
    '<option value="' + t.bps + '"' + (String(t.bps) === String(l.taxRateBps || 0) ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</select>';
  const acctSelH = '<select data-f="acct">' + acctOptions(o.acctType === 'Expense' ? 'Expense' : 'Revenue', l.acctId || l.revenueAccountId || l.expenseAccountId || o.defAcct) + '</select>';
  const pid = l.productId ? '<input type="hidden" data-f="productId" value="' + esc(l.productId) + '">' : '';
  return '<tr data-line>' + pid
    + '<td><input type="text" data-f="desc" value="' + esc(l.desc || '') + '" placeholder="What was it?"></td>'
    + (o.mode === 'bill' ? '' : '<td><input type="number" data-f="qty" value="' + (l.qty !== undefined ? l.qty : 1) + '" min="0" step="any" style="width:70px"></td>')
    + '<td><input type="text" data-f="rate" inputmode="decimal" value="' + (l.rateCents !== undefined ? moneyInpVal(l.rateCents) : l.amountCents !== undefined ? moneyInpVal(l.amountCents) : '') + '" placeholder="0.00" style="width:110px"></td>'
    + '<td>' + taxSel + '</td><td>' + acctSelH + '</td>'
    + '<td><button type="button" class="btn btn-sm btn-danger" data-del title="Remove line">×</button></td></tr>';
}
function wireLineEditor(back, o) {
  o = o || {};
  back.querySelector('#line-add').onclick = () => {
    back.querySelector('#line-tbl tbody').insertAdjacentHTML('beforeend', lineRowHTML({}, o));
  };
  const pick = back.querySelector('#pl-pick');
  if (pick) pick.onchange = () => {
    const p = S.products.find(x => x.id === pick.value);
    if (!p) return;
    back.querySelector('#line-tbl tbody').insertAdjacentHTML('beforeend',
      lineRowHTML({ desc: p.name, qty: 1, rateCents: p.priceCents, taxRateBps: p.taxBps || 0, acctId: o.defAcct, productId: p.id }, o));
    pick.value = '';
  };
  back.querySelector('#line-tbl').addEventListener('click', e => {
    const b = e.target.closest('[data-del]');
    if (b) {
      const rows = back.querySelectorAll('#line-tbl tr[data-line]');
      if (rows.length > 1) b.closest('tr').remove(); else toast('Keep at least one line.');
    }
  });
}
function readDocLines(back, mode) {
  const out = [];
  back.querySelectorAll('#line-tbl tr[data-line]').forEach(tr => {
    const g = f => { const el = tr.querySelector('[data-f="' + f + '"]'); return el ? el.value : ''; };
    const desc = g('desc').trim();
    const rateCents = Core.toCents(g('rate'));
    if (!desc && !rateCents) return; // skip empty rows
    out.push({
      desc: desc || '(no description)',
      qty: mode === 'bill' ? 1 : (parseFloat(g('qty')) || 0),
      rateCents: rateCents,
      taxRateBps: parseInt(g('tax'), 10) || 0,
      acctId: g('acct'),
      productId: g('productId') || null
    });
  });
  return out;
}

Screens['dash'] = function () {
  const cid = S.company.id, t = today();
  const totals = Core.accountTotals(S.accounts, Core.txsIn(S.journal, cid, null, t));
  const cashAccts = S.accounts.filter(a => (a.subkind === 'bank' || a.subkind === 'cash') && !a.archived);
  const cashTotal = cashAccts.reduce((s, a) => s + Core.signedBalance(a, totals), 0);
  const asOf = t;
  const arDocs = S.invoices.filter(i => i.status !== 'void' && i.status !== 'draft')
    .map(i => ({ dueDate: i.dueDate, balanceDueCents: invBalance(i), number: i.number, id: i.id, customerId: i.customerId }));
  const buckets = Core.agedBuckets(arDocs, asOf);
  const overdueTotal = buckets.slice(1).reduce((s, b) => s + b.total, 0);
  const unpaidBills = S.bills.filter(b => b.status !== 'void' && b.status !== 'draft' && Core.docBalanceDue(b) > 0);
  const apTotal = unpaidBills.reduce((s, b) => s + Core.docBalanceDue(b), 0);
  const mk = Core.monthKey(t);
  const plMonth = Core.profitLoss(S.accounts, S.journal, { companyId: cid, from: mk + '-01', to: t });
  const tax = Core.taxSummary(S.accounts, S.journal, { companyId: cid });

  // 6-month trend
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(Core.monthKey(Core.addMonths(t, -i)));
  const trend = months.map(m => {
    const p = Core.profitLoss(S.accounts, S.journal, { companyId: cid, from: m + '-01', to: Core.addDays(Core.monthKey(Core.addMonths(m + '-01', 1)) + '-01', -1) });
    const d = Core.parseISO(m + '-01');
    return { label: d.toLocaleDateString('en-US', { month: 'short' }), v1: p.totalRevenue, v2: p.totalExpense, key: m };
  });
  window._barTrend = trend; // stash for fitBarChart (bar chart auto-fit)
  // expense breakdown this year
  const yStart = t.slice(0, 4) + '-01-01';
  const expT = Core.accountTotals(S.accounts, Core.txsIn(S.journal, cid, yStart, t));
  const expSegs = S.accounts.filter(a => a.type === 'Expense' && !a.archived)
    .map(a => ({ label: a.name, value: Core.signedBalance(a, expT), key: a.id }))
    .filter(x => x.value > 0).sort((a, b) => b.value - a.value).slice(0, 8);
  // cash flow line: monthly net bank change
  const byId = S.acctById;
  const cashPts = months.map(m => {
    const txs = Core.txsIn(S.journal, cid, m + '-01', Core.addDays(Core.monthKey(Core.addMonths(m + '-01', 1)) + '-01', -1));
    let net = 0;
    txs.forEach(tx => tx.lines.forEach(ln => {
      const a = byId[ln.accountId];
      if (a && (a.subkind === 'bank' || a.subkind === 'cash')) net += ln.debit - ln.credit;
    }));
    const d = Core.parseISO(m + '-01');
    return { label: d.toLocaleDateString('en-US', { month: 'short' }), value: net, key: m };
  });

  const overdueList = arDocs.filter(d => d.balanceDueCents > 0 && d.dueDate && d.dueDate < asOf)
    .sort((a, b) => a.dueDate < b.dueDate ? -1 : 1).slice(0, 5);
  const upcomingBills = unpaidBills
    .map(b => ({ b, due: Core.docBalanceDue(b) })).sort((a, b) => (a.b.dueDate || 'z') < (b.b.dueDate || 'z') ? -1 : 1).slice(0, 5);

  let h = '';
  h += '<h2>' + esc(S.company.name) + ' <span class="small">· as of ' + esc(fdate(t)) + '</span></h2>';
  h += '<div class="grid kpis">'
    + kpi('Cash on hand', money(cashTotal), cashAccts.length + (cashAccts.length === 1 ? ' bank account' : ' bank accounts'), 'bank/accounts')
    + kpi('Overdue — customers owe me', money(overdueTotal), (function(){var n=buckets.slice(1).reduce((s, b) => s + b.docs.length, 0);return n + ' overdue invoice' + (n===1?'':'s');})(), 'reports/ar')
    + kpi('Unpaid bills I owe', money(apTotal), (function(){var n=unpaidBills.length;return n + ' unpaid bill' + (n===1?'':'s');})(), 'reports/ap')
    + kpi('This month: profit', money(plMonth.net), 'in ' + money(plMonth.totalRevenue) + ' · out ' + money(plMonth.totalExpense), 'reports/pl')
    + kpi('Tax collected (unpaid)', money(tax.netOwed), 'collected ' + money(tax.collected), 'reports/tax')

function bindChartSvg(svg) {
    svg.addEventListener('click', e => {
      const bar = e.target.closest('.bar'); if (!bar || !bar.dataset.k) return;
      const key = bar.dataset.k, s2 = bar.dataset.s;
      // visible selection: pull-out / lift + outline; click again to release
      const was = bar.classList.contains('sel');
      clearChartSels();
      if (!was) {
        bar.classList.add('sel');
        if (bar.tagName === 'path' && bar.dataset.mid) {
          const m = parseFloat(bar.dataset.mid);
          bar.setAttribute('transform', 'translate(' + (Math.cos(m) * 13).toFixed(1) + ' ' + (Math.sin(m) * 13).toFixed(1) + ')');
          // donut: show the selected slice's value in the center while selected
          const dcv = svg.querySelector('.dcv'), dcl = svg.querySelector('.dcl');
          if (dcv && dcl) {
            if (!svg.dataset.ctv) { svg.dataset.ctv = dcv.textContent; svg.dataset.ctl = dcl.textContent; }
            dcv.textContent = shortMoney(parseFloat(bar.dataset.v) || 0);
            dcl.textContent = bar.dataset.label || '';
          }
        } else if (bar.tagName === 'rect') {
          bar.setAttribute('transform', 'translate(0 -7)');
        } else if (bar.tagName === 'circle') {
          bar.setAttribute('r', '11');
        }
      }
      if (svg.querySelector('polyline')) {
        // cash line: bank txs in month
        const txs = S.journal.filter(t => t.companyId === S.company.id && Core.monthKey(t.date) === key
          && t.lines.some(l => { const a = S.acctById[l.accountId]; return a && (a.subkind === 'bank' || a.subkind === 'cash'); }));
        showTxList('Bank transactions — ' + key, txs);
      } else if (svg.querySelector('path')) {
        drillTxForAccount(key, today().slice(0, 4) + '-01-01', today(), 'Ledger — ' + acctName(key));
      } else {
        const wantRev = s2 === '1';
        const txs = S.journal.filter(t => t.companyId === S.company.id && Core.monthKey(t.date) === key
          && t.lines.some(l => { const a = S.acctById[l.accountId]; return a && a.type === (wantRev ? 'Revenue' : 'Expense'); }));
        showTxList((wantRev ? 'Income — ' : 'Expenses — ') + key, txs);
      }
    });
}

/* post invoice journal + inventory relief */
async function postInvoiceTx(inv) {
  const ar = S.accounts.find(a => a.subkind === 'ar' && !a.archived);
  const taxA = S.accounts.find(a => a.subkind === 'tax' && !a.archived);
  if (!ar) throw new Error('No Accounts Receivable account found.');
  const r = inv.rateToBase || 1;
  const tx = Core.buildSaleInvoice({
    date: inv.date, memo: 'Invoice ' + inv.number + ' — ' + custName(inv.customerId), ref: inv.number,
    arAccountId: ar.id, taxAccountId: taxA ? taxA.id : ar.id,
    lines: inv.lines.map(l => ({
      revenueAccountId: l.revenueAccountId,
      qty: l.qty, rateCents: Core.convertToBase(l.rateCents, r), taxRateBps: l.taxRateBps
    }))
  });
  tx.source = { kind: 'invoice', id: inv.id };
  await postJournal(tx);
  inv.journalId = tx.id;
  await relieveInventory(inv);
}
async function relieveInventory(inv) {
  const ensured = await ensureInventoryAccts();
  const cogs = ensured.cogs, invA = ensured.invA;
  for (const ln of inv.lines) {
    if (!ln.productId) continue;
    const p = S.products.find(x => x.id === ln.productId);
    if (!p || !p.trackStock) continue;
    const avg = p.qtyOnHand > 0 ? (p.avgCostCents || 0) : 0;
    const relief = Math.round((ln.qty || 0) * avg);
    p.qtyOnHand = Math.max(0, (p.qtyOnHand || 0) - (ln.qty || 0));
    await putCol('products', p);
    if (relief > 0 && cogs && invA) {
      await postJournal(Core.buildInventoryRelief({
        date: inv.date, memo: 'Cost of goods — ' + inv.number, ref: inv.number,
        cogsAccountId: cogs.id, inventoryAccountId: invA.id, amountCents: relief,
        source: { kind: 'cogs', id: inv.id }
      }));
    }
  }
}
function reverseTx(tx, memo) {
  return Core.makeTx({
    date: today(), memo: memo, ref: tx.ref,
    lines: tx.lines.map(l => ({ accountId: l.accountId, debit: l.credit, credit: l.debit })),
    source: { kind: 'reversal', id: tx.id }
  });
}

  const inv = {
    id: Core.newId('in'), number: await nextNumber('invoice'), customerId: q.customerId,
    date: today(), dueDate: Core.addDays(today(), 14),
    lines: q.lines.map(l => Object.assign({}, l)), payments: [], status: 'sent',

  };

}

      });

function openBillDetail(id) {
  const b = S.bills.find(x => x.id === id);
  if (!b) return;
  const st = billStatus(b), tot = Core.docLineTotals(b.lines), due = billBalance(b);
  const lineRows = b.lines.map(l =>
    '<tr><td>' + esc(l.desc) + '</td><td>' + esc(acctName(l.expenseAccountId)) + '</td><td>' + esc(taxName(l.taxRateBps)) + '</td><td class="r">' + esc(money(Math.round(l.amountCents * (1 + (l.taxRateBps || 0) / 10000)), b.currency)) + '</td></tr>').join('');
  const payRows = (b.payments || []).map(p => '<tr><td>' + esc(fdate(p.date)) + '</td><td>' + esc(p.method || '') + '</td><td class="r">' + esc(money(p.foreignCents !== undefined ? p.foreignCents : p.amountCents, b.currency)) + '</td></tr>').join('');
  openModal('Bill ' + b.number,
    '<p><b>' + esc(suppName(b.supplierId)) + '</b> · ' + esc(fdate(b.date)) + ' · due ' + esc(fdate(b.dueDate)) + '</p>'
    + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Description</th><th>Category</th><th>Tax</th><th class="r">Amount</th></tr></thead><tbody>' + lineRows + '</tbody>'
    + '<tfoot><tr><td colspan="3">Total</td><td class="r">' + esc(money(tot.total, b.currency)) + '</td></tr>'
    + '<tr><td colspan="3">Balance due</td><td class="r">' + esc(money(due, b.currency)) + '</td></tr></tfoot></table></div>'
    + '<h3>Payments</h3>' + (payRows ? '<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Method</th><th class="r">Amount</th></tr></thead><tbody>' + payRows + '</tbody></table></div>' : '<p class="small">Not paid yet.</p>')
    + '<div class="mfoot" style="justify-content:flex-start">'
    + (due > 0 && st !== 'void' ? '<button class="btn btn-p" data-act="pay">Pay bill</button>' : '')
    + (st !== 'void' && due === tot.total ? '<button class="btn btn-danger" data-act="void">Void</button>' : '')
    + '</div>',
    { wide: true, titleHTML: 'Bill ' + esc(b.number) + ' ' + statusBadge(st), onMount(back, close) {
      back.querySelectorAll('[data-act]').forEach(x => x.onclick = async () => {
        if (x.dataset.act === 'pay') { close(); payBillModal(b); }
        else if (x.dataset.act === 'void') {
          if (!await confirmDlg('Void bill ' + b.number + '? A reversing entry will be posted.', 'Void bill')) return;
          const orig = S.journal.find(t => t.id === b.journalId);
          if (orig) await postJournal(reverseTx(orig, 'Void bill ' + b.number));
          b.status = 'void'; await putCol('bills', b); blip(); toast('Bill voided.'); close(); rerender();
        }
      });
    }});
}
function payBillModal(b) {
  const due = billBalance(b), r = b.rateToBase || 1;
  formModal('Pay bill — ' + b.number,
    fld('Date', '<input type="date" name="date" value="' + today() + '">')
    + fld('Amount (' + esc(b.currency) + ')', '<input type="text" name="amount" inputmode="decimal" value="' + moneyInpVal(due / r) + '">', 'Balance due: ' + money(due / r, b.currency))
    + fld('Paid from', acctSel('bankAccountId', 'Asset', S.accounts.find(a => a.subkind === 'bank' && !a.archived).id, 'bank'))
    + fld('Method', '<input type="text" name="method" value="Bank transfer">'),
    'Save payment', async vals => {
      const foreign = Core.toCents(vals.amount);
      if (foreign <= 0) { toast('Amount must be positive.'); return false; }
      if (foreign > Math.round(due / r)) { toast('That is more than the balance due.'); return false; }
      const base = Core.convertToBase(foreign, r);
      const ap = S.accounts.find(a => a.subkind === 'ap' && !a.archived);
      const tx = Core.buildBillPayment({ date: vals.date, memo: 'Paid ' + b.number + ' — ' + suppName(b.supplierId), ref: b.number, bankAccountId: vals.bankAccountId, apAccountId: ap.id, amountCents: base, source: { kind: 'bill-payment', id: b.id } });
      await postJournal(tx);
      b.payments.push({ date: vals.date, amountCents: base, foreignCents: foreign, currency: b.currency, rateToBase: r, journalId: tx.id, method: vals.method });
      await putCol('bills', b);
    });
}

async function openExpenseDetail(id) {
  const e = S.expenses.find(x => x.id === id);

  let receiptH = '<p class="small">No receipt attached.</p>';

      receiptH = att.kind && att.kind.indexOf('image/') === 0
        ? '<img src="' + url + '" style="max-width:100%;border:1px solid var(--line);border-radius:8px" alt="receipt">'
        : '<p><a class="btn" href="' + url + '" download="' + esc(att.name || 'receipt') + '">Download receipt</a></p>';

    + '<tr><td><b>Category</b></td><td>' + esc(acctName(e.expenseAccountId)) + ' <span class="small">(' + esc((S.acctById[e.expenseAccountId] || {}).plain || 'Expense') + '</span></td></tr>'
    + '<tr><td><b>Amount</b></td><td>' + esc(money(e.amountCents + (e.taxCents || 0))) + (e.taxCents ? ' <span class="small">(incl. ' + esc(money(e.taxCents)) + ' tax)</span>' : '') + '</td></tr>'
    + '<tr><td><b>Paid from</b></td><td>' + esc(acctName(e.bankAccountId)) + '</td></tr>'
    + '<tr><td><b>What</b></td><td>' + esc(e.memo || '') + '</td></tr>'
    + (e.supplierId ? '<tr><td><b>Supplier</b></td><td>' + esc(suppName(e.supplierId)) + '</td></tr>' : '')
    + '</tbody></table></div><h3>Receipt</h3>' + receiptH
    + '<div class="mfoot" style="justify-content:flex-start"><button class="btn btn-danger" id="ex-del">Delete expense</button></div>',
    { onMount(back, close) {
      back.querySelector('#ex-del').onclick = async () => {
        if (!await confirmDlg('Delete this expense? Its bookkeeping entry will be removed too.', 'Delete')) return;

}

  let h = helpBox('Reconcile — prove your books match the bank', 'Reconciling means checking that <b>every dollar in your books also appears on the bank statement</b>, and vice versa. Do it monthly: import the statement (or enter the ending balance by hand), tick off each transaction, and chase the difference to zero.');
  h += '<div class="toolbar">' + fld('Account', '<select id="rec-acct">' + banks.map(a => '<option value="' + a.id + '"' + (a.id === REC.acct ? ' selected' : '') + '>' + esc(a.name) + '</option>').join('') + '</select>') + '</div>';
  // --- classic reconcile ---
  const cleared = clearedTxIds(REC.acct);
  const uncleared = S.journal.filter(t => t.companyId === S.company.id && !cleared.has(t.id)
    && t.lines.some(l => l.accountId === REC.acct)).sort((a, b) => a.date < b.date ? -1 : 1);
  h += '<div class="card"><h3>1 · Check off against a statement</h3>'

    + '<div class="tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr><th></th><th>Date</th><th>What</th><th class="r">Amount</th></tr></thead><tbody>'
    + (uncleared.map(t => {
      const ln = t.lines.find(l => l.accountId === REC.acct);

    + '<div class="toolbar"><span id="rec-sum" class="small">Tick the transactions that appear on your statement.</span><span class="spacer"></span><button class="btn btn-p" id="rec-finish">Finish reconciliation</button></div></div>';
  // --- import ---
  h += '<div class="card" style="margin-top:14px"><h3>2 · Import a bank statement (CSV)</h3>'
    + '<p class="small">Download a CSV from your bank, then upload it here. ' + esc(BRAND) + ' will suggest a category for each line (you can teach it with rules), and you match or record each one.</p>'
    + '<div class="toolbar"><input type="file" id="stmt-file" accept=".csv,.txt" class="btn"> <button class="btn" id="stmt-sample">Use sample CSV</button></div>'
    + '<div id="stmt-list">' + (stmts.map(s => {
      const unm = s.rows.filter(r => !r.matched && r.ignored !== true).length;
      return '<div class="checkline"><span><b>' + esc(s.name) + '</b> <span class="small">' + s.rows.length + ' lines · ' + unm + ' unmatched</span></span><span class="spacer" style="flex:1"></span><button class="btn btn-sm" data-open="' + s.id + '">Work on it</button> <button class="btn btn-sm btn-danger" data-delstmt="' + s.id + '">Delete</button></div>';
    }).join('') || '<p class="small">No statements imported for this account yet.</p>') + '</div>'
    + '<div id="stmt-work"></div></div>';
  // --- smart rules ---
  h += '<div class="card" style="margin-top:14px"><h3>3 · Smart rules</h3>'
    + '<p class="small">Teach ' + esc(BRAND) + ' your habits: when an imported line contains a word, it suggests a category automatically.</p>'
    + '<div id="rule-list">' + (S.rules.map(r =>
      '<div class="checkline"><span>When the description contains <b>“' + esc(r.pattern) + '”</b> → suggest <b>' + esc(acctName(r.accountId)) + '</b></span><span class="spacer" style="flex:1"></span><button class="btn btn-sm btn-danger" data-delrule="' + r.id + '">Delete</button></div>'
    ).join('') || '<p class="small">No rules yet.</p>') + '</div>'
    + '<div class="frow" style="margin-top:8px;max-width:640px">'
    + fld('Word in description', '<input type="text" id="rule-pat" placeholder="e.g. officemart">')
    + fld('Suggest category', '<select id="rule-acct">' + acctOptions('__ALL__') + '</select>') + '</div>'
    + '<button class="btn btn-sm btn-p" id="rule-add">Add rule</button></div>';
  return h;
};
Screens['bank/reconcile'].mount = function (view) {
  view.querySelector('#rec-acct').onchange = e => { REC.acct = e.target.value; REC.stmt = null; rerender(); };
  const boxes = () => Array.from(view.querySelectorAll('[data-tx]'));
  const upd = () => {
    let sum = 0, n = 0;
    boxes().forEach(b => { if (b.checked) { sum += +b.dataset.amt; n++; } });
    const stmt = Core.toCents(view.querySelector('#rec-bal').value);
    const diff = stmt - bookBalanceToDate(REC.acct, view.querySelector('#rec-date').value);
    view.querySelector('#rec-sum').innerHTML = n + ' ticked · ticked total ' + esc(money(sum))
      + ' · statement minus books: <b>' + esc(money(diff)) + '</b>' + (diff === 0 ? ' <span class="pos">✓ balanced</span>' : '');
  };

  view.querySelector('#rec-bal').oninput = upd;
  view.querySelector('#rec-finish').onclick = async () => {
    const ids = boxes().filter(b => b.checked).map(b => b.dataset.tx);
    if (!ids.length) { toast('Tick at least one transaction.'); return; }
    if (!await confirmDlg('Mark ' + ids.length + ' transaction(s) as reconciled on ' + fdate(view.querySelector('#rec-date').value) + '?', 'Finish')) return;
    await putCol('recons', {
      id: Core.newId('rc'), accountId: REC.acct, statementDate: view.querySelector('#rec-date').value,
      statementBalance: Core.toCents(view.querySelector('#rec-bal').value), clearedTxIds: ids, finishedAt: new Date().toISOString()
    });
    blip(); toast('Reconciled.'); rerender();
  };
  view.querySelector('#stmt-sample').onclick = async () => {
    const csv = 'Date,Description,Amount\n' + today() + ',"COFFEE SHOP DOWNTOWN",-14.50\n' + today() + ',"CLIENT PAYMENT ACME BAKERY",850.00\n' + today() + ',"MONTHLY BANK FEE",-12.00\n' + today() + ',"OFFICEMART SUPPLIES",-64.20\n';
    await importStatementCSV(csv, 'sample-statement.csv');
  };

    const f = e.target.files[0]; if (!f) return;
    await importStatementCSV(await f.text(), f.name);
  };
  view.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { REC.stmt = b.dataset.open; renderStmtWork(view); });
  view.querySelectorAll('[data-delstmt]').forEach(b => b.onclick = async () => {
    if (await confirmDlg('Delete this imported statement? (Your books are not touched.)', 'Delete')) { await delCol('statements', b.dataset.delstmt); rerender(); }
  });
  view.querySelector('#rule-add').onclick = async () => {
    const pat = view.querySelector('#rule-pat').value.trim();
    const aid = view.querySelector('#rule-acct').value;
    if (!pat || !aid) { toast('Enter a word and pick a category.'); return; }
    await putCol('rules', { id: Core.newId('ru'), pattern: pat, accountId: aid });
    blip(); toast('Rule added.'); rerender();
  };
  view.querySelectorAll('[data-delrule]').forEach(b => b.onclick = async () => { await delCol('rules', b.dataset.delrule); rerender(); });
  if (REC.stmt) renderStmtWork(view);
};
function bookBalanceToDate(acctId, date) {
  const totals = Core.accountTotals(S.accounts, Core.txsIn(S.journal, S.company.id, null, date));
  const a = S.acctById[acctId];
  return Core.signedBalance(a, totals);
}
function clearedTxIds(acctId) {
  const s = new Set();
  S.recons.filter(r => r.accountId === acctId).forEach(r => (r.clearedTxIds || []).forEach(id => s.add(id)));
  return s;
}
async function importStatementCSV(text, name) {
  const p = Core.parseBankCSV(text);
  if (!p.rows.length) { toast('Could not read that file: ' + (p.errors[0] || 'no rows')); return; }
  Core.applyRules(p.rows, S.rules);
  const stmt = { id: Core.newId('st'), accountId: REC.acct, name: name || 'statement.csv', uploadedAt: new Date().toISOString(), rows: p.rows };

function agingBuckets(docs, asOf) {
  const out = { current: [], d1_30: [], d31_60: [], d61_90: [], d90: [] };
  docs.forEach(d => {
    const late = d.dueDate ? Core.diffDays(d.dueDate, asOf) : -1; // no due date => not overdue
    const row = { id: d.id, balance: d.balance, dueDate: d.dueDate };
    if (late <= 0) out.current.push(row);
    else if (late <= 30) out.d1_30.push(row);
    else if (late <= 60) out.d31_60.push(row);
    else if (late <= 90) out.d61_90.push(row);
    else out.d90.push(row);
  });
  return out;
}
/* simple trend forecast: linear regression over history, projected n months */
function trendForecast(history, n) {
  const ys = history.slice(-6);
  if (!ys.length) return Array(n).fill(0);
  if (ys.length === 1) return Array(n).fill(ys[0]);
  const m = ys.length;
  const sx = m * (m - 1) / 2, sxx = (m - 1) * m * (2 * m - 1) / 6;
  const sy = ys.reduce((s, y) => s + y, 0);
  const sxy = ys.reduce((s, y, i) => s + i * y, 0);
  const denom = m * sxx - sx * sx;
  const slope = denom ? (m * sxy - sx * sy) / denom : 0;
  const icept = (sy - slope * sx) / m;
  const out = [];
  for (let i = 0; i < n; i++) out.push(Math.round(icept + slope * (m + i)));
  return out;
}

function plSections(txs) {
  const totals = Core.accountTotals(S.accounts, txs);
  const rev = [], exp = [];
  S.accounts.filter(a => a.type === 'Revenue' && !a.archived).forEach(a => {
    const v = Core.signedBalance(a, totals);
    if (v !== 0) rev.push([a, v]);
  });
  S.accounts.filter(a => a.type === 'Expense' && !a.archived).forEach(a => {
    const v = Core.signedBalance(a, totals);
    if (v !== 0) exp.push([a, v]);
  });
  return { rev, exp, net: netOf(txs) };
}

function rptAging(kind) {
  const t = today();
  const docs = kind === 'ar'
    ? S.invoices.filter(d => d.status !== 'void' && d.status !== 'draft').map(d => ({ doc: d, id: d.id, key: 'i:' + d.id, num: d.number, who: custName(d.customerId), date: d.dueDate || d.date, dd: d.dueDate || null, t: Core.docLineTotals(d.lines), cur: d.currency, r: d.rateToBase }))
    : S.bills.filter(d => d.status !== 'void').map(d => ({ doc: d, id: d.id, key: 'b:' + d.id, num: d.number, who: suppName(d.supplierId), date: d.dueDate || d.date, dd: d.dueDate || null, t: Core.docLineTotals(d.lines), cur: d.currency, r: d.rateToBase }));
  const withDue = docs.map(d => Object.assign(d, { due: Math.round(Core.docBalanceDue(d.doc)) })).filter(d => d.due > 0);
  const buckets = agingBuckets(withDue.map(d => ({ id: d.id, dueDate: d.dd, balance: d.due })), t);
  const byId = {}; withDue.forEach(d => byId[d.id] = d);
  const order = ['current', 'd1_30', 'd31_60', 'd61_90', 'd90'];
  const labels = { current: 'Not due yet', d1_30: '1–30 days late', d31_60: '31–60 days late', d61_90: '61–90 days late', d90: 'Over 90 days late' };
  let h = '<div class="tblwrap"><table class="tbl"><thead><tr><th>Age</th><th class="r">Amount</th></tr></thead><tbody>';
  let tot = 0;
  order.forEach(b => {
    const rows = buckets[b] || [];
    const sum = rows.reduce((s, r) => s + r.balance, 0);
    tot += sum;
    h += '<tr><td style="font-weight:700">' + labels[b] + ' <span class="small">(' + rows.length + ')</span></td><td class="r" style="font-weight:700">' + esc(money(sum)) + '</td></tr>';
    rows.forEach(r => {
      const d = byId[r.id];
      h += '<tr><td style="padding-left:24px"><span class="rowlink" data-rdoc="' + d.key + '">' + esc(d.num) + '</span> · ' + esc(d.who) + ' <span class="small">' + (d.dd ? 'due ' + esc(fdate(d.dd)) : 'no due date') + '</span></td><td class="r">' + esc(money(r.balance)) + '</td></tr>';
    });
  });
  h += '<tr><td style="font-weight:700">Total outstanding</td><td class="r" style="font-weight:700">' + esc(money(tot)) + '</td></tr>';
  h += '</tbody></table></div>';
  return h;
}
function rptTax(from, to) {
  const byRate = {};
  const add = (bps, taxable, tax, kind) => {
    const k = kind + '|' + bps;
    byRate[k] = byRate[k] || { bps, taxable: 0, tax: 0, kind };
    byRate[k].taxable += taxable; byRate[k].tax += tax;
  };
  S.invoices.filter(d => d.status !== 'void' && d.status !== 'draft' && d.date >= from && d.date <= to).forEach(d => {
    d.lines.forEach(l => {
      const base = Math.round(l.qty * l.rateCents * (d.rateToBase || 1));
      add(l.taxRateBps || 0, base, Math.round(base * (l.taxRateBps || 0) / 10000), 'collected');
    });
  });
  S.bills.filter(d => d.status !== 'void' && d.date >= from && d.date <= to).forEach(d => {
    d.lines.forEach(l => {
      const base = Math.round(l.amountCents * (d.rateToBase || 1));
      add(l.taxRateBps || 0, base, Math.round(base * (l.taxRateBps || 0) / 10000), 'paid');
    });
  });
  S.expenses.filter(d => d.date >= from && d.date <= to).forEach(e => add(e.taxRateBps || 0, e.amountCents, e.taxCents || 0, 'paid'));
  const rows = Object.values(byRate).sort((a, b) => (a.kind < b.kind ? -1 : 1) || a.bps - b.bps);
  let coll = 0, paid = 0;
  const body = rows.map(r => {
    if (r.kind === 'collected') coll += r.tax; else paid += r.tax;
    return '<tr><td>' + (r.kind === 'collected' ? 'Charged on sales' : 'Paid on purchases') + '</td><td>' + esc(taxName(r.bps)) + '</td><td class="r">' + esc(money(r.taxable)) + '</td><td class="r">' + esc(money(r.tax)) + '</td></tr>';
  }).join('');
  return '<div class="tblwrap"><table class="tbl"><thead><tr><th>Type</th><th>Rate</th><th class="r">Taxable amount</th><th class="r">Tax</th></tr></thead><tbody>' + (body || '<tr><td colspan="4" class="small">No taxed activity in this period.</td></tr>')
    + '</tbody><tfoot><tr><td colspan="3" style="font-weight:700">Net tax position (collected − paid)</td><td class="r" style="font-weight:700">' + esc(money(coll - paid)) + '</td></tr></tfoot></table></div>'
    + '<p class="small">Positive means you collected more than you paid (you likely owe the difference). Hand these numbers to your tax preparer — ' + esc(BRAND) + ' does not file taxes.</p>';
}

function rptBudget() {
  const period = RPT.from.slice(0, 7);
  const b = S.budgets.find(x => x.period === period)
    || S.budgets.slice().sort((a, b2) => a.period < b2.period ? 1 : -1)[0];
  if (!b) return '<div class="empty">No budget yet. Create one under Tools → Budgets.</div>';
  const vars = Core.budgetVsActual(b, S.accounts, S.journal, { companyId: S.company.id });
  const rows = vars.map(v => {
    const over = v.account && v.account.type === 'Expense' ? v.variance < 0 : v.variance > 0;
    const cls = v.variance === 0 ? '' : (over ? 'pos' : 'neg');
    return '<tr><td>' + esc(v.account ? v.account.name : '?') + '</td><td class="r">' + esc(money(v.budgeted)) + '</td><td class="r">' + esc(money(v.actual)) + '</td><td class="r ' + cls + '">' + esc(money(v.variance)) + '</td></tr>';
  }).join('');
  return '<p class="small">Budget: <b>' + esc(b.name) + '</b> · ' + esc(b.period) + ' <span class="small">(showing the budget closest to your selected dates)</span></p>'
    + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Account</th><th class="r">Budgeted</th><th class="r">Actual</th><th class="r">Left / (over)</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<p class="small">“Left” is budgeted minus actual. For expenses, positive means under budget; for income, positive means ahead of target.</p>';
}
function rptForecast() {
  const months = RPT.fmonths || 6;
  // monthly net income for the last 6 closed-ish months
  const t = today();
  const series = [];
  for (let i = 6; i >= 1; i--) {
    const m = Core.addMonths(t.slice(0, 7) + '-01', -(i - 1));
    const f = m.slice(0, 7) + '-01';
    const last = Core.addDays(Core.addMonths(f, 1), -1);
    const txs = rptTxs(f, last > t ? t : last);
    series.push({ label: m.slice(0, 7), value: netOf(txs) });
  }
  const fc = trendForecast(series.map(s => s.value), months);
  const labels = series.map(s => s.label);
  for (let i = 1; i <= months; i++) labels.push(Core.addMonths(t.slice(0, 7) + '-01', i).slice(0, 7));
  const data = series.map(s => s.value).concat(fc);
  const chart = svgLine(labels.map((l, i) => ({ label: l, value: data[i], key: 'm' + i })));
  const fcRows = fc.map((v, i) => '<tr><td>' + esc(labels[6 + i]) + ' (projected)</td><td class="r">' + esc(money(v)) + '</td></tr>').join('');
  const histRows = series.map(s => '<tr><td>' + esc(s.label) + '</td><td class="r">' + esc(money(s.value)) + '</td></tr>').join('');
  return '<div class="toolbar"><span class="small">Forecast how many months ahead:</span>'
    + [3, 6, 12].map(m => '<button class="btn btn-sm' + (months === m ? ' btn-p' : '') + '" data-fm="' + m + '">' + m + '</button>').join('') + '</div>'
    + '<div style="max-width:680px">' + chart + '</div>'
    + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Month</th><th class="r">Net profit</th></tr></thead><tbody>' + histRows + fcRows + '</tbody></table></div>'
    + '<p class="small">Forecasts use a simple trend of your last 6 months. They are a rough guide, not a promise.</p>';
}

function stepRecDate(d, freq) {

}
function recPayloadText(r) {
