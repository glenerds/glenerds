<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Scheduling, Billing &amp; Payroll Manager — LessonLane</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#2b2620;--mut:#7a7264;--line:#e6dfd2;--acc:#2a7f62;--acc2:#c9a227;--warn:#c0392b;--ok:#2a7f62;--sel:#e8f4ee}
[data-theme="dark"]{--bg:#1a1d1b;--card:#232726;--ink:#ece9e2;--mut:#bdb5a3;--line:#383d3b;--acc:#4cb892;--acc2:#d9b93c;--warn:#e06c5a;--ok:#7bc47f;--sel:#243b33}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;max-width:1100px;margin:0 auto;padding:0 16px 60px;font-size:16px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.35rem}
.logo svg{width:34px;height:34px}
.hdr-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
.hdr-btns button,.hdr-btns a{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.hdr-btns button:hover{background:var(--line)}
.hdr-btns button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.hdr-btns button:active{transform:scale(.93);filter:brightness(.92)}
.more-apps{width:auto!important;padding:0 14px;font-weight:600;font-size:15px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.tabs button{background:none;border:none;color:var(--mut);font-size:16px;font-weight:600;padding:8px 14px;cursor:pointer;border-radius:8px}
.tabs button.active{color:var(--acc);background:var(--card);box-shadow:inset 0 -3px 0 var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.card h2{margin-bottom:10px;font-size:1.15rem}
.card h3{margin:14px 0 8px;font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .n{font-size:1.7rem;font-weight:800;color:var(--acc)}
.stat .l{font-size:15px;color:var(--mut)}
.stat.warn .n{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:6px}
label.f{display:grid;gap:4px;font-size:15px;font-weight:600}
input,select,textarea{font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type="checkbox"]{width:auto}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn)}
.btn.sm{padding:6px 12px;font-size:14px}
.rowline{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rowline .grow{flex:1}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:13px;font-weight:600}
.badge.ok{background:#dff0df;color:#1d5c22}.badge.warn{background:#fbe3df;color:#8f2b1d}.badge.low{background:#fff3d6;color:#7a5b00}.badge.info{background:#dde9f7;color:#1d4e8f}
[data-theme="dark"] .badge.ok{background:#2a4a2d;color:#bfe6c2}[data-theme="dark"] .badge.warn{background:#4a2a24;color:#f0b3a6}[data-theme="dark"] .badge.low{background:#4a3d1a;color:#f0d98a}[data-theme="dark"] .badge.info{background:#24344a;color:#b3cdf0}
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend{font-size:14px;display:grid;gap:4px}
.legend div{padding:4px 8px;border-radius:6px;cursor:pointer}
.legend div.sel{background:var(--sel);outline:2px solid var(--acc);font-weight:700}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.bar-lbl{width:110px;flex:none;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--line);border-radius:6px;height:22px;position:relative}
.bar-fill{background:var(--acc);border-radius:6px;height:100%;transition:width .2s}
.bar-fill.sel{outline:3px solid var(--ink);outline-offset:-3px}
.bar-val{width:70px;text-align:right;font-size:14px;font-weight:600}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.chart-card h3{margin-bottom:8px}
.muted{color:var(--mut)}.small{font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.cta-strip{display:flex;gap:10px;align-items:center;justify-content:center;margin:28px 0;flex-wrap:wrap}
.pill{display:inline-block;padding:10px 22px;border-radius:30px;background:var(--acc);color:#fff;font-weight:700;text-decoration:none;font-size:16px}
.inv-paper{background:#fff;color:#222;border:1px solid #ddd;border-radius:8px;padding:28px;max-width:700px;margin:0 auto;font-size:15px}
.inv-paper h2{color:#111}
.inv-paper table th{color:#555}
@media print{header,.tabs,.hdr-btns,.no-print,.cta-strip,#toast{display:none!important}body{background:#fff}.card{border:none}.inv-paper{border:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="6" y="4" width="22" height="26" rx="3" fill="#2a7f62"/><rect x="10" y="9" width="14" height="3" rx="1.5" fill="#fff" opacity=".9"/><rect x="10" y="14" width="14" height="2.4" rx="1.2" fill="#fff" opacity=".65"/><rect x="10" y="18.5" width="9" height="2.4" rx="1.2" fill="#fff" opacity=".65"/><circle cx="24" cy="24" r="6" fill="#c9a227"/><path d="M24 21.5v3l2 1.4" stroke="#2b2620" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span>LessonLane</span></div>
  <div class="hdr-btns">
    <a class="more-apps" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps</a>
    <button id="btn-sample" title="Try sample data" aria-label="Try sample data" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v5.5L4.8 17a3 3 0 0 0 2.6 4.5h9.2a3 3 0 0 0 2.6-4.5L14 8.5V3"/></svg></button>
    <button id="btn-theme" title="Dark mode" aria-label="Dark mode" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
    <button id="btn-sound" title="Sound" aria-label="Sound" aria-pressed="true" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path class="wv" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  </div>
</header>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="view"></main>
<div class="cta-strip no-print"><a class="pill" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps by Glenerds</a></div>
<div id="toast" role="status"></div>
<script>
"use strict";
</script>
<script>
/* ===== LessonLane core: storage, utils, theme/sound/sample ===== */
var LS="lessonlane_v1", LSS="lessonlane_snap", LST="lessonlane_snap_on";
var DB=null;
var ui={tab:"dash",sel:{},editStudent:null,editTutor:null,editSession:null,showSForm:false,showTForm:false};
function blankDB(){return {students:[],tutors:[],sessions:[],invoices:[],payments:[],expenses:[],invSeq:1};}
function load(){try{var s=localStorage.getItem(LS);if(s){var d=JSON.parse(s);if(!d||!Array.isArray(d.students)||!Array.isArray(d.tutors)||!Array.isArray(d.sessions)||!Array.isArray(d.invoices)||!Array.isArray(d.payments)||!Array.isArray(d.expenses)){throw 0;}if(typeof d.invSeq!=="number")d.invSeq=1;DB=d;return;}}catch(e){}DB=blankDB();}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){toast("Could not save — storage full or blocked. Export a backup now.");}}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},2600);}
function money(n){n=Number(n)||0;return "$"+n.toFixed(2);}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function nowDT(){var d=new Date(),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function fmtD(s){if(!s)return "—";var p=s.split("-");return p.length===3?p[1]+"/"+p[2]+"/"+p[0]:s;}
function fmtDT(s){if(!s)return "—";var a=s.split("T");return fmtD(a[0])+(a[1]?" "+a[1]:"");}
function monthKey(s){return (s||"").slice(0,7);}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
/* sound */
var sndOn=true;try{sndOn=localStorage.getItem("lessonlane_snd")!=="0";}catch(e){}
function click(){if(!sndOn)return;try{var c=new (window.AudioContext||window.webkitAudioContext)();var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.start();o.stop(c.currentTime+.13);}catch(e){}}
function paintSnd(){var b=$("btn-sound");if(!b)return;b.querySelectorAll(".wv").forEach(function(p){p.style.display=sndOn?"":"none";});b.classList.toggle("on",sndOn);b.setAttribute("aria-pressed",sndOn?"true":"false");}
/* theme */
function paintTheme(){var dark=false;try{var v=localStorage.getItem("lessonlane_theme");dark=v==="dark"||(v===null&&window.matchMedia("(prefers-color-scheme: dark)").matches);}catch(e){}document.documentElement.setAttribute("data-theme",dark?"dark":"");var b=$("btn-theme");if(b){b.classList.toggle("on",dark);b.setAttribute("aria-pressed",dark?"true":"false");}}
/* sample data */
function sampleOn(){try{return !!localStorage.getItem(LST);}catch(e){return false;}}
function paintSample(){var b=$("btn-sample");if(b){b.classList.toggle("on",sampleOn());b.setAttribute("aria-pressed",sampleOn()?"true":"false");}}
function toggleSample(){click();
  if(!sampleOn()){
    try{localStorage.setItem(LSS,JSON.stringify(DB));localStorage.setItem(LST,"1");}catch(e){}
    DB=makeSample();save();toast("Sample data loaded — toggle off to restore yours.");
  }else{
    var snap=null;try{snap=JSON.parse(localStorage.getItem(LSS)||"null");}catch(e){}
    if(!snap||!Array.isArray(snap.students)||!Array.isArray(snap.sessions)||!Array.isArray(snap.invoices)||!Array.isArray(snap.payments)||!Array.isArray(snap.expenses)||!Array.isArray(snap.tutors)){toast("Sample snapshot missing — not touching data.");return;}
    DB=snap;save();
    try{localStorage.removeItem(LSS);localStorage.removeItem(LST);}catch(e){}
    toast("Your data restored.");
  }
  ui.editStudent=ui.editTutor=ui.editSession=null;ui.showSForm=ui.showTForm=false;render();
}
function makeSample(){
  var db=blankDB();
  var s1=uid(),s2=uid(),s3=uid(),t1=uid(),t2=uid();
  db.students=[
    {id:s1,name:"Maya Chen",parent:"Li Chen",phone:"555-0142",email:"li@example.com",subjects:"Algebra II, Geometry",rate:45,billFreq:"Monthly",notes:"Prefers Tue/Thu afternoons.",active:true},
    {id:s2,name:"Jordan Ellis",parent:"Sam Ellis",phone:"555-0119",email:"sam@example.com",subjects:"SAT Prep",rate:60,billFreq:"Per session",notes:"",active:true},
    {id:s3,name:"Priya Nair",parent:"Asha Nair",phone:"555-0177",email:"asha@example.com",subjects:"Chemistry",rate:50,billFreq:"Monthly",notes:"AP Chem focus.",active:true}
  ];
  db.tutors=[
    {id:t1,name:"Alex Rivera",phone:"555-0101",email:"alex@example.com",payRate:30,notes:"Math & science.",active:true},
    {id:t2,name:"Sam Whitfield",phone:"555-0102",email:"samw@example.com",payRate:28,notes:"Test prep.",active:true}
  ];
  function stuRate(id){var s=db.students.filter(function(x){return x.id===id;})[0];return s?s.rate:0;}
  function tutRate(id){var t=db.tutors.filter(function(x){return x.id===id;})[0];return t?t.payRate:null;}
  function sess(stu,tut,d,tm,dur,sub,st,notes){return {id:uid(),studentId:stu,tutorId:tut,date:d,time:tm,durationMin:dur,subject:sub,status:st,notes:notes||"",rateSnap:stuRate(stu),paySnap:tutRate(tut)};}
  db.sessions=[
    sess(s1,t1,"2026-10-01","15:30",60,"Algebra II","completed","Quadratic formula practice."),
    sess(s1,t1,"2026-10-06","15:30",60,"Algebra II","completed",""),
    sess(s1,t1,"2026-10-08","15:30",60,"Geometry","completed",""),
    sess(s2,t2,"2026-10-03","11:00",90,"SAT Prep","completed","Math section drill."),
    sess(s2,t2,"2026-10-10","11:00",90,"SAT Prep","no-show",""),
    sess(s3,t1,"2026-10-05","16:00",60,"Chemistry","completed","Stoichiometry."),
    sess(s3,t1,"2026-10-12","16:00",60,"Chemistry","scheduled",""),
    sess(s1,t1,"2026-10-13","15:30",60,"Algebra II","scheduled",""),
    sess(s2,t2,"2026-10-17","11:00",90,"SAT Prep","scheduled","")
  ];
  db.invSeq=1003;
  var inv1={id:uid(),number:"INV-1001",studentId:s1,date:"2026-10-06",dueDate:"2026-10-20",status:"paid",notes:"",lines:[
    {desc:"Algebra II — 10/01 (60 min)",qty:1,rate:45,amount:45},
    {desc:"Algebra II — 10/06 (60 min)",qty:1,rate:45,amount:45}]};
  var inv2={id:uid(),number:"INV-1002",studentId:s2,date:"2026-10-04",dueDate:"2026-10-18",status:"sent",notes:"",lines:[
    {desc:"SAT Prep — 10/03 (90 min)",qty:1.5,rate:60,amount:90}]};
  db.invoices=[inv1,inv2];
  db.payments=[{id:uid(),invoiceId:inv1.id,date:"2026-10-15",amount:90,method:"Venmo",notes:""}];
  db.expenses=[
    {id:uid(),date:"2026-10-02",category:"Materials",desc:"SAT prep workbooks",amount:32.50,notes:""},
    {id:uid(),date:"2026-10-09",category:"Software",desc:"Scheduling app sub",amount:12.00,notes:""}
  ];
  return db;
}
/* lookups */
function studentById(id){return DB.students.filter(function(s){return s.id===id;})[0]||null;}
function tutorById(id){return DB.tutors.filter(function(t){return t.id===id;})[0]||null;}
function invoiceById(id){return DB.invoices.filter(function(v){return v.id===id;})[0]||null;}
function invTotal(inv){return inv.lines.reduce(function(s,l){return s+Number(l.amount||0);},0);}
function invPaid(inv){return DB.payments.filter(function(p){return p.invoiceId===inv.id;}).reduce(function(s,p){return s+Number(p.amount||0);},0);}
function invBalance(inv){return Math.max(0,invTotal(inv)-invPaid(inv));}
function sessValue(s){var st=studentById(s.studentId);var r=(s.rateSnap!=null&&s.rateSnap!=="")?Number(s.rateSnap):(st?Number(st.rate):0);return Math.round(r*(Number(s.durationMin)/60)*100)/100;}
</script>
<script>
/* ===== views: dashboard, students, tutors ===== */
var TABS=[["dash","Dashboard"],["students","Students"],["sessions","Sessions"],["invoices","Invoices"],["tutors","Tutors"],["expenses","Expenses"],["charts","Charts"],["report","Reports"]];
function statusBadge(st){
  var m={scheduled:"info",completed:"ok",cancelled:"low","no-show":"warn",paid:"ok",sent:"info",overdue:"warn",draft:"low"};
  return '<span class="badge '+(m[st]||"info")+'">'+esc(st)+"</span>";
}
function viewDash(){
  var t=todayStr(),mk=monthKey(t);
  var upcoming=DB.sessions.filter(function(s){return s.status==="scheduled"&&s.date>=t;}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;}).slice(0,6);
  var mSess=DB.sessions.filter(function(s){return s.status==="completed"&&monthKey(s.date)===mk;});
  var mRev=mSess.reduce(function(s,x){return s+sessValue(x);},0);
  var mExp=DB.expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount);},0);
  var outstanding=DB.invoices.reduce(function(s,v){return s+invBalance(v);},0);
  var overdue=DB.invoices.filter(function(v){return invBalance(v)>0&&v.dueDate<t&&v.status!=="paid";}).length;
  var h='<div class="grid">';
  h+='<div class="stat"><div class="n">'+money(mRev)+'</div><div class="l">Revenue this month ($)</div></div>';
  h+='<div class="stat"><div class="n">'+mSess.length+'</div><div class="l">Sessions completed (mo)</div></div>';
  h+='<div class="stat'+(outstanding>0?" warn":"")+'"><div class="n">'+money(outstanding)+'</div><div class="l">Outstanding invoices</div></div>';
  h+='<div class="stat'+(overdue>0?" warn":"")+'"><div class="n">'+overdue+'</div><div class="l">Overdue invoices</div></div>';
  h+="</div>";
  h+='<div class="card"><h2>Upcoming sessions</h2>';
  if(!upcoming.length)h+='<p class="muted">Nothing scheduled. Add sessions on the Sessions tab.</p>';
  else{h+='<table><tr><th>Date</th><th>Time</th><th>Student</th><th>Subject</th><th>Tutor</th><th></th></tr>';
    upcoming.forEach(function(s){var st=studentById(s.studentId),tu=tutorById(s.tutorId);
      h+="<tr><td>"+fmtD(s.date)+"</td><td>"+esc(s.time)+"</td><td>"+esc(st?st.name:"?")+"</td><td>"+esc(s.subject)+"</td><td>"+esc(tu?tu.name:"—")+"</td>"+'<td><button class="btn sm" data-complete="'+s.id+'">Complete</button></td></tr>';});
    h+="</table>";}
  h+="</div>";
  var recent=DB.sessions.filter(function(s){return s.status==="completed";}).sort(function(a,b){return (b.date+b.time)<(a.date+a.time)?-1:1;}).slice(0,5);
  h+='<div class="card"><h2>Recent sessions</h2>';
  if(!recent.length)h+='<p class="muted">No completed sessions yet.</p>';
  else{h+='<table><tr><th>Date</th><th>Student</th><th>Subject</th><th>Value</th><th>Status</th></tr>';
    recent.forEach(function(s){var st=studentById(s.studentId);
      h+="<tr><td>"+fmtD(s.date)+"</td><td>"+esc(st?st.name:"?")+"</td><td>"+esc(s.subject)+"</td><td>"+money(sessValue(s))+"</td><td>"+statusBadge(s.status)+"</td></tr>";});
    h+="</table>";}
  h+="</div>";
  return h;
}
function studentForm(s){
  s=s||{name:"",parent:"",phone:"",email:"",subjects:"",rate:50,billFreq:"Monthly",notes:"",active:true};
  return '<div class="card"><h2>'+(s.id?"Edit student":"Add student")+'</h2><form class="add" id="form-student">'
  +'<label class="f">Name<input name="name" required maxlength="80" value="'+esc(s.name)+'"></label>'
  +'<label class="f">Parent/guardian<input name="parent" maxlength="80" value="'+esc(s.parent)+'"></label>'
  +'<label class="f">Phone<input name="phone" maxlength="30" value="'+esc(s.phone)+'"></label>'
  +'<label class="f">Email<input name="email" type="email" maxlength="80" value="'+esc(s.email)+'"></label>'
  +'<label class="f">Subjects<input name="subjects" maxlength="120" value="'+esc(s.subjects)+'" placeholder="Algebra, SAT Prep"></label>'
  +'<label class="f">Rate ($/hr)<input name="rate" type="number" min="0" step="0.01" required value="'+esc(s.rate)+'"></label>'
  +'<label class="f">Billing<select name="billFreq"><option'+(s.billFreq==="Monthly"?" selected":"")+'>Monthly</option><option'+(s.billFreq==="Per session"?" selected":"")+'>Per session</option><option'+(s.billFreq==="Package"?" selected":"")+'>Package</option></select></label>'
  +'<label class="f" style="grid-column:1/-1">Notes<textarea name="notes" rows="2" maxlength="400">'+esc(s.notes)+'</textarea></label>'
  +'<div><button class="btn" type="submit">'+(s.id?"Save":"Add student")+'</button> <button class="btn ghost" type="button" id="cancel-sform">Cancel</button></div></form></div>';
}
function viewStudents(){
  var h="";
  if(ui.showSForm||ui.editStudent)h+=studentForm(ui.editStudent?studentById(ui.editStudent):null);
  else h+='<p><button class="btn" id="add-student">+ Add student</button></p>';
  h+='<div class="card"><h2>Students ('+DB.students.length+')</h2>';
  if(!DB.students.length)h+='<p class="muted">No students yet.</p>';
  else{h+='<table><tr><th>Name</th><th>Subjects</th><th>Rate</th><th>Billing</th><th>Unbilled</th><th></th></tr>';
    DB.students.forEach(function(st){
      var unbilled=DB.sessions.filter(function(s){return s.studentId===st.id&&s.status==="completed"&&!s.invoiced;}).reduce(function(a,s){return a+sessValue(s);},0);
      h+="<tr><td><b>"+esc(st.name)+"</b>"+(st.active?"":' <span class="badge low">inactive</span>')+(st.parent?'<br><span class="muted small">'+esc(st.parent)+"</span>":"")+"</td>"
      +"<td>"+esc(st.subjects)+"</td><td>"+money(st.rate)+"/hr</td><td>"+esc(st.billFreq)+"</td><td>"+money(unbilled)+"</td>"
      +'<td style="white-space:nowrap"><button class="btn sm" data-edit-student="'+st.id+'">Edit</button> <button class="btn sm ghost" data-invoice-student="'+st.id+'">Invoice</button> <button class="btn sm ghost" data-toggle-student="'+st.id+'">'+(st.active?"Deactivate":"Activate")+'</button></td></tr>';
    });
    h+="</table>";}
  h+="</div>";
  return h;
}
function tutorForm(t){
  t=t||{name:"",phone:"",email:"",payRate:25,notes:"",active:true};
  return '<div class="card"><h2>'+(t.id?"Edit tutor":"Add tutor")+'</h2><form class="add" id="form-tutor">'
  +'<label class="f">Name<input name="name" required maxlength="80" value="'+esc(t.name)+'"></label>'
  +'<label class="f">Phone<input name="phone" maxlength="30" value="'+esc(t.phone)+'"></label>'
  +'<label class="f">Email<input name="email" type="email" maxlength="80" value="'+esc(t.email)+'"></label>'
  +'<label class="f">Pay rate ($/hr)<input name="payRate" type="number" min="0" step="0.01" required value="'+esc(t.payRate)+'"></label>'
  +'<label class="f" style="grid-column:1/-1">Notes<textarea name="notes" rows="2" maxlength="400">'+esc(t.notes)+'</textarea></label>'
  +'<div><button class="btn" type="submit">'+(t.id?"Save":"Add tutor")+'</button> <button class="btn ghost" type="button" id="cancel-tform">Cancel</button></div></form></div>';
}
function viewTutors(){
  var h="";
  if(ui.showTForm||ui.editTutor)h+=tutorForm(ui.editTutor?tutorById(ui.editTutor):null);
  else h+='<p><button class="btn" id="add-tutor">+ Add tutor</button> <span class="muted small">For multi-tutor businesses — payroll is computed from completed sessions.</span></p>';
  h+='<div class="card"><h2>Tutors ('+DB.tutors.length+')</h2>';
  if(!DB.tutors.length)h+='<p class="muted">No tutors yet. Solo? Add yourself as the tutor so payroll and scheduling work.</p>';
  else{h+='<table><tr><th>Name</th><th>Pay rate</th><th>Sessions (mo)</th><th>Pay owed (mo)</th><th></th></tr>';
    var mk=monthKey(todayStr());
    DB.tutors.forEach(function(t){
      var ms=DB.sessions.filter(function(s){return s.tutorId===t.id&&s.status==="completed"&&monthKey(s.date)===mk;});
      var owed=ms.reduce(function(a,s){var pr=(s.paySnap!=null&&s.paySnap!=="")?Number(s.paySnap):Number(t.payRate);return a+(Number(s.durationMin)/60)*pr;},0);
      h+="<tr><td><b>"+esc(t.name)+"</b>"+(t.active?"":' <span class="badge low">inactive</span>')+"</td><td>"+money(t.payRate)+"/hr</td><td>"+ms.length+"</td><td>"+money(owed)+"</td>"
      +'<td><button class="btn sm" data-edit-tutor="'+t.id+'">Edit</button> <button class="btn sm ghost" data-toggle-tutor="'+t.id+'">'+(t.active?"Deactivate":"Activate")+'</button></td></tr>';
    });
    h+="</table>";}
  h+="</div>";
  return h;
}
</script>
<script>
/* ===== views: sessions, invoices, payments ===== */
function sessionForm(s){
  s=s||{studentId:"",tutorId:"",date:todayStr(),time:"15:00",durationMin:60,subject:"",status:"scheduled",notes:"",recur:"none",recurCount:8};
  var stuOpts=DB.students.filter(function(x){return x.active;}).map(function(x){return '<option value="'+x.id+'"'+(x.id===s.studentId?" selected":"")+'>'+esc(x.name)+"</option>";}).join("");
  var tutOpts='<option value="">—</option>'+DB.tutors.filter(function(x){return x.active;}).map(function(x){return '<option value="'+x.id+'"'+(x.id===s.tutorId?" selected":"")+'>'+esc(x.name)+"</option>";}).join("");
  return '<div class="card"><h2>'+(s.id?"Edit session":"Schedule session")+'</h2><form class="add" id="form-session">'
  +'<label class="f">Student<select name="studentId" required>'+stuOpts+'</select></label>'
  +'<label class="f">Tutor<select name="tutorId">'+tutOpts+'</select></label>'
  +'<label class="f">Date<input name="date" type="date" required value="'+esc(s.date)+'"></label>'
  +'<label class="f">Time<input name="time" type="time" required value="'+esc(s.time)+'"></label>'
  +'<label class="f">Duration (min)<input name="durationMin" type="number" min="15" step="15" required value="'+esc(s.durationMin)+'"></label>'
  +'<label class="f">Subject<input name="subject" maxlength="60" value="'+esc(s.subject)+'"></label>'
  +'<label class="f">Status<select name="status"><option'+(s.status==="scheduled"?" selected":"")+'>scheduled</option><option'+(s.status==="completed"?" selected":"")+'>completed</option><option'+(s.status==="cancelled"?" selected":"")+'>cancelled</option><option'+(s.status==="no-show"?" selected":"")+'>no-show</option></select></label>'
  +(!s.id?'<label class="f">Repeat<select name="recur"><option value="none">One time</option><option value="weekly">Weekly</option></select></label><label class="f">Weeks<input name="recurCount" type="number" min="2" max="52" value="8"></label>':"")
  +'<label class="f" style="grid-column:1/-1">Session notes<textarea name="notes" rows="2" maxlength="400">'+esc(s.notes)+'</textarea></label>'
  +'<div><button class="btn" type="submit">'+(s.id?"Save":"Schedule")+'</button> <button class="btn ghost" type="button" id="cancel-sessform">Cancel</button></div></form></div>';
}
function viewSessions(){
  var h="";
  if(ui.showSessForm||ui.editSession)h+=sessionForm(ui.editSession?DB.sessions.filter(function(s){return s.id===ui.editSession;})[0]:null);
  else h+='<p><button class="btn" id="add-session">+ Schedule session</button></p>';
  var list=DB.sessions.slice().sort(function(a,b){return (b.date+b.time)<(a.date+a.time)?-1:1;});
  h+='<div class="card"><h2>Sessions ('+list.length+')</h2>';
  if(!list.length)h+='<p class="muted">No sessions yet.</p>';
  else{h+='<table><tr><th>Date</th><th>Student</th><th>Subject</th><th>Dur</th><th>Value</th><th>Status</th><th></th></tr>';
    list.slice(0,60).forEach(function(s){var st=studentById(s.studentId);
      h+="<tr><td>"+fmtD(s.date)+"<br><span class='muted small'>"+esc(s.time)+"</span></td><td>"+esc(st?st.name:"?")+"</td><td>"+esc(s.subject)+"</td><td>"+s.durationMin+"m</td><td>"+money(sessValue(s))+"</td><td>"+statusBadge(s.status)+"</td>"
      +'<td style="white-space:nowrap">'
      +(s.status==="scheduled"?'<button class="btn sm" data-complete="'+s.id+'">Complete</button> ':"")
      +'<button class="btn sm ghost" data-edit-session="'+s.id+'">Edit</button> '
      +'<button class="btn sm danger" data-del-session="'+s.id+'">Del</button></td></tr>';
    });
    if(list.length>60)h+='<p class="muted small">Showing 60 most recent of '+list.length+'.</p>';
    h+="</table>";}
  h+="</div>";
  return h;
}
function quickInvoice(studentId){
  var st=studentById(studentId);if(!st){toast("Student not found.");return;}
  var unbilled=DB.sessions.filter(function(s){return s.studentId===studentId&&s.status==="completed"&&!s.invoiced;});
  if(!unbilled.length){toast("No unbilled completed sessions for "+st.name+".");return;}
  var lines=unbilled.map(function(s){var q=Math.round((s.durationMin/60)*100)/100;var r=(s.rateSnap!=null&&s.rateSnap!=="")?Number(s.rateSnap):Number(st.rate);return {desc:(s.subject||"Session")+" — "+fmtD(s.date)+" ("+s.durationMin+" min)",qty:q,rate:r,amount:Math.round(q*r*100)/100};});
  var num="INV-"+(DB.invSeq++);
  var t=todayStr();
  var dd=new Date();dd.setDate(dd.getDate()+14);
  var due=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
  var inv={id:uid(),number:num,studentId:studentId,date:t,dueDate:due,lines:lines,status:"sent",notes:""};
  DB.invoices.push(inv);
  unbilled.forEach(function(s){s.invoiced=true;s.invId=inv.id;});
  save();click();toast("Invoice "+num+" created — "+money(invTotal(inv))+".");
  ui.tab="invoices";ui.viewInvoice=inv.id;render();
}
function invoiceDetail(inv){
  var st=studentById(inv.studentId);
  var bal=invBalance(inv);
  var h='<div class="card"><p><button class="btn ghost sm" id="back-invoices">← All invoices</button></p><h2>Invoice '+esc(inv.number)+'</h2>';
  h+="<p><b>"+esc(st?st.name:"?")+"</b>"+(st&&st.email?" · "+esc(st.email):"")+"<br>Date: "+fmtD(inv.date)+" · Due: "+fmtD(inv.dueDate)+" · "+statusBadge(bal<=0?"paid":inv.status)+"</p>";
  h+='<table><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>';
  inv.lines.forEach(function(l){h+="<tr><td>"+esc(l.desc)+"</td><td>"+l.qty+"</td><td>"+money(l.rate)+"</td><td>"+money(l.amount)+"</td></tr>";});
  h+='<tr><td colspan="3" style="text-align:right"><b>Total</b></td><td><b>'+money(invTotal(inv))+'</b></td></tr>';
  h+='<tr><td colspan="3" style="text-align:right">Paid</td><td>'+money(invPaid(inv))+'</td></tr>';
  h+='<tr><td colspan="3" style="text-align:right"><b>Balance</b></td><td><b>'+money(bal)+'</b></td></tr></table>';
  h+='<h3>Record payment</h3><form class="add" id="form-payment"><input type="hidden" name="invoiceId" value="'+inv.id+'">'
  +'<label class="f">Date<input name="date" type="date" required value="'+todayStr()+'"></label>'
  +'<label class="f">Amount<input name="amount" type="number" min="0.01" step="0.01" required value="'+bal.toFixed(2)+'"></label>'
  +'<label class="f">Method<select name="method"><option>Cash</option><option>Check</option><option>Venmo</option><option>Zelle</option><option>PayPal</option><option>Card</option><option>Other</option></select></label>'
  +'<div><button class="btn" type="submit">Record payment</button></div></form>';
  var pays=DB.payments.filter(function(p){return p.invoiceId===inv.id;});
  if(pays.length){h+="<h3>Payments</h3><table><tr><th>Date</th><th>Amount</th><th>Method</th><th></th></tr>";
    pays.forEach(function(p){h+="<tr><td>"+fmtD(p.date)+"</td><td>"+money(p.amount)+"</td><td>"+esc(p.method)+"</td>"+'<td><button class="btn sm danger" data-del-payment="'+p.id+'">Del</button></td></tr>';});
    h+="</table>";}
  h+='<p style="margin-top:10px"><button class="btn" id="print-invoice">Print invoice</button> '
  +'<button class="btn ghost" data-inv-status="'+inv.id+'">'+(inv.status==="paid"?"Mark unpaid":"Mark paid")+'</button> '
  +'<button class="btn danger" data-del-invoice="'+inv.id+'">Delete invoice</button></p>'
  +'<form class="add" id="form-duedate" style="margin-top:10px"><input type="hidden" name="invoiceId" value="'+inv.id+'">'
  +'<label class="f">Due date<input name="dueDate" type="date" value="'+esc(inv.dueDate)+'"></label>'
  +'<div><button class="btn ghost" type="submit">Update due date</button></div></form>';
  h+="</div>";
  return h;
}
function viewInvoices(){
  if(ui.viewInvoice){var inv=invoiceById(ui.viewInvoice);if(inv)return invoiceDetail(inv);ui.viewInvoice=null;}
  var h='<div class="card"><h2>Invoices ('+DB.invoices.length+')</h2>';
  h+='<p class="muted small">Invoices are built from completed sessions. Open a student and click "Invoice" to bill their unbilled sessions.</p>';
  if(!DB.invoices.length)h+='<p class="muted">No invoices yet.</p>';
  else{var t=todayStr();
    h+='<table><tr><th>#</th><th>Student</th><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>';
    DB.invoices.slice().sort(function(a,b){var na=parseInt(String(a.number).replace(/\D/g,""),10)||0,nb=parseInt(String(b.number).replace(/\D/g,""),10)||0;return nb-na;}).forEach(function(v){
      var st=studentById(v.studentId),bal=invBalance(v);
      var st2=bal<=0?"paid":(v.dueDate<t?"overdue":v.status);
      h+="<tr><td><b>"+esc(v.number)+"</b></td><td>"+esc(st?st.name:"?")+"</td><td>"+fmtD(v.date)+"</td><td>"+money(invTotal(v))+"</td><td>"+money(invPaid(v))+"</td><td>"+money(bal)+"</td><td>"+statusBadge(st2)+"</td>"
      +'<td><button class="btn sm" data-view-invoice="'+v.id+'">Open</button></td></tr>';
    });
    h+="</table>";}
  h+="</div>";
  return h;
}
</script>
<script>
/* ===== views: expenses, charts, reports, print, backup ===== */
function viewExpenses(){
  var h='<div class="card"><h2>Log expense</h2><form class="add" id="form-expense">'
  +'<label class="f">Date<input name="date" type="date" required value="'+todayStr()+'"></label>'
  +'<label class="f">Category<select name="category"><option>Materials</option><option>Software</option><option>Travel</option><option>Marketing</option><option>Rent</option><option>Other</option></select></label>'
  +'<label class="f">Description<input name="desc" required maxlength="120"></label>'
  +'<label class="f">Amount<input name="amount" type="number" min="0.01" step="0.01" required></label>'
  +'<div><button class="btn" type="submit">Add expense</button></div></form></div>';
  var list=DB.expenses.slice().sort(function(a,b){return b.date<a.date?-1:1;});
  var tot=list.reduce(function(s,e){return s+Number(e.amount);},0);
  h+='<div class="card"><h2>Expenses ('+list.length+') — total '+money(tot)+'</h2>';
  if(!list.length)h+='<p class="muted">No expenses logged.</p>';
  else{h+='<table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr>';
    list.forEach(function(e){h+="<tr><td>"+fmtD(e.date)+"</td><td>"+esc(e.category)+"</td><td>"+esc(e.desc)+"</td><td>"+money(e.amount)+"</td>"+'<td><button class="btn sm danger" data-del-expense="'+e.id+'">Del</button></td></tr>';});
    h+="</table>";}
  h+="</div>";
  return h;
}
/* --- charts --- */
function chartColors(){return [cssVar("--acc")||"#2a7f62","#c9a227","#7a5cc9","#b3541e","#4c9ab8","#c95a7a"];}
function donutSegPath(cx,cy,R,r,a0,a1){
  var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
  var xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
  var large=(a1-a0)>Math.PI?1:0,f=function(n){return n.toFixed(1);};
  return "M"+f(x0)+","+f(y0)+" A"+R+","+R+" 0 "+large+",1 "+f(x1)+","+f(y1)+" L"+f(xi1)+","+f(yi1)+" A"+r+","+r+" 0 "+large+",0 "+f(xi0)+","+f(yi0)+" Z";
}
function donutSVG(id,pairs,isMoney){
  if(isMoney===undefined)isMoney=true;
  var tot=pairs.reduce(function(s,p){return s+p.value;},0);
  var cx=90,cy=90,R=78,r=50,cols=chartColors();
  var h='<svg width="180" height="180" viewBox="0 0 180 180" role="img">';
  if(!tot){h+='<circle cx="90" cy="90" r="64" fill="none" stroke="'+cssVar("--line")+'" stroke-width="26"/><text x="90" y="96" text-anchor="middle" font-size="14" fill="'+cssVar("--mut")+'">No data</text></svg>';return h;}
  var a=-Math.PI/2,sel=ui.sel[id];
  pairs.forEach(function(p,i){
    var frac=p.value/tot,a1=a+frac*2*Math.PI;
    var isSel=sel===p.label,mid=(a+a1)/2,pull=isSel?8:0;
    var dx=(Math.cos(mid)*pull).toFixed(1),dy=(Math.sin(mid)*pull).toFixed(1);
    h+='<path d="'+donutSegPath(cx,cy,R,r,a,a1)+'" fill="'+cols[i%cols.length]+'" data-donut="'+id+'" data-k="'+esc(p.label)+'" style="cursor:pointer" transform="translate('+dx+' '+dy+')"'+(isSel?' stroke="'+cssVar("--ink")+'" stroke-width="2.5"':'')+'/>';
    a=a1;
  });
  var selP=sel?pairs.filter(function(p){return p.label===sel;})[0]:null;
  function fmtV(v){return isMoney?money(v):String(v);}
  h+='<text pointer-events="none" x="90" y="86" text-anchor="middle" font-size="16" font-weight="800" fill="'+cssVar("--ink")+'">'+(selP?fmtV(selP.value):fmtV(tot))+'</text>';
  h+='<text pointer-events="none" x="90" y="106" text-anchor="middle" font-size="12" fill="'+cssVar("--mut")+'">'+esc(selP?selP.label:"total")+'</text></svg>';
  return h;
}
function barsSVG(id,pairs){
  var W=340,H=220,padL=34,padB=44,padT=14;
  var cols=chartColors(),sel=ui.sel[id];
  var max=Math.max.apply(null,pairs.map(function(p){return p.value;}).concat([1]));
  var n=pairs.length,bw=Math.min(46,(W-padL-8)/Math.max(1,n)-8);
  var step=Math.ceil(n/7),showLbl=[],li;
  for(li=0;li<n;li+=step)showLbl.push(li);
  if(showLbl[showLbl.length-1]!==n-1&&n-1-showLbl[showLbl.length-1]>=2)showLbl.push(n-1);
  var h='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  h+='<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+W+'" y2="'+(H-padB)+'" stroke="'+cssVar("--line")+'"/>';
  pairs.forEach(function(p,i){
    var bh=(H-padB-padT)*(p.value/max);
    var x=padL+8+i*((W-padL-8)/n)+(((W-padL-8)/n)-bw)/2;
    var y=H-padB-bh,isSel=sel===p.label;
    h+='<rect class="bar" data-bar="'+id+'" data-k="'+esc(p.label)+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,bh).toFixed(1)+'" rx="4" fill="'+cols[i%cols.length]+'" style="cursor:pointer"'+(isSel?' stroke="'+cssVar("--ink")+'" stroke-width="3"':'')+'/>';
    h+='<text pointer-events="none" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="'+(isSel?14:12)+'" font-weight="'+(isSel?800:600)+'" fill="'+cssVar("--ink")+'">'+(p.value%1?p.value.toFixed(1):p.value)+'</text>';
    if(showLbl.indexOf(i)>=0){
      var lbl=p.label,isLast=i===n-1;
      var words=lbl.split(" "),l1=lbl,l2=null;
      if(lbl.length>10&&words.length>1){var mid=Math.ceil(words.length/2);l1=words.slice(0,mid).join(" ");l2=words.slice(mid).join(" ");}
      else if(lbl.length>12){l1=lbl.slice(0,12);l2=null;}
      var tx=isLast?W-2:(x+bw/2).toFixed(1),ta=isLast?"end":"middle";
      if(l2){h+='<text pointer-events="none" x="'+tx+'" y="'+(H-padB+14).toFixed(1)+'" text-anchor="'+ta+'" font-size="10.5" fill="'+cssVar("--mut")+'">'+esc(l1)+'</text>';
        h+='<text pointer-events="none" x="'+tx+'" y="'+(H-padB+26).toFixed(1)+'" text-anchor="'+ta+'" font-size="10.5" fill="'+cssVar("--mut")+'">'+esc(l2)+'</text>';}
      else{h+='<text pointer-events="none" x="'+tx+'" y="'+(H-padB+18).toFixed(1)+'" text-anchor="'+ta+'" font-size="11" fill="'+cssVar("--mut")+'">'+esc(l1)+'</text>';}
    }
  });
  h+='</svg>';
  return h;
}
function viewCharts(){
  var h='<div class="charts-grid">';
  var bySub={},byStat={},byMonth={};
  DB.sessions.forEach(function(s){
    if(s.status==="completed")bySub[s.subject||"Other"]=(bySub[s.subject||"Other"]||0)+sessValue(s);
    byStat[s.status]=(byStat[s.status]||0)+1;
    if(s.status==="completed"){var mk=monthKey(s.date);byMonth[mk]=(byMonth[mk]||0)+sessValue(s);}
  });
  var months=Object.keys(byMonth).sort().slice(-8);
  var MNAME=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function mkLabel(mk){var p=mk.split("-");return MNAME[Number(p[1])-1]+" ’"+p[0].slice(2);}
  h+='<div class="chart-card"><h3>Revenue by month</h3>'+barsSVG("revMonth",months.map(function(m){return {label:mkLabel(m),value:Math.round(byMonth[m]*100)/100};}))+'</div>';
  h+='<div class="chart-card"><h3>Revenue by subject</h3><div class="donut-wrap">'+donutSVG("revSub",Object.keys(bySub).map(function(k){return {label:k,value:Math.round(bySub[k]*100)/100};}))+'<div class="legend">'+Object.keys(bySub).map(function(k){return '<div data-donut="revSub" data-k="'+esc(k)+'" class="'+(ui.sel.revSub===k?"sel":"")+'">'+esc(k)+" — "+money(bySub[k])+"</div>";}).join("")+'</div></div></div>';
  h+='<div class="chart-card"><h3>Sessions by status</h3><div class="donut-wrap">'+donutSVG("sessStat",Object.keys(byStat).map(function(k){return {label:k,value:byStat[k]};}),false)+'<div class="legend">'+Object.keys(byStat).map(function(k){return '<div data-donut="sessStat" data-k="'+esc(k)+'" class="'+(ui.sel.sessStat===k?"sel":"")+'">'+esc(k)+" — "+byStat[k]+"</div>";}).join("")+'</div></div>';
  var byCat={};
  DB.expenses.forEach(function(e){byCat[e.category]=(byCat[e.category]||0)+Number(e.amount);});
  h+='<div class="chart-card"><h3>Expenses by category</h3>'+barsSVG("expCat",Object.keys(byCat).map(function(k){return {label:k,value:Math.round(byCat[k]*100)/100};}))+'</div>';
  h+='</div>';
  return h;
}
function viewReport(){
  var mk=monthKey(todayStr());
  var ms=DB.sessions.filter(function(s){return s.status==="completed"&&monthKey(s.date)===mk;});
  var rev=ms.reduce(function(s,x){return s+sessValue(x);},0);
  var exp=DB.expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount);},0);
  var h='<div class="card"><h2>Monthly report — '+mk+'</h2><div class="grid">'
  +'<div class="stat"><div class="n">'+money(rev)+'</div><div class="l">Revenue</div></div>'
  +'<div class="stat"><div class="n">'+money(exp)+'</div><div class="l">Expenses</div></div>'
  +'<div class="stat"><div class="n">'+money(rev-exp)+'</div><div class="l">Net</div></div>'
  +'<div class="stat"><div class="n">'+ms.length+'</div><div class="l">Sessions</div></div></div>';
  h+='<h3>Tutor payroll (completed sessions, this month)</h3><table><tr><th>Tutor</th><th>Hours</th><th>Rate</th><th>Owed</th></tr>';
  DB.tutors.forEach(function(t){
    var ts=ms.filter(function(s){return s.tutorId===t.id;});
    var hrs=ts.reduce(function(s,x){return s+Number(x.durationMin)/60;},0);
    var owed=ts.reduce(function(s,x){var pr=(x.paySnap!=null&&x.paySnap!=="")?Number(x.paySnap):Number(t.payRate);return s+(Number(x.durationMin)/60)*pr;},0);
    h+="<tr><td>"+esc(t.name)+"</td><td>"+hrs.toFixed(1)+"</td><td>"+money(t.payRate)+"/hr</td><td>"+money(owed)+"</td></tr>";
  });
  h+='</table><p style="margin-top:10px"><button class="btn" id="print-report">Print report</button> <button class="btn ghost" id="export-json">Export JSON</button> <button class="btn ghost" id="export-csv">Export CSV</button> <label class="btn ghost" style="cursor:pointer">Import JSON<input type="file" id="import-json" accept=".json" style="display:none"></label></p></div>';
  return h;
}
function printInvoice(inv){
  var st=studentById(inv.studentId);
  var h='<div class="inv-paper"><h2>Invoice '+esc(inv.number)+'</h2>'
  +"<p>Date: "+fmtD(inv.date)+"<br>Due: "+fmtD(inv.dueDate)+"<br>Bill to: <b>"+esc(st?st.name:"")+"</b>"+(st&&st.email?"<br>"+esc(st.email):"")+"</p>"
  +'<table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;border-bottom:2px solid #333">Description</th><th style="border-bottom:2px solid #333">Qty</th><th style="border-bottom:2px solid #333">Rate</th><th style="text-align:right;border-bottom:2px solid #333">Amount</th></tr>';
  inv.lines.forEach(function(l){h+="<tr><td style='border-bottom:1px solid #ddd;padding:6px'>"+esc(l.desc)+"</td><td style='border-bottom:1px solid #ddd'>"+l.qty+"</td><td style='border-bottom:1px solid #ddd'>"+money(l.rate)+"</td><td style='border-bottom:1px solid #ddd;text-align:right'>"+money(l.amount)+"</td></tr>";});
  h+="<tr><td colspan='3' style='text-align:right;padding:8px'><b>Total</b></td><td style='text-align:right'><b>"+money(invTotal(inv))+"</b></td></tr>";
  h+="<tr><td colspan='3' style='text-align:right'>Paid</td><td style='text-align:right'>"+money(invPaid(inv))+"</td></tr>";
  h+="<tr><td colspan='3' style='text-align:right'><b>Balance due</b></td><td style='text-align:right'><b>"+money(invBalance(inv))+"</b></td></tr></table>"
  +(inv.notes?"<p>"+esc(inv.notes)+"</p>":"")+"</div>";
  var w=window.open("","_blank");w.document.write("<html><head><title>Invoice "+esc(inv.number)+"</title></head><body style='font-family:sans-serif'>"+h+"</body></html>");w.document.close();w.focus();w.print();
}
function printReport(){
  var mk=monthKey(todayStr());
  var ms=DB.sessions.filter(function(s){return s.status==="completed"&&monthKey(s.date)===mk;});
  var rev=ms.reduce(function(s,x){return s+sessValue(x);},0);
  var exp=DB.expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount);},0);
  var h="<h2>LessonLane — Monthly report "+mk+"</h2><p>Sessions: "+ms.length+" · Revenue: "+money(rev)+" · Expenses: "+money(exp)+" · Net: "+money(rev-exp)+"</p>";
  h+="<table border='1' cellpadding='6' style='border-collapse:collapse'><tr><th>Date</th><th>Student</th><th>Subject</th><th>Tutor</th><th>Value</th></tr>";
  ms.sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(s){var st=studentById(s.studentId),tu=tutorById(s.tutorId);
    h+="<tr><td>"+fmtD(s.date)+"</td><td>"+esc(st?st.name:"?")+"</td><td>"+esc(s.subject)+"</td><td>"+esc(tu?tu.name:"—")+"</td><td>"+money(sessValue(s))+"</td></tr>";});
  h+="</table>";
  var w=window.open("","_blank");w.document.write("<html><head><title>Report "+mk+"</title></head><body style='font-family:sans-serif'>"+h+"</body></html>");w.document.close();w.focus();w.print();
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lessonlane-backup.json";a.click();
}
function exportCSV(){
  var rows=[["type","date","student","tutor","subject","status","duration_min","value","notes"]];
  DB.sessions.forEach(function(s){var st=studentById(s.studentId),tu=tutorById(s.tutorId);
    rows.push(["session",s.date,st?st.name:"",tu?tu.name:"",s.subject,s.status,s.durationMin,sessValue(s).toFixed(2),s.notes||""]);});
  DB.payments.forEach(function(p){var inv=invoiceById(p.invoiceId);
    rows.push(["payment",p.date,"","","","","",Number(p.amount).toFixed(2),(inv?inv.number+" ":"")+p.method]);});
  DB.expenses.forEach(function(e){rows.push(["expense",e.date,"","","","","",Number(e.amount).toFixed(2),e.category+": "+e.desc]);});
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var blob=new Blob([csv],{type:"text/csv"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lessonlane-export.csv";a.click();
}
function importJSON(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.students)||!Array.isArray(d.sessions)||!Array.isArray(d.invoices)||!Array.isArray(d.payments)||!Array.isArray(d.expenses)||!Array.isArray(d.tutors))throw 0;
      d.students.forEach(function(s){if(typeof s.name!=="string"||typeof s.rate==="undefined"||!s.id)throw 0;});
      d.tutors.forEach(function(t){if(typeof t.name!=="string"||typeof t.payRate==="undefined"||!t.id)throw 0;});
      d.sessions.forEach(function(s){if(!s.id||!s.studentId||!s.date||typeof s.durationMin==="undefined")throw 0;});
      d.invoices.forEach(function(v){if(!v.id||!v.number||!Array.isArray(v.lines)||!v.lines.length)throw 0;v.lines.forEach(function(l){if(typeof l.amount==="undefined"||typeof l.desc!=="string")throw 0;});});
      d.payments.forEach(function(p){if(!p.id||!p.invoiceId||typeof p.amount==="undefined")throw 0;});
      d.expenses.forEach(function(e){if(!e.id||!e.date||typeof e.amount==="undefined")throw 0;});
      d.sessions.forEach(function(s){if(s.rateSnap==="")s.rateSnap=null;if(s.paySnap==="")s.paySnap=null;});
      DB=d;if(typeof DB.invSeq!=="number")DB.invSeq=1;
      save();render();toast("Backup imported.");
    }catch(e){toast("Import failed — not a valid LessonLane backup.");}
  };
  r.readAsText(file);
}
</script>
<script>
/* ===== render, events, init ===== */
function renderTabs(){
  $("tabs").innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'" class="'+(ui.tab===t[0]?"active":"")+'">'+t[1]+"</button>";}).join("");
}
function render(){
  renderTabs();paintTheme();paintSnd();paintSample();
  var v=$("view"),h="";
  if(ui.tab==="dash")h=viewDash();
  else if(ui.tab==="students")h=viewStudents();
  else if(ui.tab==="sessions")h=viewSessions();
  else if(ui.tab==="invoices")h=viewInvoices();
  else if(ui.tab==="tutors")h=viewTutors();
  else if(ui.tab==="expenses")h=viewExpenses();
  else if(ui.tab==="charts")h=viewCharts();
  else h=viewReport();
  v.innerHTML=h;
  wire();
}
function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function wire(){
  qa("#tabs [data-tab]").forEach(function(b){b.addEventListener("click",function(){click();ui.tab=b.getAttribute("data-tab");ui.viewInvoice=null;render();});});
  qa("[data-complete]").forEach(function(b){b.addEventListener("click",function(){var s=DB.sessions.filter(function(x){return x.id===b.getAttribute("data-complete");})[0];if(s){s.status="completed";save();click();toast("Session completed.");render();}});});
  var as=$("add-student");if(as)as.addEventListener("click",function(){click();ui.showSForm=true;ui.editStudent=null;render();});
  var cs=$("cancel-sform");if(cs)cs.addEventListener("click",function(){click();ui.showSForm=false;ui.editStudent=null;render();});
  qa("[data-edit-student]").forEach(function(b){b.addEventListener("click",function(){click();ui.editStudent=b.getAttribute("data-edit-student");ui.showSForm=true;render();window.scrollTo(0,0);});});
  qa("[data-invoice-student]").forEach(function(b){b.addEventListener("click",function(){quickInvoice(b.getAttribute("data-invoice-student"));});});
  qa("[data-toggle-student]").forEach(function(b){b.addEventListener("click",function(){var s=studentById(b.getAttribute("data-toggle-student"));if(s){s.active=!s.active;save();click();toast(s.active?"Student activated.":"Student deactivated.");render();}});});
  qa("[data-toggle-tutor]").forEach(function(b){b.addEventListener("click",function(){var t=tutorById(b.getAttribute("data-toggle-tutor"));if(t){t.active=!t.active;save();click();toast(t.active?"Tutor activated.":"Tutor deactivated.");render();}});});
  var fs=$("form-student");if(fs)fs.addEventListener("submit",function(e){e.preventDefault();click();
    var f=new FormData(fs);
    var data={name:String(f.get("name")).trim(),parent:String(f.get("parent")).trim(),phone:String(f.get("phone")).trim(),email:String(f.get("email")).trim(),subjects:String(f.get("subjects")).trim(),rate:Number(f.get("rate")),billFreq:String(f.get("billFreq")),notes:String(f.get("notes")).trim(),active:true};
    if(!data.name||!(data.rate>=0)){toast("Name and a valid rate are required.");return;}
    if(ui.editStudent){var s=studentById(ui.editStudent);if(s)Object.keys(data).forEach(function(k){s[k]=data[k];});toast("Student saved.");}
    else{data.id=uid();DB.students.push(data);toast("Student added.");}
    save();ui.showSForm=false;ui.editStudent=null;render();});
  var at=$("add-tutor");if(at)at.addEventListener("click",function(){click();ui.showTForm=true;ui.editTutor=null;render();});
  var ct=$("cancel-tform");if(ct)ct.addEventListener("click",function(){click();ui.showTForm=false;ui.editTutor=null;render();});
  qa("[data-edit-tutor]").forEach(function(b){b.addEventListener("click",function(){click();ui.editTutor=b.getAttribute("data-edit-tutor");ui.showTForm=true;render();window.scrollTo(0,0);});});
  var ft=$("form-tutor");if(ft)ft.addEventListener("submit",function(e){e.preventDefault();click();
    var f=new FormData(ft);
    var data={name:String(f.get("name")).trim(),phone:String(f.get("phone")).trim(),email:String(f.get("email")).trim(),payRate:Number(f.get("payRate")),notes:String(f.get("notes")).trim(),active:true};
    if(!data.name||!(data.payRate>=0)){toast("Name and a valid pay rate are required.");return;}
    if(ui.editTutor){var t=tutorById(ui.editTutor);if(t)Object.keys(data).forEach(function(k){t[k]=data[k];});toast("Tutor saved.");}
    else{data.id=uid();DB.tutors.push(data);toast("Tutor added.");}
    save();ui.showTForm=false;ui.editTutor=null;render();});
  var as2=$("add-session");if(as2)as2.addEventListener("click",function(){click();ui.showSessForm=true;ui.editSession=null;render();});
  var cs2=$("cancel-sessform");if(cs2)cs2.addEventListener("click",function(){click();ui.showSessForm=false;ui.editSession=null;render();});
  qa("[data-edit-session]").forEach(function(b){b.addEventListener("click",function(){click();ui.editSession=b.getAttribute("data-edit-session");ui.showSessForm=true;render();window.scrollTo(0,0);});});
  qa("[data-del-session]").forEach(function(b){b.addEventListener("click",function(){if(!confirm("Delete this session?"))return;DB.sessions=DB.sessions.filter(function(x){return x.id!==b.getAttribute("data-del-session");});save();click();render();});});
  var fse=$("form-session");if(fse)fse.addEventListener("submit",function(e){e.preventDefault();click();
    var f=new FormData(fse);
    var base={studentId:String(f.get("studentId")),tutorId:String(f.get("tutorId"))||null,date:String(f.get("date")),time:String(f.get("time")),durationMin:Number(f.get("durationMin")),subject:String(f.get("subject")).trim(),status:String(f.get("status")),notes:String(f.get("notes")).trim()};
    if(!base.studentId||!base.date||!base.time||!(base.durationMin>0)){toast("Student, date, time and duration are required.");return;}
    var st=studentById(base.studentId);base.rateSnap=st?st.rate:0;
    var tu=base.tutorId?tutorById(base.tutorId):null;base.paySnap=tu?tu.payRate:null;
    if(ui.editSession){var s=DB.sessions.filter(function(x){return x.id===ui.editSession;})[0];if(s){Object.keys(base).forEach(function(k){if(k!=="rateSnap"&&k!=="paySnap")s[k]=base[k];});if(base.status!=="completed"&&s.invoiced){s.invoiced=false;s.invId=null;}}toast("Session saved.");}
    else{
      var recur=String(f.get("recur")||"none"),count=Math.min(52,Math.max(2,Number(f.get("recurCount"))||8));
      if(recur==="weekly"){
        var d0=new Date(base.date+"T12:00:00");
        for(var i=0;i<count;i++){var d=new Date(d0);d.setDate(d0.getDate()+i*7);
          var iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
          var cp=JSON.parse(JSON.stringify(base));cp.id=uid();cp.date=iso;cp.status="scheduled";DB.sessions.push(cp);}
        toast(count+" weekly sessions scheduled.");
      }else{base.id=uid();DB.sessions.push(base);toast("Session scheduled.");}
    }
    save();ui.showSessForm=false;ui.editSession=null;render();});
  qa("[data-view-invoice]").forEach(function(b){b.addEventListener("click",function(){click();ui.viewInvoice=b.getAttribute("data-view-invoice");render();});});
  var bi=$("back-invoices");if(bi)bi.addEventListener("click",function(){click();ui.viewInvoice=null;render();});
  var fp=$("form-payment");if(fp)fp.addEventListener("submit",function(e){e.preventDefault();click();
    var f=new FormData(fp);
    var inv=invoiceById(String(f.get("invoiceId")));if(!inv)return;
    var amt=Number(f.get("amount"));
    if(!(amt>0)){toast("Enter a valid amount.");return;}
    DB.payments.push({id:uid(),invoiceId:inv.id,date:String(f.get("date")),amount:amt,method:String(f.get("method")),notes:""});
    if(invBalance(inv)<=0)inv.status="paid";
    save();click();toast("Payment recorded.");render();});
  qa("[data-del-payment]").forEach(function(b){b.addEventListener("click",function(){if(!confirm("Delete this payment?"))return;var p=DB.payments.filter(function(x){return x.id===b.getAttribute("data-del-payment");})[0];DB.payments=DB.payments.filter(function(x){return x.id!==b.getAttribute("data-del-payment");});if(p){var inv=invoiceById(p.invoiceId);if(inv&&invBalance(inv)>0&&inv.status==="paid")inv.status="sent";}save();click();render();});});
  qa("[data-inv-status]").forEach(function(b){b.addEventListener("click",function(){var inv=invoiceById(b.getAttribute("data-inv-status"));if(inv){inv.status=inv.status==="paid"?"sent":"paid";save();click();render();}});});
  qa("[data-del-invoice]").forEach(function(b){b.addEventListener("click",function(){if(!confirm("Delete this invoice and its payments?"))return;var id=b.getAttribute("data-del-invoice");DB.invoices=DB.invoices.filter(function(x){return x.id!==id;});DB.payments=DB.payments.filter(function(p){return p.invoiceId!==id;});DB.sessions.forEach(function(s){if(s.invId===id){s.invoiced=false;s.invId=null;}});save();click();ui.viewInvoice=null;render();});});
  var fd=$("form-duedate");if(fd)fd.addEventListener("submit",function(e){e.preventDefault();click();
    var f=new FormData(fd);var inv=invoiceById(String(f.get("invoiceId")));if(!inv)return;
    var dd=String(f.get("dueDate"));if(!/^\d{4}-\d{2}-\d{2}$/.test(dd)){toast("Enter a valid due date.");return;}
    inv.dueDate=dd;save();click();toast("Due date updated.");render();});
  var pi=$("print-invoice");if(pi)pi.addEventListener("click",function(){var inv=invoiceById(ui.viewInvoice);if(inv)printInvoice(inv);});
  var fe=$("form-expense");if(fe)fe.addEventListener("submit",function(e){e.preventDefault();click();
    var f=new FormData(fe);
    var amt=Number(f.get("amount"));if(!(amt>0)){toast("Enter a valid amount.");return;}
    DB.expenses.push({id:uid(),date:String(f.get("date")),category:String(f.get("category")),desc:String(f.get("desc")).trim(),amount:amt,notes:""});
    save();click();toast("Expense added.");render();});
  qa("[data-del-expense]").forEach(function(b){b.addEventListener("click",function(){if(!confirm("Delete this expense?"))return;DB.expenses=DB.expenses.filter(function(x){return x.id!==b.getAttribute("data-del-expense");});save();click();render();});});
  /* chart interactions */
  qa("[data-donut]").forEach(function(el){el.addEventListener("click",function(){var id=el.getAttribute("data-donut"),k=el.getAttribute("data-k");ui.sel[id]=ui.sel[id]===k?null:k;click();render();});});
  qa("[data-bar]").forEach(function(el){el.addEventListener("click",function(){var id=el.getAttribute("data-bar"),k=el.getAttribute("data-k");ui.sel[id]=ui.sel[id]===k?null:k;click();render();});});
  var pr=$("print-report");if(pr)pr.addEventListener("click",function(){printReport();});
  var ej=$("export-json");if(ej)ej.addEventListener("click",function(){exportJSON();toast("Backup downloaded.");});
  var ec=$("export-csv");if(ec)ec.addEventListener("click",function(){exportCSV();toast("CSV downloaded.");});
  var ij=$("import-json");if(ij)ij.addEventListener("change",function(){if(ij.files[0])importJSON(ij.files[0]);ij.value="";});
}
$("btn-sample").addEventListener("click",toggleSample);
$("btn-theme").addEventListener("click",function(){click();try{var d=document.documentElement.getAttribute("data-theme")==="dark";localStorage.setItem("lessonlane_theme",d?"light":"dark");}catch(e){}paintTheme();});
$("btn-sound").addEventListener("click",function(){sndOn=!sndOn;try{localStorage.setItem("lessonlane_snd",sndOn?"1":"0");}catch(e){}paintSnd();click();});
load();render();
</script>
</body>
