<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuditReady — Compliance Self-Audit &amp; Document Generator</title>
<style>
/* ============ AuditReady styles — chunk 1: tokens, base, header, tabs ============ */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f5;
  --text:#1a2230; --muted:#5c6777; --border:#dde2ea;
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#e3eefe;
  --good:#18794e; --good-soft:#dcf2e5;
  --warn:#9a6b12; --warn-soft:#fdf0d3;
  --bad:#b3261e; --bad-soft:#fbe3e1;
  --banner-bg:#fff7df; --banner-border:#e8c547; --banner-text:#5f4a08;
  --shadow:0 1px 3px rgba(16,24,40,.10);
  --radius:12px;
}
[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface2:#1c2531;
  --text:#e9eef5; --muted:#9ba7b9; --border:#2b3646;
  --accent:#5b93ff; --accent-ink:#0b1220; --accent-soft:#1d2c4d;
  --good:#3fb970; --good-soft:#143325;
  --warn:#d9a13b; --warn-soft:#3a2f14;
  --bad:#f0706a; --bad-soft:#3d1d1b;
  --banner-bg:#2e260f; --banner-border:#8a6d1f; --banner-text:#f0d98a;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:26px;margin:0}
h2{font-size:22px;margin:0 0 12px}
h3{font-size:18px;margin:0 0 8px}
p{margin:0 0 10px}
small,.small{font-size:15px;color:var(--muted)}
a{color:var(--accent)}

/* ---- header: clean, no colored top bar ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:.2px}
.brand svg{flex:0 0 auto}
.topbar .spacer{flex:1}
.icon-btn{width:44px;height:44px;min-width:44px;border:1px solid var(--border);
  background:var(--surface2);border-radius:10px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.icon-btn svg{width:24px;height:24px}
.pill-btn{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface2);cursor:pointer;font-weight:700;font-size:16px;
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.pill-btn:hover{border-color:var(--accent)}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;padding:0 20px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:none;padding:14px 16px;font-size:16px;font-weight:600;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- layout ---- */
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.view{display:none}
.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){
  .topbar{flex-wrap:wrap;row-gap:8px;padding:10px 12px}
  .topbar .spacer{order:5;flex-basis:100%;height:0}
  #moreAppsBtn{order:6}#sampleBtn{order:7}#themeBtn{order:8}#soundBtn{order:9}#langBtn{order:10}
  .tabs{overflow-x:auto}
}

/* ---- disclaimer banner ---- */
.banner{background:var(--banner-bg);border:2px solid var(--banner-border);color:var(--banner-text);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;font-size:16px}
.banner strong{display:block;font-size:18px;margin-bottom:6px}
.banner .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
  padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---- segmented Yes/No/N-A ---- */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 18px;font-size:16px;font-weight:700;
  cursor:pointer;min-height:44px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on-yes{background:var(--good);color:#fff}
.seg button.on-no{background:var(--bad);color:#fff}
.seg button.on-na{background:var(--warn);color:#fff}

/* ---- audit questions ---- */
.section-head{display:flex;align-items:center;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
.section-score{margin-left:auto;font-weight:800;font-size:18px}
.q{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.q-top{display:flex;gap:12px;align-items:flex-start}
.q-text{flex:1;font-size:16px}
.q-weight{flex:0 0 auto;font-size:15px;font-weight:700;border-radius:999px;padding:4px 12px;
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.q-weight.w3{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.q-weight.w2{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.q-actions{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note-toggle{background:none;border:0;color:var(--accent);cursor:pointer;font-size:15px;font-weight:600;padding:8px 0}
.q-note{width:100%;margin-top:8px;display:none}
.q-note.open{display:block}
.q-note textarea{width:100%;min-height:70px;border:1px solid var(--border);border-radius:8px;
  padding:10px;background:var(--bg);font-size:16px;resize:vertical}
.q.answered{border-left:4px solid var(--good)}
.q.answered-no{border-left:4px solid var(--bad)}

/* ---- gauges ---- */
.gauge-card{text-align:center}
.gauge-num{font-size:36px;font-weight:800;line-height:1.1;margin-top:4px}
.gauge-label{font-size:16px;font-weight:700;margin-top:2px}
.gauge-sub{font-size:15px;color:var(--muted)}
.gauge-click{cursor:pointer}

/* ---- charts ---- */
.chart-card{position:relative}
.bar{cursor:pointer;transition:transform .15s ease}
.bar:hover{filter:brightness(1.06)}
.bar.selected{transform:translateY(-6px)}
.chart-tip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;margin-top:12px;font-size:16px;display:none}
.chart-tip.open{display:block}
.axis-label{font-size:15px;fill:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

/* ---- tables (logs) ---- */
table.log{width:100%;border-collapse:collapse;font-size:16px}
table.log th,table.log td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}
table.log th{background:var(--surface2);font-size:15px}
table.log tr:nth-child(even) td{background:var(--surface2)}
.status-pill{display:inline-block;padding:4px 14px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}
.status-open{background:var(--bad-soft);color:var(--bad)}
.status-done{background:var(--good-soft);color:var(--good)}
.status-progress{background:var(--warn-soft);color:var(--warn)}
.status-overdue{background:#fde8e8;color:#b42323}
[data-theme="dark"] .status-overdue{background:#4a1f1f;color:#ff9a9a}

/* ---- forms ---- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:16px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;
  padding:11px 12px;background:var(--bg);font-size:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.form-row{grid-template-columns:1fr}}

/* ---- checklists ---- */
.check-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--surface)}
.check-item input{width:24px;height:24px;margin-top:2px;flex:0 0 auto;cursor:pointer}
.check-item.done .check-text{text-decoration:line-through;color:var(--muted)}
.progress{height:14px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}

/* ---- track picker cards ---- */
.track-card{cursor:pointer;text-align:left}
.track-card:hover{border-color:var(--accent)}
.track-card h3{font-size:20px}
.track-badge{display:inline-block;font-size:15px;font-weight:700;border-radius:999px;
  padding:4px 14px;margin-bottom:8px}
.badge-osha{background:var(--bad-soft);color:var(--bad)}
.badge-fmcsa{background:var(--accent-soft);color:var(--accent)}
.badge-cottage{background:var(--good-soft);color:var(--good)}

/* ---- modal ---- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-back.open{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;
  max-height:90vh;overflow:auto;padding:24px}

/* ---- doc preview ---- */
.doc{background:#fff;color:#111;border:1px solid var(--border);border-radius:8px;padding:36px;margin-bottom:18px}
[data-theme="dark"] .doc{background:#fdfdfd;color:#111}
.doc h1{font-size:24px;margin-bottom:4px}
.doc h2{font-size:19px;margin:22px 0 8px;border-bottom:2px solid #1f6feb;padding-bottom:4px}
.doc h3{font-size:16px;margin:14px 0 6px}
.doc p,.doc li{font-size:15px}
.doc .doc-stamp{border:3px solid #b3261e;color:#b3261e;font-weight:800;text-align:center;
  padding:12px;border-radius:8px;margin:16px 0;font-size:16px}
.doc .sig-line{margin-top:40px;display:flex;gap:40px}
.doc .sig-line div{flex:1;border-top:1px solid #111;padding-top:6px;font-size:15px}

/* ---- print ---- */
#printRoot{display:none}
@media print{
  body>*{display:none !important}
  #printRoot{display:block !important}
  #printRoot .doc{border:0;border-radius:0;padding:0;margin:0;box-shadow:none}
}

/* ---- misc ---- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:12px 22px;border-radius:999px;
  font-size:16px;font-weight:600;z-index:200;display:none}
.toast.show{display:block}
.empty{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;color:var(--muted)}
.kbd-note{font-size:15px;color:var(--muted)}
.footer-note{padding:24px 20px;text-align:center;color:var(--muted);font-size:15px;border-top:1px solid var(--border)}
.hidden{display:none !important}
</style>
</head>

<body>
<!-- ============ chunk 2: header, tabs, view skeletons ============ -->
<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M17 2 L29 7 V15 C29 24 23 29.5 17 32 C11 29.5 5 24 5 15 V7 Z" fill="#1f6feb"/>
      <path d="M12 16.5 L15.5 20 L22.5 12.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>AuditReady</span>
  </div>
  <div class="spacer"></div>
  <a class="pill-btn" href="https://glenerds.gumroad.com" target="_blank" rel="noopener" id="moreAppsBtn">More Apps</a>
  <button class="icon-btn" id="sampleBtn" aria-pressed="false" title="Try sample data" aria-label="Toggle sample data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5.5L4.8 17a2.4 2.4 0 0 0 2.1 3.5h10.2a2.4 2.4 0 0 0 2.1-3.5L14 8.5V3"/><path d="M7.5 14h9"/></svg>
  </button>
  <button class="icon-btn" id="themeBtn" aria-pressed="false" title="Toggle dark mode" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Toggle sound" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.4 9.4 0 0 1 0 13"/></svg>
  </button>
  <button class="icon-btn" id="langBtn" aria-pressed="false" title="Switch language / Cambiar idioma" aria-label="Switch language: English / Español" style="font-weight:800;font-size:17px">ES</button>
</header>

<nav class="tabs" role="tablist" aria-label="Main sections">
  <button class="tab active" data-view="dashboard" role="tab">Dashboard</button>
  <button class="tab" data-view="audits" role="tab">Audits</button>
  <button class="tab" data-view="fleet" role="tab">Fleet</button>
  <button class="tab" data-view="documents" role="tab">Documents</button>
  <button class="tab" data-view="labels" role="tab">Labels</button>
  <button class="tab" data-view="logs" role="tab">Logs</button>
  <button class="tab" data-view="checklists" role="tab">Checklists</button>
  <button class="tab" data-view="settings" role="tab">Settings</button>
</nav>

<main class="wrap">
  <div id="disclaimerBanner" class="banner hidden">
    <div class="row">
      <div style="flex:1;min-width:260px" data-str="discBody"></div>
      <button class="btn secondary small" id="dismissDisclaimer" data-str="discOk"></button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <section class="view active" id="view-dashboard">
    <h2 style="margin-bottom:16px">Compliance Dashboard</h2>
    <div id="dashEmpty" class="empty hidden">
      <p style="font-size:18px;font-weight:700;color:var(--text)" data-str="deH"></p>
      <p data-str="deP"></p>
      <button class="btn" data-goto="audits" data-str="deBtn"></button>
    </div>
    <div id="dashContent">
      <div class="card hidden" id="renewalCard"><h3 id="renewalAlertsTitle">Renewal Alerts</h3><div id="renewalAlerts"></div></div>
      <div class="card hidden" id="nudgeCard"><h3 id="nudgeTitle">Smart Nudges</h3><div id="nudgePanel"></div></div>
      <div class="grid4" id="gaugeRow"></div>
      <div class="card chart-card">
        <h3 data-str="findings">Open Findings by Category</h3>
        <div class="field" style="max-width:340px">
          <label for="barTrackFilter" data-str="fltTrack"></label>
          <select id="barTrackFilter">
            <option value="all" data-str="fltAll"></option>
            <option value="osha">OSHA</option>
            <option value="fmcsa">FMCSA</option>
            <option value="cottage" data-str="fltCottage"></option>
          </select>
        </div>
        <div id="barChart"></div>
        <div class="chart-tip" id="barTip"></div>
      </div>
      <div class="grid2">
      <div class="card chart-card">
        <h3 data-str="trend"></h3>
        <div class="legend" id="trendLegend"></div>
        <div id="trendChart"></div>
        <div class="chart-tip" id="trendTip"></div>
      </div>
      <div class="card chart-card">
        <h3 data-str="incidents">Incidents per Month</h3>
        <div id="incChart"></div>
        <div class="chart-tip" id="incTip"></div>
      </div>
      </div>
    </div>
  </section>

  <!-- AUDITS -->
  <section class="view" id="view-audits">
    <h2 style="margin-bottom:4px" data-str="auditsH"></h2><p class="small dim" style="margin-bottom:16px" data-str="auditsSub"></p>
    <div id="auditPicker" class="grid3"></div>
    <div id="auditRunner" class="hidden"></div>
  </section>

  <!-- FLEET -->
  <section class="view" id="view-fleet">
    <h2 style="margin-bottom:16px" data-str="fleetH"></h2>
    <div id="fleetBody"></div>
  </section>

  <!-- LABELS -->
  <section class="view" id="view-labels">
    <h2 style="margin-bottom:16px" data-str="labelsH"></h2>
    <p class="small" style="margin-bottom:16px" data-str="labelsSub"></p>
    <div class="grid2">
      <div class="card">
        <h3>Label details</h3>
        <div class="field"><label for="lb-product">Product name</label><input id="lb-product" placeholder="Sourdough Loaf"></div>
        <div class="form-row">
          <div class="field"><label for="lb-biz">Business name</label><input id="lb-biz"></div>
          <div class="field"><label for="lb-addr">Business address</label><input id="lb-addr"></div>
        </div>
        <div class="field"><label for="lb-ing">Ingredients (one per line, in order by weight)</label><textarea id="lb-ing" style="min-height:90px" placeholder="Enriched wheat flour&#10;Water&#10;Salt"></textarea></div>
        <div class="field"><label>Allergens present (select all)</label><div id="lb-allergens" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div></div>
        <div class="form-row">
          <div class="field"><label for="lb-wt">Net weight — amount</label><input id="lb-wt" placeholder="16"></div>
          <div class="field"><label for="lb-unit">Net weight — unit</label><select id="lb-unit"><option>oz</option><option>lb</option><option>g</option><option>kg</option><option>ct</option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="lb-permit">Permit / license # (optional)</label><input id="lb-permit" placeholder="As required by your state"></div>
          <div class="field"><label for="lb-bestby">Best-by date (optional)</label><input type="date" id="lb-bestby"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="lb-preview">Preview label</button>
          <button class="btn secondary" id="lb-save">Save label</button>
        </div>
      </div>
      <div>
        <div class="card"><h3>Preview</h3><div id="labelPreview"><div class="empty">Fill in the details and preview your label.</div></div>
        <div style="margin-top:12px"><button class="btn secondary" id="lb-print" disabled>🖨 Print label</button></div></div>
        <div class="card"><h3>Saved labels</h3><div id="labelSaved"></div></div>
      </div>
    </div>
  </section>

  <!-- DOCUMENTS -->
  <section class="view" id="view-documents">
    <h2 style="margin-bottom:16px" data-str="docsH"></h2>
    <p class="small" style="margin-bottom:16px" data-str="docsSub"></p>
    <div class="grid3" id="docPicker"></div>
    <div id="docPreview"></div>
  </section>

  <!-- LOGS -->
  <section class="view" id="view-logs">
    <h2 style="margin-bottom:16px">Logs &amp; Corrective Actions</h2>
    <nav class="tabs" role="tablist" aria-label="Log types" style="padding:0;margin-bottom:18px">
      <button class="tab active" data-logtab="actions" role="tab">Corrective Actions</button>
      <button class="tab" data-logtab="injury" role="tab">Injury / Illness</button>
      <button class="tab" data-logtab="training" role="tab">Training</button>
      <button class="tab" data-logtab="dvir" role="tab">Vehicle Inspection</button>
      <button class="tab" data-logtab="sds" role="tab">Safety Data Sheets</button>
    </nav>
    <div id="log-actions"></div>
    <div id="log-injury" class="hidden"></div>
    <div id="log-training" class="hidden"></div>
    <div id="log-dvir" class="hidden"></div>
    <div id="log-sds" class="hidden"></div>
  </section>

  <!-- CHECKLISTS -->
  <section class="view" id="view-checklists">
    <h2 style="margin-bottom:4px" data-str="checkH"></h2><p class="small dim" style="margin-bottom:16px" data-str="checkSub"></p>
    <div id="checklistWrap"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="view-settings">
    <h2 style="margin-bottom:16px" data-str="settingsH"></h2>
    <div class="card">
      <h3 data-str="coProfile"></h3>
      <p class="small" style="margin-bottom:14px" data-str="coProfileSub"></p>
      <div class="form-row">
        <div class="field"><label for="pf-name" data-str="pfName"></label><input id="pf-name" placeholder="Acme Manufacturing LLC"></div>
        <div class="field"><label for="pf-contact" data-str="pfContact"></label><input id="pf-contact" placeholder="Jane Smith"></div>
      </div>

const $ = (s, r) => (r||document).querySelector(s);

  get(k, fb){ try { const v = localStorage.getItem("auditready."+k); return v==null ? fb : JSON.parse(v); } catch(e){ return fb; } },
  set(k, v){ try { localStorage.setItem("auditready."+k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem("auditready."+k); } catch(e){} }

      saveDone=()=>store.set("auditDone",auditDone);

/* ---------- sound: WebAudio oscillator, on by default, persists ---------- */
let audioCtx = null, soundOn = store.get("sound", true);
function beep(freq, dur, type){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||"sine"; o.frequency.value = freq||660;
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur||0.08));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (dur||0.08));
  }catch(e){}
}
const sndClick = () => beep(660, .07);
const sndOk    = () => { beep(523,.09); setTimeout(()=>beep(784,.12),90); };
const sndBad   = () => beep(220,.15,"triangle");

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const dark = t==="dark";
  $("#themeBtn").setAttribute("aria-pressed", dark?"true":"false");
  store.set("theme", t);
}
function initTheme(){
  const saved = store.get("theme", null);
  applyTheme(saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
}

/* ---------- toast + modal ---------- */
let toastTimer=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }
let modalOpener=null;
function openModal(html){ modalOpener=document.activeElement; $("#modalBox").innerHTML=html; $("#modalBack").classList.add("open");
  const f=$("#modalBox").querySelector("button, input, select, textarea, [tabindex]"); if(f) f.focus(); }
function closeModal(){ $("#modalBack").classList.remove("open"); if(modalOpener&&modalOpener.focus) try{modalOpener.focus();}catch(e){} modalOpener=null; }
$("#modalBack").addEventListener("click", e=>{ if(e.target.id==="modalBack") closeModal(); });
$("#modalBack").addEventListener("keydown", e=>{ if(e.key!=="Tab") return;
  const f=$$("#modalBox button, #modalBox input, #modalBox select, #modalBox textarea").filter(el=>!el.disabled);
  if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } });

/* ---------- navigation ---------- */
function goto(view){
  $$(".tab[data-view]").forEach(t=>t.classList.toggle("active", t.dataset.view===view));
  $$(".view").forEach(v=>v.classList.toggle("active", v.id==="view-"+view));
  if(view==="dashboard") renderDashboard();
  if(view==="audits") renderAuditPicker();
  if(view==="fleet") renderFleet();
  if(view==="documents") renderDocPicker();
  if(view==="labels") renderLabels();
  if(view==="logs") renderLogs();
  if(view==="checklists") renderChecklists();
  window.scrollTo(0,0);
}
$$(".tab[data-view]").forEach(t=>t.addEventListener("click",()=>{ sndClick(); goto(t.dataset.view); }));
document.addEventListener("click", e=>{ const g=e.target.closest("[data-goto]"); if(g){ sndClick(); goto(g.dataset.goto); } });

/* ---------- score color ---------- */
function scoreColor(s){ return s==null ? "var(--muted)" : s>=80 ? "var(--good)" : s>=60 ? "var(--warn)" : "var(--bad)"; }
function scoreWord(s){ return s==null ? D("Not audited","Sin auditar") : s>=80 ? D("Strong","Sólido") : s>=60 ? D("Needs work","Necesita trabajo") : D("At risk","En riesgo"); }

<script>

    '<circle cx="20" cy="20" r="15.9" fill="none" stroke="var(--border)" stroke-width="6"/>'+

}
function renderAuditPicker(){
  const w=$("#auditPicker");

    const tr=TRACKS[t], sc=trackScore(t);
    const done=auditDone[t];
    const rings=tr.sections.map(sec=>{
      let ans=0; sec.questions.forEach((q,i)=>{ if(getAnswer(t,sec.id,i)) ans++; });
      const frac=sec.questions.length?ans/sec.questions.length:0;
      const cap=esc(sectitle(t,sec).replace(/^.+?:\s*/,""));
      let short=cap.length>20?cap.slice(0,20).replace(/\s+\S*$/,"")+"\u2026":cap; if(!/[\s\-]/.test(short)&&short.length>11) short=short.slice(0,10)+"\u2026";
      return '<button class="iring" data-ring="'+t+'|'+sec.id+'" title="'+cap+' — '+ans+'/'+sec.questions.length+' answered" aria-label="'+cap+": "+ans+" of "+sec.questions.length+' answered">'+
        ringSVG(frac,scoreColor(frac*100))+'<span class="iring-pct">'+ans+'/'+sec.questions.length+'</span>'+
        '<span class="iring-cap">'+short+'</span></button>';
    }).join("");
    return '<div class="card track-card" data-track="'+t+'" role="button" tabindex="0" aria-label="'+esc(trackname(t))+' audit">'+
      '<span class="track-badge '+tr.badge+'">'+tr.short+'</span>'+

function completeAudit(t){
  const sc=trackScore(t);
  if(sc.score==null) return;
  // log history
  history.push({date:todayISO(),track:t,score:sc.score});
  saveHistory();
  auditDone[t]=todayISO(); saveDone();
  // snapshot "no" qids for repeat-finding heuristics
  auditRuns.push({date:todayISO(),track:t,score:sc.score,
    nos:Object.keys(answers[t]||{}).filter(k=>answers[t][k].a==="no")});
  saveRuns();

  const tr=TRACKS[t]; let created=0;
  tr.sections.forEach(sec=>sec.questions.forEach((q,i)=>{
    const a=getAnswer(t,sec.id,i);
    if(a&&a.a==="no"){
      const id=qid(t,sec.id,i);
      const dup=actions.some(x=>x.qid===id&&x.status!=="done");
      if(!dup){ actions.push({id:uid(),qid:id,track:t,section:sectitle(t,sec),question:qtext(t,sec.id,i,q),
        text:"Corrective action for: "+qtext(t,sec.id,i,q),due:dueISO(30),status:"open",created:todayISO(),assignee:""}); created++; }
    }
  }));
  saveActions();
  sndOk();
  toast((lang==="es"?"Auditoría completa: ":"Audit complete: ")+sc.score+"% — "+created+(lang==="es"?" acción(es) creada(s)":" action item(s) created"));
  closeAudit(); goto("dashboard");
}
</script>

<script>

/* ============ chunk 6: dashboard — gauges + charts ============ */

let selectedBar=null, selectedTrend=null;

$("#barTrackFilter").addEventListener("change",()=>{ sndClick(); selectedBar=null; renderBarChart(); });

function renderBarChart(){
  const f=$("#barTrackFilter").value;
  const cats={};
  actions.filter(a=>a.status!=="done"&&(f==="all"||a.track===f)).forEach(a=>{
    const k=a.track+"|"+a.section;

function renderTrend(){
  const box=$("#trendChart"), tip=$("#trendTip"), leg=$("#trendLegend");
  const h=[...history].sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  if(!h.length){ box.innerHTML='<div class="empty">No score history yet — it builds each time you complete an audit.</div>'; tip.classList.remove("open"); leg.innerHTML=""; return; }
  const dates=[...new Set(h.map(x=>x.date))];
  leg.innerHTML=Object.keys(TRACKS).map(t=>'<span><span class="dot" style="background:'+TRACK_COLORS[t]+'"></span>'+TRACKS[t].short+'</span>').join("");
  const W=640,H=300,padL=44,padB=44,padT=16,padR=16;
  const X=i=>padL+(dates.length===1? (W-padL-padR)/2 : i*(W-padL-padR)/(dates.length-1));
  const Y=s=>padT+(100-s)*(H-padT-padB)/100;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+D("Score history trend","Tendencia del historial de puntajes")+'">';
  for(let g=0;g<=100;g+=20){
    svg+='<line x1="'+padL+'" y1="'+Y(g)+'" x2="'+(W-padR)+'" y2="'+Y(g)+'" stroke="var(--border)" stroke-width="1"/>'+
         '<text x="'+(padL-8)+'" y="'+(Y(g)+5)+'" font-size="15" fill="var(--muted)" text-anchor="end">'+g+'</text>';
  }
  const step=Math.max(1,Math.ceil(dates.length/8));
  dates.forEach((d,i)=>{ if(i%step===0){ const xr=X(i), nearR=xr>=624;
    svg+='<text x="'+(nearR?636:xr)+'" y="'+(H-14)+'" font-size="15" fill="var(--muted)" text-anchor="'+(nearR?"end":"middle")+'">'+esc(d.slice(5))+'</text>'; } });
  Object.keys(TRACKS).forEach(t=>{
    const pts=dates.map((d,i)=>{ const e=h.find(x=>x.track===t&&x.date<=d); return e?{i,s:e.score,d:e.date}:null; });
    const valid=pts.map((p,pi)=>p?pi:-1).filter(x=>x>=0);
    if(!valid.length) return;
    let path="";
    valid.forEach((pi,k)=>{ path+=(k?"L":"M")+X(pi).toFixed(1)+" "+Y(pts[pi].s).toFixed(1)+" "; });
    svg+='<path d="'+path+'" fill="none" stroke="'+TRACK_COLORS[t]+'" stroke-width="3"/>';
    valid.forEach(pi=>{
      const p=pts[pi]; if(p.d!==dates[pi]) return; // step-line carry-forward: line only, no button
      const key=t+"|"+p.d+"|"+p.i;
      const sel=selectedTrend===key;
      svg+='<circle class="bar" data-key="'+key+'" cx="'+X(pi).toFixed(1)+'" cy="'+Y(p.s).toFixed(1)+'" r="'+(sel?10:6)+'" fill="'+TRACK_COLORS[t]+'" tabindex="0" role="button" aria-label="'+TRACKS[t].short+" "+p.s+"% on "+p.d+'"'+
        (sel?' style="stroke:var(--text);stroke-width:3"':"")+'/>';
    });
  });
  box.innerHTML=svg+"</svg>";
  $$("#trendChart circle").forEach(c=>{
    const act=()=>{ sndClick(); selectedTrend=selectedTrend===c.dataset.key?null:c.dataset.key; renderTrend(); };
    c.addEventListener("click",act);
    c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } });
  });
  if(selectedTrend){
    const [t,d]=selectedTrend.split("|");
    const e=[...h].reverse().find(x=>x.track===t&&x.date===d);
    if(e){ tip.innerHTML="<strong>"+esc(TRACKS[t].name)+"</strong> — "+e.score+"% ("+scoreWord(e.score)+") on "+fmtDate(e.date); tip.classList.add("open"); }
    else { tip.classList.remove("open"); selectedTrend=null; }
  } else tip.classList.remove("open");
}
</script>

<script>

function renderLogs(){ renderActions(); renderInjury(); renderTraining(); renderDvir(); renderSds(); }

/* ---- corrective actions ---- */
function statusPill(s){ const k=s==="done"?"done":s==="progress"?"progress":s==="overdue"?"overdue":"open";
  const tx=s==="done"?D("Done","Hecho"):s==="progress"?D("In progress","En curso"):s==="overdue"?D("Overdue","Vencido"):D("Open","Abierto");
  return '<span class="status-pill status-'+k+'">'+tx+"</span>"; }
function actionStatus(a){
  if(a.status==="done") return "done";
  if(a.due&&daysUntil(a.due)<0) return "overdue";
  return a.status==="progress"?"progress":"open";
}
const ACTION_SEGS=[
  {k:"open",label:()=>D("Open","Abierto"),color:"#4d8dff"},
  {k:"progress",label:()=>D("In progress","En curso"),color:"#d9930d"},
  {k:"overdue",label:()=>D("Overdue","Vencido"),color:"#d64545"},
  {k:"done",label:()=>D("Closed","Cerrado"),color:"#2f9e5f"}
];
let actionFilter=null, actionSel=null;
function renderActions(){
  const w=$("#log-actions");
  const buckets={open:0,progress:0,overdue:0,done:0};
  actions.forEach(a=>buckets[actionStatus(a)]++);
  const total=actions.length;
  const openCt=actions.filter(a=>actionStatus(a)!=="done").length;
  // donut arcs
  const R=88, CX=115, CY=115, C=2*Math.PI*R;
  let acc=0, arcs="";
  ACTION_SEGS.forEach(sg=>{
    const frac=total?buckets[sg.k]/total:0;
    const a0=acc*360-90, a1=(acc+frac)*360-90; acc+=frac;
    if(frac<=0) return;
    const x0=(CX+R*Math.cos(a0*Math.PI/180)).toFixed(1), y0=(CY+Math.sin(a0*Math.PI/180)*R).toFixed(1);
    const x1=(CX+R*Math.cos(a1*Math.PI/180)).toFixed(1), y1=(CY+Math.sin(a1*Math.PI/180)*R).toFixed(1);
    const large=(a1-a0)>180?1:0;
    const mid=((a0+a1)/2)*Math.PI/180;
    const sel=actionSel===sg.k;
    const ox=sel?Math.cos(mid)*10:0, oy=sel?Math.sin(mid)*10:0;
    arcs+='<path d="M '+x0+' '+y0+' A '+R+' '+R+' 0 '+large+' 1 '+x1+' '+y1+'" fill="none" stroke="'+sg.color+'" stroke-width="26"'+

      :'<div class="empty">'+D("No actions with this status.","Sin acciones con este estado.")+'</div>')
      :'<div class="empty">'+D('No corrective actions. They are created automatically when you complete an audit with "No" answers.','Sin acciones correctivas. Se crean automáticamente cuando completas una auditoría con respuestas "No".')+'</div>')+"</div>";

    '<div class="field"><label>'+D("Due date","Fecha límite")+'</label><input type="date" id="m-due" value="'+dueISO(30)+'"></div></div>'+
    '<div style="display:flex;gap:10px"><button class="btn" id="m-save">'+D("Save","Guardar")+'</button><button class="btn secondary" id="m-cancel">'+D("Cancel","Cancelar")+'</button></div>');
    $("#m-cancel").addEventListener("click",closeModal);
    $("#m-save").addEventListener("click",()=>{ const t=$("#m-text").value.trim(); if(!t){toast(D("Describe the action","Describe la acción"));return;}
      actions.push({id:uid(),qid:null,track:$("#m-track").value,section:"Manual entry",question:t,text:t,due:$("#m-due").value||dueISO(30),status:"open",created:todayISO(),assignee:""});
      saveActions(); closeModal(); sndOk(); renderActions(); });
  });
  const cf=$("#clearActFilter");
  if(cf) cf.addEventListener("click",()=>{ sndClick(); actionFilter=null; actionSel=null; renderActions(); });
  const pick=k=>{ sndClick(); actionFilter=actionFilter===k?null:k; actionSel=actionFilter; renderActions(); };
  w.querySelectorAll(".aseg").forEach(p=>{ p.addEventListener("click",()=>pick(p.dataset.seg));
    p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(p.dataset.seg); } }); });
  w.querySelectorAll(".donut-leg").forEach(b=>b.addEventListener("click",()=>pick(b.dataset.leg)));
  $$("#log-actions [data-act]").forEach(b=>b.addEventListener("click",()=>{
    sndClick(); const a=actions.find(x=>x.id===b.dataset.id); if(!a) return;
    if(b.dataset.act==="del"){ if(confirm(D("Delete this action?","¿Eliminar esta acción?"))){ actions=actions.filter(x=>x.id!==a.id); saveActions(); renderActions(); } }
    else if(b.dataset.act==="cycle"){ a.status=a.status==="open"?"progress":a.status==="progress"?"done":"open"; saveActions(); sndOk(); renderActions(); }
    else if(b.dataset.act==="assign"){ const v=prompt(lang==="es"?"Responsable:":"Assignee (name):",a.assignee||""); if(v!=null){ a.assignee=v.trim(); saveActions(); sndOk(); renderActions(); } }
    else if(b.dataset.act==="due"){ const d=prompt(D("Due date (YYYY-MM-DD):","Fecha límite (AAAA-MM-DD):"),a.due); if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){ a.due=d; saveActions(); renderActions(); } }
  }));
}

/* ---- training log ---- */
const REQUIRED_TRAININGS=["HazCom","PPE","Forklift","First Aid","Food Safety"];
let hmSel=null;
function trainingStatus(date){
  if(!date) return "miss";
  const days=daysUntil(date)+365; // days until expiry (1-yr validity)
  if(days<0) return "ovd";
  if(days<=60) return "exp";
  return "cur";
}
function renderHeatmap(){
  const topics=[...new Set([...REQUIRED_TRAININGS, ...trainingMatrix.map(r=>r.topic)])];
  const emps=[...new Set(trainingMatrix.map(r=>r.emp))].sort();
  let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px">'+
    '<h3 style="margin:0">Training Matrix — current / expiring / expired</h3>'+
    '<button class="btn small" id="addEmpBtn">＋ Employee</button></div>'+
    '<p class="small" style="margin-bottom:8px">Click a cell to log or update training for that employee and topic.</p>';
  if(!emps.length){
    h+='<div class="empty">No employees yet. Add an employee, then click a cell to log their training.</div>';
  } else {
    h+='<div class="hm-scroll"><table class="hm"><tr><th></th>'+topics.map(t=>"<th>"+esc(t)+"</th>").join("")+"</tr>";
    emps.forEach(emp=>{
      h+="<tr><td class='emp'>"+esc(emp)+"</td>";
      topics.forEach(topic=>{
        const rec=trainingMatrix.find(r=>r.emp===emp&&r.topic===topic);
        const st=trainingStatus(rec?rec.date:null);
        const key=emp+"|"+topic, sel=hmSel===key;
        const lbl=st==="cur"?"Current":st==="exp"?"Expiring":st==="ovd"?"Expired":"Missing";
        const sub=rec?fmtD(rec.date):"—";
        h+="<td><button class='hm-cell "+st+(sel?" selected":"")+"' data-hm='"+esc(key)+"' title='"+esc(emp+" — "+topic+": "+lbl+(rec?" ("+fmtD(rec.date)+")":""))+"' aria-label='"+esc(emp+", "+topic+", "+lbl)+"'>"+lbl+"<small>"+sub+"</small></button></td>";
      });
      h+="</tr>";
    });
    h+="</table></div>";
    h+='<div class="hm-legend"><span><i style="background:#2f9e5f"></i>Current</span>'+
      '<span><i style="background:#d9930d"></i>Expiring ≤60d</span>'+
      '<span><i style="background:#d64545"></i>Expired</span>'+
      '<span><i style="background:#9aa1ab"></i>Missing</span></div>';
  }
  if(hmSel){
    const [semp,stop]=hmSel.split("|");
    const srec=trainingMatrix.find(r=>r.emp===semp&&r.topic===stop);
    const sst=trainingStatus(srec?srec.date:null);
    const slbl=sst==="cur"?"Current":sst==="exp"?"Expiring soon":sst==="ovd"?"Expired":"Missing";
    h+='<div class="filter-note" style="margin-top:10px"><span><b>'+esc(semp)+'</b> — '+esc(stop)+': <b>'+slbl+'</b>'+(srec?" ("+fmtD(srec.date)+(srec.trainer?", "+esc(srec.trainer):"")+")":"")+'</span>'+
      '<button class="btn small" id="hmUpdate">Log / update training</button>'+
      '<button class="btn secondary small" id="hmClear">Release</button></div>';
  }
  h+="</div>";
  return h;
}
function logTrainingFor(emp,topic){
  const rec=trainingMatrix.find(r=>r.emp===emp&&r.topic===topic);
  openModal('<h3>Log training</h3><p class="small" style="margin-bottom:10px">'+esc(emp)+" — "+esc(topic)+'</p>'+
    '<div class="form-row"><div class="field"><label>Date completed</label><input type="date" id="m-date" value="'+(rec?rec.date:todayISO())+'"></div>'+
    '<div class="field"><label>Trainer</label><input id="m-trainer" value="'+esc(rec&&rec.trainer?rec.trainer:"")+'"></div></div>'+
    '<div style="display:flex;gap:10px"><button class="btn" id="m-save">Save</button><button class="btn secondary" id="m-cancel">Cancel</button></div>');
  $("#m-cancel").addEventListener("click",closeModal);
  $("#m-save").addEventListener("click",()=>{
    const d=$("#m-date").value||todayISO(), tr=$("#m-trainer").value.trim();
    if(rec){ rec.date=d; rec.trainer=tr; } else trainingMatrix.push({id:uid(),emp,topic,date:d,trainer:tr});
    saveMatrix(); closeModal(); sndOk(); renderTraining(); toast(D("Training recorded","Capacitación registrada"));
  });
}
function renderTraining(){
  const rows=logs.training.map((e,i)=>"<tr><td>"+fmtDate(e.date)+"</td><td>"+esc(e.topic)+"</td><td>"+esc(e.trainer)+"</td><td>"+esc(e.att)+"</td><td>"+esc(e.dur)+"</td>"+

    (logs.training.length?'<div style="overflow-x:auto"><table class="log"><tr><th>'+D("Date","Fecha")+'</th><th>'+D("Topic","Tema")+'</th><th>'+D("Trainer","Capacitador")+'</th><th>'+D("Attendees","Asistentes")+'</th><th>'+D("Duration","Duración")+'</th><th></th></tr>'+rows+"</table></div>"
    :'<div class="empty">'+D("No training sessions logged.","Sin sesiones de capacitación registradas.")+'</div>')+"</div>";
  $("#addEmpBtn").addEventListener("click",()=>{ sndClick();
    openModal('<h3>'+D("Add employee","Agregar empleado")+'</h3><div class="field"><label>'+D("Name","Nombre")+'</label><input id="m-emp"></div>'+
      '<div style="display:flex;gap:10px"><button class="btn" id="m-save">'+D("Save","Guardar")+'</button><button class="btn secondary" id="m-cancel">'+D("Cancel","Cancelar")+'</button></div>');
    $("#m-cancel").addEventListener("click",closeModal);
    $("#m-save").addEventListener("click",()=>{ const n=$("#m-emp").value.trim(); if(!n){toast(D("Enter a name","Ingrese un nombre"));return;}
      if(!trainingMatrix.some(r=>r.emp===n)) trainingMatrix.push({id:uid(),emp:n,topic:REQUIRED_TRAININGS[0],date:"",trainer:""});
      saveMatrix(); closeModal(); sndOk(); renderTraining(); });
  });
  $$("#log-training .hm-cell").forEach(c=>c.addEventListener("click",()=>{
    sndClick(); const key=c.dataset.hm; hmSel=hmSel===key?null:key; renderTraining();
  }));
  const hu=$("#hmUpdate");
  if(hu) hu.addEventListener("click",()=>{ const [emp,topic]=hmSel.split("|"); logTrainingFor(emp,topic); });
  const hc=$("#hmClear");
  if(hc) hc.addEventListener("click",()=>{ sndClick(); hmSel=null; renderTraining(); });
  $("#addTraining").addEventListener("click",()=>{ sndClick(); openModal(
    '<h3>Log training session</h3><div class="form-row"><div class="field"><label>Date</label><input type="date" id="m-date" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>Topic</label><input id="m-topic"></div></div>'+
    '<div class="form-row"><div class="field"><label>Trainer</label><input id="m-trainer"></div>'+
    '<div class="field"><label>Attendees</label><input id="m-att" placeholder="Names or count"></div></div>'+
    '<div class="field"><label>Duration</label><input id="m-dur" placeholder="e.g. 1 hour"></div>'+
    '<div style="display:flex;gap:10px"><button class="btn" id="m-save">Save</button><button class="btn secondary" id="m-cancel">Cancel</button></div>');
    $("#m-cancel").addEventListener("click",closeModal);
    $("#m-save").addEventListener("click",()=>{ logs.training.push({date:$("#m-date").value||todayISO(),topic:$("#m-topic").value,trainer:$("#m-trainer").value,att:$("#m-att").value,dur:$("#m-dur").value});
      saveLogs(); closeModal(); sndOk(); renderTraining(); });
  });
  $$("#log-training [data-i]").forEach(b=>b.addEventListener("click",()=>{ if(confirm(D("Delete this entry?","¿Eliminar este registro?"))){ logs.training.splice(+b.dataset.i,1); saveLogs(); renderTraining(); } }));
}

<script>
"use strict";
/* ============ chunk G: Fleet view — drivers/vehicles/locations CRUD + renewals + expiration timeline ============ */
function daysUntil(d){
  const t=new Date(); t.setHours(0,0,0,0);
  const x=new Date(d+"T00:00:00"); x.setHours(0,0,0,0);
  return Math.round((x-t)/86400000);
}
function fmtD(d){ if(!d) return "—"; const [y,m,dd]=d.split("-"); return m+"/"+dd+"/"+y; }
const saneDate=v=>{ if(!v) return true; const y=parseInt(v.slice(0,4),10); const cy=new Date().getFullYear(); return y>=1900&&y<=cy+1; };
const badDateMsg=()=>D("Please enter a realistic date (1900\u2013"+(new Date().getFullYear()+1)+")","Ingrese una fecha realista (1900\u2013"+(new Date().getFullYear()+1)+")");
const rItem=k=>({cdl:"CDL",med:D("Medical","M\u00e9dica"),mvr:"MVR",reg:D("Registration","Registro"),ins:D("Insurance","Seguro"),permit:D("Permit","Permiso")}[k]||k);
function renewClass(days){
  if(days<0) return "od"; if(days<=7) return "u7"; if(days<=30) return "u30"; if(days<=60) return "u60"; return "ok";
}
function renewColor(days){
  if(days<0) return "#d64545"; if(days<=7) return "#d64545"; if(days<=30) return "#e07b1f"; if(days<=60) return "#e8b71a"; return "#2f9e5f";
}
function renewLabel(days){
  if(days<0) return lang==="es"?"Vencido hace "+(-days)+" días":"Overdue by "+(-days)+" days";
  if(days===0) return lang==="es"?"Vence hoy":"Due today";
  if(days<=60) return lang==="es"?"Vence en "+days+" d":"Due in "+days+"d";
  return fmtD(null)||"";
}
function openFleetModal(kind,id){
  const isD=kind==="driver", isV=kind==="vehicle";
  const rec=id? (isD?drivers.find(x=>x.id===id):isV?vehicles.find(x=>x.id===id):locations.find(x=>x.id===id))
    : (isD?{id:uid(),name:"",cdlExp:"",medExp:"",mvrExp:"",notes:""}
       :isV?{id:uid(),unit:"",regExp:"",insExp:"",notes:""}
       :{id:uid(),name:"",address:"",permitExp:"",notes:""});
  const title=(id?(lang==="es"?"Editar ":"Edit "):(lang==="es"?"Añadir ":"Add "))+
    (isD?(lang==="es"?"conductor":"driver"):isV?(lang==="es"?"vehículo":"vehicle"):(lang==="es"?"ubicación":"location"));
  const L={name:lang==="es"?"Nombre":"Name",unit:lang==="es"?"Unidad":"Unit",address:lang==="es"?"Dirección":"Address",
    cdl:lang==="es"?"Venc. CDL":"CDL exp.",med:lang==="es"?"Venc. tarjeta médica":"Medical card exp.",
    mvr:lang==="es"?"Venc. MVR":"MVR exp.",reg:lang==="es"?"Venc. registro":"Registration exp.",
    ins:lang==="es"?"Venc. seguro":"Insurance exp.",permit:lang==="es"?"Venc. permiso":"Permit exp.",
    notes:lang==="es"?"Notas":"Notes",save:lang==="es"?"Guardar":"Save",cancel:lang==="es"?"Cancelar":"Cancel"};
  let fields;
  if(isD) fields=`<label>${L.name}<input id="fm-name" value="${esc(rec.name)}" required></label>
    <div class="f3"><label>${L.cdl}<input type="date" id="fm-d1" value="${esc(rec.cdlExp||"")}"></label>
    <label>${L.med}<input type="date" id="fm-d2" value="${esc(rec.medExp||"")}"></label>
    <label>${L.mvr}<input type="date" id="fm-d3" value="${esc(rec.mvrExp||"")}"></label></div>`;
  else if(isV) fields=`<label>${L.unit}<input id="fm-name" value="${esc(rec.unit)}" required></label>
    <div class="f3"><label>${L.reg}<input type="date" id="fm-d1" value="${esc(rec.regExp||"")}"></label>
    <label>${L.ins}<input type="date" id="fm-d2" value="${esc(rec.insExp||"")}"></label></div>`;
  else fields=`<label>${L.name}<input id="fm-name" value="${esc(rec.name)}" required></label>
    <label>${L.address}<input id="fm-addr" value="${esc(rec.address||"")}"></label>
    <label>${L.permit}<input type="date" id="fm-d1" value="${esc(rec.permitExp||"")}"></label>`;
  openModal('<h3>'+esc(title)+'</h3>'+fields+`<label>${L.notes}<textarea id="fm-notes" rows="2">${esc(rec.notes||"")}</textarea></label>
    <div class="modal-actions"><button class="btn" id="fmSave">${L.save}</button>
    <button class="btn secondary" id="fmCancel">${L.cancel}</button></div>`);
  $("#fmCancel").addEventListener("click",closeModal);
  $("#fmSave").addEventListener("click",()=>{
    const name=$("#fm-name").value.trim(); if(!name){toast(lang==="es"?"Nombre requerido":"Name required");return;}
    const notes=$("#fm-notes").value.trim();
    if(isD){ const d={id:rec.id,name,cdlExp:$("#fm-d1").value,medExp:$("#fm-d2").value,mvrExp:$("#fm-d3").value,notes};
      const i=drivers.findIndex(x=>x.id===rec.id); i>=0?drivers[i]=d:drivers.push(d); saveDrivers(); }
    else if(isV){ const v={id:rec.id,unit:name,regExp:$("#fm-d1").value,insExp:$("#fm-d2").value,notes};
      const i=vehicles.findIndex(x=>x.id===rec.id); i>=0?vehicles[i]=v:vehicles.push(v); saveVehicles(); }
    else { const l={id:rec.id,name,address:$("#fm-addr").value.trim(),permitExp:$("#fm-d1").value,notes};
      const i=locations.findIndex(x=>x.id===rec.id); i>=0?locations[i]=l:locations.push(l); saveLocations(); }
    closeModal(); renderFleet(); renderDashboard(); sndOk(); toast(lang==="es"?"Guardado":"Saved");
  });
}
function fleetRow(kind,rec){
  const isD=kind==="driver", isV=kind==="vehicle";
  const name=isD?rec.name:isV?rec.unit:rec.name;
  const dates=isD?[["cdl",rec.cdlExp],["med",rec.medExp],["mvr",rec.mvrExp]]
    :isV?[["reg",rec.regExp],["ins",rec.insExp]]:[["permit",rec.permitExp]];
  let chips=dates.map(([k,d])=>{
    if(!d) return '<span class="chip ok dim">'+rItem(k)+' —</span>';
    const n=daysUntil(d), c=renewClass(n);
    return '<span class="chip '+c+'">'+rItem(k)+' '+fmtD(d)+'</span>';
  }).join("");
  return '<div class="fleet-row"><div class="fleet-row-main"><strong>'+esc(name)+'</strong>'+
    (rec.address?'<span class="small dim"> '+esc(rec.address)+'</span>':"")+
    (rec.notes?'<span class="small dim"> · '+esc(rec.notes)+'</span>':"")+'</div>'+
    '<div class="fleet-chips">'+chips+'</div>'+
    '<div class="fleet-row-actions"><button class="btn secondary small" aria-label="'+D("Edit","Editar")+'" data-edit="'+kind+":"+rec.id+'">✎</button>'+
    '<button class="btn secondary small danger" aria-label="'+D("Delete","Eliminar")+'" data-del="'+kind+":"+rec.id+'">✕</button></div></div>';
}
function renewalItems(){
  const out=[];
  drivers.forEach(d=>{[["cdl",d.cdlExp],["med",d.medExp],["mvr",d.mvrExp]].forEach(([k,v])=>{ if(v) out.push({kind:"driver",ref:d.id,name:d.name,item:k,date:v}); });});
  vehicles.forEach(v=>{[["reg",v.regExp],["ins",v.insExp]].forEach(([k,vv])=>{ if(vv) out.push({kind:"vehicle",ref:v.id,name:v.unit,item:k,date:vv}); });});
  locations.forEach(l=>{ if(l.permitExp) out.push({kind:"location",ref:l.id,name:l.name,item:"permit",date:l.permitExp}); });

/* ============ chunk V2: incidents-per-month mini bars ============ */
let incSel=null;
function renderIncChart(){
  const box=$("#incChart"), tip=$("#incTip");
  if(!box) return;
  const now=new Date(); now.setDate(1);
  const months=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleString("en",{month:"short"})});
  }
  months.forEach(mo=>{
    mo.items=(logs.injury||[]).filter(e=>{ const d=new Date(e.date+"T00:00:00"); return d.getFullYear()===mo.y&&d.getMonth()===mo.m; });
    mo.n=mo.items.length;
  });
  const max=Math.max(1,...months.map(m=>m.n));
  box.innerHTML='<div class="inc-bars" role="group" aria-label="Incidents per month, last 12 months">'+months.map((mo,i)=>{
    const h=Math.max(6,(mo.n/max)*110), sel=incSel===i;
    return '<button class="inc-bar'+(mo.n?"":" zero")+(sel?" selected":"")+'" data-i="'+i+'" aria-label="'+mo.label+": "+mo.n+' incident(s)">'+
      '<span class="cnt">'+(mo.n||"")+'</span>'+
      '<span class="col" style="height:'+h+'px"></span>'+
      '<span class="mo">'+mo.label+'</span></button>';
  }).join("")+"</div>";
  box.querySelectorAll(".inc-bar").forEach(b=>b.addEventListener("click",()=>{
    sndClick(); const i=+b.dataset.i; incSel=incSel===i?null:i; renderIncChart();
  }));
  if(incSel!=null){
    const mo=months[incSel];
    const ttl=mo.label+" "+mo.y+" — "+mo.n+" incident(s)";
    tip.innerHTML="<strong>"+esc(ttl)+"</strong>"+(mo.n?"<ul style='margin:8px 0 0;padding-left:20px'>"+
      mo.items.map(e=>"<li>"+esc(fmtDate(e.date)+" — "+(e.desc||e.type||"incident")+" ("+esc(e.where||"")+")")+"</li>").join("")+"</ul>":"");
    tip.classList.add("open");
  } else tip.classList.remove("open");
}

/* ---- injury / illness log: recordability helper + near-miss + photo ---- */
function downscalePhoto(file,cb){
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ try{
    const max=800; let w=img.width||max,h=img.height||max;
    if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg",0.7));
  }catch(e){ URL.revokeObjectURL(url); cb(null); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); cb(null); };
  img.src=url;
}

      if(a&&a.a==="no") fixes.push({w:q[1],area:sectitle("fmcsa",sec),q:qtext("fmcsa",sec.id,i,q),note:a.note||""}); });
  });
  h+="</table>";
  fixes.sort((a,b)=>b.w-a.w);
  h+="<h2>"+D("Prioritized fix list","Lista priorizada de correcciones")+" ("+fixes.length+")</h2>";
  h+=fixes.length
    ? "<ol>"+fixes.map(f=>"<li><strong>["+WLABEL(f.w)+"]</strong> "+esc(f.q)+" <em>— "+esc(f.area)+"</em>"+(f.note?" — "+esc(f.note):"")+"</li>").join("")+"</ol>"
    : D("<p>No open findings in the FMCSA track. Keep records current and re-audit after any operational change.</p>",
        "<p>Sin hallazgos abiertos en el área FMCSA. Mantenga los registros actualizados y repita la auditoría ante cualquier cambio operativo.</p>");
  h+=D("<h2>How to use this report</h2><p>Work the fix list top-down: critical items first. Attach evidence (receipts, filed forms, photos) to each corrective action in the app, then re-run the FMCSA audit to confirm the score improves. Auditors typically ask for records going back 6–12 months depending on the area.</p>",
       "<h2>Cómo usar este informe</h2><p>Trabaje la lista de arriba hacia abajo: primero lo crítico. Adjunte evidencia (recibos, formularios, fotos) a cada acción correctiva en la app y repita la auditoría FMCSA para confirmar la mejora. Los auditores suelen pedir registros de 6 a 12 meses según el área.</p>");
  h+=docFoot();
  return h;
}

function docHeadEs(title,sub){
  const p=profile;
  const st=(typeof stateName==="function"&&p.state)?" · "+esc(stateName(p.state)):"";
  return '<h1>'+esc(title)+'</h1><p style="font-size:16px"><strong>'+esc(p.name||"[Nombre del negocio — configurar en Ajustes]")+'</strong><br>'+
    esc(p.addr||"")+(p.phone?" · "+esc(p.phone):"")+st+(p.usdot?" · USDOT "+esc(p.usdot):"")+'<br>Preparado: '+fmtDate(todayISO())+(sub?" · "+esc(sub):"")+'</p>'+STAMP_ES;
}
function docFootEs(){
  return STAMP_ES+'<div class="sig-line"><div>Firma autorizada / Fecha</div><div>Nombre en letra de molde / Cargo</div></div>';
}
/* language-aware finding helpers */
function noAnswersL(t,secId){
  const tr=TRACKS[t], sec=tr.sections.find(s=>s.id===secId); if(!sec) return [];
  const out=[];
  sec.questions.forEach((q,i)=>{ const a=getAnswer(t,secId,i); if(a&&a.a==="no") out.push({q:qtext(t,secId,i,q),note:a.note||""}); });
  return out;
}
function gapBoxL(items){
  if(!items.length) return "";
  return '<div style="border:2px solid #b3261e;border-radius:8px;padding:10px 14px;margin:10px 0;background:#fdf0ef">'+
    '<strong style="color:#b3261e">⚠ '+(lang==="es"?"Brechas identificadas en su autoauditoría — corríjalas:":"Gaps identified in your self-audit — address these:")+'</strong><ul style="margin:6px 0">'+
    items.map(x=>"<li>"+esc(x.q)+(x.note?" <em>— "+esc(x.note)+"</em>":"")+"</li>").join("")+"</ul></div>";
}
function openFindingsListL(t){
  const tr=TRACKS[t]; let items=[];
  tr.sections.forEach(sec=>sec.questions.forEach((q,i)=>{ const a=getAnswer(t,sec.id,i); if(a&&a.a==="no") items.push(sectitle(t,sec)+": "+qtext(t,sec.id,i,q)); }));
  return items;
}

/* ---- ES: Written Safety Program ---- */
function genOshaDocEs(){
  const items=openFindingsListL("osha");
  let h=docHeadEs("Programa escrito de seguridad en el lugar de trabajo","Autoauditoría OSHA — industria general");
  h+="<h2>1. Declaración de política de seguridad</h2><p>"+esc(profile.name||"Esta empresa")+" está comprometida a proporcionar un lugar de trabajo seguro y saludable. La seguridad es responsabilidad compartida de la gerencia, los supervisores y cada empleado. Este programa se revisará al menos una vez al año y se actualizará cuando cambien las operaciones.</p>";
  h+="<h2>2. Responsabilidades</h2><ul><li><strong>Gerencia:</strong> proporciona recursos, hace cumplir este programa y revisa los resultados de auditoría.</li><li><strong>Supervisores:</strong> aseguran que los empleados sigan prácticas seguras y reporten peligros pronto.</li><li><strong>Empleados:</strong> siguen las reglas de seguridad, usan el EPP requerido y reportan peligros, lesiones y casi-accidentes.</li></ul>";
  h+="<h2>3. Programa de comunicación de peligros</h2>"+gapBoxL(noAnswersL("osha","hazcom"))+
     "<p>Se mantiene un programa escrito de comunicación de peligros. Las hojas SDS de todos los químicos peligrosos están accesibles a los empleados en cada turno. Los envases están etiquetados con la identidad del producto y advertencias de peligro. Los empleados reciben capacitación HazCom antes de su asignación inicial y cuando se introducen nuevos peligros.</p>";
  h+="<h2>4. Programa de equipo de protección personal</h2>"+gapBoxL(noAnswersL("osha","ppe"))+
     "<p>Una evaluación de peligros determina el EPP requerido. El EPP se proporciona sin costo y los empleados están capacitados en su uso, cuidado y limitaciones. El EPP defectuoso se retira de servicio de inmediato.</p>";
  h+="<h2>5. Programa de capacitación en seguridad</h2>"+gapBoxL(noAnswersL("osha","training"))+
     "<p>Los nuevos empleados reciben orientación de seguridad antes de empezar. La capacitación específica se documenta con fechas, temas y asistentes. Los operadores de montacargas están capacitados y certificados. Se re-capacita cuando cambian los procedimientos.</p>";
  h+="<h2>6. Registro de lesiones y enfermedades</h2>"+gapBoxL(noAnswersL("osha","record"))+
     "<p>El registro OSHA 300 se mantiene actualizado; el resumen 300A se publica del 1 de febrero al 30 de abril. Las muertes se reportan dentro de 8 horas; hospitalizaciones, amputaciones y pérdidas de ojos dentro de 24 horas. Los registros se conservan 5 años.</p>";
  h+="<h2>7. Plan de acción de emergencia</h2>"+gapBoxL(noAnswersL("osha","eap"))+
     "<p>Alarmas, rutas de evacuación y puntos de reunión se comunican a todos los empleados. Las rutas se mantienen marcadas y despejadas. Un procedimiento de conteo verifica a todo el personal tras una evacuación.</p>";
  h+="<h2>8. Superficies de tránsito y seguridad eléctrica</h2>"+gapBoxL(noAnswersL("osha","wws").concat(noAnswersL("osha","electrical")))+
     "<p>La limpieza mantiene pisos y pasillos despejados. Se usa protección contra caídas y barandillas donde se requiere. Solo trabajadores calificados hacen trabajo eléctrico; se usa bloqueo y etiquetado durante el mantenimiento.</p>";
  h+="<h2>9. Acciones correctivas de la autoauditoría ("+items.length+")</h2>";
  h+=items.length?"<ol>"+items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>":"<p>Sin hallazgos abiertos.</p>";
  h+=docFootEs();
  return h;
}
/* ---- ES: FMCSA Compliance Packet ---- */
function genFmcsaDocEs(){
  const items=openFindingsListL("fmcsa");
  let h=docHeadEs("Paquete de cumplimiento FMCSA","Calificación de conductores + inspección y mantenimiento de vehículos");
  h+="<h2>Parte A — Lista de verificación del archivo de calificación del conductor</h2><p>Mantenga un archivo por conductor con cada punto. Marque cada documento presente con fecha.</p>";
  const dq=["Solicitud de empleo (completa y firmada)","Historial de manejo (MVR) obtenido al contratar","Certificado médico vigente","Certificado de prueba de manejo o equivalente","Revisión anual del MVR (documentada)","Verificación de historial con empleadores anteriores (dentro de 30 días)","Certificación anual de violaciones del conductor","Copia de licencia (válida para la clase de vehículo)"];
  h+='<table class="log"><tr><th>Documento requerido</th><th>¿Presente?</th><th>Fecha de verificación</th><th>Nombre del conductor</th></tr>'+
     dq.map(d=>"<tr><td>"+d+"</td><td>☐ Sí ☐ No</td><td></td><td></td></tr>").join("")+"</table>";
  h+=gapBoxL(noAnswersL("fmcsa","dq"));
  h+="<h2>Parte B — Programa de inspección y mantenimiento de vehículos</h2>"+gapBoxL(noAnswersL("fmcsa","veh"))+
     "<p><strong>Reportes de inspección (DVIR):</strong> los conductores completan la inspección pre-viaje antes de operar y un DVIR post-viaje diario por escrito; los defectos que afectan la seguridad se reportan y reparan antes del despacho.</p>"+
     "<p><strong>Inspección periódica:</strong> cada vehículo comercial recibe una inspección anual por un inspector calificado; la prueba se conserva en el vehículo.</p>"+
     "<p><strong>Mantenimiento sistemático:</strong> un programa de mantenimiento cubre frenos, llantas, luces, dirección y acoples; todos los registros se conservan.</p>";
  h+="<h2>Parte C — Horas de servicio y controles de drogas y alcohol</h2>"+gapBoxL(noAnswersL("fmcsa","hos").concat(noAnswersL("fmcsa","da")))+
     "<p>Los conductores cumplen los límites de 11 horas de manejo, ventana de 14 horas y 70/8 (o 60/7) usando ELD. Las bitácoras se auditan y las violaciones se corrigen. Un programa DOT de drogas y alcohol cubre pruebas pre-empleo, aleatorias, post-accidente y por sospecha razonable.</p>";
  h+="<h2>Acciones correctivas de la autoauditoría ("+items.length+")</h2>";
  h+=items.length?"<ol>"+items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>":"<p>Sin hallazgos abiertos.</p>";
  h+=docFootEs();
  return h;
}
/* ---- ES: Cottage Food Safety Plan ---- */
function genCottageDocEs(){
  const items=openFindingsListL("cottage");
  let h=docHeadEs("Plan de seguridad alimentaria casera","Productor de alimentos caseros — autoauditoría");
  h+="<h2>1. Negocio y productos</h2><p>Productos bajo este plan: ________________________________________. Todos los productos están dentro de los alimentos permitidos por la ley estatal y se venden solo en los lugares permitidos.</p>";
  h+="<h2>2. Registro y cumplimiento</h2>"+gapBoxL(noAnswersL("cottage","reg"))+
     "<p>El negocio tiene el registro/permiso estatal requerido, lo renueva según el calendario y se mantiene dentro del límite anual de ventas.</p>";
  h+="<h2>3. Etiquetado y control de alérgenos</h2>"+gapBoxL(noAnswersL("cottage","label"))+
     "<p>Cada etiqueta muestra: nombre del producto; ingredientes en orden descendente por peso; peso neto; los 9 alérgenos principales cuando están presentes; nombre y dirección del productor; y la declaración estatal de producción casera. Los cambios de receta activan una revisión de etiqueta.</p>";
  h+="<h2>4. Saneamiento e higiene personal</h2>"+gapBoxL(noAnswersL("cottage","san"))+
     "<p>Las manos se lavan antes de manipular alimentos y tras cualquier interrupción. Las personas enfermas no participan en la producción. Las mascotas no entran a las áreas de producción. Las superficies de contacto se limpian y desinfectan; se usa agua potable.</p>";
  h+="<h2>5. Producción, temperatura y almacenamiento</h2>"+gapBoxL(noAnswersL("cottage","prod"))+
     "<p>Los alimentos sensibles a tiempo/temperatura se mantienen a temperaturas seguras con termómetros calibrados. Los productos crudos y terminados se almacenan evitando contaminación cruzada. Los empaques son de grado alimenticio y se almacenan limpios y secos.</p>";
  h+="<h2>6. Plan de retiro y registros</h2><p>Códigos de lote: ____________. Si un producto puede ser inseguro: detenga ventas, notifique a clientes/locales, documente lotes afectados y contacte a la autoridad estatal. Los registros de producción, ventas y quejas se conservan al menos un año.</p>";
  h+="<h2>Acciones correctivas de la autoauditoría ("+items.length+")</h2>";
  h+=items.length?"<ol>"+items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>":"<p>Sin hallazgos abiertos.</p>";
  h+=docFootEs();
  return h;
}

/* override: doc picker supports badge/title per doc + ES */
function renderDocPicker(){
  $("#docPicker").innerHTML=Object.keys(DOCS).map(k=>{
    const d=DOCS[k], es=lang==="es";
    const _t=es&&d.titleEs?d.titleEs:d.title, _b=d.badge||"DOC";
    const _badge=(_t.toLowerCase().indexOf(_b.toLowerCase())===0)?"":'<span class="track-badge '+(d.cls||"badge-all")+'">'+esc(_b)+'</span>';
    return '<button class="card track-card" data-doc="'+k+'">'+_badge+
    "<h3>"+esc(es&&d.titleEs?d.titleEs:d.title)+"</h3><p class='small'>"+esc(es&&d.descEs?d.descEs:d.desc)+"</p></button>";
  }).join("");
  $$("#docPicker .track-card").forEach(c=>c.addEventListener("click",()=>{ sndClick(); previewDoc(c.dataset.doc); }));
}
/* override: preview picks ES generator when active */
function previewDoc(t){
  const d=DOCS[t]; if(!d) return;
  currentDocHTML=(lang==="es"&&d.genEs)?d.genEs():d.gen();
  $("#docPreview").innerHTML='<div class="card"><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">'+
    '<button class="btn" id="printDocBtn">🖨 '+(lang==="es"?"Imprimir / Guardar PDF":"Print / Save PDF")+'</button>'+
    '<button class="btn secondary" id="backDocs">← '+(lang==="es"?"Todos los documentos":"All documents")+'</button></div>'+
    '<div class="doc">'+currentDocHTML+'</div></div>';
  $("#printDocBtn").addEventListener("click",()=>{ sndClick(); doPrint(); });
  $("#backDocs").addEventListener("click",()=>{ sndClick(); $("#docPreview").innerHTML=""; });
  window.scrollTo(0,0);
}
